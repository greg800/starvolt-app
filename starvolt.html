<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starvolt — Calculateur d'économies</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#065060"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Starvolt"/>
  <link rel="apple-touch-icon" href="/icon-192.svg"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- React + ReactDOM + Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SheetJS (lecture Excel côté client) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Canvas Confetti (fireworks) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    /* =============================================
       RESET & ROOT
       ============================================= */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --teal-deep:   #065060;
      --teal:        #0891b2;
      --teal-light:  #0da890;
      --green:       #7dd940;
      --green-light: #a3ed6a;
      --white:       #ffffff;
      --font:        'Poppins', sans-serif;
      --r-card:      22px;
      --r-btn:       14px;
      --shadow:      0 20px 60px rgba(0,0,0,0.25);
    }

    html, body {
      min-height: 100%;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: linear-gradient(145deg, #065060 0%, #0a9b8c 50%, #0b8264 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =============================================
       APP SHELL
       ============================================= */

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 76px 16px 150px;
      position: relative;
      overflow: hidden;
    }

    /* Blob decorations */
    .app::before {
      content: '';
      position: fixed;
      top: -180px; right: -180px;
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(125,217,64,.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .app::after {
      content: '';
      position: fixed;
      bottom: -220px; left: -220px;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(8,145,178,.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Chevrons */
    .chevrons-deco {
      position: fixed;
      right: -8px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 2px;
      opacity: .07; pointer-events: none;
    }
    .chevrons-deco span {
      font-size: 72px; color: var(--green);
      line-height: 1; font-weight: 900;
    }

    /* =============================================
       TOP BAR
       ============================================= */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
      background: rgba(5,65,78,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,.1);
      z-index: 300;
    }

    .user-chip {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px;
      padding: 4px 12px 4px 5px;
      max-width: 160px;
      overflow: hidden;
    }
    .user-chip-av {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: #1a4500;
      flex-shrink: 0;
    }
    .user-chip span {
      font-size: 12px; font-weight: 700; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* =============================================
       STICKY FOOTER
       ============================================= */
    .sticky-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 24px 16px 22px;
      background: linear-gradient(to top, rgba(5,65,78,1) 65%, rgba(5,65,78,.92) 85%, transparent);
      z-index: 200;
    }
    .sticky-footer-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex; flex-direction: column; gap: 9px;
    }
    .sticky-footer-inner.row { flex-direction: row; gap: 10px; }
    .sticky-footer-inner.row .btn { flex: 1; }

    /* =============================================
       SCREEN
       ============================================= */
    .screen {
      width: 100%; max-width: 520px;
      display: flex; flex-direction: column;
      gap: 0;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:none; }
    }
    .fade-in { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }

    /* =============================================
       BILL METER
       ============================================= */
    .bill-meter {
      text-align: center;
      padding: 18px 0 14px;
    }
    .bill-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(255,255,255,.6);
      margin-bottom: 2px;
    }
    .bill-amount-row {
      display: flex; align-items: baseline;
      justify-content: center; gap: 4px; line-height: 1;
    }
    .bill-num {
      font-size: 80px; font-weight: 900; color: white;
      transition: color .6s ease;
      font-variant-numeric: tabular-nums;
    }
    .bill-num.saving {
      color: var(--green);
      text-shadow: 0 0 40px rgba(125,217,64,.45);
    }
    .bill-cur {
      font-size: 30px; font-weight: 700;
      color: rgba(255,255,255,.75);
    }
    .bill-period {
      font-size: 12px; color: rgba(255,255,255,.45);
      margin-top: 2px;
    }
    .savings-badge {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px;
      background: rgba(125,217,64,.16);
      border: 1px solid rgba(125,217,64,.32);
      border-radius: 20px; padding: 5px 14px;
      font-size: 12px; font-weight: 700; color: var(--green);
      animation: fadeUp .5s ease both;
    }

    /* =============================================
       CARD
       ============================================= */
    .card {
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-card);
      padding: 26px 22px;
      color: white;
      box-shadow: var(--shadow);
    }

    /* =============================================
       TYPOGRAPHY
       ============================================= */
    .screen-title {
      font-size: 23px; font-weight: 800;
      line-height: 1.22; margin-bottom: 8px;
    }
    .screen-sub {
      font-size: 13.5px; line-height: 1.6;
      color: rgba(255,255,255,.75);
      margin-bottom: 18px;
    }
    .q-title {
      font-size: 15px; font-weight: 700;
      margin: 18px 0 12px; line-height: 1.4;
    }
    .badge {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 23px; font-weight: 800;
      line-height: 1.22; margin-bottom: 12px;
      text-align: center;
    }
    .badge.success { color: var(--green); }
    .badge.info    { color: white; }

    .star-twinkle {
      display: inline-block;
      font-style: normal;
      animation: twinkle 1.6s ease-in-out infinite;
    }
    .star-twinkle.delay1 { animation-delay: .35s; }
    .star-twinkle.delay2 { animation-delay: .7s; }
    .star-twinkle.delay3 { animation-delay: 1.05s; }
    @keyframes twinkle {
      0%, 100% { opacity: 1;   transform: scale(1)   rotate(0deg); }
      50%      { opacity: .2;  transform: scale(.5)  rotate(22deg); }
    }

    /* =============================================
       BUTTONS
       ============================================= */
    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%;
      padding: 14px 18px;
      border-radius: var(--r-btn); border: none;
      font-family: var(--font); font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      line-height: 1.2;
    }
    .btn:hover  { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-primary { background: var(--green); color: #1a4500; }
    .btn-primary:hover { box-shadow: 0 8px 28px rgba(125,217,64,.35); }

    .btn-yes { background: var(--green); color: #1a4500; }
    .btn-yes:hover {
      background: var(--green-light);
      box-shadow: 0 8px 28px rgba(125,217,64,.32);
    }

    .btn-no {
      background: rgba(255,255,255,.10); color: rgba(255,255,255,.85);
      border: 1.5px solid rgba(255,255,255,.22);
    }
    .btn-no:hover { background: rgba(255,255,255,.18); }

    .btn-sec {
      background: rgba(255,255,255,.12); color: white;
      border: 1.5px solid rgba(255,255,255,.25);
      font-size: 13px;
    }
    .btn-sec:hover { background: rgba(255,255,255,.2); }

    .btn-group { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }

    /* =============================================
       BACK BUTTON
       ============================================= */
    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: none;
      color: rgba(255,255,255,.55);
      font-family: var(--font); font-size: 12.5px; font-weight: 600;
      cursor: pointer; padding: 0; margin-bottom: 10px;
      transition: color .2s;
    }
    .back-btn:hover { color: white; }

    /* =============================================
       WELCOME
       ============================================= */
    .welcome-header { text-align: center; margin-bottom: 22px; }
    .welcome-tag {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--green); margin-bottom: 10px;
    }
    .welcome-title {
      font-size: 34px; font-weight: 900;
      color: white; line-height: 1.15; margin-bottom: 8px;
    }
    .welcome-title .accent { color: var(--green); }
    .welcome-sub { font-size: 14px; color: rgba(255,255,255,.6); }

    .form-card {
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-card);
      padding: 22px; margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .inp-group { display: flex; flex-direction: column; gap: 5px; }
    .inp-label {
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,.65);
      letter-spacing: .5px; text-transform: uppercase;
    }
    .inp {
      width: 100%; padding: 12px 15px;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.11);
      color: white; font-family: var(--font);
      font-size: 15px; font-weight: 600;
      outline: none;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none;
    }
    .inp::placeholder { color: rgba(255,255,255,.38); }
    .inp:focus { border-color: var(--green); background: rgba(255,255,255,.16); }
    .inp[type=number]::-webkit-inner-spin-button,
    .inp[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .bill-wrap { position: relative; }
    .bill-sfx {
      position: absolute; right: 15px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,.45);
      font-size: 13px; font-weight: 600;
      pointer-events: none;
    }

    .acc-map-thumb {
      width: 100%; border-radius: 12px; overflow: hidden;
      cursor: zoom-in; margin-top: 16px;
      border: 1px solid rgba(255,255,255,.15);
      position: relative;
    }
    .acc-map-thumb img { width: 100%; display: block; }
    .acc-map-hint {
      text-align: center; font-size: 11px;
      color: rgba(255,255,255,.45); margin-top: 5px;
    }
    .lightbox-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.88); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lightbox-overlay img {
      max-width: 96vw; max-height: 92vh;
      border-radius: 8px;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }

    /* =============================================
       ADDRESS / LOADING
       ============================================= */
    .loading-card {
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-card);
      padding: 48px 22px;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      text-align: center; color: white;
    }
    .loading-card p { font-size: 14.5px; font-weight: 600; }
    .loading-card .sub { font-size: 12.5px; color: rgba(255,255,255,.55); }

    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,.18);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .addr-found {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,.09);
      border-radius: 14px; padding: 12px 15px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.13);
    }
    .addr-icon { font-size: 26px; }
    .addr-text { display: flex; flex-direction: column; gap: 2px; }
    .addr-text strong { font-size: 14.5px; font-weight: 700; color: white; }
    .addr-text span { font-size: 12px; color: rgba(255,255,255,.55); }

    /* =============================================
       MAP ACC
       ============================================= */
    .map-container {
      border-radius: 14px; overflow: hidden;
      margin: 14px 0;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
    }
    .map-legend {
      display: flex; flex-direction: column; gap: 7px;
      margin: 10px 0 18px;
    }
    .leg-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 12.5px; color: rgba(255,255,255,.82);
    }
    .leg-dot {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .leg-dot.house { background: rgba(255,255,255,.18); }
    .leg-dot.pv    { background: rgba(255,220,0,.18); }
    .leg-dot.zone  {
      background: rgba(125,217,64,.12);
      border: 1.5px dashed var(--green);
    }

    /* =============================================
       TARIFF
       ============================================= */
    .tariff-box {
      background: rgba(0,0,0,.14);
      border-radius: 14px; padding: 14px; margin: 14px 0;
    }
    .tariff-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; }
    .tariff-lbl { font-size: 12.5px; color: rgba(255,255,255,.68); }
    .tariff-val { font-size: 17px; font-weight: 800; }
    .tariff-val.old { text-decoration: line-through; color: rgba(255,255,255,.42); font-size: 14px; }
    .tariff-val.grn { color: var(--green); }
    .tariff-arrow { text-align: center; color: var(--green); font-size: 18px; padding: 4px 0; }

    .saving-est {
      background: rgba(125,217,64,.11);
      border: 1.5px solid rgba(125,217,64,.28);
      border-radius: 14px; padding: 14px;
      text-align: center; margin: 14px 0;
    }
    .sav-lbl {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.55); margin-bottom: 3px;
    }
    .sav-amt { font-size: 40px; font-weight: 900; color: var(--green); line-height: 1; }
    .sav-note { font-size: 11.5px; color: rgba(255,255,255,.48); margin-top: 3px; }

    /* =============================================
       OFFER CARD
       ============================================= */
    .offer-box {
      background: rgba(0,0,0,.14);
      border-radius: 14px; padding: 14px; margin: 14px 0;
    }
    .offer-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; }
    .offer-lbl { font-size: 12.5px; color: rgba(255,255,255,.68); }
    .offer-val { font-size: 17px; font-weight: 800; color: white; }
    .offer-val.grn { color: var(--green); }
    .offer-div { height: 1px; background: rgba(255,255,255,.09); margin: 3px 0; }
    .offer-promo {
      font-size: 11.5px; color: rgba(255,255,255,.65);
      margin-top: 9px; padding-top: 9px;
      border-top: 1px solid rgba(255,255,255,.09);
      line-height: 1.55;
    }
    .offer-promo strong { color: var(--green); }

    .dev-icon { font-size: 38px; text-align: center; margin-bottom: 10px; }

    /* =============================================
       NO ACC STEPS
       ============================================= */
    .steps-list { display: flex; flex-direction: column; gap: 11px; margin: 14px 0 18px; }
    .step-item  { display: flex; align-items: flex-start; gap: 11px; }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green); color: #1a4500;
      font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .step-txt { font-size: 13.5px; color: rgba(255,255,255,.82); line-height: 1.5; }

    /* =============================================
       BRAVO
       ============================================= */
    .bravo-card { text-align: center; padding: 30px 22px; }

    .bravo-num {
      font-size: 86px; font-weight: 900; color: var(--green); line-height: 1;
      text-shadow: 0 0 60px rgba(125,217,64,.45);
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .bravo-title {
      font-size: 44px; font-weight: 900; color: white;
      letter-spacing: 3px;
      animation: popIn .5s .1s cubic-bezier(.34,1.56,.64,1) both;
    }
    .bravo-sub { font-size: 13px; color: rgba(255,255,255,.65); margin: 8px 0 4px; }
    .bravo-sav-row {
      display: flex; align-items: baseline; justify-content: center;
      gap: 5px; margin: 4px 0 6px;
      animation: popIn .5s .2s cubic-bezier(.34,1.56,.64,1) both;
    }
    .bravo-sav-amt { font-size: 50px; font-weight: 900; color: var(--green); line-height: 1; }
    .bravo-sav-per { font-size: 17px; font-weight: 600; color: rgba(255,255,255,.65); }
    .bravo-lbl { font-size: 12.5px; color: rgba(255,255,255,.48); margin-bottom: 22px; }

    @keyframes popIn {
      0%   { transform: scale(.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* =============================================
       FINAL
       ============================================= */
    .final-cmp {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      background: rgba(0,0,0,.12);
      border-radius: 14px; padding: 14px; margin: 14px 0;
    }
    .cmp-item { width: 100%; text-align: center; }
    .cmp-lbl {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.45); margin-bottom: 3px;
    }
    .cmp-amt { font-size: 26px; font-weight: 800; }
    .cmp-amt.old { color: rgba(255,255,255,.4); text-decoration: line-through; }
    .cmp-amt.new { color: var(--green); }
    .cmp-arrow { font-size: 20px; color: var(--green); }

    .final-total {
      background: rgba(125,217,64,.11);
      border: 1.5px solid rgba(125,217,64,.28);
      border-radius: 14px; padding: 16px;
      text-align: center; margin: 10px 0;
    }
    .tot-lbl {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.55); margin-bottom: 3px;
    }
    .tot-amt { font-size: 50px; font-weight: 900; color: var(--green); line-height: 1; }

    .final-items { display: flex; flex-direction: column; gap: 7px; margin: 10px 0; }
    .final-item {
      display: flex; align-items: center; gap: 9px;
      font-size: 13.5px; color: rgba(255,255,255,.8);
      background: rgba(255,255,255,.07);
      border-radius: 10px; padding: 9px 13px;
    }
    .fi-check { color: var(--green); font-weight: 800; font-size: 15px; }

    .roi-block {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px; padding: 14px 12px;
      margin: 10px 0;
    }
    .roi-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.5); text-align: center;
      margin-bottom: 10px;
    }
    .roi-row {
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .roi-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1;
    }
    .roi-val {
      font-size: 14px; font-weight: 800; color: white; text-align: center;
    }
    .roi-val.roi-years {
      color: var(--green); font-size: 22px;
    }
    .roi-sub {
      font-size: 9px; color: rgba(255,255,255,.42);

// ─── Animated bill counter ─────────────────────
function useAnimatedBill(target) {
  const [cur, setCur]     = useState(target);
  const fromRef           = useRef(target);
  const rafRef            = useRef(null);

  useEffect(() => {
    if (fromRef.current === target) return;
    const from     = fromRef.current;
    const duration = 1400;
    const t0       = performance.now();

    const animate = (now) => {
      const p = Math.min((now - t0) / duration, 1);
      const e = 1 - Math.pow(1 - p, 4);
      setCur(Math.round(from + (target - from) * e));
      if (p < 1) { rafRef.current = requestAnimationFrame(animate); }
      else        { fromRef.current = target; }
    };

    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(animate);
    return () => rafRef.current && cancelAnimationFrame(rafRef.current);
  }, [target]);

  return cur;
}

// ─── PWA Install Banner ───────────────────────
function InstallBanner() {
  const [show,    setShow]    = useState(false);
  const [isIOS,   setIsIOS]   = useState(false);
  const deferredRef           = useRef(null);

  useEffect(() => {
    // Already installed → never show
    if (window.matchMedia('(display-mode: standalone)').matches) return;
    if (window.navigator.standalone) return;
    // Dismissed this session → skip
    if (sessionStorage.getItem('pwa-dismissed')) return;

    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.navigator.standalone;
    setIsIOS(ios);

    if (ios) {
      const t = setTimeout(() => setShow(true), 6000);
      return () => clearTimeout(t);
    }

    const handler = (e) => {
      e.preventDefault();
      deferredRef.current = e;
      // Delay so it doesn't pop immediately on load
      setTimeout(() => setShow(true), 5000);
    };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const dismiss = () => {
    setShow(false);
    sessionStorage.setItem('pwa-dismissed', '1');
  };

  const install = async () => {
    if (!deferredRef.current) return;
    deferredRef.current.prompt();
    const { outcome } = await deferredRef.current.userChoice;
    deferredRef.current = null;
    setShow(false);
    if (outcome === 'dismissed') sessionStorage.setItem('pwa-dismissed', '1');
  };

  if (!show) return null;

  return (
    <div className="pwa-banner">
      <div className="pwa-banner-card">
        <div className="pwa-icon">⚡</div>
        <div className="pwa-text">
          <strong>Installer l'app Starvolt</strong>
          {isIOS
            ? <span>Appuyez sur <strong>Partager</strong> puis <strong>"Sur l'écran d'accueil"</strong></span>
            : <span>Accès rapide depuis votre écran d'accueil Android</span>
          }
        </div>
        <div className="pwa-actions">
          {!isIOS && <button className="pwa-btn-install" onClick={install}>Installer</button>}
          <button className="pwa-btn-close" onClick={dismiss} aria-label="Fermer">✕</button>
        </div>
      </div>
    </div>
  );
}

function AuthSignupScreen({ onGoToLogin, onSignedUp }) {
  const [prenom,  setPrenom]  = useState('');
  const [nom,     setNom]     = useState('');
  const [email,   setEmail]   = useState('');
  const [pwd,     setPwd]     = useState('');
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);
  const [checkEmail, setCheckEmail] = useState(false);

  const handleSignup = async () => {
    if (!prenom.trim() || !nom.trim() || !email.trim() || !pwd) {
      setError('Tous les champs sont obligatoires.'); return;
    }
    if (pwd.length < 6) {
      setError('Le mot de passe doit contenir au moins 6 caractères.'); return;
    }
    setLoading(true); setError(null);
    const { data, error: err } = await sb.auth.signUp({ email: email.trim(), password: pwd });
    if (err) { setError(err.message); setLoading(false); return; }
    if (data.user) {
      await sb.from('profiles').insert({ id: data.user.id, prenom: prenom.trim(), nom: nom.trim() });
      onSignedUp?.({ prenom: prenom.trim(), nom: nom.trim() });

    if (!data.session) setCheckEmail(true);
    setLoading(false);

  if (checkEmail) return (
    <>

    </>

  return (
    <>

        <div className="auth-header">
          <div className="welcome-tag">La constellation vous attend</div>
          <h1 className="welcome-title">Créez votre<br/><span className="accent">compte</span></h1>

            <div className="inp-group">
              <label className="inp-label">Prénom</label>
              <input className="inp" value={prenom} onChange={e=>setPrenom(e.target.value)} placeholder="Marie"/>

              <label className="inp-label">Nom</label>

function ProfileScreen({ user, profile, onSave, onCancel, onLogout, onDeleted }) {

  const [nom,       setNom]       = useState(profile?.nom || '');
  const [pseudo,    setPseudo]    = useState(profile?.pseudo || '');

  const [cp,        setCp]        = useState(profile?.code_postal || '');
  const [ville,     setVille]     = useState(profile?.ville || '');
  const [tel,       setTel]       = useState(profile?.telephone || '');
  const [email,     setEmail]     = useState(user?.email || '');
  const [hc1Start,  setHc1Start]  = useState(profile?.heure_debut_hc1?.slice(0,5) || '');
  const [hc1End,    setHc1End]    = useState(profile?.heure_fin_hc1?.slice(0,5) || '');

      prenom:         prenom.trim(),

// ─── couleur spot ─────────────────────────────
function spotColor(prix) {
  if (prix === null || prix === undefined) return 'rgba(255,255,255,.08)';
  if (prix < 0.03) return '#c8f0c8';
  if (prix < 0.06) return '#90d890';
  if (prix < 0.09) return '#58c058';
  if (prix < 0.12) return '#28a028';
  if (prix < 0.15) return '#b0c820';
  if (prix < 0.18) return '#d8b000';
  if (prix < 0.20) return '#e07818';
  if (prix < 0.22) return '#d84010';
  if (prix < 0.26) return '#b01010';
  return '#600010';
}

// ─── SpotPricesScreen ─────────────────────────
function SpotPricesScreen({ onBack }) {
  const [meta,     setMeta]     = useState(null);
  const [spotData, setSpotData] = useState(null);
  const [loading,  setLoading]  = useState(true);
  const [importing,setImporting]= useState(false);
  const [importMsg,setImportMsg]= useState(null);
  const fileRef = useRef(null);

  const MOIS = ['Jan','Fév','Mar','Avr','Mai','Jui','Jul','Aoû','Sep','Oct','Nov','Déc'];

  const loadData = useCallback(async () => {
    const [{data:m}, {data:rows}] = await Promise.all([
      sb.from('spot_metadata').select('*').eq('id',1).maybeSingle(),
      sb.rpc('get_spot_averages'),
    ]);
    setMeta(m);
    if (rows && rows.length > 0) {
      const avg = {};
      rows.forEach(r => { avg[`${r.mois}_${r.heure}`] = parseFloat(r.avg_prix); });
      setSpotData(avg);
    }
    setLoading(false);
  }, []);

  useEffect(() => { loadData(); }, [loadData]);

  const handleImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImporting(true); setImportMsg(null);
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header:0 });
        const records = rows.map(r => ({
          mois:  parseInt(r['mois'] ?? r['Mois'] ?? r['MOIS']),
          jour:  parseInt(r['jour'] ?? r['Jour'] ?? r['JOUR']),
          heure: parseInt(r['heure'] ?? r['Heure'] ?? r['HEURE']),
          prix:  parseFloat(r['spot price'] ?? r['prix'] ?? r['Prix']),
        })).filter(r => !isNaN(r.mois) && !isNaN(r.jour) && !isNaN(r.heure) && !isNaN(r.prix));

        // Upsert par chunks de 500
        const CHUNK = 500;
        for (let i = 0; i < records.length; i += CHUNK) {
          const chunk = records.slice(i, i+CHUNK);
          const { error } = await sb.from('prix_spot').upsert(chunk, { onConflict:'mois,jour,heure' });
          if (error) { setImportMsg('Erreur : ' + error.message); setImporting(false); return; }
        }
        await sb.from('spot_metadata').upsert({ id:1, last_update: new Date().toISOString(), rows_count: records.length, source_file: file.name }, { onConflict:'id' });

        setImportMsg(`✓ ${records.length} lignes importées`);
        setImporting(false);
        await loadData();
      } catch(err) {
        setImportMsg('Erreur lecture fichier : ' + err.message);
        setImporting(false);
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  const fmtDate = (ts) => ts ? new Date(ts).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
  const fmtP = (v) => v !== undefined ? (v*100).toFixed(2) + ' c€' : '—';

  return (
    <div className="screen fade-in">
      <button className="back-btn" onClick={onBack}>← Retour</button>
      <div className="auth-header">
        <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
        <h1 className="welcome-title">Prix<br/><span className="accent">spot</span></h1>
      </div>

      {/* Méta */}
      <div className="card" style={{marginBottom:12,padding:'16px 18px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <span style={{fontSize:13,color:'rgba(255,255,255,.6)',fontWeight:600}}>Dernière mise à jour</span>
          <span style={{fontSize:13,fontWeight:700,color:'white'}}>{fmtDate(meta?.last_update)}</span>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <span style={{fontSize:13,color:'rgba(255,255,255,.6)',fontWeight:600}}>Lignes importées</span>
          <span style={{fontSize:13,fontWeight:700,color:'white'}}>{meta?.rows_count?.toLocaleString('fr-FR') ?? '—'}</span>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <span style={{fontSize:13,color:'rgba(255,255,255,.6)',fontWeight:600}}>Source</span>
          <span style={{fontSize:12,fontWeight:600,color:'rgba(255,255,255,.5)'}}>{meta?.source_file ?? '—'}</span>
        </div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={handleImport}/>
        <button className="btn btn-sec" style={{color:'#5de0f5',borderColor:'rgba(8,145,178,.4)',fontSize:13}}
          onClick={()=>fileRef.current?.click()} disabled={importing}>
          {importing ? 'Import en cours…' : '⚡ Importer les prix spot (xlsx/csv)'}
        </button>
        {importMsg && <div style={{marginTop:8,fontSize:12,fontWeight:700,color: importMsg.startsWith('✓') ? 'var(--green)' : '#ff9090'}}>{importMsg}</div>}
      </div>

      {/* Légende couleurs */}
      <div style={{display:'flex',gap:3,flexWrap:'wrap',marginBottom:10,padding:'0 2px'}}>
        {[['< 3c€',0.02],['3-6',0.04],['6-9',0.07],['9-12',0.10],['12-15',0.13],['15-18',0.16],['18-20',0.19],['20-22',0.21],['22-26',0.24],['>26',0.30]].map(([lbl,v])=>(
          <div key={lbl} style={{display:'flex',alignItems:'center',gap:3,fontSize:9.5,color:'rgba(255,255,255,.65)',fontWeight:600}}>
            <div style={{width:12,height:12,borderRadius:2,background:spotColor(v),flexShrink:0}}/>
            {lbl}
          </div>
        ))}
      </div>

      {/* Heatmap heures × mois */}
      {loading ? (
        <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div>
      ) : spotData ? (
        <div style={{overflowX:'auto',marginBottom:80}}>
          <div style={{minWidth:320}}>
            {/* Header mois */}
            <div style={{display:'grid',gridTemplateColumns:'28px repeat(12,1fr)',gap:2,marginBottom:2}}>
              <div/>
              {MOIS.map(m=>(
                <div key={m} style={{textAlign:'center',fontSize:9,color:'rgba(255,255,255,.5)',fontWeight:700}}>{m}</div>
              ))}
            </div>
            {/* Lignes heures */}
            {Array.from({length:24},(_,h)=>(
              <div key={h} style={{display:'grid',gridTemplateColumns:'28px repeat(12,1fr)',gap:2,marginBottom:2}}>
                <div style={{fontSize:9,color:'rgba(255,255,255,.45)',fontWeight:600,display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:4}}>
                  {String(h).padStart(2,'0')}h
                </div>
                {Array.from({length:12},(_,mi)=>{
                  const k = `${mi+1}_${h}`;
                  const val = spotData[k];
                  return (
                    <div key={mi} title={val !== undefined ? `${MOIS[mi]} ${String(h).padStart(2,'0')}h : ${(val*100).toFixed(2)} c€/kWh` : ''}
                      style={{height:16,borderRadius:2,background:spotColor(val),cursor:val!==undefined?'help':'default'}}/>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div className="card" style={{textAlign:'center',padding:'32px 20px'}}>
          <div style={{fontSize:32,marginBottom:10}}>⚡</div>
          <p style={{color:'rgba(255,255,255,.6)',fontSize:13}}>Aucun prix spot importé.<br/>Utilisez le bouton ci-dessus pour importer un fichier Excel.</p>
        </div>
      )}
    </div>
  );
}

      {loading ? <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div> : (
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:80}}>
          {tariffs.map(t => (
            <div key={t.id} className="tariff-row-item" onClick={()=>onEdit(t)}>
              <div style={{flex:1}}>
                <div className="tariff-row-name">{t.nom}</div>
                <div className="tariff-row-meta">
                  Abo : {t.abo_annuel ? `${t.abo_annuel} €/an` : '—'}
                  {t.prix_hp ? ` · HP : ${t.prix_hp} €` : ''}
                  {t.prix_hc ? ` · HC : ${t.prix_hc} €` : ''}
                </div>
                <div className="tariff-row-badges">
                  {t.tarif_dynamique && <span className="tariff-badge dyn">Dynamique</span>}
                  {t.bat_virtuelle && <span className="tariff-badge bat">Bat. virtuelle</span>}
                </div>
                <div className="tariff-row-meta" style={{marginTop:3}}>Modifié : {fmt(t.last_modified)}</div>
              </div>
              <span style={{color:'rgba(255,255,255,.35)',fontSize:18,marginLeft:10}}>›</span>
            </div>
          ))}
        </div>
      )}
      <div style={{position:'fixed',bottom:0,left:0,right:0,padding:'16px',background:'linear-gradient(to top, rgba(5,65,78,1) 65%, transparent)',zIndex:200}}>
        <div style={{maxWidth:520,margin:'0 auto',display:'flex',gap:10}}>
          <button className="btn btn-sec" style={{flex:1,fontSize:13}} onClick={onNew}>+ Nouveau tarif</button>
          <button className="btn btn-sec" style={{flex:1,fontSize:13,color:'#5de0f5',borderColor:'rgba(8,145,178,.4)'}}
            onClick={()=>alert('Import prix spot — à venir')}>⚡ Importer prix spot</button>
        </div>
      </div>
    </div>
  );
}

// ─── Helpers tariff form (définis hors composant pour éviter remount) ──
function TariffToggle({ label, val, onChange }) {
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0'}}>
      <span style={{fontSize:13,color:'rgba(255,255,255,.75)',fontWeight:600}}>{label}</span>
      <button type="button" onClick={()=>onChange(!val)} style={{
        width:44,height:26,borderRadius:13,border:'none',cursor:'pointer',padding:3,
        background: val ? 'var(--green)' : 'rgba(255,255,255,.2)',
        display:'flex',alignItems:'center',justifyContent: val ? 'flex-end' : 'flex-start',
        transition:'background .2s',flexShrink:0,
      }}>
        <span style={{width:20,height:20,borderRadius:10,background:'white',display:'block'}}/>
      </button>
    </div>
  );
}

function TariffField({ label, fkey, type='text', placeholder='', value, onChange }) {
  return (
    <div className="inp-group">
      <label className="inp-label">{label}</label>
      <input className="inp" type={type} value={value} placeholder={placeholder}
        onChange={e=>onChange(fkey, e.target.value)}/>
    </div>
  );
}

// ─── AdminTariffEditScreen ────────────────────
function AdminTariffEditScreen({ tariff, onSave, onDelete, onBack }) {
  const isNew = !tariff?.id;
  const [f, setF] = useState({
    nom:               tariff?.nom || '',
    abo_annuel:        tariff?.abo_annuel ?? '',
    prix_hp:           tariff?.prix_hp ?? '',
    prix_hc:           tariff?.prix_hc ?? '',
    bat_virtuelle:     tariff?.bat_virtuelle || false,
    surcout_abonnement:tariff?.surcout_abonnement ?? '',
    acheminement_hp:   tariff?.acheminement_hp ?? '',
    acheminement_hc:   tariff?.acheminement_hc ?? '',
    tarif_dynamique:   tariff?.tarif_dynamique || false,
    turpe_fixe:        tariff?.turpe_fixe ?? '',
    cta_fixe:          tariff?.cta_fixe ?? '',
  });
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);

  const upd = useCallback((k, v) => setF(p => ({...p, [k]: v})), []);
  const n = (v) => v === '' || v === null || v === undefined ? null : parseFloat(v);

  const handleSave = async () => {
    if (!f.nom.trim()) { setError('Le nom est obligatoire.'); return; }
    setLoading(true); setError(null);
    const payload = {
      nom: f.nom.trim(),
      abo_annuel: n(f.abo_annuel),
      prix_hp: f.tarif_dynamique ? null : n(f.prix_hp),
      prix_hc: f.tarif_dynamique ? null : n(f.prix_hc),
      bat_virtuelle:   f.bat_virtuelle,
      surcout_abonnement: f.bat_virtuelle ? n(f.surcout_abonnement) : null,
      acheminement_hp:    f.bat_virtuelle ? n(f.acheminement_hp) : null,
      acheminement_hc:    f.bat_virtuelle ? n(f.acheminement_hc) : null,
      tarif_dynamique: f.tarif_dynamique,
      turpe_fixe: f.tarif_dynamique ? n(f.turpe_fixe) : null,
      cta_fixe:   f.tarif_dynamique ? n(f.cta_fixe)   : null,
      last_modified: new Date().toISOString(),
    };
    let err;
    if (isNew) {
      ({ error: err } = await sb.from('tarifs_electricite').insert(payload));
    } else {
      ({ error: err } = await sb.from('tarifs_electricite').update(payload).eq('id', tariff.id));
    }
    setLoading(false);
    if (err) { setError(err.message); return; }
    onSave();
  };

  const handleDelete = async () => {
    if (!confirm(`Supprimer "${tariff.nom}" ?`)) return;
    await sb.from('tarifs_electricite').delete().eq('id', tariff.id);
    onDelete();
  };

  return (
    <>
      <div className="screen fade-in">
        <button className="back-btn" onClick={onBack}>← Retour</button>
        <div className="auth-header">
          <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
          <h1 className="welcome-title">{isNew ? 'Nouveau' : 'Modifier'}<br/><span className="accent">tarif</span></h1>
        </div>
        <div className="form-card">
          <TariffField label="Nom du tarif *" fkey="nom" value={f.nom} onChange={upd} placeholder="EDF TRV HC HP"/>
          <TariffField label="Abonnement annuel (€/an)" fkey="abo_annuel" type="number" value={String(f.abo_annuel)} onChange={upd} placeholder="237.72"/>
          <TariffToggle label="Tarif dynamique (prix spot)" val={f.tarif_dynamique} onChange={v=>upd('tarif_dynamique',v)}/>
          {f.tarif_dynamique ? (
            <div className="inp-row">
              <TariffField label="TURPE fixe (€/an)" fkey="turpe_fixe" type="number" value={String(f.turpe_fixe)} onChange={upd} placeholder="129.79"/>
              <TariffField label="CTA fixe (€/an)" fkey="cta_fixe" type="number" value={String(f.cta_fixe)} onChange={upd} placeholder="19.47"/>
            </div>
          ) : (
            <div className="inp-row">
              <TariffField label="Prix HP (€/kWh)" fkey="prix_hp" type="number" value={String(f.prix_hp)} onChange={upd} placeholder="0.2081"/>
              <TariffField label="Prix HC (€/kWh)" fkey="prix_hc" type="number" value={String(f.prix_hc)} onChange={upd} placeholder="0.1635"/>
            </div>
          )}
          <TariffToggle label="Batterie virtuelle" val={f.bat_virtuelle} onChange={v=>upd('bat_virtuelle',v)}/>
          {f.bat_virtuelle && (<>
            <TariffField label="Surcout abonnement (€/an)" fkey="surcout_abonnement" type="number" value={String(f.surcout_abonnement)} onChange={upd} placeholder="86.4"/>
            <div className="inp-row">
              <TariffField label="Acheminement HP (€/kWh)" fkey="acheminement_hp" type="number" value={String(f.acheminement_hp)} onChange={upd} placeholder="0.0953"/>
              <TariffField label="Acheminement HC (€/kWh)" fkey="acheminement_hc" type="number" value={String(f.acheminement_hc)} onChange={upd} placeholder="0.078"/>
            </div>
          </>)}
          {error && <div className="auth-error">{error}</div>}
        </div>
        {!isNew && (
          <button className="btn-link" style={{color:'rgba(255,100,100,.55)',marginTop:8}} onClick={handleDelete}>
            Supprimer ce tarif
          </button>
        )}
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handleSave} disabled={loading}>
          {loading ? 'Enregistrement…' : '✓ Enregistrer'}
        </button>
        <button className="btn btn-sec" onClick={onBack}>Annuler</button>
      </StickyFooter>
    </>
  );
}

// ─── AdminUsersScreen ─────────────────────────
function AdminUsersScreen({ onBack }) {
  const [users,   setUsers]   = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    sb.from('profiles').select('prenom, nom, pseudo, created_at').order('created_at', {ascending:false})
      .then(({ data }) => { setUsers(data || []); setLoading(false); });
  }, []);

  return (
    <div className="screen fade-in">
      <button className="back-btn" onClick={onBack}>← Retour</button>
      <div className="auth-header">
        <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
        <h1 className="welcome-title">Utilisateurs<br/><span className="accent">({users.length})</span></h1>
      </div>
      {loading ? <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div> : (
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {users.map((u,i) => (
            <div key={i} className="tariff-row-item" style={{cursor:'default'}}>
              <div>
                <div className="tariff-row-name">{u.prenom} {u.nom}</div>
                {u.pseudo && <div className="tariff-row-meta">Pseudo : {u.pseudo}</div>}
                <div className="tariff-row-meta">Inscrit le {u.created_at ? new Date(u.created_at).toLocaleDateString('fr-FR') : '—'}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── MAIN APP — Machine d'états ──────────────

const INIT = {
  screen:      'WELCOME',
  name:        '',
  address:     '',
  initialBill: 0,
  bill:        0,
  bravoItems:  [],
  investment:  0,
};

function App() {
  const [state,       setState]      = useState(INIT);
  const [history,     setHistory]    = useState([]);
  const [user,        setUser]       = useState(null);
  const [profile,     setProfile]    = useState(null);
  const [authLoading, setAuthLoading]= useState(true);
  const pendingProfileRef            = useRef(null);

  const fetchProfile = useCallback(async (userId) => {
    const { data } = await sb.from('profiles')
      .select('prenom, nom, pseudo, adresse_ligne1, code_postal, ville, telephone, heure_debut_hc1, heure_fin_hc1, heure_debut_hc2, heure_fin_hc2')
      .eq('id', userId).single();
    if (data) setProfile(data);
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        setUser(session.user);
        fetchProfile(session.user.id);
        setState(s => ({ ...s, screen: 'HOME_LOGGED_IN' }));
      }
      setAuthLoading(false);
    });

    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        setUser(session.user);
        if (pendingProfileRef.current) {
          setProfile(pendingProfileRef.current);
          pendingProfileRef.current = null;
        }
        fetchProfile(session.user.id);
        setState(s => ({ ...s, screen: 'HOME_LOGGED_IN' }));
        setHistory([]);
      }
      if (event === 'SIGNED_OUT') {
        setUser(null); setProfile(null);
        setHistory([]); setState(INIT);
      }
    });

    return () => subscription.unsubscribe();
  }, [fetchProfile]);

  const goTo = useCallback((screen, updates = {}) => {
    setHistory(h => [...h, state]);
    setState(s => ({ ...s, screen, ...updates }));
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [state]);

  const goBack = useCallback(() => {
    if (!history.length) return;
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0,-1));
    setState(prev);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [history]);

  const handleLogout = async () => { await sb.auth.signOut(); };

  const isAdmin = user?.email === 'greg@starvolt.fr';

  const render = () => {
    if (authLoading) return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'60vh'}}>
        <div className="spinner"/>
      </div>
    );

    switch (state.screen) {

      case 'HOME_LOGGED_IN':
        return <HomeLoggedInScreen profile={profile}/>;

      case 'PROFILE':
        return <ProfileScreen
          user={user}
          profile={profile}
          onSave={(updated) => { setProfile(p => ({...p, ...updated})); goTo('HOME_LOGGED_IN'); }}
          onCancel={() => goTo('HOME_LOGGED_IN')}
          onLogout={handleLogout}
          onDeleted={() => { setUser(null); setProfile(null); setState(INIT); setHistory([]); }}/>;

      case 'ADMIN':
        return <AdminScreen
          onTariffs={()=>goTo('ADMIN_TARIFFS')}
          onSpot={()=>goTo('SPOT_PRICES')}
          onUsers={()=>goTo('ADMIN_USERS')}
          onBack={goBack}/>;

      case 'SPOT_PRICES':
        return <SpotPricesScreen onBack={goBack}/>;

      case 'ADMIN_TARIFFS':
        return <AdminTariffsScreen
          onEdit={(t)=>goTo('ADMIN_TARIFF_EDIT', {editTariff: t})}
          onNew={()=>goTo('ADMIN_TARIFF_EDIT', {editTariff: null})}
          onBack={goBack}/>;

      case 'ADMIN_TARIFF_EDIT':
        return <AdminTariffEditScreen
          tariff={state.editTariff}
          onSave={()=>goTo('ADMIN_TARIFFS')}
          onDelete={()=>goTo('ADMIN_TARIFFS')}
          onBack={goBack}/>;

      case 'ADMIN_USERS':
        return <AdminUsersScreen onBack={goBack}/>;

      case 'MA_CONSO':
        return <MaConsoScreen onBack={goBack}/>;

      case 'SIMULATIONS': {
        const base = { name: profile?.prenom||'', address:'Zone ACC', initialBill:2000, bill:2000, bravoItems:[], investment:0, eligible:true };
        return <SimulationsScreen
          onACC={()=>goTo('ADDRESS', base)}
          onBox={()=>goTo('COMWATT', base)}
          onSolar={()=>goTo('SOLAR', base)}
          onBack={goBack}/>;
      }

      case 'AUTH_SIGNUP':
        return <AuthSignupScreen
          onGoToLogin={()=>goTo('AUTH_LOGIN')}
          onSignedUp={(p)=>{ pendingProfileRef.current = {...p, pseudo:null, adresse_ligne1:null, code_postal:null, ville:null, telephone:null}; }}/>;

      case 'AUTH_LOGIN':
        return <AuthLoginScreen onGoToSignup={()=>goTo('AUTH_SIGNUP')}/>;

      case 'WELCOME':
        return <WelcomeScreen
          onCreateAccount={()=>goTo('AUTH_SIGNUP')}
          onLogin={()=>goTo('AUTH_LOGIN')}/>;

      case 'ADDRESS': {
        const accSaving = Math.round(state.initialBill * 0.15);
        if (!state.eligible) {
          return <NoACCScreen state={state} onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
        }
        return <EligibleScreen state={state} saving={accSaving}
          onYes={()=>goTo('BRAVO_1',{ bill:state.bill-accSaving, bravoItems:[...state.bravoItems,`Tarif ACC : −${accSaving.toLocaleString('fr-FR')} €/an`] })}
          onNo={()=>goTo('NO_ACC')}
          onBack={goBack}/>;
      }

      case 'NO_ACC':
        return <NoACCScreen state={state} onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;

      case 'BRAVO_1': {
        const accSaving = Math.round(state.initialBill * 0.15);
        return <BravoScreen state={state} stepNumber={1} saving={accSaving} label="Grâce au tarif ACC"
          onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
      }

      case 'COMWATT': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <ComwattScreen state={state} saving={cwSaving}
          onYes={()=>goTo('BRAVO_2',{ bill:state.bill-cwSaving, bravoItems:[...state.bravoItems,`Box Comwatt : −${cwSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+550 })}
          onNo={()=>goTo('SOLAR')}
          onBack={goBack}/>;
      }

      case 'BRAVO_2': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <BravoScreen state={state} stepNumber={2} saving={cwSaving} label="Grâce à la box Comwatt"
          onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;
      }

      case 'SOLAR': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <SolarScreen state={state} saving={solSaving}
          onYes={()=>goTo('BRAVO_3',{ bill:state.bill-solSaving, bravoItems:[...state.bravoItems,`Solaire + batterie : −${solSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+10000 })}
          onNo={()=>goTo('FINAL')}
          onBack={goBack}/>;
      }

      case 'BRAVO_3': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <BravoScreen state={state} stepNumber={3} saving={solSaving} label="Grâce aux panneaux solaires"
          onContinue={()=>goTo('FINAL')} onBack={goBack}/>;
      }

      case 'FINAL':
        return <FinalScreen state={state} onRestart={()=>{ setHistory([]); setState(INIT); }}/>;

      default: return null;
    }
  };

  const isAuthScreen = ['AUTH_SIGNUP','AUTH_LOGIN'].includes(state.screen);
  const isHome = !authLoading && user && state.screen === 'HOME_LOGGED_IN';
  const chipLabel = profile ? (profile.pseudo || profile.prenom || '') : state.name;
  const avatarName = profile ? `${profile.prenom || ''} ${profile.nom || ''}`.trim() : state.name;
  const showNameChip = profile ? true : state.screen !== 'WELCOME';

  return (
    <div className="app">
      <TopBar
        name={chipLabel}
        avatarName={avatarName}
        showName={!isAuthScreen && showNameChip}
        logoOnly={isAuthScreen}
        onLogout={user && !isHome && state.screen !== 'PROFILE' ? handleLogout : null}
        onLogoClick={() => user ? goTo('HOME_LOGGED_IN') : goTo('WELCOME')}
        onProfileClick={user ? () => goTo('PROFILE') : null}
        isAdmin={isAdmin}
        onAdmin={()=>goTo('ADMIN')}
      />
      <div className="chevrons-deco" aria-hidden="true">
        {['»','»','»','»'].map((c,i)=><span key={i}>{c}</span>)}
      </div>
      {render()}
      {isHome && (
        <StickyFooter row>
          <button className="btn-home" onClick={()=>goTo('MA_CONSO')}>
            <span>Ma conso actuelle</span>
            <span className="btn-home-sub">renseignée à 0 %</span>
          </button>
          <button className="btn-home primary" onClick={()=>goTo('SIMULATIONS')}>
            <span>Simulations</span>
            <span className="btn-home-sub">d'économie</span>
          </button>
        </StickyFooter>
      )}
      <InstallBanner/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
