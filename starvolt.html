}

// ─── AdminTariffEditScreen ────────────────────
function AdminTariffEditScreen({ tariff, onSave, onDelete, onBack }) {
  const isNew = !tariff?.id;
  const [f, setF] = useState({
    nom:               tariff?.nom || '',
    abo_annuel:        tariff?.abo_annuel ?? '',
    prix_hp:           tariff?.prix_hp ?? '',
    prix_hc:           tariff?.prix_hc ?? '',
    bat_virtuelle:     tariff?.bat_virtuelle || false,
    surcout_abonnement:tariff?.surcout_abonnement ?? '',
    acheminement_hp:   tariff?.acheminement_hp ?? '',
    acheminement_hc:   tariff?.acheminement_hc ?? '',
    tarif_dynamique:           tariff?.tarif_dynamique || false,
    turpe_fixe:                tariff?.turpe_fixe ?? '',
    cta_fixe:                  tariff?.cta_fixe ?? '',
    marge_fournisseur_ceur_kwh: tariff?.marge_fournisseur_ceur_kwh ?? '',
  });
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);

  const upd = useCallback((k, v) => setF(p => ({...p, [k]: v})), []);
  const n = (v) => v === '' || v === null || v === undefined ? null : parseFloat(v);

  const handleSave = async () => {
    if (!f.nom.trim()) { setError('Le nom est obligatoire.'); return; }
    setLoading(true); setError(null);
    const payload = {
      nom: f.nom.trim(),
      abo_annuel: n(f.abo_annuel),
      prix_hp: f.tarif_dynamique ? null : n(f.prix_hp),
      prix_hc: f.tarif_dynamique ? null : n(f.prix_hc),
      bat_virtuelle:   f.bat_virtuelle,
      surcout_abonnement: f.bat_virtuelle ? n(f.surcout_abonnement) : null,
      acheminement_hp:    f.bat_virtuelle ? n(f.acheminement_hp) : null,
      acheminement_hc:    f.bat_virtuelle ? n(f.acheminement_hc) : null,
      tarif_dynamique: f.tarif_dynamique,
      turpe_fixe:                  f.tarif_dynamique ? n(f.turpe_fixe) : null,
      cta_fixe:                    f.tarif_dynamique ? n(f.cta_fixe)   : null,
      marge_fournisseur_ceur_kwh:  f.tarif_dynamique ? n(f.marge_fournisseur_ceur_kwh) : null,
      last_modified: new Date().toISOString(),
    };
    let err;
    if (isNew) {
      ({ error: err } = await sb.from('tarifs_electricite').insert(payload));
    } else {
      ({ error: err } = await sb.from('tarifs_electricite').update(payload).eq('id', tariff.id));
    }
    setLoading(false);
    if (err) { setError(err.message); return; }
    onSave();
  };

  const handleDelete = async () => {
    if (!confirm(`Supprimer "${tariff.nom}" ?`)) return;
    await sb.from('tarifs_electricite').delete().eq('id', tariff.id);
    onDelete();
  };

  return (
    <>
      <div className="screen fade-in">
        <button className="back-btn" onClick={onBack}>← Retour</button>
        <div className="auth-header">
          <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
          <h1 className="welcome-title">{isNew ? 'Nouveau' : 'Modifier'}<br/><span className="accent">tarif</span></h1>
        </div>
        <div className="form-card">
          <TariffField label="Nom du tarif *" fkey="nom" value={f.nom} onChange={upd} placeholder="EDF TRV HC HP"/>
          <TariffField label="Abonnement annuel (€/an)" fkey="abo_annuel" type="number" value={String(f.abo_annuel)} onChange={upd} placeholder="237.72"/>
          <TariffToggle label="Tarif dynamique (prix spot)" val={f.tarif_dynamique} onChange={v=>upd('tarif_dynamique',v)}/>
          {f.tarif_dynamique ? (
            <>
              <div className="inp-row">
                <TariffField label="TURPE fixe (€/an)" fkey="turpe_fixe" type="number" value={String(f.turpe_fixe)} onChange={upd} placeholder="129.79"/>
                <TariffField label="CTA fixe (€/an)" fkey="cta_fixe" type="number" value={String(f.cta_fixe)} onChange={upd} placeholder="19.47"/>
              </div>
              <TariffField label="Marge fournisseur (c€/kWh)" fkey="marge_fournisseur_ceur_kwh" type="number" value={String(f.marge_fournisseur_ceur_kwh)} onChange={upd} placeholder="ex: 1.5"/>
            </>
          ) : (
            <div className="inp-row">
              <TariffField label="Prix HP (€/kWh)" fkey="prix_hp" type="number" value={String(f.prix_hp)} onChange={upd} placeholder="0.2081"/>
              <TariffField label="Prix HC (€/kWh)" fkey="prix_hc" type="number" value={String(f.prix_hc)} onChange={upd} placeholder="0.1635"/>
            </div>
          )}
          <TariffToggle label="Batterie virtuelle" val={f.bat_virtuelle} onChange={v=>upd('bat_virtuelle',v)}/>
          {f.bat_virtuelle && (<>
            <TariffField label="Surcout abonnement (€/an)" fkey="surcout_abonnement" type="number" value={String(f.surcout_abonnement)} onChange={upd} placeholder="86.4"/>
            <div className="inp-row">
              <TariffField label="Acheminement HP (€/kWh)" fkey="acheminement_hp" type="number" value={String(f.acheminement_hp)} onChange={upd} placeholder="0.0953"/>
              <TariffField label="Acheminement HC (€/kWh)" fkey="acheminement_hc" type="number" value={String(f.acheminement_hc)} onChange={upd} placeholder="0.078"/>
            </div>
          </>)}
          {error && <div className="auth-error">{error}</div>}
        </div>
        {!isNew && (
          <button className="btn-link" style={{color:'rgba(255,100,100,.55)',marginTop:8}} onClick={handleDelete}>
            Supprimer ce tarif
          </button>
        )}
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handleSave} disabled={loading}>
          {loading ? 'Enregistrement…' : '✓ Enregistrer'}
        </button>
        <button className="btn btn-sec" onClick={onBack}>Annuler</button>
      </StickyFooter>
    </>
  );
}

// ─── MAIN APP — Machine d'états ──────────────

const INIT = {
  screen:      'WELCOME',
  name:        '',
  address:     '',
  initialBill: 0,
  bill:        0,
  bravoItems:  [],
  investment:  0,
};

function App() {
  const [state,       setState]      = useState(INIT);
  const [history,     setHistory]    = useState([]);
  const [user,        setUser]       = useState(null);
  const [profile,     setProfile]    = useState(null);
  const [authLoading, setAuthLoading]= useState(true);
  const pendingProfileRef            = useRef(null);

  const fetchProfile = useCallback(async (userId) => {
    const { data } = await sb.from('profiles')
      .select('prenom, nom, pseudo, adresse_ligne1, code_postal, ville, telephone, heure_debut_hc1, heure_fin_hc1, heure_debut_hc2, heure_fin_hc2')
      .eq('id', userId).single();
    if (data) setProfile(data);
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        setUser(session.user);
        fetchProfile(session.user.id);
        setState(s => ({ ...s, screen: 'HOME_LOGGED_IN' }));
      }
      setAuthLoading(false);
    });

    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        setUser(session.user);
        if (pendingProfileRef.current) {
          setProfile(pendingProfileRef.current);
          pendingProfileRef.current = null;
        }
        fetchProfile(session.user.id);
        setState(s => ({ ...s, screen: 'HOME_LOGGED_IN' }));
        setHistory([]);
      }
      if (event === 'SIGNED_OUT') {
        setUser(null); setProfile(null);
        setHistory([]); setState(INIT);
      }
    });

    return () => subscription.unsubscribe();
  }, [fetchProfile]);

  const goTo = useCallback((screen, updates = {}) => {
    setHistory(h => [...h, state]);
    setState(s => ({ ...s, screen, ...updates }));
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [state]);

  const goBack = useCallback(() => {
    if (!history.length) return;
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0,-1));
    setState(prev);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [history]);

  const handleLogout = async () => { await sb.auth.signOut(); };

  const isAdmin = user?.email === 'greg@starvolt.fr';

  const render = () => {
    if (authLoading) return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'60vh'}}>
        <div className="spinner"/>
      </div>
    );

    switch (state.screen) {

      case 'HOME_LOGGED_IN':
        return <HomeLoggedInScreen profile={profile}/>;

      case 'PROFILE':
        return <ProfileScreen
          user={user}
          profile={profile}
          onSave={(updated) => { setProfile(p => ({...p, ...updated})); goTo('HOME_LOGGED_IN'); }}
          onCancel={() => goTo('HOME_LOGGED_IN')}
          onLogout={handleLogout}
          onDeleted={() => { setUser(null); setProfile(null); setState(INIT); setHistory([]); }}/>;

      case 'ADMIN':
        return <AdminScreen
          onTariffs={()=>goTo('ADMIN_TARIFFS')}
          onSpot={()=>goTo('SPOT_PRICES')}
          onUsers={()=>goTo('ADMIN_USERS')}
          onAcc={()=>goTo('ADMIN_ACC')}
          onBack={goBack}/>;

      case 'SPOT_PRICES':
        return <SpotPricesScreen onBack={goBack}/>;

      case 'ADMIN_TARIFFS':
        return <AdminTariffsScreen
          onEdit={(t)=>goTo('ADMIN_TARIFF_EDIT', {editTariff: t})}
          onNew={()=>goTo('ADMIN_TARIFF_EDIT', {editTariff: null})}
          onBack={goBack}/>;

      case 'ADMIN_TARIFF_EDIT':
        return <AdminTariffEditScreen
          tariff={state.editTariff}
          onSave={()=>goTo('ADMIN_TARIFFS')}
          onDelete={()=>goTo('ADMIN_TARIFFS')}
          onBack={goBack}/>;

      case 'ADMIN_USERS':
        return <AdminUsersScreen onBack={goBack}/>;

      case 'ADMIN_ACC':
        return <AdminAccScreen
          onEdit={(s)=>goTo('ADMIN_ACC_EDIT',{editAccSite:s})}
          onNew={()=>goTo('ADMIN_ACC_EDIT',{editAccSite:null})}
          onBack={goBack}/>;

      case 'ADMIN_ACC_EDIT':
        return <AdminAccEditScreen
          site={state.editAccSite}
          onSave={()=>goTo('ADMIN_ACC')}
          onDelete={()=>goTo('ADMIN_ACC')}
          onBack={goBack}/>;

      case 'MA_CONSO':
        return <MaConsoScreen user={user} userProfile={profile} onBack={goBack}/>;

      case 'SIMULATIONS': {
        const base = { name: profile?.prenom||'', address:'Zone ACC', initialBill:2000, bill:2000, bravoItems:[], investment:0, eligible:true };
        return <SimulationsScreen
          user={user}
          userProfile={profile}
          onACC={()=>goTo('ACC_MAP')}
          onBox={()=>goTo('COMWATT', base)}
          onSolar={()=>goTo('SOLAR', base)}
          onOptimisation={()=>goTo('OPTIMISATION')}
          onBack={goBack}/>;
      }

      case 'OPTIMISATION':
        return <OptimisationScreen user={user} userProfile={profile} onBack={goBack}/>;

      case 'ACC_MAP':
        return <AccMapScreen user={user} userProfile={profile} onBack={goBack}/>;

      case 'AUTH_SIGNUP':
        return <AuthSignupScreen
          onGoToLogin={()=>goTo('AUTH_LOGIN')}
          onSignedUp={(p)=>{ pendingProfileRef.current = {...p, pseudo:null, adresse_ligne1:null, code_postal:null, ville:null, telephone:null}; }}/>;

      case 'AUTH_LOGIN':
        return <AuthLoginScreen onGoToSignup={()=>goTo('AUTH_SIGNUP')}/>;

      case 'WELCOME':
        return <WelcomeScreen
          onCreateAccount={()=>goTo('AUTH_SIGNUP')}
          onLogin={()=>goTo('AUTH_LOGIN')}/>;

      case 'ADDRESS': {
        const accSaving = Math.round(state.initialBill * 0.15);
        if (!state.eligible) {
          return <NoACCScreen state={state} onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
        }
        return <EligibleScreen state={state} saving={accSaving}
          onYes={()=>goTo('BRAVO_1',{ bill:state.bill-accSaving, bravoItems:[...state.bravoItems,`Tarif ACC : −${accSaving.toLocaleString('fr-FR')} €/an`] })}
          onNo={()=>goTo('NO_ACC')}
          onBack={goBack}/>;
      }

      case 'NO_ACC':
        return <NoACCScreen state={state} onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;

      case 'BRAVO_1': {
        const accSaving = Math.round(state.initialBill * 0.15);
        return <BravoScreen state={state} stepNumber={1} saving={accSaving} label="Grâce au tarif ACC"
          onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
      }

      case 'COMWATT': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <ComwattScreen state={state} saving={cwSaving}
          onYes={()=>goTo('BRAVO_2',{ bill:state.bill-cwSaving, bravoItems:[...state.bravoItems,`Box Comwatt : −${cwSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+550 })}
          onNo={()=>goTo('SOLAR')}
          onBack={goBack}/>;
      }

      case 'BRAVO_2': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <BravoScreen state={state} stepNumber={2} saving={cwSaving} label="Grâce à la box Comwatt"
          onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;
      }

      case 'SOLAR': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <SolarScreen state={state} saving={solSaving}
          onYes={()=>goTo('BRAVO_3',{ bill:state.bill-solSaving, bravoItems:[...state.bravoItems,`Solaire + batterie : −${solSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+10000 })}
          onNo={()=>goTo('FINAL')}
          onBack={goBack}/>;
      }

      case 'BRAVO_3': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <BravoScreen state={state} stepNumber={3} saving={solSaving} label="Grâce aux panneaux solaires"
          onContinue={()=>goTo('FINAL')} onBack={goBack}/>;
      }

      case 'FINAL':
        return <FinalScreen state={state} onRestart={()=>{ setHistory([]); setState(INIT); }}/>;

      default: return null;
    }
  };

  const isAuthScreen = ['AUTH_SIGNUP','AUTH_LOGIN'].includes(state.screen);
  const isHome = !authLoading && user && state.screen === 'HOME_LOGGED_IN';
  const chipLabel = profile ? (profile.pseudo || profile.prenom || '') : state.name;
  const avatarName = profile ? `${profile.prenom || ''} ${profile.nom || ''}`.trim() : state.name;
  const showNameChip = profile ? true : state.screen !== 'WELCOME';

  return (
    <div className="app">
      <TopBar
        name={chipLabel}
        avatarName={avatarName}
        showName={!isAuthScreen && showNameChip}
        logoOnly={isAuthScreen}
        onLogout={user && !isHome && state.screen !== 'PROFILE' ? handleLogout : null}
        onLogoClick={() => user ? goTo('HOME_LOGGED_IN') : goTo('WELCOME')}
        onProfileClick={user ? () => goTo('PROFILE') : null}
        isAdmin={isAdmin}
        onAdmin={()=>goTo('ADMIN')}
      />
      <div className="chevrons-deco" aria-hidden="true">
        {['»','»','»','»'].map((c,i)=><span key={i}>{c}</span>)}
      </div>
      {render()}
      {isHome && (
        <StickyFooter row>
          <button className="btn-home" onClick={()=>goTo('MA_CONSO')}>
            <span>Ma conso actuelle</span>
            <span className="btn-home-sub">renseignée à 0 %</span>
          </button>
          <button className="btn-home primary" onClick={()=>goTo('SIMULATIONS')}>
            <span>Simulations</span>
            <span className="btn-home-sub">d'économie</span>
          </button>
        </StickyFooter>
      )}
      <InstallBanner/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
