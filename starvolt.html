// ─── computeEnergyBalance ─────────────────────
// Retourne { monthly[12], hourly[8784] } en kWh
// batLossPct/thermLossPct : % pertes sur cycle (ex 10 = 10%). Pertes à la charge.
function computeEnergyBalance(conso, prodNorm, pvKwc, batPowerW, batCapKwh, batLossPct, thermPowerKw, thermCapKwh, thermLossPct) {
  const batCapWh = (batCapKwh || 0) * 1000;
  const batPowWh = batPowerW || 0;
  const batEff = 1 - Math.min(Math.max(batLossPct||0,0),100)/100;
  const thermCapWh = (thermCapKwh || 0) * 1000;
  const thermPowWh = (thermPowerKw || 0) * 1000;
  const thermEff = 1 - Math.min(Math.max(thermLossPct||0,0),100)/100;
  let batState = 0, thermState = 0;
  const monthly = Array.from({length:12}, () => ({on_site:0, grid_buy:0, injection:0, via_bat:0, via_therm:0}));
  const hourly = new Array(8784);
  for (let m = 1; m <= 12; m++) {
    for (let d = 1; d <= PROF_DAYS[m-1]; d++) {
      for (let h = 0; h < 24; h++) {
        const idx = profIdx(m, d, h);
        const consoWh = conso[idx] || 0;
        const prodWh = (prodNorm[idx] || 0) * pvKwc;
        let surplus = prodWh - consoWh;
        if (surplus >= 0) {
          // Priorité : thermique d'abord, puis chimique
          if (thermCapWh > 0 && thermEff > 0) {
            const room = thermCapWh - thermState;
            const ci = Math.min(surplus, thermPowWh, room > 0 ? room / thermEff : 0);
            thermState += ci * thermEff; surplus -= ci;
          }
          if (batCapWh > 0 && batEff > 0) {
            const room = batCapWh - batState;
            const ci = Math.min(surplus, batPowWh, room > 0 ? room / batEff : 0);
            batState += ci * batEff; surplus -= ci;
          }
          const os = consoWh/1000, inj = surplus/1000;
          hourly[idx] = {on_site:os, grid_buy:0, injection:inj, via_bat:0, via_therm:0, m, d, h};
          monthly[m-1].on_site += os; monthly[m-1].injection += inj;
        } else {
          let need = -surplus, viaBat = 0, viaTherm = 0;
          // Décharge : thermique d'abord, puis chimique
          if (thermState > 0) { const dt=Math.min(need,thermPowWh,thermState); thermState-=dt; need-=dt; viaTherm+=dt; }
          if (batState > 0 && need > 0) { const db=Math.min(need,batPowWh,batState); batState-=db; need-=db; viaBat+=db; }
          const onSite=prodWh+viaBat+viaTherm;
          const os=onSite/1000, gb=need/1000, vb=viaBat/1000, vt=viaTherm/1000;
          hourly[idx] = {on_site:os, grid_buy:gb, injection:0, via_bat:vb, via_therm:vt, m, d, h};
          monthly[m-1].on_site += os; monthly[m-1].grid_buy += gb; monthly[m-1].via_bat += vb; monthly[m-1].via_therm += vt;
        }
      }
    }
  }
  return {monthly, hourly};
}

// ─── computeStorageOptimization ───────────────
// Optimisation stockage sans PV.
// baseTariff = tarif actuel du site (avant changement fournisseur) → billWithout
// tariff     = tarif retenu (panier ou site) → billWithStorage
// Retourne { monthly[12], hourly[8784], billWithout, billWithStorage, saving, reductionPct, _storageOpti:true }
function computeStorageOptimization(consoProfile, tariff, baseTariff, site, batKwh, thermKwh, globalVars, spotMap) {
  const ratioBat   = (globalVars?.ratio_puissance_stockage             ?? 50) / 100;
  const ratioTherm = (globalVars?.ratio_puissance_stockage_thermique   ?? 50) / 100;
  const pBat       = (globalVars?.pertes_batterie                      ?? 10) / 100;
  const seuil      = (globalVars?.seuil_optimisation_stockage          ?? 10) / 100;

  const bk = parseFloat(batKwh)   || 0;
  const tk = parseFloat(thermKwh) || 0;
  const batCapWh   = bk * 1000;
  const thermCapWh = tk * 1000;
  const batPowWh   = batCapWh  * ratioBat;
  const thermPowWh = thermCapWh * ratioTherm;
  const batEff     = 1 - Math.min(Math.max(pBat, 0), 1);

  const monthly = Array.from({length:12}, () => ({on_site:0, grid_buy:0, injection:0, via_bat:0, via_therm:0}));
  const hourly  = new Array(8784);

  const toHcH = v => { if (v == null || v === '') return null; const n = parseInt(String(v).split(':')[0]); return isNaN(n) ? null : n; };

  // Plages HC (communes à tous les modes)
  const hcWinCommon = [
    { s: toHcH(site?.hc_debut1 ?? site?.heure_debut_hc1 ?? globalVars?.hc_debut1), e: toHcH(site?.hc_fin1 ?? site?.heure_fin_hc1 ?? globalVars?.hc_fin1) },
    { s: toHcH(site?.hc_debut2 ?? site?.heure_debut_hc2 ?? globalVars?.hc_debut2), e: toHcH(site?.hc_fin2 ?? site?.heure_fin_hc2 ?? globalVars?.hc_fin2) },
  ].filter(w => w.s !== null && w.e !== null);

  // ── Helper : facture annuelle d'un tarif sur la conso brute (pas de PV ni stockage) ──
  const simpleAnnualBill = t => {
    if (!t) return 0;
    const tva = (globalVars?.tva ?? 20) / 100;
    let varCost = 0;
    for (let m = 1; m <= 12; m++)
      for (let d = 1; d <= PROF_DAYS[m-1]; d++)
        for (let h = 0; h < 24; h++) {
          const kWh = (consoProfile[profIdx(m,d,h)] || 0) / 1000;
          let p;
          if (t.tarif_dynamique && spotMap) {
            const marge = (t.marge_fournisseur_ceur_kwh||0)/100, accise = (globalVars?.accise||0)/100;
            p = (spotMap[`${m}_${d}_${h}`]||0) + getTurpeRate(m,h,globalVars,hcWinCommon) + accise + marge;
          } else if (t.type_tarif === 'multi' && t.periodes?.length > 0) {
            p = getPrixMulti(m, d, h, t.periodes);
          } else if (t.prix_hc != null && t.prix_hc !== t.prix_hp && hcWinCommon.length > 0) {
            p = isHcHour(h, hcWinCommon) ? t.prix_hc : t.prix_hp;
          } else {
            p = t.prix_hp || 0;
          }
          varCost += kWh * p;
        }
    if (t.tarif_dynamique && spotMap)
      return Math.round((varCost + (t.abo_annuel||0) + (t.turpe_fixe||0) + (t.cta_fixe||0)) * (1+tva));
    return Math.round(varCost + (t.abo_annuel||0));
  };

  // billWithout = facture AVANT tout changement (tarif actuel du site, pas de stockage)
  const billWithoutBase = simpleAnnualBill(baseTariff || tariff);

  const optiTarif = globalVars?.opti_tarif ?? true;

  // Optimisation désactivée → facture = conso brute × tarif retenu, pas de charge/décharge
  if (!optiTarif) {
    const billWithStorage = simpleAnnualBill(tariff);
    for (let m = 1; m <= 12; m++)
      for (let d = 1; d <= PROF_DAYS[m-1]; d++)
        for (let h = 0; h < 24; h++) {
          const idx = profIdx(m, d, h);
          const gb  = (consoProfile[idx] || 0) / 1000;
          monthly[m-1].grid_buy += gb;
          hourly[idx] = {on_site:0, grid_buy:gb, injection:0, via_bat:0, via_therm:0, m, d, h};
        }
    const saving = Math.max(0, billWithoutBase - billWithStorage);
    const reductionPct = billWithoutBase > 0 ? Math.min(100, Math.round(saving/billWithoutBase*100)) : 0;
    return {monthly, hourly, billWithout: billWithoutBase, billWithStorage, saving, reductionPct, _storageOpti: true};
  }

  // ── Helper : boucle interne charge/décharge (commun aux deux modes) ──────────
  // localSeuil=seuil pour spot dynamique ; localSeuil=0 pour HC/HP fixe
  // (seuil=0 → charge tout HC, décharge tout HP, sans filtre par seuil)
  function runLoop(getPrice, getDailyAvg, localSeuil) {
    let batSOC = batCapWh * 0.5, thermSOC = thermCapWh * 0.5;
    let varCostHT_without = 0, varCostHT_with = 0;
    for (let m = 1; m <= 12; m++) {
      for (let d = 1; d <= PROF_DAYS[m-1]; d++) {
        const avgDay = getDailyAvg(m, d);
        for (let h = 0; h < 24; h++) {
          const idx     = profIdx(m, d, h);
          const consoWh = consoProfile[idx] || 0;
          const price   = getPrice(m, d, h);
          varCostHT_without += (consoWh / 1000) * price;

          let gridConsumedWh = consoWh;
          let gridBillableWh = consoWh;
          let viaBat = 0, viaTherm = 0;

          if (price < 0) {
            // Prix négatif : on est payé pour consommer → charge stockage à fond depuis réseau
            if (thermCapWh > 0) { const ci=Math.min(thermPowWh,thermCapWh-thermSOC); if(ci>0){thermSOC+=ci;gridBillableWh+=ci;} }
            if (batCapWh > 0 && batEff > 0) { const room=batCapWh-batSOC; const ci=Math.min(batPowWh,room>0?room/batEff:0); if(ci>0){batSOC+=ci*batEff;gridBillableWh+=ci;} }
          } else if (price < avgDay * (1 - localSeuil)) {
            // Bon marché → charger (thermique d'abord)
            if (thermCapWh > 0) {
              const ci = Math.min(thermPowWh, thermCapWh - thermSOC);
              if (ci > 0) { thermSOC += ci; gridBillableWh += ci; }
            }
            if (batCapWh > 0 && batEff > 0) {
              const room = batCapWh - batSOC;
              const ci   = Math.min(batPowWh, room > 0 ? room / batEff : 0);
              if (ci > 0) { batSOC += ci * batEff; gridBillableWh += ci; }
            }
          } else if (price > avgDay * (1 + localSeuil)) {
            // Cher → décharger (thermique d'abord)
            let need = consoWh;
            if (thermSOC > 0 && need > 0) {
              const dt = Math.min(thermPowWh, thermSOC, need);
              thermSOC -= dt; need -= dt; viaTherm = dt;
            }
            if (batSOC > 0 && need > 0) {
              const db = Math.min(batPowWh, batSOC, need);
              batSOC -= db; need -= db; viaBat = db;
            }
            gridConsumedWh = Math.max(0, consoWh - viaBat - viaTherm);
            gridBillableWh = gridConsumedWh;
          }

          varCostHT_with += (gridBillableWh / 1000) * price;

          // grid_buy = achat réel au réseau (inclut la charge du stockage, pas juste la conso nette)
          // → thermique sans pertes : grid_buy constant sur l'année
          // → batterie avec 10% pertes : grid_buy légèrement supérieur à la conso
          const gb = gridBillableWh / 1000, vb = viaBat / 1000, vt = viaTherm / 1000;
          hourly[idx] = {on_site:0, grid_buy:gb, injection:0, via_bat:vb, via_therm:vt, m, d, h};
          monthly[m-1].grid_buy  += gb;
          monthly[m-1].via_bat   += vb;
          monthly[m-1].via_therm += vt;
        }
      }
    }
    return {varCostHT_without, varCostHT_with};
  }

  // ── Détection du mode de tarification ─────────────────────────────────────
  const isDynamic  = !!(tariff.tarif_dynamique && spotMap);
  const isMulti    = !isDynamic && tariff.type_tarif === 'multi' && tariff.periodes?.length > 0;
  const hasHC_fixed = !isDynamic && !isMulti && tariff.prix_hc != null && tariff.prix_hc !== tariff.prix_hp;

  // ── Tarif plat (pas d'optim, pas de dimension temporelle exploitable) ──────
  if (!isDynamic && !isMulti && !hasHC_fixed) {
    let billWithStorage = tariff.abo_annuel || 0;
    for (let m = 1; m <= 12; m++)
      for (let d = 1; d <= PROF_DAYS[m-1]; d++)
        for (let h = 0; h < 24; h++) {
          const idx = profIdx(m, d, h);
          const gb  = (consoProfile[idx] || 0) / 1000;
          monthly[m-1].grid_buy += gb;
          hourly[idx] = {on_site:0, grid_buy:gb, injection:0, via_bat:0, via_therm:0, m, d, h};
          billWithStorage += gb * (tariff.prix_hp || 0);
        }
    billWithStorage = Math.round(billWithStorage);
    const saving = Math.max(0, billWithoutBase - billWithStorage);
    const reductionPct = billWithoutBase > 0 ? Math.min(100, Math.round(saving/billWithoutBase*100)) : 0;
    return {monthly, hourly, billWithout: billWithoutBase, billWithStorage, saving, reductionPct, _storageOpti: true};
  }

  let billWithStorage;

  // ── MODE DYNAMIQUE : prix spot réels, moyenne journalière par jour ──────────
  if (isDynamic) {
    const marge  = (tariff.marge_fournisseur_ceur_kwh || 0) / 100;
    const accise = (globalVars?.accise  || 0) / 100;
    const tva    = (globalVars?.tva     ?? 20) / 100;
    const fixedHT = (tariff.abo_annuel || 0) + (tariff.turpe_fixe || 0) + (tariff.cta_fixe || 0);
    const hcWin   = [
      { s: toHcH(site?.hc_debut1 ?? site?.heure_debut_hc1 ?? globalVars?.hc_debut1), e: toHcH(site?.hc_fin1 ?? site?.heure_fin_hc1 ?? globalVars?.hc_fin1) },
      { s: toHcH(site?.hc_debut2 ?? site?.heure_debut_hc2 ?? globalVars?.hc_debut2), e: toHcH(site?.hc_fin2 ?? site?.heure_fin_hc2 ?? globalVars?.hc_fin2) },
    ].filter(w => w.s !== null && w.e !== null);

    // Prix HT de l'heure (spot + TURPE + accise + marge)
    const getPrice = (m, d, h) => {
      const spot = spotMap[`${m}_${d}_${h}`] || 0;
      return spot + getTurpeRate(m, h, globalVars, hcWin) + accise + marge;
    };
    // Moyenne journalière des 24 prix HT
    const getDailyAvg = (m, d) => {
      let s = 0;
      for (let h = 0; h < 24; h++) s += getPrice(m, d, h);
      return s / 24;
    };

    // Mode dynamique : utilise le seuil global pour filtrer les heures marginales
    const {varCostHT_with} = runLoop(getPrice, getDailyAvg, seuil);
    billWithStorage = Math.round((varCostHT_with + fixedHT) * (1 + tva));

  // ── MODE MULTI-PÉRIODES : prix variables selon plages dates/heures ───────────
  } else if (isMulti) {
    // Utilise la moyenne journalière réelle comme seuil (même logique que le mode dynamique)
    // Les prix dans periodes sont déjà TTC → pas de TVA supplémentaire
    const getPrice   = (m, d, h) => getPrixMulti(m, d, h, tariff.periodes);
    const getDailyAvg = (m, d) => { let s = 0; for (let h = 0; h < 24; h++) s += getPrice(m, d, h); return s / 24; };
    const {varCostHT_with} = runLoop(getPrice, getDailyAvg, seuil);
    billWithStorage = Math.round(varCostHT_with + (tariff.abo_annuel || 0));

  // ── MODE HC/HP FIXE : moyenne annuelle constante ─────────────────────────────
  } else {
    // Plages HC : site d'abord, sinon fallback sur les valeurs globales (parametres_nationaux)
    // toHcH() gère les entiers (DB) et les strings ("22" ou "22:00")
    const hcWindows = [
      { s: toHcH(site?.hc_debut1 ?? site?.heure_debut_hc1 ?? globalVars?.hc_debut1), e: toHcH(site?.hc_fin1 ?? site?.heure_fin_hc1 ?? globalVars?.hc_fin1) },
      { s: toHcH(site?.hc_debut2 ?? site?.heure_debut_hc2 ?? globalVars?.hc_debut2), e: toHcH(site?.hc_fin2 ?? site?.heure_fin_hc2 ?? globalVars?.hc_fin2) },
    ].filter(w => w.s !== null && w.e !== null);

    // Pas de plages HC renseignées → pas de déplacement possible, stockage inactif
    if (hcWindows.length === 0) {
      let bws = tariff.abo_annuel || 0;
      for (let m = 1; m <= 12; m++)
        for (let d = 1; d <= PROF_DAYS[m-1]; d++)
          for (let h = 0; h < 24; h++) {
            const idx = profIdx(m, d, h);
            const gb  = (consoProfile[idx] || 0) / 1000;
            monthly[m-1].grid_buy += gb;
            hourly[idx] = {on_site:0, grid_buy:gb, injection:0, via_bat:0, via_therm:0, m, d, h};
            bws += gb * tariff.prix_hp;
          }
      bws = Math.round(bws);
      const saving = Math.max(0, billWithoutBase - bws);
      const reductionPct = billWithoutBase > 0 ? Math.min(100, Math.round(saving/billWithoutBase*100)) : 0;
      return {monthly, hourly, billWithout: billWithoutBase, billWithStorage: bws, saving, reductionPct, _storageOpti: true};
    }

    let hcCount = 0;
    for (let h = 0; h < 24; h++) if (isHcHour(h, hcWindows)) hcCount++;
    const avgFixed = (hcCount * tariff.prix_hc + (24 - hcCount) * tariff.prix_hp) / 24;

    const getPrice   = (m, d, h) => isHcHour(h, hcWindows) ? tariff.prix_hc : tariff.prix_hp;
    const getDailyAvg = ()       => avgFixed;

    // HC/HP fixe : seuil=0 → charge systématiquement tout HC, décharge tout HP
    const {varCostHT_with} = runLoop(getPrice, getDailyAvg, 0);
    billWithStorage = Math.round(varCostHT_with + (tariff.abo_annuel || 0));
  }

  const billWithout  = billWithoutBase;
  const saving       = Math.max(0, billWithout - billWithStorage);
  const reductionPct = billWithout > 0 ? Math.min(100, Math.round((saving / billWithout) * 100)) : 0;
  return {monthly, hourly, billWithout, billWithStorage, saving, reductionPct, _storageOpti: true};
}

// ─── computeCombinedOptimization ─────────────
// PV + stockage + déplacement temporel combinés.
// baseTariff = tarif actuel du site (avant tout changement de fournisseur) → sert au billWithout.
// tariff     = tarif effectif retenu (panier ou site) → sert au billWithStorage.
// → billWithout = coût sans PV ni stockage, au tarif actuel
// → billWithStorage = coût avec PV + stockage optimisé, au tarif retenu (panier compris)
// → saving = tous les effets cumulés : changement fournisseur + PV + box
function computeCombinedOptimization(consoProfile, prodNorm, pvKwc, batKwh, thermKwh, globalVars, tariff, baseTariff, site, spotMap) {
  const optiSolaire = globalVars?.opti_solaire ?? true;
  const optiTarif   = globalVars?.opti_tarif   ?? true;

  const ratioBat   = (globalVars?.ratio_puissance_stockage           ?? 50) / 100;
  const ratioTherm = (globalVars?.ratio_puissance_stockage_thermique ?? 50) / 100;
  const pBat       = (globalVars?.pertes_batterie                    ?? 10) / 100;
  const seuil      = (globalVars?.seuil_optimisation_stockage        ?? 10) / 100;
  const prixRachat = (globalVars?.prix_rachat_injection              ?? 0.04);
  const tva        = (globalVars?.tva                                ?? 20)  / 100;

  const bk = parseFloat(batKwh)   || 0;
  const tk  = parseFloat(thermKwh) || 0;
  const batCapWh   = bk * 1000;
  const thermCapWh = tk * 1000;
  const batPowWh   = batCapWh  * ratioBat;
  const thermPowWh = thermCapWh * ratioTherm;
  const batEff     = 1 - Math.min(Math.max(pBat, 0), 1);

  const monthly = Array.from({length:12}, ()=>({on_site:0, grid_buy:0, injection:0, via_bat:0, via_therm:0}));
  const hourly  = new Array(8784);

  const toHcH = v => { if (v == null || v === '') return null; const n = parseInt(String(v).split(':')[0]); return isNaN(n) ? null : n; };

  // Plages HC communes (depuis le site, avec fallback sur variables globales)
  const hcWinArr = [
    { s: toHcH(site?.hc_debut1 ?? site?.heure_debut_hc1 ?? globalVars?.hc_debut1), e: toHcH(site?.hc_fin1 ?? site?.heure_fin_hc1 ?? globalVars?.hc_fin1) },
    { s: toHcH(site?.hc_debut2 ?? site?.heure_debut_hc2 ?? globalVars?.hc_debut2), e: toHcH(site?.hc_fin2 ?? site?.heure_fin_hc2 ?? globalVars?.hc_fin2) },
  ].filter(w => w.s !== null && w.e !== null);

  // ── Helper : construit une fonction getPrice(m,d,h) pour un tarif donné ───
  const makePriceFn = t => {
    if (!t) return () => 0;
    if (t.tarif_dynamique && spotMap) {
      const marge  = (t.marge_fournisseur_ceur_kwh || 0) / 100;
      const accise = (globalVars?.accise || 0) / 100;
      return (m, d, h) => (spotMap[`${m}_${d}_${h}`] || 0) + getTurpeRate(m, h, globalVars, hcWinArr) + accise + marge;
    }
    if (t.type_tarif === 'multi' && t.periodes?.length > 0) {
      return (m, d, h) => getPrixMulti(m, d, h, t.periodes);
    }
    if (t.prix_hc != null && t.prix_hc !== t.prix_hp && hcWinArr.length > 0) {
      return (m, d, h) => isHcHour(h, hcWinArr) ? t.prix_hc : t.prix_hp;
    }
    const flat = t.prix_hp || 0;
    return () => flat;
  };

  // ── Helper : calcule le coût annuel TTC d'un tarif sur un profil de conso ──
  // (pas de PV ni stockage — boucle simple)
  const annualBill = (t, priceFn) => {
    let varCost = 0;
    for (let m = 1; m <= 12; m++)
      for (let d = 1; d <= PROF_DAYS[m-1]; d++)
        for (let h = 0; h < 24; h++)
          varCost += ((consoProfile[profIdx(m,d,h)] || 0) / 1000) * priceFn(m, d, h);
    if (t.tarif_dynamique && spotMap) {
      return Math.round((varCost + (t.abo_annuel||0) + (t.turpe_fixe||0) + (t.cta_fixe||0)) * (1 + tva));
    }
    return Math.round(varCost + (t.abo_annuel || 0));
  };

  // ── Tarif baseline (avant changement de fournisseur) ──────────────────────
  const bt = baseTariff || tariff; // fallback sur tarif effectif si pas de baseline distinct
  const billWithout = annualBill(bt, makePriceFn(bt));

  // ── Tarif effectif (après changement) : getPrice + getDailyAvg ───────────
  const getPrice = makePriceFn(tariff);
  const isDynamic = !!(tariff.tarif_dynamique && spotMap);
  const hasHC_fixed = !tariff.tarif_dynamique && tariff.prix_hc != null && tariff.prix_hc !== tariff.prix_hp && hcWinArr.length > 0;

  const isMultiPeriod = tariff.type_tarif === 'multi' && tariff.periodes?.length > 0;
  let getDailyAvg, localSeuil;
  if (isDynamic) {
    getDailyAvg = (m, d) => { let s = 0; for (let h = 0; h < 24; h++) s += getPrice(m, d, h); return s / 24; };
    localSeuil  = seuil;
  } else if (isMultiPeriod) {
    // Multi-période : la moyenne journalière varie selon le jour — utilise le prix réel
    getDailyAvg = (m, d) => { let s = 0; for (let h = 0; h < 24; h++) s += getPrixMulti(m, d, h, tariff.periodes); return s / 24; };
    localSeuil  = seuil; // Permet au stockage de se positionner sur les heures bon marché
  } else if (hasHC_fixed) {
    let hcCount = 0;
    for (let h = 0; h < 24; h++) if (isHcHour(h, hcWinArr)) hcCount++;
    const avgFixed = (hcCount * tariff.prix_hc + (24 - hcCount) * tariff.prix_hp) / 24;
    getDailyAvg = () => avgFixed;
    localSeuil  = 0;
  } else {
    getDailyAvg = () => tariff.prix_hp || 0;
    localSeuil  = 0;
  }

  // L'optimisation tarifaire (HC/HP ou spot) n'est utile que si le tarif a une dimension
  // temporelle. Sur un tarif plat, optiTarif n'a aucun effet → on retombe sur optiSolaire.
  const canOptiTarif = optiTarif && (isDynamic || hasHC_fixed || isMultiPeriod);

  // ── Boucle horaire (scénario optimisé) ────────────────────────────────────
  let varCostHT_with = 0, annInjKwh = 0;
  let batSOC = batCapWh * 0.5, thermSOC = thermCapWh * 0.5;

  for (let m = 1; m <= 12; m++) {
    for (let d = 1; d <= PROF_DAYS[m-1]; d++) {
      const avgDay = getDailyAvg(m, d);
      for (let h = 0; h < 24; h++) {
        const idx    = profIdx(m, d, h);
        const conso  = consoProfile[idx] || 0;
        const pvProd = (prodNorm[idx] || 0) * pvKwc;
        const price  = getPrice(m, d, h);

        // Prix négatif : on est payé pour consommer → arrêt onduleurs PV + charge stockage à fond
        // Uniquement si l'optimisation tarifaire est active ET le tarif est dynamique
        if (price < 0 && canOptiTarif) {
          let chargeWh = 0;
          if (thermCapWh > 0) { const ci=Math.min(thermPowWh,thermCapWh-thermSOC); if(ci>0){thermSOC+=ci;chargeWh+=ci;} }
          if (batCapWh > 0 && batEff > 0) { const room=batCapWh-batSOC; const ci=Math.min(batPowWh,room>0?room/batEff:0); if(ci>0){batSOC+=ci*batEff;chargeWh+=ci;} }
          const gb=(conso+chargeWh)/1000;
          varCostHT_with += gb * price; // négatif → gain
          hourly[idx]={on_site:0,grid_buy:gb,injection:0,via_bat:0,via_therm:0,m,d,h};
          monthly[m-1].grid_buy+=gb;
          continue;
        }

        const surplus  = pvProd - conso;
        let   onSiteWh = Math.min(pvProd, conso);
        let gridBuyWh = 0, injectWh = 0, viaBat = 0, viaTherm = 0;

        if (surplus >= 0) {
          let free = surplus;
          if (optiSolaire) {
            if (thermCapWh > 0) { const ci=Math.min(thermPowWh,thermCapWh-thermSOC,free); if(ci>0){thermSOC+=ci;free-=ci;} }
            if (batCapWh > 0 && batEff > 0) { const room=batCapWh-batSOC; const ci=Math.min(batPowWh,room>0?room/batEff:0,free); if(ci>0){batSOC+=ci*batEff;free-=ci;} }
          }
          injectWh = free;
        } else {
          let need = -surplus;
          if (canOptiTarif) {
            // Look-ahead 24h glissantes : surplus PV attendu dans les 24 prochaines heures.
            // Si ce surplus dépasse la place dispo → pas de charge réseau, tout réservé au solaire.
            // Sinon : roomForGrid = place restante après réservation PV → optimisation tarifaire sur cette marge.
            let expPvSurp = 0;
            if (optiSolaire) {
              const currentAbs = profIdx(m, d, h);
              for (let delta = 1; delta <= 24; delta++) {
                const fabs = Math.min(currentAbs + delta, 8783);
                expPvSurp += Math.max(0, (prodNorm[fabs]||0)*pvKwc - (consoProfile[fabs]||0));
              }
            }
            const thermRoom   = thermCapWh - thermSOC;
            const batRoom     = batCapWh   - batSOC;
            const currentRoom = thermRoom  + batRoom;
            // Marge pour la charge réseau = place dispo - surplus PV des 24h (min 0)
            const roomForGrid = Math.max(0, currentRoom - expPvSurp);
            // pvWillFill : surplus PV des 24h va remplir tout le stockage dispo → priorité autoconso
            const pvWillFill  = optiSolaire && roomForGrid === 0;

            if (price > avgDay * (1 + localSeuil)) {
              // Heure chère → décharger toujours
              if (thermSOC > 0 && need > 0) { const dt=Math.min(thermPowWh,thermSOC,need); thermSOC-=dt; need-=dt; viaTherm=dt; }
              if (batSOC > 0  && need > 0) { const db=Math.min(batPowWh,batSOC,need);   batSOC -=db; need-=db; viaBat=db; }
              gridBuyWh = Math.max(0, need);
            } else if (price < avgDay * (1 - localSeuil)) {
              // Heure bon marché
              if (pvWillFill) {
                // Le PV (24h) va remplir le dispo → décharger maintenant, pas de charge réseau.
                // Valeur autoconso PV (≈0,13 €/kWh) >> arbitrage HC/HP (0,035 €/kWh).
                if (thermSOC > 0 && need > 0) { const dt=Math.min(thermPowWh,thermSOC,need); thermSOC-=dt; need-=dt; viaTherm=dt; }
                if (batSOC > 0  && need > 0) { const db=Math.min(batPowWh,batSOC,need);   batSOC -=db; need-=db; viaBat=db; }
                gridBuyWh = Math.max(0, need);
              } else {
                // Marge disponible → garder pour HP, charger depuis réseau jusqu'à roomForGrid
                gridBuyWh = need;
                let rFG = roomForGrid;
                if (thermCapWh > 0 && rFG > 0) {
                  const ci=Math.min(thermPowWh, Math.min(thermRoom, rFG));
                  if(ci>0){thermSOC+=ci;gridBuyWh+=ci;rFG-=ci;}
                }
                if (batCapWh > 0 && batEff > 0 && rFG > 0) {
                  const room=batCapWh-batSOC;
                  const ci=Math.min(batPowWh, room>0?Math.min(room/batEff, rFG/batEff):0);
                  if(ci>0){batSOC+=ci*batEff;gridBuyWh+=ci;}
                }
              }
            } else {
              // Heure neutre → décharger si PV va quand même remplir (libère de la place)
              if (optiSolaire && pvWillFill) {
                if (thermSOC > 0 && need > 0) { const dt=Math.min(thermPowWh,thermSOC,need); thermSOC-=dt; need-=dt; viaTherm=dt; }
                if (batSOC > 0  && need > 0) { const db=Math.min(batPowWh,batSOC,need);   batSOC -=db; need-=db; viaBat=db; }
              }
              gridBuyWh = Math.max(0, need);
            }
          } else if (optiSolaire) {
            // Solaire seul : décharger sur tout déficit (libère place pour prochain surplus PV)
            if (thermSOC > 0 && need > 0) { const dt=Math.min(thermPowWh,thermSOC,need); thermSOC-=dt; need-=dt; viaTherm=dt; }
            if (batSOC > 0  && need > 0) { const db=Math.min(batPowWh,batSOC,need);   batSOC -=db; need-=db; viaBat=db; }
            gridBuyWh = Math.max(0, need);
          } else {
            gridBuyWh = need;
          }
        }

        varCostHT_with += (gridBuyWh / 1000) * price;
        annInjKwh      += injectWh / 1000;

        const gb=gridBuyWh/1000, inj=injectWh/1000, vb=viaBat/1000, vt=viaTherm/1000, os=onSiteWh/1000;
        hourly[idx] = {on_site:os, grid_buy:gb, injection:inj, via_bat:vb, via_therm:vt, m, d, h};
        monthly[m-1].on_site   += os;
        monthly[m-1].grid_buy  += gb;
        monthly[m-1].injection += inj;
        monthly[m-1].via_bat   += vb;
        monthly[m-1].via_therm += vt;
      }
    }
  }

  // ── Facturation du scénario optimisé ─────────────────────────────────────
  const injCredit = annInjKwh * prixRachat;
  let billWithStorage;
  if (isDynamic) {
    const fixedHT = (tariff.abo_annuel||0) + (tariff.turpe_fixe||0) + (tariff.cta_fixe||0);
    billWithStorage = Math.round(Math.max(0, (varCostHT_with + fixedHT) * (1 + tva) - injCredit));
  } else {
    billWithStorage = Math.round(Math.max(0, varCostHT_with + (tariff.abo_annuel||0) - injCredit));
  }

  const saving       = Math.max(0, billWithout - billWithStorage);
  const reductionPct = billWithout > 0 ? Math.min(100, Math.round((saving / billWithout) * 100)) : 0;
  return {monthly, hourly, billWithout, billWithStorage, saving, reductionPct, _combined: true};
}

// ─── EnergyBalanceChart ───────────────────────
function EnergyBalanceChart({ balance, level, selMonth, selDay, setLevel, setSelMonth, setSelDay, hourlyPrices, isDynamic }) {
  const wrapperRef = useRef(null), canvasRef = useRef(null);
  const barsRef = useRef([]);

  // Données à afficher selon le niveau de zoom
  const chartData = useMemo(() => {
    if (!balance) return [];
    if (level === 'month') return balance.monthly;
    if (level === 'day') {
      const days = PROF_DAYS[selMonth - 1];
      const daily = Array.from({length:days}, () => ({on_site:0, grid_buy:0, injection:0, via_bat:0, via_therm:0}));
      balance.hourly.forEach(pt => {
        if (pt && pt.m === selMonth) {
          daily[pt.d-1].on_site += pt.on_site;
          daily[pt.d-1].grid_buy += pt.grid_buy;
          daily[pt.d-1].injection += pt.injection;
          daily[pt.d-1].via_bat += pt.via_bat||0;
          daily[pt.d-1].via_therm += pt.via_therm||0;
        }
      });
      return daily;
    }
    if (level === 'hour') {
      return Array.from({length:24}, (_, hIdx) => {
        const pt = balance.hourly[profIdx(selMonth, selDay, hIdx)];
        return pt || {on_site:0, grid_buy:0, injection:0, via_bat:0, via_therm:0};
      });
    }
    return [];
  }, [balance, level, selMonth, selDay]);

  const xLabels = useMemo(() => {
    if (level === 'month') return MOIS_ABBR;
    if (level === 'day') return Array.from({length: PROF_DAYS[selMonth-1]}, (_, i) => String(i+1));
    return Array.from({length:24}, (_, i) => i + 'h');
  }, [level, selMonth]);

  // Prix agrégés pour l'axe droit (€/kWh → on affiche en c€/kWh × 100)
  const priceData = useMemo(() => {
    if (!hourlyPrices) return null;
    if (level === 'month') return Array.from({length:12}, (_, mi) => {
      let s=0, cnt=0;
      for(let d=1;d<=PROF_DAYS[mi];d++) for(let h=0;h<24;h++){s+=hourlyPrices[profIdx(mi+1,d,h)]||0;cnt++;}
      return cnt>0?s/cnt:0;
    });
    if (level === 'day') { const days=PROF_DAYS[selMonth-1]; return Array.from({length:days},(_,di)=>{let s=0;for(let h=0;h<24;h++)s+=hourlyPrices[profIdx(selMonth,di+1,h)]||0;return s/24;}); }
    if (level === 'hour') return Array.from({length:24},(_,h)=>hourlyPrices[profIdx(selMonth,selDay,h)]||0);
    return null;
  }, [hourlyPrices, level, selMonth, selDay]);

  // Moyenne 24h pour tarif dynamique en vue heure (trait pointillé)
  const dailyAvgPrice = useMemo(() => {
    if (!isDynamic || level !== 'hour' || !hourlyPrices) return null;
    let s=0; for(let h=0;h<24;h++) s+=hourlyPrices[profIdx(selMonth,selDay,h)]||0; return s/24;
  }, [isDynamic, level, selMonth, selDay, hourlyPrices]);

  const handleDblClick = (e) => {
    if (level === 'hour') return;
    const canvas = canvasRef.current; if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const cx = (e.clientX - rect.left) * (canvas.width / dpr) / rect.width;
    const idx = barsRef.current.findIndex(b => cx >= b.x && cx <= b.x + b.w);
    if (idx === -1) return;
    if (level === 'month') { setSelMonth(idx + 1); setLevel('day'); }
    else if (level === 'day') { setSelDay(idx + 1); setLevel('hour'); }
  };

  const zoomOut = () => {
    if (level === 'hour') setLevel('day');
    else if (level === 'day') { setLevel('month'); setSelMonth(null); setSelDay(null); }
  };

  const handlePrev = () => {
    if (level === 'day') { const m = selMonth > 1 ? selMonth - 1 : 12; setSelMonth(m); }
    else if (level === 'hour') {
      if (selDay > 1) { setSelDay(selDay - 1); }
      else { const pm = selMonth > 1 ? selMonth - 1 : 12; setSelMonth(pm); setSelDay(PROF_DAYS[pm-1]); }
    }
  };

  const handleNext = () => {
    if (level === 'day') { const m = selMonth < 12 ? selMonth + 1 : 1; setSelMonth(m); }
    else if (level === 'hour') {
      if (selDay < PROF_DAYS[selMonth-1]) { setSelDay(selDay + 1); }
      else { const nm = selMonth < 12 ? selMonth + 1 : 1; setSelMonth(nm); setSelDay(1); }
    }
  };

  useEffect(() => {
    const canvas = canvasRef.current, wrapper = wrapperRef.current;
    if (!canvas || !wrapper || !chartData.length) return;
    const W = Math.max(wrapper.clientWidth, 200), H = 240, dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const isMobChart = window.innerWidth < 640;
    const LEGEND_H = isMobChart ? 62 : 26;
    const ML = 46, MR = priceData ? 48 : 8, MT = LEGEND_H + 6, MB = isMobChart ? 24 : 28;
    const cW = W - ML - MR, cH = H - MT - MB;
    const n = chartData.length;

    // Unité adaptative
    const maxRaw = Math.max(...chartData.map(m => m.on_site + m.grid_buy), 0.001);
    const unitScale = maxRaw >= 100 ? 0.001 : 1;
    const unitLabel = maxRaw >= 100 ? 'MWh' : 'kWh';

    const data = chartData.map(m => ({s: m.on_site*unitScale, g: m.grid_buy*unitScale, i: m.injection*unitScale, b: (m.via_bat||0)*unitScale, t: (m.via_therm||0)*unitScale}));
    const maxPos = Math.max(...data.map(m => m.s + m.g), 0.001);
    const maxNeg = Math.max(...data.map(m => m.i), 0.001);
    const posRatio = Math.min(Math.max(maxPos / (maxPos + maxNeg), 0.38), 0.82);
    const zeroY = MT + cH * posRatio;
    const scalePos = (cH * posRatio) / maxPos;
    const scaleNeg = (cH * (1 - posRatio)) / maxNeg;

    // Grille
    ctx.lineWidth = 1;
    [1/3, 2/3, 1].forEach(f => {
      const v = maxPos * f, y = zeroY - v * scalePos;
      ctx.strokeStyle = 'rgba(255,255,255,.09)';
      ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(W - MR, y); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '13px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(v.toFixed(1), ML - 4, y + 4);
    });
    const vn = maxNeg * 0.65, yn = zeroY + vn * scaleNeg;
    ctx.strokeStyle = 'rgba(255,255,255,.09)';
    ctx.beginPath(); ctx.moveTo(ML, yn); ctx.lineTo(W - MR, yn); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.textAlign = 'right';
    ctx.fillText('-'+vn.toFixed(1), ML - 4, yn + 4);

    // Axe zéro
    ctx.strokeStyle = 'rgba(255,255,255,1)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ML, zeroY); ctx.lineTo(W - MR, zeroY); ctx.stroke();

    // Label axe Y
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.translate(14, MT + cH / 2); ctx.rotate(-Math.PI/2); ctx.fillText(unitLabel, 0, 0); ctx.restore();

    // Barres + positions pour le drill-down
    const bTW = cW / n, bPad = Math.max(2, bTW * 0.14), bW = bTW - bPad * 2;
    const newBars = [];
    data.forEach((m, i) => {
      const x = ML + i * bTW + bPad;
      newBars.push({x, w: bW});
      const sDirect = Math.max(0, m.s - m.b - m.t);
      // Direct solaire
      if (sDirect > 0) { ctx.fillStyle = '#f0a050'; ctx.fillRect(x, zeroY - sDirect * scalePos, bW, sDirect * scalePos); }
      // Stockage thermique (orange pointillé)
      if (m.t > 0) {
        const yTop = zeroY - (sDirect + m.t) * scalePos;
        const barH = m.t * scalePos;
        ctx.fillStyle = '#ffb060'; ctx.fillRect(x, yTop, bW, barH);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for (let dy = yTop + 3; dy < yTop + barH - 1; dy += 5) {
          for (let dx = x + 3; dx < x + bW - 1; dx += 5) {
            ctx.beginPath(); ctx.arc(dx, dy, 1.5, 0, Math.PI*2); ctx.fill();
          }
        }
      }
      // Batterie chimique
      if (m.b > 0) { ctx.fillStyle = '#ffd098'; ctx.fillRect(x, zeroY - (sDirect + m.t + m.b) * scalePos, bW, m.b * scalePos); }
      // Achat réseau
      if (m.g > 0) { ctx.fillStyle = '#d0d0d0'; ctx.fillRect(x, zeroY - (m.s + m.g) * scalePos, bW, m.g * scalePos - 1); }
      // Injection
      if (m.i > 0) { ctx.fillStyle = '#f0e86a'; ctx.fillRect(x, zeroY + 2, bW, m.i * scaleNeg - 2); }
    });
    barsRef.current = newBars;

    // ── Axe droit : tarif (€/kWh) ──────────────────────────────────────────────
    if (priceData) {
      const hasNegPrice = priceData.some(p => p < 0);
      const maxP = Math.max(...priceData, dailyAvgPrice||0, 0.001);
      const minP = hasNegPrice ? Math.min(...priceData, dailyAvgPrice||0) : 0;
      // Échelle : zeroY = prix 0, croissant vers le haut (positif) et vers le bas (négatif)
      const priceScale = (zeroY - MT) / maxP; // px par €/kWh
      const priceY = p => zeroY - p * priceScale;
      const axX = W - MR + 4;
      const axBottom = hasNegPrice ? Math.min(MT + cH, priceY(minP)) : zeroY;

      ctx.save();

      // Ligne verticale axe droit (étendue vers le bas si prix négatifs)
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(axX, MT); ctx.lineTo(axX, axBottom); ctx.stroke();

      // Ticks + labels en c€/kWh
      ctx.font = (isMobChart ? '9px' : '10px') + ' sans-serif';
      ctx.textAlign = 'left';
      const ticks = [0, maxP * 0.5, maxP];
      if (hasNegPrice) ticks.push(minP);
      ticks.forEach(p => {
        const ty = priceY(p);
        if (ty < MT - 4 || ty > axBottom + 4) return;
        const neg = p < 0;
        ctx.strokeStyle = neg ? 'rgba(255,100,100,.6)' : 'rgba(255,255,255,.35)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(axX, ty); ctx.lineTo(axX + 4, ty); ctx.stroke();
        ctx.fillStyle = neg ? 'rgba(255,160,160,.9)' : 'rgba(255,255,255,.65)';
        ctx.fillText((p * 100).toFixed(p === 0 ? 0 : 1), axX + 6, ty + 3.5);
      });

      // Label unité
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.font = (isMobChart ? '8px' : '9px') + ' sans-serif';
      ctx.textAlign = 'center';
      ctx.translate(W - 6, MT + (zeroY - MT) / 2);
      ctx.rotate(Math.PI / 2);
      ctx.fillText('c€/kWh', 0, 0);
      ctx.restore();

      // Trait horizontal par barre = tarif de la période (rouge si négatif)
      newBars.forEach((bar, i) => {
        if (i >= priceData.length) return;
        const p = priceData[i];
        const py = priceY(p);
        if (py < MT - 4 || py > axBottom + 4) return;
        ctx.strokeStyle = p < 0 ? 'rgba(255,80,80,.95)' : 'white';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(bar.x, py); ctx.lineTo(bar.x + bar.w, py); ctx.stroke();
      });

      // Trait pointillé = moyenne 24h (tarif dynamique, vue heure uniquement)
      if (dailyAvgPrice != null) {
        const py = priceY(dailyAvgPrice);
        const negAvg = dailyAvgPrice < 0;
        ctx.strokeStyle = negAvg ? 'rgba(255,150,150,.75)' : 'rgba(255,255,255,.75)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(ML, py); ctx.lineTo(W - MR, py); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = negAvg ? 'rgba(255,150,150,.75)' : 'rgba(255,255,255,.75)';
        ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
        ctx.fillText('moy', W - MR - 2, py - 3);
      }
      ctx.restore();
    }

    // Labels axe X
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.textAlign = 'center';
    // Taille par niveau : heures = 20px, mois/jours = 26px (desktop)
    const lblFont = isMobChart ? '13px sans-serif' : 'bold 18px sans-serif';
    ctx.font = lblFont;
    xLabels.forEach((lbl, i) => {
      if (n > 24 && i % 2 !== 0) return;           // jours : 1 sur 2
      if (isMobChart && n === 24 && i % 4 !== 0) return;  // mobile heures : 1 sur 4
      if (!isMobChart && n === 24 && i % 2 !== 0) return; // desktop heures : 1 sur 2
      ctx.fillText(lbl, ML + i * bTW + bTW / 2, H - (isMobChart ? 4 : 8));
    });

    // Indice de niveau
    if (level !== 'hour') {
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('double-clic pour zoomer', W - MR, MT + 10);
    }

    // Légende — labels courts
    const LEG = [
      {color:'#f0a050', label:'Solaire'},
      {color:'#ffb060', label:'Bat. Thermique', dots:true},
      {color:'#ffd098', label:'Batterie'},
      {color:'#d0d0d0', label:'Achat'},
      {color:'#f0e86a', label:'Injection'},
    ];
    const drawLegItem = (it, lx, ly, sqSz) => {
      ctx.fillStyle = it.color; ctx.fillRect(lx, ly, sqSz, sqSz);
      if (it.dots) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        [2,7].forEach(dy => [2,6,10].forEach(dx => { ctx.beginPath(); ctx.arc(lx+dx, ly+dy, 1.4, 0, Math.PI*2); ctx.fill(); }));
      }
      ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.textAlign = 'left';
      ctx.fillText(it.label, lx + sqSz + 4, ly + sqSz - 1);
    };
    if (!isMobChart) {
      // Desktop : 1 ligne centrée
      ctx.font = 'bold 14px sans-serif';
      const sqSz = 12, txtGap = 4, pad = 18;
      const widths = LEG.map(it => sqSz + txtGap + ctx.measureText(it.label).width);
      const totalW = widths.reduce((s, w) => s + w, 0) + pad * (LEG.length - 1);
      let lx = Math.max(4, (W - totalW) / 2);
      const ly = Math.floor((LEGEND_H - sqSz) / 2);
      LEG.forEach((it, i) => { drawLegItem(it, lx, ly, sqSz); lx += widths[i] + pad; });
    } else {
      // Mobile : 2 colonnes centrées (marge 40px pour laisser place aux flèches nav)
      ctx.font = 'bold 13px sans-serif';
      const legMargin = 40, colW = Math.floor((W - legMargin * 2) / 2), rowH = 19, sqSz = 11;
      LEG.forEach((it, i) => {
        const col = i >= 3 ? 1 : 0, row = i >= 3 ? i - 3 : i;
        drawLegItem(it, legMargin + col * colW, 3 + row * rowH, sqSz);
      });
    }
  }, [chartData, xLabels, level, priceData, dailyAvgPrice]);

  const ctxLabel = level === 'day' ? MOIS_FULL[selMonth-1] : level === 'hour' ? `${selDay} ${MOIS_FULL[selMonth-1]}` : null;

  const navBtnStyle = {
    position:'absolute', zIndex:2, background:'#5cb85c',
    border:'none', borderRadius:'50%',
    width:32, height:32, cursor:'pointer', color:'white',
    fontSize:16, lineHeight:'30px', textAlign:'center', padding:0,
    boxShadow:'0 2px 8px rgba(125,217,64,.35)'
  };

  return (
    <div ref={wrapperRef} style={{position:'relative', width:'100%'}}>
      {level !== 'month' && (
        <button onClick={handlePrev} title="Période précédente" style={{...navBtnStyle, top:4, left:4}}>←</button>
      )}
      {level !== 'month' && (
        <button onClick={handleNext} title="Période suivante" style={{...navBtnStyle, top:4, right:4}}>→</button>
      )}
      <canvas ref={canvasRef} style={{display:'block', cursor: level!=='hour'?'crosshair':'default'}} onDoubleClick={handleDblClick}/>
      {level !== 'month' && (
        <button onClick={zoomOut} title="Zoom arrière" style={{
          position:'absolute', bottom:28, left:4, zIndex:2,
          background:'#5cb85c', border:'none',
          borderRadius:'50%', width:32, height:32, cursor:'pointer',
          padding:0, display:'flex', alignItems:'center', justifyContent:'center',
          boxShadow:'0 2px 8px rgba(125,217,64,.35)'
        }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="7.5" cy="7.5" r="5.5" stroke="white" strokeWidth="2"/>
            <line x1="4.5" y1="7.5" x2="10.5" y2="7.5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
            <line x1="12" y1="12" x2="16" y2="16" stroke="white" strokeWidth="2" strokeLinecap="round"/>
          </svg>
        </button>
      )}
      {ctxLabel && <div style={{textAlign:'center',fontSize:22,fontWeight:700,color:'rgba(255,255,255,.75)',marginTop:4}}>{ctxLabel}</div>}
    </div>
  );
}

  const load=async()=>{
    const[{data:s},{data:t},{data:pp}]=await Promise.all([
      sb.from('sites').select('*').eq('user_id',user.id).order('created_at'),
      sb.from('tarifs_electricite').select('*').order('nom'),
      sb.from('profils_production').select('id,nom,latitude,longitude').order('nom'),
    ]);
    setSites(s||[]); setTariffs(t||[]); setProdProfils(pp||[]);
    const stored=userProfile?.active_site_id||localStorage.getItem('starvolt_active_site_id');
    const valid=stored&&s?.find(x=>x.id===stored)?stored:(s?.length?s[0].id:null);
    persistActiveSite(valid);
  };
  useEffect(()=>{load();},[]);

  const site=sites?.find(s=>s.id===activeId)||null;

  // Sync champs locaux quand on change de site
  // Règle : si solar au panier → valeurs de la page solaire (panier) ; sinon → valeurs DB ou défauts
  useEffect(()=>{
    // Source unique : starvolt_solar_defaults (partagé avec la page solaire) > DB > défauts
    // Si solar au panier → 6/10/10 ou valeurs configurées ; sinon → 0 (pas d'équipement)
    const solarDef=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})();
    const hasSolarPanier=!!localStorage.getItem('starvolt_solar_chosen');
    const hasBoxOnlyPanier=!!localStorage.getItem('starvolt_box_chosen')&&!hasSolarPanier;
    if(hasSolarPanier){
      setPvKwc(solarDef.pvKwc||(site?.puissance_pv_kwc>0?String(site.puissance_pv_kwc):'6'));
      setBatKwh(solarDef.batKwh||(site?.batterie_capacite_kwh>0?String(site.batterie_capacite_kwh):'10'));
      setThermKwh(solarDef.thermKwh||'10');
    } else if(hasBoxOnlyPanier){
      // Box seule : conserver les valeurs déjà saisies, thermique à 10 par défaut
      setPvKwc(solarDef.pvKwc||'0');
      setBatKwh(solarDef.batKwh||'0');
      setThermKwh(solarDef.thermKwh||'10');
    } else {
      // Aucun équipement au panier : conserver les valeurs saisies (ne pas remettre à 0)
      setPvKwc(solarDef.pvKwc||'0');
      setBatKwh(solarDef.batKwh||'0');
      setThermKwh(solarDef.thermKwh||'0');
    }
    setProdProfilId(site?.profil_production_id||'');
    setProdProfilData(null); setBalance(null);
  },[activeId]);

  // Sync bidirectionnelle : écriture vers starvolt_solar_defaults partagé avec SolarSim
  useEffect(()=>{
    localStorage.setItem('starvolt_solar_defaults',JSON.stringify({pvKwc,batKwh,thermKwh}));
  },[pvKwc,batKwh,thermKwh]);

  // Auto-sélection du profil de production le plus proche par GPS
  useEffect(()=>{
    if(!site||prodProfils.length===0)return;
    if(site.profil_production_id){setProdProfilId(site.profil_production_id);return;}
    const profilsGeo=prodProfils.filter(p=>p.latitude&&p.longitude);
    if(profilsGeo.length===0){setProdProfilId(prodProfils[0].id);return;}
    const q=`${site.adresse_ligne1||''} ${site.code_postal||''} ${site.ville||''}`.trim();
    const saveProfil=(id)=>{
      setProdProfilId(id);
      setSites(prev=>prev.map(s=>s.id===activeId?{...s,profil_production_id:id}:s));
      sb.from('sites').update({profil_production_id:id}).eq('id',activeId);
    };
    if(!q){saveProfil(profilsGeo[0].id);return;}
    fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=1`)
      .then(r=>r.json()).then(geo=>{
        const feat=geo.features?.[0];
        if(!feat){saveProfil(profilsGeo[0].id);return;}
        const[lon,lat]=feat.geometry.coordinates;
        let best=profilsGeo[0],bestD=haversine(lat,lon,best.latitude,best.longitude);
        profilsGeo.forEach(p=>{const d=haversine(lat,lon,p.latitude,p.longitude);if(d<bestD){bestD=d;best=p;}});
        saveProfil(best.id);
      }).catch(()=>saveProfil(profilsGeo[0].id));
  },[activeId,prodProfils.length]);

  // Charger les données du profil de production sélectionné
  useEffect(()=>{
    if(!prodProfilId){setProdProfilData(null);setBalance(null);return;}
    sb.from('profils_production').select('profil').eq('id',prodProfilId).single()
      .then(({data})=>setProdProfilData(data?.profil||null));
  },[prodProfilId]);

  // Reset zoom seulement quand le jeu de données change (pas sur modif des paramètres)
  useEffect(()=>{
    setChartLevel('month'); setChartMonth(null); setChartDay(null);
  },[site?.conso_profil,prodProfilData]);

  // Calculer le bilan énergétique dès que les données sont prêtes
  useEffect(()=>{
    if(!site?.conso_profil){setBalance(null);return;}
    const kw=pvKwc===''?6:(parseFloat(pvKwc)||0);
    const bk=parseFloat(batKwh)||0;
    const tk=parseFloat(thermKwh)||0;

    // ── Box souscrite ? ──────────────────────────────────────────────────────
    // Le stockage ne se charge/décharge que si l'utilisateur a une box Starvolt.
    // Sans box, les flags opti_tarif et opti_solaire sont forcés à false
    // pour que le calcul reflète uniquement le changement de tarif, pas l'optimisation.
    const hasBoxLS = !!localStorage.getItem('starvolt_box_chosen')
                  || localStorage.getItem('starvolt_solar_chosen') === 'solar_box';
    const effectiveGlobalVars = globalVars ? {
      ...globalVars,
      opti_tarif:   hasBoxLS ? (globalVars.opti_tarif   ?? true) : false,
      opti_solaire: hasBoxLS ? (globalVars.opti_solaire ?? true) : false,
    } : globalVars;

    // ── Helpers tarif ─────────────────────────────────────────────────────────
    const getEffectiveTariff = () => {
      if(!tariffs.length) return null;
      const optiChosen=!!localStorage.getItem('starvolt_optimisation_chosen');
      const optiTariffId=optiChosen?localStorage.getItem('starvolt_optimisation_tariff_id'):null;
      const id=optiTariffId||site.tarif_id;
      return id?tariffs.find(t=>t.id===id)||null:null;
    };
    const getBaseTariff = curT => site.tarif_id?tariffs.find(t=>t.id===site.tarif_id)||curT:curT;

    // ── Routage ────────────────────────────────────────────────────────────────
    // Les flags ☀️/⚡ contrôlent la STRATÉGIE DE STOCKAGE, pas si le PV est compté.
    // Le PV réduit toujours la facture finale via l'autoconsommation (kW instantanés).
    //
    // • kw>0 + profil prod présent → computeCombinedOptimization
    //   PV toujours inclus dans billWithStorage ; flags contrôlent le dispatch du stockage.
    // • kw=0 ou pas de profil prod → computeStorageOptimization (tarif pur, PV absent)
    // • Pas de tarif connu → computeEnergyBalance (graphique PV sans €)

    const curT = getEffectiveTariff();

    if(kw>0 && prodProfilData){
      // ── Chemin PV + stockage ──
      if(curT){
        if(curT.tarif_dynamique&&!spotMap){setBalance(null);return;}
        setBalance(computeCombinedOptimization(site.conso_profil,prodProfilData,kw,batKwh,thermKwh,effectiveGlobalVars,curT,getBaseTariff(curT),site,spotMap));
        return;
      }
      // Pas de tarif → graphique PV seul
      const ratioBat=(globalVars?.ratio_puissance_stockage??50)/100;
      const pBat=globalVars?.pertes_batterie??10;
      const ratioTherm=(globalVars?.ratio_puissance_stockage_thermique??50)/100;
      const pTherm=globalVars?.pertes_thermique??0;
      setBalance(computeEnergyBalance(site.conso_profil,prodProfilData,kw,bk*ratioBat*1000,bk,pBat,tk*ratioTherm,tk,pTherm));
      return;
    }

    // ── Chemin tarif pur (kw=0 ou profil prod absent) ──
    if(curT){
      if(curT.tarif_dynamique&&!spotMap){setBalance(null);return;}
      setBalance(computeStorageOptimization(site.conso_profil,curT,getBaseTariff(curT),site,bk,tk,effectiveGlobalVars,spotMap));
      return;
    }
    setBalance(null);
  },[site?.conso_profil,prodProfilData,pvKwc,batKwh,thermKwh,globalVars,spotMap,tariffs,site?.tarif_id,site?.heure_debut_hc1,site?.heure_fin_hc1,site?.heure_debut_hc2,site?.heure_fin_hc2]);

  const updateSite=async(updates)=>{ await sb.from('sites').update(updates).eq('id',activeId); await load(); };

  const handleAddSite=async(data)=>{
    const{data:ns}=await sb.from('sites').insert({user_id:user.id,...data}).select().single();
    setShowAdd(false); await load(); if(ns)persistActiveSite(ns.id);
  };

  const handleDeleteConfirmed=async()=>{
    await sb.from('sites').delete().eq('id',activeId);
    persistActiveSite(null); setEditMode(false); setShowDeleteConfirm(false); await load();
  };

  const handleImport=async(e)=>{
    const file=e.target.files?.[0]; if(!file)return;
    setImporting(true); setImportMsg(null);
    try{
      const result=await processConsoXLS(await file.arrayBuffer());
      if(result.error){setImportMsg({type:'err',text:result.error});return;}
      await updateSite({conso_profil:Array.from(result.profile),conso_annuelle_kwh:Math.round(result.annualKwh),conso_imported_at:new Date().toISOString(),conso_gaps:result.gapsPatched});
      setImportMsg({type:'ok',kwh:Math.round(result.annualKwh),gaps:result.gapsPatched.length});
      setShowGaps(result.gapsPatched.length>0);
    }catch(err){setImportMsg({type:'err',text:String(err)});}
    finally{setImporting(false);if(fileRef.current)fileRef.current.value='';}
  };

  // Charger variables globales + listener mobile
  useEffect(()=>{
    sb.from('parametres_nationaux').select('*').eq('id',1).maybeSingle()
      .then(({data})=>{
        if(!data) return;
        // opti_* : le localStorage est la source de vérité (mis à jour en temps réel au clic)
        // Supabase peut avoir une valeur stale si l'upsert n'avait pas eu le temps de se sauver
        const cached=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_global_vars_cache'));}catch{return null;}})();
        const merged={...data,
          opti_solaire: cached?.opti_solaire ?? data.opti_solaire ?? true,
          opti_tarif:   cached?.opti_tarif   ?? data.opti_tarif   ?? true,
          opti_flex:    cached?.opti_flex    ?? data.opti_flex    ?? false,
          opti_acc:     cached?.opti_acc     ?? data.opti_acc     ?? false,
        };
        setGlobalVars(merged);
        try{localStorage.setItem('starvolt_global_vars_cache',JSON.stringify(merged));}catch{}
      });
    sb.from('prix_materiaux').select('*').eq('id',1).maybeSingle()
      .then(({data})=>setPrixMat(data));
    const handler=()=>setIsMobile(window.innerWidth<640);
    window.addEventListener('resize',handler);
    return()=>window.removeEventListener('resize',handler);
  },[]);

  // Tarif effectif (panier si choisi, sinon site) — utilisé pour hourlyPrices
  const effectiveTariff = useMemo(()=>{
    if(!tariffs.length) return null;
    const optiChosen=!!localStorage.getItem('starvolt_optimisation_chosen');
    const optiId=optiChosen?localStorage.getItem('starvolt_optimisation_tariff_id'):null;
    const tid=optiId||site?.tarif_id;
    return tid?tariffs.find(t=>t.id===tid)||null:null;
  },[tariffs,site?.tarif_id]);

  const isDynamicTariff = !!(effectiveTariff?.tarif_dynamique);

  // Prix horaire (€/kWh) pour l'axe droit du graphique
  const hourlyPrices = useMemo(()=>{
    if(!effectiveTariff) return null;
    const hcWin=[
      {s:parseHcHour(site?.hc_debut1??site?.heure_debut_hc1??globalVars?.hc_debut1), e:parseHcHour(site?.hc_fin1??site?.heure_fin_hc1??globalVars?.hc_fin1)},
      {s:parseHcHour(site?.hc_debut2??site?.heure_debut_hc2??globalVars?.hc_debut2), e:parseHcHour(site?.hc_fin2??site?.heure_fin_hc2??globalVars?.hc_fin2)},
    ].filter(w=>w.s!==null&&w.e!==null);
    const arr=new Float32Array(8784);
    if(effectiveTariff.tarif_dynamique&&spotMap){
      const marge=(effectiveTariff.marge_fournisseur_ceur_kwh||0)/100;
      const accise=(globalVars?.accise||0)/100;
      const tva=(globalVars?.tva??20)/100;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
        const idx=profIdx(m,d,h);
        const spot=spotMap[`${m}_${d}_${h}`]||0;
        arr[idx]=(spot+getTurpeRate(m,h,globalVars,hcWin)+accise+marge)*(1+tva);
      }
    } else if(effectiveTariff.type_tarif==='multi'&&effectiveTariff.periodes?.length>0){
      const periodes=effectiveTariff.periodes;
      const abo=effectiveTariff.abo_annuel||0;
      const kwhGrid=balance
        ?balance.monthly.reduce((s,m)=>s+m.grid_buy,0)
        :(site?.conso_annuelle_kwh||null);
      const aboKwh=abo>0&&kwhGrid>0?abo/kwhGrid:0;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++)
        arr[profIdx(m,d,h)]=getPrixMulti(m,d,h,periodes)+aboKwh;
    } else {
      const ph=parseFloat(effectiveTariff.prix_hp)||0;
      const pc=effectiveTariff.prix_hc!=null?parseFloat(effectiveTariff.prix_hc)||0:ph;
      // Abonnement amorti sur la conso annuelle achetée au réseau (prix frontal réel)
      const abo=effectiveTariff.abo_annuel||0;
      const kwhGrid=balance
        ?balance.monthly.reduce((s,m)=>s+m.grid_buy,0)
        :(site?.conso_annuelle_kwh||null);
      const aboKwh=abo>0&&kwhGrid>0?abo/kwhGrid:0;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
        const idx=profIdx(m,d,h);
        arr[idx]=(hcWin.length>0&&isHcHour(h,hcWin)?pc:ph)+aboKwh;
      }
    }
    // Si ACC au panier : remplacer le prix heures prod non nulle par le prix ACC TTC
    // Formule : (prix_vente_ACC + TURPE_4_taux(m,h)) × (1 + TVA) — sans accise
    // TURPE variable selon saison (été/hiver) et HC/HP — mois début/fin été configurables
    if(localStorage.getItem('starvolt_acc_chosen')==='true'){
      const _accPHT=parseFloat(localStorage.getItem('starvolt_acc_price_ht')||'0.09');
      const _tva=(globalVars?.tva??20)/100;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
        const idx=profIdx(m,d,h);
        if(prodProfilData?!(prodProfilData[idx]>0):(h<9||h>=18)) continue;
        const accTTC=(_accPHT+getTurpeRate(m,h,globalVars,hcWin))*(1+_tva);
        if(accTTC<arr[idx]) arr[idx]=accTTC;
      }
    }
    return arr;
  },[effectiveTariff,site?.heure_debut_hc1,site?.heure_fin_hc1,site?.heure_debut_hc2,site?.heure_fin_hc2,globalVars,spotMap,prodProfilData,balance,site?.conso_annuelle_kwh]);

  // Charger les données spot si tarif dynamique (avec ou sans PV)
  useEffect(()=>{
    const optiChosen=!!localStorage.getItem('starvolt_optimisation_chosen');
    const optiTariffId=optiChosen?localStorage.getItem('starvolt_optimisation_tariff_id'):null;
    const effectiveTariffId=optiTariffId||site?.tarif_id;
    const curT=effectiveTariffId?tariffs.find(t=>t.id===effectiveTariffId):null;
    if(curT?.tarif_dynamique){
      sb.rpc('get_spot_json').then(({data})=>setSpotMap(buildSpotMap(data||[])));
    } else {
      setSpotMap(null);
    }
  },[site?.tarif_id,tariffs]);

  if(sites===null)return(<><div className="screen fade-in"><div style={{textAlign:'center',padding:40,color:'rgba(255,255,255,.5)'}}>Chargement…</div></div><StickyFooter onBack={onBack}/></>);

  const firstDefault=sites.length===0?{adresse_ligne1:userProfile?.adresse_ligne1||'',code_postal:userProfile?.code_postal||'',ville:userProfile?.ville||'',pdl:userProfile?.pdl||''}:{};
  const showActions=!showAdd&&!editMode;

  return(
    <>
      <div className="screen screen-wide fade-in">
        {/* Titre */}
        <div style={{marginBottom:10,marginTop:4}}>
          <div style={{fontSize:9,letterSpacing:'.6px',color:'rgba(125,217,64,.8)',fontWeight:700,textTransform:'uppercase'}}>Énergie</div>
          <div style={{fontSize:18,fontWeight:900,color:'white',lineHeight:1.1}}>Mon <span className="accent">site</span></div>
        </div>

        {showAdd&&<SiteFormCard initial={firstDefault} onSave={handleAddSite} onCancel={()=>setShowAdd(false)}/>}

        {sites.length===0&&!showAdd&&(
          <div className="card" style={{textAlign:'center',padding:'24px 20px'}}>
            <div style={{fontSize:32,marginBottom:10}}>🏠</div>
            <div style={{color:'white',fontWeight:700,marginBottom:5}}>Aucun site configuré</div>
            <div style={{color:'rgba(255,255,255,.55)',fontSize:13,marginBottom:16}}>Ajoutez votre site pour importer votre profil de consommation.</div>
            <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
              <button className="btn btn-primary" style={{fontSize:13}} onClick={()=>{setShowAdd(true);setEditMode(false);}}>🏠 Créer mon site</button>
              <button className="btn btn-sec" style={{fontSize:13}} disabled={importingDemo} onClick={handleImportDemo}>{importingDemo?'⏳ Chargement…':'📂 Données témoins'}</button>
            </div>
          </div>
        )}

        {site&&!showAdd&&(
          <>
            {/* Info site — compact, sélecteur intégré si plusieurs sites */}
            {!editMode?(
              <div className="card" style={{padding:'8px 14px',marginBottom:8}}>
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  {sites.length>1?(
                    <select className="inp inp-sel" style={{fontSize:13,padding:'6px 30px 6px 10px',maxWidth:200,flexShrink:0}} value={activeId||''} onChange={e=>{
   clearPanierLS(); // efface aussi starvolt_global_vars_cache
   persistActiveSite(e.target.value);
   // Réinitialise les services cochés lors d'un changement de site
   const _reset={id:1,opti_solaire:true,opti_tarif:true,opti_flex:false,opti_acc:false};
   sb.from('parametres_nationaux').upsert(_reset,{onConflict:'id'});
   setGlobalVars(v=>({...v,..._reset}));
   setEditMode(false);setImportMsg(null);setShowDeleteConfirm(false);
 }}>
                      {sites.map(s=><option key={s.id} value={s.id}>{s.nom}</option>)}
                    </select>
                  ):(
                    <span style={{fontWeight:800,fontSize:14,color:'white',flexShrink:0}}>{site.nom}</span>
                  )}
                  {(site.adresse_ligne1||site.ville)&&(
                    <span style={{fontSize:11,color:'rgba(255,255,255,.45)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>
                      {[site.adresse_ligne1,site.code_postal,site.ville].filter(Boolean).join(' ')}
                    </span>
                  )}
                  <div style={{display:'flex',gap:6,marginLeft:'auto',flexShrink:0}}>
                    <button style={{background:'rgba(125,217,64,.15)',border:'1px solid rgba(125,217,64,.3)',color:'#7dd940',cursor:'pointer',fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:6}} onClick={()=>{setShowAdd(true);setEditMode(false);setShowDeleteConfirm(false);}}>+ Ajouter</button>
                    {!showDeleteConfirm&&<button style={{background:'rgba(255,80,80,.1)',border:'1px solid rgba(255,80,80,.25)',color:'#ff6b6b',cursor:'pointer',fontSize:11,fontWeight:700,padding:'4px 10px',borderRadius:6}} onClick={()=>setShowDeleteConfirm(true)}>🗑 Supprimer</button>}
                    <button style={{background:'none',border:'none',color:'rgba(255,255,255,.35)',cursor:'pointer',fontSize:12,flexShrink:0}} onClick={()=>setEditMode(true)}>✏️</button>
                  </div>
                </div>
                <div style={{fontSize:10,color:'rgba(125,217,64,.65)',fontWeight:700,marginTop:4,display:'flex',alignItems:'center',gap:4}}><span>✦</span> Ce site sera utilisé dans tous les calculs d'économie</div>
              </div>
            ):(
              <SiteFormCard initial={site} onSave={async d=>{await updateSite(d);setEditMode(false);}} onCancel={()=>setEditMode(false)}/>
            )}

            {/* ── Tuile Ma conso ── */}
            <div className="card" style={{padding:0,marginBottom:8,overflow:'hidden'}}>
              <div
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px 8px',borderBottom: consoOpen ? '1px solid rgba(255,255,255,.07)' : 'none',cursor:'pointer',userSelect:'none'}}
                onClick={()=>setConsoOpen(v=>!v)}
              >
                <div style={{fontWeight:800,fontSize:13,color:'white',display:'flex',alignItems:'center',gap:6}}>
                  ⚡ Ma conso
                  {!consoOpen && site?.conso_annuelle_kwh > 0 && (
                    <span style={{fontSize:11,fontWeight:600,color:'rgba(255,255,255,.45)',marginLeft:4}}>
                      {Math.round(site.conso_annuelle_kwh).toLocaleString('fr-FR')} kWh/an
                      {(()=>{ const curT=tariffs.find(t=>t.id===site.tarif_id); if(!curT||curT.tarif_dynamique)return null; const f=Math.round((curT.abo_annuel||0)+site.conso_annuelle_kwh*(curT.prix_hp||0)); return f>0?<span style={{color:'rgba(240,160,80,.7)',marginLeft:4}}>· {f.toLocaleString('fr-FR')} €/an</span>:null; })()}
                    </span>
                  )}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}} onClick={e=>e.stopPropagation()}>
                  <button className="btn btn-sec" style={{fontSize:11,padding:'5px 14px',borderRadius:8,width:'auto',flexShrink:0}} onClick={()=>fileRef.current?.click()} disabled={importing}>
                    {importing?'⏳ Traitement…':'📂 Importer'}
                  </button>
                  <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleImport}/>
                  <span style={{color:'rgba(255,255,255,.4)',fontSize:16,lineHeight:1,transition:'transform .2s',transform:consoOpen?'rotate(0deg)':'rotate(-90deg)',display:'inline-block'}}>▾</span>
                </div>
              </div>
              {consoOpen && <div style={{padding:'10px 14px 12px'}}>
                <div style={{display:'flex',gap:12,alignItems:'flex-start',flexWrap:'wrap'}}>
                  {/* Colonne gauche : saisies + stats */}
                  <div style={{flex:'1 1 200px',minWidth:0,display:'flex',flexDirection:'column',gap:8}}>
                    <div>
                      <label style={{fontSize:10,color:'rgba(255,255,255,.45)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>TARIF D'ÉLECTRICITÉ</label>
                      <select className="inp inp-sel" style={{fontSize:13,padding:'8px 36px 8px 12px',maxWidth:320}} value={site.tarif_id||''} onChange={e=>updateSite({tarif_id:e.target.value||null})}>

              </div>
              {prodOpen && <div style={{padding:'10px 14px 12px',display:'flex',flexDirection:'column',gap:8}}>
                {(()=>{
                  const T={background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:10,padding:isMobile?'6px 10px':'12px',display:'flex',flexDirection:'column',gap:isMobile?3:6,flex:'1 1 130px'};
                  const LBL={fontSize:13,color:'rgba(255,255,255,.65)',fontWeight:700,letterSpacing:'.3px'};
                  let pts=null,autoconso=0,achat=0,injection=0,prod=0,conso=0,tauxAC=0,tauxAP=0,unit='kWh',scale=1,period='Année',fmt=v=>v.toFixed(0)+' kWh';
                  if(balance){
                    if(chartLevel==='month') pts=balance.monthly;
                    else if(chartLevel==='day') pts=balance.hourly.filter(p=>p&&p.m===chartMonth);
                    else pts=balance.hourly.filter(p=>p&&p.m===chartMonth&&p.d===chartDay);
                    autoconso=pts.reduce((s,m)=>s+m.on_site,0);
                    achat=pts.reduce((s,m)=>s+m.grid_buy,0);
                    injection=pts.reduce((s,m)=>s+m.injection,0);
                    prod=autoconso+injection; conso=autoconso+achat;
                    tauxAC=prod>0?Math.round(autoconso/prod*100):0;
                    tauxAP=conso>0?Math.round(autoconso/conso*100):0;
                    unit=(autoconso+achat)>=100?'MWh':'kWh'; scale=unit==='MWh'?0.001:1;
                    period=chartLevel==='hour'?`${chartDay}/${chartMonth}`:chartLevel==='day'?`Mois ${chartMonth}`:'Année';
                    fmt=v=>(v*scale).toFixed(unit==='MWh'?1:0)+' '+unit;
                  }
                  // Baisse de facture annuelle (€TTC) et réduction (%)
                  let reductionFacturePct=null, baisseFacture=null;
                  if(balance){
                    if(balance._storageOpti||balance._combined){
                      // Résultat optimisation stockage (avec ou sans PV)
                      baisseFacture=balance.saving;
                      reductionFacturePct=balance.reductionPct;
                      if(baisseFacture>0) localStorage.setItem('starvolt_baisse_facture',String(baisseFacture));
                    } else if(site?.conso_profil&&site.conso_annuelle_kwh>0){
                      // Bilan PV normal — même formule que SolarSim
                      const annInj=balance.monthly.reduce((s,m)=>s+m.injection,0);

                      const curT=tariffs.find(t=>t.id===site.tarif_id);

                          const _pm=_bill/site.conso_annuelle_kwh;
                          const _pr=globalVars?.prix_rachat_injection??0.04;
                          const nouvFact=Math.max(0,annGrid*_pm-annInj*_pr);
                          reductionFacturePct=Math.min(100,Math.round((1-nouvFact/_bill)*100));
                          baisseFacture=Math.max(0,Math.round(_bill-nouvFact));
                          localStorage.setItem('starvolt_baisse_facture',String(baisseFacture));
                        }
                      }
                    }
                  }
                  const hasSolar=!!localStorage.getItem('starvolt_solar_chosen');
                  // hasBox : box choisie seule OU incluse dans solar_box
                  const hasBox=!!localStorage.getItem('starvolt_box_chosen')||localStorage.getItem('starvolt_solar_chosen')==='solar_box';
                  const hasAcc=localStorage.getItem('starvolt_acc_chosen')==='true';
                  const optiFlex=!!(globalVars?.opti_flex)&&hasBox;
                  const optiAcc=!!(globalVars?.opti_acc)&&hasAcc;
                  // Flex revenue : thermique 14 €/kW/an + batterie 27 €/kW/an (puissance = capacité × ratio)
                  const _ratio=(globalVars?.ratio_puissance_stockage??50)/100;
                  const batPowKw=(parseFloat(batKwh)||0)*_ratio;
                  const flexRevenue=optiFlex?Math.round((parseFloat(thermKwh)||0)*14+batPowKw*27):0;
                  // ACC savings post-balance : heures 9–17, accTTC < normalTTC
                  // Formule ACC TTC : (prix_vente_ACC + TURPE_4_taux(m,h)) × (1+TVA) — sans accise
                  // TURPE variable selon saison et HC/HP ; normalTTC depuis tarif brut (pas hourlyPrices)
                  let accSavings=0;
                  if(optiAcc&&balance?.hourly){
                    const _accPHT=parseFloat(localStorage.getItem('starvolt_acc_price_ht')||'0.09');
                    const _tva=(globalVars?.tva??20)/100;
                    const _hcw=[
                      {s:parseHcHour(site?.hc_debut1??site?.heure_debut_hc1??globalVars?.hc_debut1),e:parseHcHour(site?.hc_fin1??site?.heure_fin_hc1??globalVars?.hc_fin1)},
                      {s:parseHcHour(site?.hc_debut2??site?.heure_debut_hc2??globalVars?.hc_debut2),e:parseHcHour(site?.hc_fin2??site?.heure_fin_hc2??globalVars?.hc_fin2)},
                    ].filter(w=>w.s!==null&&w.e!==null);
                    for(const pt of balance.hourly){
                      if(!pt||pt.grid_buy<=0||!(prodProfilData?.[profIdx(pt.m,pt.d,pt.h)]>0)) continue;
                      // Prix ACC TTC de l'heure : TURPE 4 taux (été/hiver × HC/HP), sans accise
                      const accTTC=(_accPHT+getTurpeRate(pt.m,pt.h,globalVars,_hcw))*(1+_tva);
                      // Prix normal de l'heure (sans ACC) calculé depuis le tarif brut
                      const normalTTC=(()=>{
                        if(effectiveTariff?.tarif_dynamique&&spotMap){
                          const spot=spotMap[`${pt.m}_${pt.d}_${pt.h}`]||0;
                          const marge=(effectiveTariff.marge_fournisseur_ceur_kwh||0)/100;
                          return(spot+getTurpeRate(pt.m,pt.h,globalVars,_hcw)+(globalVars?.accise||0)/100+marge)*(1+_tva);
                        }
                        const ph=parseFloat(effectiveTariff?.prix_hp)||0;
                        const pc=effectiveTariff?.prix_hc!=null?parseFloat(effectiveTariff.prix_hc)||0:ph;
                        return _hcw.length>0&&isHcHour(pt.h,_hcw)?pc:ph;
                      })();
                      if(normalTTC>accTTC) accSavings+=pt.grid_buy*(normalTTC-accTTC);
                    }
                    accSavings=Math.round(accSavings);
                  }
                  // Baisse totale : bilan énergie + flex + acc — source unique pour le panier
                  const baisseTotale=(baisseFacture||0)+flexRevenue+accSavings;
                  if(baisseTotale>0) localStorage.setItem('starvolt_baisse_facture',String(baisseTotale));
                  // Investissement global (PV + batterie + box) depuis les tarifs admin
                  const _pvInv = interpPrix(parseFloat(pvKwc)||0, prixMat?.pv_prices||[]);
                  const _batInv = interpPrix(parseFloat(batKwh)||0, prixMat?.bat_prices||[]);
                  const _boxInv = hasBox ? ((prixMat?.box_prix||500)+(prixMat?.box_installation||100)) : 0;
                  const totalInvestissement = _pvInv + _batInv + _boxInv;
                  // Toujours écrire (même 0) pour éviter que l'ancienne valeur persiste

                          </div>

                          </div>
                          {!isMobile&&<div style={{fontSize:11,color:'rgba(255,255,255,.45)'}}>
                            {baisseFacture>0?`Énergie ${baisseFacture.toLocaleString('fr-FR')} €`:''}

                            const P=({x1,y1,x2,y2,w=1.2})=><line x1={x1} y1={y1} x2={x2} y2={y2} stroke="white" strokeWidth={w} strokeLinecap="round"/>;
                            return <svg width="72" height="56" viewBox="0 0 80 64" fill="none">
                              {/* Mât */}
                              <P x1="54" y1="3" x2="54" y2="9" w={2}/>
                              {/* Bras supérieur (±9) */}
                              <P x1="45" y1="9" x2="63" y2="9" w={2.2}/>

                              {/* Bras inférieur (±8) */}
                              <P x1="46" y1="16" x2="62" y2="16" w={2}/>

                              <P x1="62" y1="16" x2="64" y2="21" w={1.8}/>

                              <P x1="59" y1="16" x2="61" y2="32" w={1.4}/>

                              {/* Corps section 2 */}
                              <P x1="47" y1="32" x2="45" y2="48" w={1.4}/>
                              <P x1="61" y1="32" x2="63" y2="48" w={1.4}/>
                              <P x1="47" y1="32" x2="63" y2="48" w={0.8}/>
                              <P x1="61" y1="32" x2="45" y2="48" w={0.8}/>
                              {/* Corps section 3 */}
                              <P x1="45" y1="48" x2="43" y2="61" w={1.4}/>
                              <P x1="63" y1="48" x2="65" y2="61" w={1.4}/>
                              <P x1="45" y1="48" x2="63" y2="48" w={0.9}/>
                              <P x1="45" y1="48" x2="65" y2="61" w={0.8}/>
                              <P x1="63" y1="48" x2="43" y2="61" w={0.8}/>

                              <P x1="4" y1="12" x2="31" y2="12" w={3}/>

                          })(),

                        },
                      ].map(({icon,color,bg,label,value})=>(
                        <div key={label} style={{

      <StickyFooter row onBack={onBack}>
