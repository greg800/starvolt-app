              // Heure neutre → décharger si PV va quand même remplir (libère de la place)
              if (optiSolaire && pvWillFill) {
                if (thermSOC > 0 && need > 0) { const dt=Math.min(thermPowWh,thermSOC,need); thermSOC-=dt; need-=dt; viaTherm=dt; }
                if (batSOC > 0  && need > 0) { const db=Math.min(batPowWh,batSOC,need);   batSOC -=db; need-=db; viaBat=db; }
              }
              gridBuyWh = Math.max(0, need);
            }
          } else if (optiSolaire) {
            // Solaire seul : décharger sur tout déficit (libère place pour prochain surplus PV)
            if (thermSOC > 0 && need > 0) { const dt=Math.min(thermPowWh,thermSOC,need); thermSOC-=dt; need-=dt; viaTherm=dt; }
            if (batSOC > 0  && need > 0) { const db=Math.min(batPowWh,batSOC,need);   batSOC -=db; need-=db; viaBat=db; }
            gridBuyWh = Math.max(0, need);
          } else {
            gridBuyWh = need;
          }
        }

        varCostHT_with += (gridBuyWh / 1000) * price;
        annInjKwh      += injectWh / 1000;

        const gb=gridBuyWh/1000, inj=injectWh/1000, vb=viaBat/1000, vt=viaTherm/1000, os=onSiteWh/1000;
        hourly[idx] = {on_site:os, grid_buy:gb, injection:inj, via_bat:vb, via_therm:vt, m, d, h};
        monthly[m-1].on_site   += os;
        monthly[m-1].grid_buy  += gb;
        monthly[m-1].injection += inj;
        monthly[m-1].via_bat   += vb;
        monthly[m-1].via_therm += vt;
      }
    }
  }

  // ── Facturation du scénario optimisé ─────────────────────────────────────
  const injCredit = annInjKwh * prixRachat;
  let billWithStorage;
  if (isDynamic) {
    const fixedHT = (tariff.abo_annuel||0) + (tariff.turpe_fixe||0) + (tariff.cta_fixe||0);
    billWithStorage = Math.round(Math.max(0, (varCostHT_with + fixedHT) * (1 + tva) - injCredit));
  } else {
    billWithStorage = Math.round(Math.max(0, varCostHT_with + (tariff.abo_annuel||0) - injCredit));
  }

  const saving       = Math.max(0, billWithout - billWithStorage);
  const reductionPct = billWithout > 0 ? Math.min(100, Math.round((saving / billWithout) * 100)) : 0;
  return {monthly, hourly, billWithout, billWithStorage, saving, reductionPct, _combined: true};
}

// ═══════════════════════════════════════════════════════════════════════════
// SOURCE UNIQUE DE VÉRITÉ — impact du panier (Mon site ET Panier l'utilisent)
// ═══════════════════════════════════════════════════════════════════════════
// Trois fonctions pures, sans React, garantissant que les deux écrans affichent
// EXACTEMENT le même chiffre : mêmes entrées + mêmes formules = même résultat.
// Ne jamais recalculer les économies du panier ailleurs.

// 0) Variables globales : DB + override des flags opti_* depuis le cache localStorage.
//    Le cache est la SEULE source de vérité pour opti_* (mis à jour en temps réel au
//    clic) ; la DB peut être périmée. Tout écran qui calcule des économies DOIT passer
//    par ici, sinon il diverge (bug panier -416 vs Mon site -676).
function mergeGlobalVars(data) {
  const cached = (()=>{ try { return JSON.parse(localStorage.getItem('starvolt_global_vars_cache')); } catch { return null; } })();
  if (!data) return cached;
  return { ...data,
    opti_solaire: cached?.opti_solaire ?? data.opti_solaire ?? true,
    opti_tarif:   cached?.opti_tarif   ?? data.opti_tarif   ?? true,
    opti_flex:    cached?.opti_flex    ?? data.opti_flex    ?? false,
    opti_acc:     cached?.opti_acc     ?? data.opti_acc     ?? false,
  };
}

// 1) Équipement PV / batterie / thermique retenu selon le contenu du panier.
//    Lit starvolt_solar_defaults (édité dans Mon site) + fallback site + défauts.
function resolveCartEquipment(site) {
  const solarDef = (()=>{ try { return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{}; } catch { return {}; } })();
  const hasSolar   = !!localStorage.getItem('starvolt_solar_chosen');
  const hasBoxOnly = !!localStorage.getItem('starvolt_box_chosen') && !hasSolar;
  if (hasSolar) return {
    pvKwc:    parseFloat(solarDef.pvKwc)  > 0 ? String(solarDef.pvKwc)  : (site?.puissance_pv_kwc      > 0 ? String(site.puissance_pv_kwc)      : '6'),
    batKwh:   parseFloat(solarDef.batKwh) > 0 ? String(solarDef.batKwh) : (site?.batterie_capacite_kwh > 0 ? String(site.batterie_capacite_kwh) : '10'),
    thermKwh: parseFloat(solarDef.thermKwh) > 0 ? String(solarDef.thermKwh) : '10',
  };
  if (hasBoxOnly) return { pvKwc: solarDef.pvKwc||'0', batKwh: solarDef.batKwh||'0', thermKwh: solarDef.thermKwh||'10' };
  return { pvKwc: solarDef.pvKwc||'0', batKwh: solarDef.batKwh||'0', thermKwh: solarDef.thermKwh||'0' };
}

// 2) Bilan énergétique horaire selon le panier (sélection du moteur).
//    Retourne l'objet balance ({billWithout, billWithStorage, saving, monthly, hourly...}) ou null.
function buildSiteBalance({ site, prodProfil, tariffs, spotMap, globalVars, pvKwc, batKwh, thermKwh }) {
  if (!site?.conso_profil) return null;
  const kw = pvKwc === '' ? 6 : (parseFloat(pvKwc)||0);
  const bk = parseFloat(batKwh)||0;
  const tk = parseFloat(thermKwh)||0;
  // Le stockage ne se pilote que si une box Starvolt est au panier.
  const hasBoxLS = !!localStorage.getItem('starvolt_box_chosen')
                || localStorage.getItem('starvolt_solar_chosen') === 'solar_box';
  const eg = globalVars ? {
    ...globalVars,
    opti_tarif:   hasBoxLS ? (globalVars.opti_tarif   ?? true) : false,
    opti_solaire: hasBoxLS ? (globalVars.opti_solaire ?? true) : false,
  } : globalVars;
  const optiChosen = !!localStorage.getItem('starvolt_optimisation_chosen');
  const optiId = optiChosen ? localStorage.getItem('starvolt_optimisation_tariff_id') : null;
  const effId = optiId || site.tarif_id;
  const curT  = effId ? (tariffs||[]).find(t=>t.id===effId)||null : null;
  const baseT = site.tarif_id ? (tariffs||[]).find(t=>t.id===site.tarif_id)||curT : curT;
  if (kw > 0 && prodProfil) {
    if (curT) {
      if (curT.tarif_dynamique && !spotMap) return null;
      return computeCombinedOptimization(site.conso_profil, prodProfil, kw, batKwh, thermKwh, eg, curT, baseT, site, spotMap);
    }
    const ratioBat=(globalVars?.ratio_puissance_stockage??50)/100;
    const pBat=globalVars?.pertes_batterie??10;
    const ratioTherm=(globalVars?.ratio_puissance_stockage_thermique??50)/100;
    const pTherm=globalVars?.pertes_thermique??0;
    return computeEnergyBalance(site.conso_profil, prodProfil, kw, bk*ratioBat*1000, bk, pBat, tk*ratioTherm, tk, pTherm);
  }
  if (curT) {
    if (curT.tarif_dynamique && !spotMap) return null;
    return computeStorageOptimization(site.conso_profil, curT, baseT, site, bk, tk, eg, spotMap);
  }
  return null;
}

// 3) Dérive les chiffres affichés (facture avant/après, économie totale) depuis le balance.
//    totalSaving = saving énergie (tarif + stockage + PV) + flex (cagnotte) + ACC.
function deriveSiteImpact({ balance, site, prodProfil, tariffs, spotMap, globalVars, batKwh, thermKwh }) {
  const optiChosen = !!localStorage.getItem('starvolt_optimisation_chosen');
  const optiId = optiChosen ? localStorage.getItem('starvolt_optimisation_tariff_id') : null;
  const effId = optiId || site?.tarif_id;
  const effectiveTariff = effId ? (tariffs||[]).find(t=>t.id===effId)||null : null;
  const baseTariff = (tariffs||[]).find(t=>t.id===site?.tarif_id);
  const consoTot = Math.round(site?.conso_annuelle_kwh||0);

  let billAvant = balance?.billWithout != null
    ? Math.round(balance.billWithout)
    : (baseTariff && !baseTariff.tarif_dynamique
        ? Math.round((baseTariff.abo_annuel||0) + (site?.conso_annuelle_kwh||0)*(baseTariff.prix_hp||0))
        : null);

  // Flex revenue (cagnotte flexibilité) — uniquement si box au panier + service activé
  const _boxLS = localStorage.getItem('starvolt_box_chosen');
  const _hasBox = (_boxLS && _boxLS!=='diy') || localStorage.getItem('starvolt_solar_chosen')==='solar_box';
  const _optiFlex = !!(globalVars?.opti_flex) && _hasBox;
  const _ratio = (globalVars?.ratio_puissance_stockage??50)/100;
  const _batPow = (parseFloat(batKwh)||0)*_ratio;
  const flexRev = _optiFlex ? Math.round((parseFloat(thermKwh)||0)*14 + _batPow*27) : 0;

  // ACC savings — heures de prod solaire, accTTC < tarif normal TTC
  const _hasAcc = localStorage.getItem('starvolt_acc_chosen')==='true';
  let accRev = 0;
  if (_hasAcc && effectiveTariff && site?.conso_profil) {
    const _accPHT = parseFloat(localStorage.getItem('starvolt_acc_price_ht')||'0.09');
    const _tva = (globalVars?.tva??20)/100;
    const _hcw = [
      {s:parseHcHour(site?.hc_debut1??site?.heure_debut_hc1??globalVars?.hc_debut1),e:parseHcHour(site?.hc_fin1??site?.heure_fin_hc1??globalVars?.hc_fin1)},
      {s:parseHcHour(site?.hc_debut2??site?.heure_debut_hc2??globalVars?.hc_debut2),e:parseHcHour(site?.hc_fin2??site?.heure_fin_hc2??globalVars?.hc_fin2)},
    ].filter(w=>w.s!==null&&w.e!==null);
    const _ph = parseFloat(effectiveTariff.prix_hp)||0;
    const _pc = effectiveTariff.prix_hc!=null ? parseFloat(effectiveTariff.prix_hc)||0 : _ph;
    for (let _m=1;_m<=12;_m++) for (let _d=1;_d<=PROF_DAYS[_m-1];_d++) for (let _h=0;_h<24;_h++) {
      const _idx = profIdx(_m,_d,_h);
      const _isSolar = prodProfil ? prodProfil[_idx]>0 : (_h>=9&&_h<18);
      if (!_isSolar) continue;
      const _gkwh = balance?.hourly ? (balance.hourly[_idx]?.grid_buy||0) : ((site.conso_profil[_idx]||0)/1000);
      if (_gkwh<=0) continue;
      const _accTTC = (_accPHT+getTurpeRate(_m,_h,globalVars,_hcw))*(1+_tva);
      let _nTTC;
      if (effectiveTariff.tarif_dynamique && spotMap) {
        const _spot = spotMap[`${_m}_${_d}_${_h}`]||0;
        const _marge = (effectiveTariff.marge_fournisseur_ceur_kwh||0)/100;
        _nTTC = (_spot+getTurpeRate(_m,_h,globalVars,_hcw)+(globalVars?.accise||0)/100+_marge)*(1+_tva);
      } else {
        _nTTC = _hcw.length>0&&isHcHour(_h,_hcw) ? _pc : _ph;
      }
      if (_nTTC>_accTTC) accRev += _gkwh*(_nTTC-_accTTC);
    }
    accRev = Math.round(accRev);
  }

  const hasBalance   = balance && typeof balance.billWithStorage === 'number';
  const consoApres   = hasBalance ? Math.round(balance.monthly.reduce((s,m)=>s+m.grid_buy,0)) : null;
  const injApres     = hasBalance ? Math.round(balance.monthly.reduce((s,m)=>s+m.injection,0)) : 0;
  const billApresElec= hasBalance ? Math.round(balance.billWithStorage) : null;
  const billApresNet = billApresElec!=null ? billApresElec-flexRev-accRev : null;
  const energySaving = hasBalance ? balance.saving : 0;
  const totalSaving  = hasBalance ? (balance.saving+flexRev+accRev) : accRev;
  const reductionPct = billAvant>0 ? Math.min(100, Math.round(totalSaving/billAvant*100)) : 0;

  return { billAvant, billApresNet, consoApres, injApres, consoTot, flexRev, accRev, energySaving, totalSaving, reductionPct, hasBalance, effectiveTariff };
}

// 4) Construit les CHIFFRES déjà calculés envoyés à l'IA pour "Ton bilan en clair".
//    L'IA ne calcule RIEN : on lui livre des faits déterministes issus du moteur.
//    leviers_classement = ordre qualitatif des leviers (sans euros, pour ne pas contredire le simulateur).
function buildBilanFacts({ site, tariffs, globalVars, prodProfil }) {
  if (!site?.conso_profil || !(site.conso_annuelle_kwh > 0)) return null;
  const cp = site.conso_profil;
  const consoAnnuelle = Math.round(site.conso_annuelle_kwh);

  // ── Répartition horaire (% de la conso annuelle) + saisonnalité ──
  const b = { nuit_0h_6h:0, matin_6h_9h:0, journee_9h_18h:0, pointe_18h_22h:0, soir_22h_24h:0 };
  let ete=0, hiver=0, total=0;
  for (let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
    const wh = cp[profIdx(m,d,h)]||0; if(wh<=0) continue;
    total+=wh;
    if(h<6) b.nuit_0h_6h+=wh;
    else if(h<9) b.matin_6h_9h+=wh;
    else if(h<18) b.journee_9h_18h+=wh;
    else if(h<22) b.pointe_18h_22h+=wh;
    else b.soir_22h_24h+=wh;
    if(m>=4&&m<=10) ete+=wh; else hiver+=wh;
  }
  const pct = v => total>0 ? Math.round(v/total*100) : 0;
  const repartition = {
    nuit_0h_6h: pct(b.nuit_0h_6h), matin_6h_9h: pct(b.matin_6h_9h),
    journee_9h_18h: pct(b.journee_9h_18h), pointe_18h_22h: pct(b.pointe_18h_22h),
    soir_22h_24h: pct(b.soir_22h_24h),
  };
  const saisonnalite = { ete: pct(ete), hiver: pct(hiver) };

  // ── Tarif courant + facture actuelle (déterministe) ──
  const curT = (tariffs||[]).find(t=>t.id===site.tarif_id) || null;
  const { kwh_hc, kwh_hp, hasHC } = calcHcHp(cp, site);
  let factureActuelle = null, typeTarif = 'inconnu';
  if (curT) {
    typeTarif = (curT.tarif_dynamique||curT.type_tarif==='dynamique') ? 'dynamique'
      : (hasHC ? 'heures_creuses' : 'base');
    const c = calcTariffCost(curT, kwh_hc, kwh_hp); // null si dynamique sans contexte
    if (c?.total!=null) factureActuelle = Math.round(c.total);
  }
  const pctHC = (kwh_hc+kwh_hp)>0 ? Math.round(kwh_hc/(kwh_hc+kwh_hp)*100) : 0;
  const prixMoyen = (factureActuelle!=null && consoAnnuelle>0)
    ? Math.round(factureActuelle/consoAnnuelle*100) : null; // c€/kWh

  // ── Leviers (€/an, ordres de grandeur indicatifs) ──
  const leviers = {};
  if (factureActuelle!=null) {
    // 1) Meilleur tarif statique vs actuel
    let best=null;
    (tariffs||[]).forEach(t=>{
      if(t.tarif_dynamique||t.type_tarif==='dynamique'||t.type_tarif==='multi') return;
      const c=calcTariffCost(t,kwh_hc,kwh_hp);
      if(c?.total!=null && (best===null||c.total<best)) best=c.total;
    });
    if(best!=null) leviers.changer_de_tarif = Math.max(0, Math.round(factureActuelle-best));
    // 2) ACC — kWh consommés en heures solaires × écart de prix
    let kwhSolaire=0;
    for (let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
      const isSolar = prodProfil ? prodProfil[profIdx(m,d,h)]>0 : (h>=9&&h<18);
      if(isSolar) kwhSolaire += (cp[profIdx(m,d,h)]||0)/1000;
    }
    const prixHp = curT?.prix_hp || (prixMoyen?prixMoyen/100:0.20);
    leviers.rejoindre_acc = Math.max(0, Math.round(kwhSolaire*Math.max(0, prixHp-0.09)));
    // 3) Box flexibilité
    leviers.box_flexibilite = Math.round(140 + factureActuelle*(typeTarif==='dynamique'?0.20:0.10));
    // 4) Panneaux solaires
    leviers.panneaux_solaires = Math.round(factureActuelle*0.5);
  }

  // ── Classement qualitatif des leviers (du plus au moins rentable) ──
  //    On NE transmet PAS les euros à l'IA (ils sont indicatifs et risqueraient
  //    de contredire le simulateur précis) : seul l'ordre est envoyé.
  const LEVIER_LABEL = {
    changer_de_tarif: 'changer de tarif',
    rejoindre_acc: 'rejoindre une communauté solaire (autoconsommation collective)',
    box_flexibilite: 'installer la box de flexibilité',
    panneaux_solaires: 'installer des panneaux solaires',
  };
  const leviersClassement = Object.entries(leviers)
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([k]) => LEVIER_LABEL[k] || k);

  return {
    conso_annuelle_kwh: consoAnnuelle,
    facture_actuelle_eur: factureActuelle,
    prix_moyen_ceur_kwh: prixMoyen,
    type_tarif: typeTarif,
    pct_heures_creuses: hasHC ? pctHC : null,
    repartition_horaire_pct: repartition,
    saisonnalite_pct: saisonnalite,
    leviers_classement: leviersClassement,
  };
}

// ─── EnergyBalanceChart ───────────────────────
function EnergyBalanceChart({ balance, level, selMonth, selDay, setLevel, setSelMonth, setSelDay, hourlyPrices, isDynamic }) {
  const wrapperRef = useRef(null), canvasRef = useRef(null);
  const barsRef = useRef([]);

  // Données à afficher selon le niveau de zoom
  const chartData = useMemo(() => {
    if (!balance) return [];
    if (level === 'month') return balance.monthly;
    if (level === 'day') {
      const days = PROF_DAYS[selMonth - 1];
      const daily = Array.from({length:days}, () => ({on_site:0, grid_buy:0, injection:0, via_bat:0, via_therm:0}));
      balance.hourly.forEach(pt => {
        if (pt && pt.m === selMonth) {
          daily[pt.d-1].on_site += pt.on_site;
          daily[pt.d-1].grid_buy += pt.grid_buy;
          daily[pt.d-1].injection += pt.injection;
          daily[pt.d-1].via_bat += pt.via_bat||0;
          daily[pt.d-1].via_therm += pt.via_therm||0;
        }
      });
      return daily;
    }
    if (level === 'hour') {
      return Array.from({length:24}, (_, hIdx) => {
        const pt = balance.hourly[profIdx(selMonth, selDay, hIdx)];
        return pt || {on_site:0, grid_buy:0, injection:0, via_bat:0, via_therm:0};
      });
    }
    return [];
  }, [balance, level, selMonth, selDay]);

  const xLabels = useMemo(() => {
    if (level === 'month') return MOIS_ABBR;
    if (level === 'day') return Array.from({length: PROF_DAYS[selMonth-1]}, (_, i) => String(i+1));
    return Array.from({length:24}, (_, i) => i + 'h');
  }, [level, selMonth]);

  // Prix agrégés pour l'axe droit (€/kWh → on affiche en c€/kWh × 100)
  const priceData = useMemo(() => {
    if (!hourlyPrices) return null;
    if (level === 'month') return Array.from({length:12}, (_, mi) => {
      let s=0, cnt=0;
      for(let d=1;d<=PROF_DAYS[mi];d++) for(let h=0;h<24;h++){s+=hourlyPrices[profIdx(mi+1,d,h)]||0;cnt++;}
      return cnt>0?s/cnt:0;
    });
    if (level === 'day') { const days=PROF_DAYS[selMonth-1]; return Array.from({length:days},(_,di)=>{let s=0;for(let h=0;h<24;h++)s+=hourlyPrices[profIdx(selMonth,di+1,h)]||0;return s/24;}); }
    if (level === 'hour') return Array.from({length:24},(_,h)=>hourlyPrices[profIdx(selMonth,selDay,h)]||0);
    return null;
  }, [hourlyPrices, level, selMonth, selDay]);

  // Moyenne 24h pour tarif dynamique en vue heure (trait pointillé)
  const dailyAvgPrice = useMemo(() => {
    if (!isDynamic || level !== 'hour' || !hourlyPrices) return null;
    let s=0; for(let h=0;h<24;h++) s+=hourlyPrices[profIdx(selMonth,selDay,h)]||0; return s/24;
  }, [isDynamic, level, selMonth, selDay, hourlyPrices]);

  const handleDblClick = (e) => {
    if (level === 'hour') return;
    const canvas = canvasRef.current; if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const cx = (e.clientX - rect.left) * (canvas.width / dpr) / rect.width;
    const idx = barsRef.current.findIndex(b => cx >= b.x && cx <= b.x + b.w);
    if (idx === -1) return;
    if (level === 'month') { setSelMonth(idx + 1); setLevel('day'); }
    else if (level === 'day') { setSelDay(idx + 1); setLevel('hour'); }
  };

  const zoomOut = () => {
    if (level === 'hour') setLevel('day');
    else if (level === 'day') { setLevel('month'); setSelMonth(null); setSelDay(null); }
  };

  const handlePrev = () => {
    if (level === 'day') { const m = selMonth > 1 ? selMonth - 1 : 12; setSelMonth(m); }
    else if (level === 'hour') {
      if (selDay > 1) { setSelDay(selDay - 1); }
      else { const pm = selMonth > 1 ? selMonth - 1 : 12; setSelMonth(pm); setSelDay(PROF_DAYS[pm-1]); }
    }
  };

  const handleNext = () => {
    if (level === 'day') { const m = selMonth < 12 ? selMonth + 1 : 1; setSelMonth(m); }
    else if (level === 'hour') {
      if (selDay < PROF_DAYS[selMonth-1]) { setSelDay(selDay + 1); }
      else { const nm = selMonth < 12 ? selMonth + 1 : 1; setSelMonth(nm); setSelDay(1); }
    }
  };

  useEffect(() => {
    const canvas = canvasRef.current, wrapper = wrapperRef.current;
    if (!canvas || !wrapper || !chartData.length) return;
    const W = Math.max(wrapper.clientWidth, 200), H = 240, dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const isMobChart = window.innerWidth < 640;
    const LEGEND_H = isMobChart ? 62 : 26;
    const ML = 46, MR = priceData ? 48 : 8, MT = LEGEND_H + 6, MB = isMobChart ? 24 : 28;
    const cW = W - ML - MR, cH = H - MT - MB;
    const n = chartData.length;

    // Unité adaptative
    const maxRaw = Math.max(...chartData.map(m => m.on_site + m.grid_buy), 0.001);
    const unitScale = maxRaw >= 100 ? 0.001 : 1;
    const unitLabel = maxRaw >= 100 ? 'MWh' : 'kWh';

    const data = chartData.map(m => ({s: m.on_site*unitScale, g: m.grid_buy*unitScale, i: m.injection*unitScale, b: (m.via_bat||0)*unitScale, t: (m.via_therm||0)*unitScale}));
    const maxPos = Math.max(...data.map(m => m.s + m.g), 0.001);
    const maxNeg = Math.max(...data.map(m => m.i), 0.001);
    const posRatio = Math.min(Math.max(maxPos / (maxPos + maxNeg), 0.38), 0.82);
    const zeroY = MT + cH * posRatio;
    const scalePos = (cH * posRatio) / maxPos;
    const scaleNeg = (cH * (1 - posRatio)) / maxNeg;

    // Grille
    ctx.lineWidth = 1;
    [1/3, 2/3, 1].forEach(f => {
      const v = maxPos * f, y = zeroY - v * scalePos;
      ctx.strokeStyle = 'rgba(255,255,255,.09)';
      ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(W - MR, y); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '13px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(v.toFixed(1), ML - 4, y + 4);
    });
    const vn = maxNeg * 0.65, yn = zeroY + vn * scaleNeg;
    ctx.strokeStyle = 'rgba(255,255,255,.09)';
    ctx.beginPath(); ctx.moveTo(ML, yn); ctx.lineTo(W - MR, yn); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.textAlign = 'right';
    ctx.fillText('-'+vn.toFixed(1), ML - 4, yn + 4);

    // Axe zéro
    ctx.strokeStyle = 'rgba(255,255,255,1)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ML, zeroY); ctx.lineTo(W - MR, zeroY); ctx.stroke();

    // Label axe Y
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.translate(14, MT + cH / 2); ctx.rotate(-Math.PI/2); ctx.fillText(unitLabel, 0, 0); ctx.restore();

    // Barres + positions pour le drill-down
    const bTW = cW / n, bPad = Math.max(2, bTW * 0.14), bW = bTW - bPad * 2;
    const newBars = [];
    data.forEach((m, i) => {
      const x = ML + i * bTW + bPad;
      newBars.push({x, w: bW});
      const sDirect = Math.max(0, m.s - m.b - m.t);
      // Direct solaire
      if (sDirect > 0) { ctx.fillStyle = '#f0a050'; ctx.fillRect(x, zeroY - sDirect * scalePos, bW, sDirect * scalePos); }
      // Stockage thermique (orange pointillé)
      if (m.t > 0) {
        const yTop = zeroY - (sDirect + m.t) * scalePos;
        const barH = m.t * scalePos;
        ctx.fillStyle = '#ffb060'; ctx.fillRect(x, yTop, bW, barH);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for (let dy = yTop + 3; dy < yTop + barH - 1; dy += 5) {
          for (let dx = x + 3; dx < x + bW - 1; dx += 5) {
            ctx.beginPath(); ctx.arc(dx, dy, 1.5, 0, Math.PI*2); ctx.fill();
          }
        }
      }
      // Batterie chimique
      if (m.b > 0) { ctx.fillStyle = '#ffd098'; ctx.fillRect(x, zeroY - (sDirect + m.t + m.b) * scalePos, bW, m.b * scalePos); }
      // Achat réseau
      if (m.g > 0) { ctx.fillStyle = '#d0d0d0'; ctx.fillRect(x, zeroY - (m.s + m.g) * scalePos, bW, m.g * scalePos - 1); }
      // Injection
      if (m.i > 0) { ctx.fillStyle = '#f0e86a'; ctx.fillRect(x, zeroY + 2, bW, m.i * scaleNeg - 2); }
    });
    barsRef.current = newBars;

    // ── Axe droit : tarif (€/kWh) ──────────────────────────────────────────────
    if (priceData) {
      const hasNegPrice = priceData.some(p => p < 0);
      const maxP = Math.max(...priceData, dailyAvgPrice||0, 0.001);
      const minP = hasNegPrice ? Math.min(...priceData, dailyAvgPrice||0) : 0;
      // Échelle : zeroY = prix 0, croissant vers le haut (positif) et vers le bas (négatif)
      const priceScale = (zeroY - MT) / maxP; // px par €/kWh
      const priceY = p => zeroY - p * priceScale;
      const axX = W - MR + 4;
      const axBottom = hasNegPrice ? Math.min(MT + cH, priceY(minP)) : zeroY;

      ctx.save();

      // Ligne verticale axe droit (étendue vers le bas si prix négatifs)
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(axX, MT); ctx.lineTo(axX, axBottom); ctx.stroke();

      // Ticks + labels en c€/kWh
      ctx.font = (isMobChart ? '9px' : '10px') + ' sans-serif';
      ctx.textAlign = 'left';
      const ticks = [0, maxP * 0.5, maxP];
      if (hasNegPrice) ticks.push(minP);
      ticks.forEach(p => {
        const ty = priceY(p);
        if (ty < MT - 4 || ty > axBottom + 4) return;
        const neg = p < 0;
        ctx.strokeStyle = neg ? 'rgba(255,100,100,.6)' : 'rgba(255,255,255,.35)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(axX, ty); ctx.lineTo(axX + 4, ty); ctx.stroke();
        ctx.fillStyle = neg ? 'rgba(255,160,160,.9)' : 'rgba(255,255,255,.65)';
        ctx.fillText((p * 100).toFixed(p === 0 ? 0 : 1), axX + 6, ty + 3.5);
      });

      // Label unité
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.font = (isMobChart ? '8px' : '9px') + ' sans-serif';
      ctx.textAlign = 'center';
      ctx.translate(W - 6, MT + (zeroY - MT) / 2);
      ctx.rotate(Math.PI / 2);
      ctx.fillText('c€/kWh', 0, 0);
      ctx.restore();

      // Trait horizontal par barre = tarif de la période (rouge si négatif)
      newBars.forEach((bar, i) => {
        if (i >= priceData.length) return;
        const p = priceData[i];
        const py = priceY(p);
        if (py < MT - 4 || py > axBottom + 4) return;
        ctx.strokeStyle = p < 0 ? 'rgba(255,80,80,.95)' : 'white';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(bar.x, py); ctx.lineTo(bar.x + bar.w, py); ctx.stroke();
      });

      // Trait pointillé = moyenne 24h (tarif dynamique, vue heure uniquement)
      if (dailyAvgPrice != null) {
        const py = priceY(dailyAvgPrice);
        const negAvg = dailyAvgPrice < 0;
        ctx.strokeStyle = negAvg ? 'rgba(255,150,150,.75)' : 'rgba(255,255,255,.75)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(ML, py); ctx.lineTo(W - MR, py); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = negAvg ? 'rgba(255,150,150,.75)' : 'rgba(255,255,255,.75)';
        ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
        ctx.fillText('moy', W - MR - 2, py - 3);
      }
      ctx.restore();
    }

    // Labels axe X
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.textAlign = 'center';
    // Taille par niveau : heures = 20px, mois/jours = 26px (desktop)
    const lblFont = isMobChart ? '13px sans-serif' : 'bold 18px sans-serif';
    ctx.font = lblFont;
    xLabels.forEach((lbl, i) => {
      if (isMobChart && n === 12 && i % 3 !== 0) return;  // mobile mois : 1 sur 3
      if (isMobChart && n > 24 && i % 5 !== 0) return;    // mobile jours : 1 sur 5
      if (!isMobChart && n > 24 && i % 2 !== 0) return;   // desktop jours : 1 sur 2
      if (isMobChart && n === 24 && i % 4 !== 0) return;  // mobile heures : 1 sur 4
      if (!isMobChart && n === 24 && i % 2 !== 0) return; // desktop heures : 1 sur 2
      ctx.fillText(lbl, ML + i * bTW + bTW / 2, H - (isMobChart ? 4 : 8));
    });

    // Indice de niveau
    if (level !== 'hour') {
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('double-clic pour zoomer', W - MR, MT + 10);
    }

    // Légende — labels courts
    const LEG = [
      {color:'#f0a050', label:'Solaire'},
      {color:'#ffb060', label:'Bat. Thermique', dots:true},
      {color:'#ffd098', label:'Batterie'},
      {color:'#d0d0d0', label:'Achat'},
      {color:'#f0e86a', label:'Injection'},
    ];
    const drawLegItem = (it, lx, ly, sqSz) => {
      ctx.fillStyle = it.color; ctx.fillRect(lx, ly, sqSz, sqSz);
      if (it.dots) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        [2,7].forEach(dy => [2,6,10].forEach(dx => { ctx.beginPath(); ctx.arc(lx+dx, ly+dy, 1.4, 0, Math.PI*2); ctx.fill(); }));
      }
      ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.textAlign = 'left';
      ctx.fillText(it.label, lx + sqSz + 4, ly + sqSz - 1);
    };
    if (!isMobChart) {
      // Desktop : 1 ligne centrée
      ctx.font = 'bold 14px sans-serif';
      const sqSz = 12, txtGap = 4, pad = 18;
      const widths = LEG.map(it => sqSz + txtGap + ctx.measureText(it.label).width);
      const totalW = widths.reduce((s, w) => s + w, 0) + pad * (LEG.length - 1);
      let lx = Math.max(4, (W - totalW) / 2);
      const ly = Math.floor((LEGEND_H - sqSz) / 2);
      LEG.forEach((it, i) => { drawLegItem(it, lx, ly, sqSz); lx += widths[i] + pad; });
    } else {
      // Mobile : 2 colonnes centrées (marge 40px pour laisser place aux flèches nav)
      ctx.font = 'bold 13px sans-serif';
      const legMargin = 40, colW = Math.floor((W - legMargin * 2) / 2), rowH = 19, sqSz = 11;
      LEG.forEach((it, i) => {
        const col = i >= 3 ? 1 : 0, row = i >= 3 ? i - 3 : i;
        drawLegItem(it, legMargin + col * colW, 3 + row * rowH, sqSz);
      });
    }
  }, [chartData, xLabels, level, priceData, dailyAvgPrice]);

  const ctxLabel = level === 'day' ? MOIS_FULL[selMonth-1] : level === 'hour' ? `${selDay} ${MOIS_FULL[selMonth-1]}` : null;

  const navBtnStyle = {
    position:'absolute', zIndex:2, background:'#5cb85c',
    border:'none', borderRadius:'50%',
    width:32, height:32, cursor:'pointer', color:'white',
    fontSize:16, lineHeight:'30px', textAlign:'center', padding:0,
    boxShadow:'0 2px 8px rgba(125,217,64,.35)'
  };

  return (
    <div ref={wrapperRef} style={{position:'relative', width:'100%'}}>
      {level !== 'month' && (
        <button onClick={handlePrev} title="Période précédente" style={{...navBtnStyle, top:4, left:4}}>←</button>
      )}
      {level !== 'month' && (
        <button onClick={handleNext} title="Période suivante" style={{...navBtnStyle, top:4, right:4}}>→</button>
      )}
      <canvas ref={canvasRef} style={{display:'block', cursor: level!=='hour'?'crosshair':'default'}} onDoubleClick={handleDblClick}/>
      {level !== 'month' && (
        <button onClick={zoomOut} title="Zoom arrière" style={{
          position:'absolute', bottom:28, left:4, zIndex:2,
          background:'#5cb85c', border:'none',
          borderRadius:'50%', width:32, height:32, cursor:'pointer',
          padding:0, display:'flex', alignItems:'center', justifyContent:'center',
          boxShadow:'0 2px 8px rgba(125,217,64,.35)'
        }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="7.5" cy="7.5" r="5.5" stroke="white" strokeWidth="2"/>
            <line x1="4.5" y1="7.5" x2="10.5" y2="7.5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
            <line x1="12" y1="12" x2="16" y2="16" stroke="white" strokeWidth="2" strokeLinecap="round"/>
          </svg>
        </button>
      )}
      {ctxLabel && <div style={{textAlign:'center',fontSize:22,fontWeight:700,color:'rgba(255,255,255,.75)',marginTop:4}}>{ctxLabel}</div>}
    </div>
  );
}

// ─── MonSiteScreen ────────────────────────────
function MonSiteScreen({ user, userProfile, onBack, onSimulations, onComprendre, onOnboardingQuestions, cartVersion=0 }) {
  const[sites,setSites]=useState(null);
  const[activeId,setActiveId]=useState(null);
  const[tariffs,setTariffs]=useState([]);
  const[prodProfils,setProdProfils]=useState([]);
  const[showAdd,setShowAdd]=useState(false);
  const[editMode,setEditMode]=useState(false);
  const[showDeleteConfirm,setShowDeleteConfirm]=useState(false);
  const[pvKwc,setPvKwc]=useState(()=>{try{const d=JSON.parse(localStorage.getItem('starvolt_solar_defaults'));if(d?.pvKwc!=null)return d.pvKwc;}catch{}return!!localStorage.getItem('starvolt_solar_chosen')?'6':'0';});
  const[batKwh,setBatKwh]=useState(()=>{try{const d=JSON.parse(localStorage.getItem('starvolt_solar_defaults'));if(d?.batKwh!=null)return d.batKwh;}catch{}return!!localStorage.getItem('starvolt_solar_chosen')?'10':'0';});
  const[thermKwh,setThermKwh]=useState(()=>{try{const d=JSON.parse(localStorage.getItem('starvolt_solar_defaults'));if(d?.thermKwh!=null)return d.thermKwh;}catch{}const hasSol=!!localStorage.getItem('starvolt_solar_chosen');return hasSol?'10':!!localStorage.getItem('starvolt_box_chosen')?'10':'0';});
  const[prodProfilId,setProdProfilId]=useState('');
  const[prodProfilData,setProdProfilData]=useState(null);
  const[balance,setBalance]=useState(null);
  const[heatmapExpanded,setHeatmapExpanded]=useState(false);
  const[chartLevel,setChartLevel]=useState('month');
  const[chartMonth,setChartMonth]=useState(null);
  const[chartDay,setChartDay]=useState(null);
  const[globalVars,setGlobalVars]=useState(()=>{try{const c=localStorage.getItem('starvolt_global_vars_cache');return c?JSON.parse(c):null;}catch{return null;}});
  const[prixMat,setPrixMat]=useState(null);
  const[spotMap,setSpotMap]=useState(null);
  const[isMobile,setIsMobile]=useState(window.innerWidth<640);
  const[consoOpen,setConsoOpen]=useState(false);
  const[prodOpen,setProdOpen]=useState(false);
  const[consoChartOpen,setConsoChartOpen]=useState(true);
  const[showFlexForm,setShowFlexForm]=useState(false);
  const[linkyStatus,setLinkyStatus]=useState(null); // null | 'loading' | 'pending' | 'ordering' | 'done' | 'error'
  const[linkyUserUrl,setLinkyUserUrl]=useState(null);
  const[linkyRequestId,setLinkyRequestId]=useState(null);
  const[linkyError,setLinkyError]=useState(null);
  const[linkyErrorStep,setLinkyErrorStep]=useState(null); // 0..3 : étape où l'erreur s'est produite
  const[linkCopied,setLinkCopied]=useState(false); // feedback "lien copié" du bouton de partage consentement
  const[consentModal,setConsentModal]=useState(null); // null | 'invite' | 'iframe' — fenêtre de consentement in-app
  const[autoLinkyArmed,setAutoLinkyArmed]=useState(false); // armé au retour de l'inscription pour lancer la collecte si besoin
  const[linkyLive,setLinkyLive]=useState(false); // true seulement quand le statut vient d'une réponse live de l'edge (≠ restauré du localStorage)
  const consentShownRef=useRef(null); // requestId pour lequel l'invite a déjà été ouverte automatiquement
  const enedisRef=useRef(null); // zone ENEDIS — cible du scroll/centre auto au retour de l'inscription
  const linkyPollRef=useRef(null);
  const[bilanGenerating,setBilanGenerating]=useState(false);
  const[bilanOpen,setBilanOpen]=useState(false);
  const bilanGenRef=useRef({}); // {siteId:true} pour ne générer qu'une fois par session
  const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhreGtod2VncWthcGRic2lzeHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MjY4NjksImV4cCI6MjA5MzAwMjg2OX0.9-_oHRJfwXZkl3bRYDMb5K56UzB8O1NOfa5QfrXFfkQ';
  const EDGE_URL='https://hkxkhwegqkapdbsisxwv.supabase.co/functions/v1/switchgrid-v0';

  // ── Restaurer l'état linky depuis localStorage quand le site actif change ──
  React.useEffect(()=>{
    clearInterval(linkyPollRef.current);
    setLinkyLive(false); // statut restauré = non confirmé ; un poll live tranchera (consentement peut-être déjà signé)
    if(!activeId){ setLinkyRequestId(null);setLinkyStatus(null);setLinkyUserUrl(null);setLinkyError(null); return; }
    try{
      const saved=localStorage.getItem(`starvolt_linky_${activeId}`);
      if(saved){
        const{requestId,status,userUrl}=JSON.parse(saved);
        if(requestId&&status!=='done'&&status!=='error'){
          setLinkyRequestId(requestId); setLinkyStatus(status);
          setLinkyUserUrl(userUrl||null); setLinkyError(null);
          return;
        }
        localStorage.removeItem(`starvolt_linky_${activeId}`);
      }
    }catch{}
    setLinkyRequestId(null);setLinkyStatus(null);setLinkyUserUrl(null);setLinkyError(null);
  },[activeId]);

  // ── Retour de l'inscription : déplie la tuile conso + centre l'écran sur la zone ENEDIS ──
  React.useEffect(()=>{
    if(!activeId) return;
    try{
      if(localStorage.getItem('starvolt_focus_enedis')==='1'){
        localStorage.removeItem('starvolt_focus_enedis');
        setConsoOpen(true);
        setAutoLinkyArmed(true); // lance la collecte au retour de l'inscription si aucune n'est déjà en cours
        // laisser le rendu de la zone dépliée se faire avant de scroller
        const t=setTimeout(()=>{ enedisRef.current?.scrollIntoView({behavior:'smooth',block:'center'}); },380);
        return ()=>clearTimeout(t);
      }
    }catch{}
  },[activeId]);

  // ── Ouvre automatiquement la fenêtre de consentement dès que le lien est prêt,
  //    et la ferme dès que le consentement est signé (statut ordering/done/error).
  //    On n'ouvre QUE si le statut 'pending' est confirmé par un poll live (linkyLive) :
  //    si le consentement est déjà donné, le poll renvoie 'ordering' → pas de fenêtre. ──
  React.useEffect(()=>{
    if(linkyLive&&linkyStatus==='pending'&&linkyUserUrl){
      if(consentShownRef.current!==linkyRequestId){
        consentShownRef.current=linkyRequestId;
        setConsentModal('invite');
      }
    } else if(linkyStatus==='ordering'||linkyStatus==='done'||linkyStatus==='error'){
      setConsentModal(null);
    }
  },[linkyLive,linkyStatus,linkyUserUrl,linkyRequestId]);

  // ── Onboarding : juste après la signature du consentement (statut ordering/done),
  //    bascule vers le questionnaire typeform. Une seule fois (flag consommé). ──
  const onbFiredRef=useRef(false);
  React.useEffect(()=>{
    if(!activeId||onbFiredRef.current||!onOnboardingQuestions) return;
    let armed=false;
    try{ armed=localStorage.getItem('starvolt_onboarding')==='1'; }catch{}
    if(!armed) return;
    if(linkyStatus==='ordering'||linkyStatus==='done'){
      onbFiredRef.current=true;
      try{ localStorage.removeItem('starvolt_onboarding'); }catch{}
      onOnboardingQuestions(activeId);
    }
  },[linkyStatus,activeId]);

  // ── Poll Edge Function tant qu'une demande est en cours ──
  React.useEffect(()=>{
    if(!linkyRequestId||linkyStatus==='done'||linkyStatus==='error') return;
    const siteId=activeId; // capture dans la closure
    clearInterval(linkyPollRef.current);
    const tick=async()=>{
      try{
        const { data:{session} } = await sb.auth.getSession();
        if(!session) return;
        const res=await fetch(`${EDGE_URL}?request_id=${linkyRequestId}`,
          {headers:{Authorization:`Bearer ${session.access_token}`,'apikey':ANON_KEY}});
        const d=await res.json();
        const ns=d.status||'pending';
        const nu=d.userUrl||null;
        setLinkyStatus(ns);
        if(nu) setLinkyUserUrl(nu);
        setLinkyLive(true); // réponse live de l'edge : le statut est désormais fiable (consentement déjà signé → 'ordering')
        if(ns==='done'||ns==='error'){
          clearInterval(linkyPollRef.current);
          if(siteId) localStorage.removeItem(`starvolt_linky_${siteId}`);
          if(ns==='done') setTimeout(()=>load(),800);
          if(ns==='error'){
            // Étape d'échec déduite du statut précédent : pending→consentement, ordering→données
            setLinkyErrorStep(linkyStatus==='pending'?1:2);
            setLinkyError(d.error_message||'Erreur inconnue');
          }
        } else if(siteId){
          localStorage.setItem(`starvolt_linky_${siteId}`,JSON.stringify({requestId:linkyRequestId,status:ns,userUrl:nu||linkyUserUrl}));
        }
      }catch(e){console.warn('linky poll error',e);}
    };
    tick(); // vérification immédiate (ne pas attendre 8 s) pour trancher tout de suite si le consentement est déjà donné
    linkyPollRef.current=setInterval(tick,8000);
    return ()=>clearInterval(linkyPollRef.current);
  },[linkyRequestId,linkyStatus]);

  const handleLinkyImport=async(site)=>{
    if(!site) return;

    const pdl         = (site.pdl||'').trim();
    const firstName   = (site.titulaire_prenom || userProfile?.prenom || '').trim();
    const lastName    = (site.titulaire_nom    || userProfile?.nom    || '').trim();
    const rue         = (site.adresse_ligne1   || userProfile?.adresse_ligne1 || '').trim();
    const cp          = (site.code_postal      || userProfile?.code_postal    || '').trim();
    const ville       = (site.ville            || userProfile?.ville          || '').trim();
    const hasAddress  = !!(rue && cp && ville);
    const hasPdl      = pdl.length === 14 && /^\d{14}$/.test(pdl);

    // ── Validation ──────────────────────────────────────────────────────────
    const isEntreprise = (site.account_type||'particulier')==='entreprise';
    if(isEntreprise){
      if(!(site.raison_sociale||'').trim()){
        setLinkyStatus('error'); setLinkyErrorStep(0);
        setLinkyError('Renseignez la raison sociale de l\'entreprise (nom recherché chez ENEDIS).');
        return;
      }
      if(!(site.signer_prenom||'').trim() || !(site.signer_nom||'').trim() || !(site.signer_email||'').trim()){
        setLinkyStatus('error'); setLinkyErrorStep(0);
        setLinkyError('Renseignez le signataire du consentement (prénom, nom et email du gérant).');
        return;
      }
    } else if(!firstName || !lastName){
      setLinkyStatus('error'); setLinkyErrorStep(0);
      setLinkyError('Renseignez le prénom et le nom du titulaire du contrat ENEDIS.');
      return;
    }
    if(!hasPdl && !hasAddress){
      setLinkyStatus('error'); setLinkyErrorStep(0);
      setLinkyError('Renseignez soit le PDL (14 chiffres), soit l\'adresse complète (rue, CP, ville).');
      return;
    }

    // ── Appel Switchgrid ─────────────────────────────────────────────────────
    setLinkyStatus('loading'); setLinkyError(null); setLinkyErrorStep(null); setLinkyUserUrl(null); setLinkyRequestId(null);
    try{
      const { data:{session} } = await sb.auth.getSession();
      if(!session) throw new Error('Non connecté');
      const res=await fetch(EDGE_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`,'apikey':ANON_KEY},
        body:JSON.stringify({
          site_id: site.id,
          pdl,
          firstName, lastName,
          address:   rue,
          codePostal: cp,
          commune:   ville,
          account_type:   site.account_type || 'particulier',
          raison_sociale: site.raison_sociale || null,
          signer_prenom:  site.signer_prenom || null,
          signer_nom:     site.signer_nom || null,
          signer_email:   site.signer_email || null,
        }),
      });
      const d=await res.json();

      // Plusieurs compteurs trouvés → afficher la liste
      if(d.error==='MULTIPLE_CONTRACTS'){
        setLinkyStatus('error'); setLinkyErrorStep(0);
        const list=d.results.map(r=>`• ${r.prm} — ${r.nom} (${r.adresse})`).join('\n');
        setLinkyError(`${d.message}\n${list}`);
        return;
      }

      // Quota ENEDIS atteint / tentative récente → message clair, pas de relance
      if(d.error==='COOLDOWN'){
        setLinkyStatus('error'); setLinkyErrorStep(2);
        setLinkyError(d.message||'Trop de demandes pour ce compteur. Réessayez plus tard.');
        return;
      }

      if(d.error){ setLinkyErrorStep(0); throw new Error(d.error); }

      // PDL auto-découvert par adresse → mettre à jour le site
      if(d.pdl_found){
        await updateSite({pdl:d.pdl_found});
      }

      setLinkyRequestId(d.request_id);
      setLinkyStatus(d.status||'pending');
      if(d.userUrl) setLinkyUserUrl(d.userUrl);
      setLinkyLive(true); // réponse live du POST : statut fiable (consentement déjà donné → 'ordering', pas de fenêtre)
      // Persister pour survie au rechargement de page
      localStorage.setItem(`starvolt_linky_${site.id}`,JSON.stringify({
        requestId:d.request_id, status:d.status||'pending', userUrl:d.userUrl||null,
      }));
    }catch(e){
      setLinkyStatus('error');
      setLinkyErrorStep(prev=>prev==null?0:prev);
      setLinkyError(e.message);
      if(site?.id) localStorage.removeItem(`starvolt_linky_${site.id}`);
    }
  };

  const persistActiveSite=(id)=>{
    setActiveId(id);
    if(id){ localStorage.setItem('starvolt_active_site_id',id); sb.from('profiles').update({active_site_id:id}).eq('id',user.id); }
    else{ localStorage.removeItem('starvolt_active_site_id'); sb.from('profiles').update({active_site_id:null}).eq('id',user.id); }
    try{ window.dispatchEvent(new Event('starvolt:sitechange')); }catch(_){}
  };

  const load=async()=>{
    const[{data:s},{data:t},{data:pp}]=await Promise.all([
      sb.from('sites').select('*').eq('user_id',user.id).order('created_at'),
      sb.from('tarifs_electricite').select('*').order('nom'),
      sb.from('profils_production').select('id,nom,latitude,longitude').order('nom'),
    ]);
    setSites(s||[]); setTariffs(t||[]); setProdProfils(pp||[]);
    const stored=userProfile?.active_site_id||localStorage.getItem('starvolt_active_site_id');
    const valid=stored&&s?.find(x=>x.id===stored)?stored:(s?.length?s[0].id:null);
    persistActiveSite(valid);
  };
  useEffect(()=>{load();},[]);

  const site=sites?.find(s=>s.id===activeId)||null;

  // Site déjà importé avec la totalité des données heure par heure (courbe de
  // charge complète : 8784 valeurs ET source non journalière). Dans ce cas, on
  // masque le bouton de collecte et on affiche les 4 étapes au vert.
  const siteHasFullHourly = !!site && site.conso_source!=='daily' && site.conso_profil?.length===8784;
  // Statut effectif pour le suivi par étapes : si une session d'import est en
  // cours on l'utilise ; sinon, un site déjà complet est affiché comme « done ».
  const effectiveLinkyStatus = linkyStatus || (siteHasFullHourly ? 'done' : null);

  // ── Repli inscription : au retour de la création de compte, si aucune collecte
  //    n'a démarré (le lancement post-signup est silencieux et peut échouer), on la
  //    lance ici via handleLinkyImport — qui, lui, affiche les erreurs éventuelles. ──
  React.useEffect(()=>{
    if(!autoLinkyArmed || !site) return;
    setAutoLinkyArmed(false);
    let already=false;
    try{ already=!!localStorage.getItem(`starvolt_linky_${activeId}`); }catch{}
    if(already || linkyStatus || siteHasFullHourly) return; // déjà lancée ou déjà complète
    handleLinkyImport(site);
  },[autoLinkyArmed,site,activeId,linkyStatus,siteHasFullHourly]);

  // Sync champs locaux quand on change de site
  // Règle : si solar au panier → valeurs de la page solaire (panier) ; sinon → valeurs DB ou défauts
  useEffect(()=>{
    // Source unique partagée avec le Panier : resolveCartEquipment
    const eq=resolveCartEquipment(site);
    setPvKwc(eq.pvKwc); setBatKwh(eq.batKwh); setThermKwh(eq.thermKwh);
    setProdProfilId(site?.profil_production_id||'');
    setProdProfilData(null); setBalance(null);
  },[activeId,cartVersion]);

  // Sync bidirectionnelle : écriture vers starvolt_solar_defaults partagé avec SolarSim
  useEffect(()=>{
    localStorage.setItem('starvolt_solar_defaults',JSON.stringify({pvKwc,batKwh,thermKwh}));
  },[pvKwc,batKwh,thermKwh]);

  // Auto-sélection du profil de production le plus proche par GPS
  useEffect(()=>{
    if(!site||prodProfils.length===0)return;
    if(site.profil_production_id){setProdProfilId(site.profil_production_id);return;}
    const profilsGeo=prodProfils.filter(p=>p.latitude&&p.longitude);
    if(profilsGeo.length===0){setProdProfilId(prodProfils[0].id);return;}
    const q=`${site.adresse_ligne1||''} ${site.code_postal||''} ${site.ville||''}`.trim();
    const saveProfil=(id)=>{
      setProdProfilId(id);
      setSites(prev=>prev.map(s=>s.id===activeId?{...s,profil_production_id:id}:s));
      sb.from('sites').update({profil_production_id:id}).eq('id',activeId);
    };
    if(!q){saveProfil(profilsGeo[0].id);return;}
    fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=1`)
      .then(r=>r.json()).then(geo=>{
        const feat=geo.features?.[0];
        if(!feat){saveProfil(profilsGeo[0].id);return;}
        const[lon,lat]=feat.geometry.coordinates;
        let best=profilsGeo[0],bestD=haversine(lat,lon,best.latitude,best.longitude);
        profilsGeo.forEach(p=>{const d=haversine(lat,lon,p.latitude,p.longitude);if(d<bestD){bestD=d;best=p;}});
        saveProfil(best.id);
      }).catch(()=>saveProfil(profilsGeo[0].id));
  },[activeId,prodProfils.length]);

  // Charger les données du profil de production sélectionné
  useEffect(()=>{
    if(!prodProfilId){setProdProfilData(null);setBalance(null);return;}
    sb.from('profils_production').select('profil').eq('id',prodProfilId).single()
      .then(({data})=>setProdProfilData(data?.profil||null));
  },[prodProfilId]);

  // Reset zoom seulement quand le jeu de données change (pas sur modif des paramètres)
  useEffect(()=>{
    setChartLevel('month'); setChartMonth(null); setChartDay(null);
  },[site?.conso_profil,prodProfilData]);

  // Calculer le bilan énergétique dès que les données sont prêtes — moteur partagé buildSiteBalance
  useEffect(()=>{
    setBalance(buildSiteBalance({site,prodProfil:prodProfilData,tariffs,spotMap,globalVars,pvKwc,batKwh,thermKwh}));
  },[site?.conso_profil,prodProfilData,pvKwc,batKwh,thermKwh,globalVars,spotMap,tariffs,site?.tarif_id,site?.heure_debut_hc1,site?.heure_fin_hc1,site?.heure_debut_hc2,site?.heure_fin_hc2]);

  // ── "Ton bilan en clair" : un SEUL appel IA quand la conso existe et que le bilan n'est pas encore écrit en dur ──
  useEffect(()=>{
    if(!site||!site.id) return;
    if(!(site.conso_annuelle_kwh>0)||!site.conso_profil) return;
    if(site.bilan_ia) return;                     // déjà écrit en dur → jamais rappelé
    if(!tariffs?.length) return;                  // besoin des tarifs pour les faits
    if(bilanGenRef.current[site.id]) return;      // pas deux fois dans la même session
    const facts=buildBilanFacts({site,tariffs,globalVars,prodProfil:prodProfilData});
    if(!facts) return;
    bilanGenRef.current[site.id]=true;
    const sid=site.id;
    setBilanGenerating(true);
    (async()=>{
      try{
        const{data,error}=await sb.functions.invoke('bilan',{body:{facts}});
        if(error||!data?.text){ console.warn('bilan error',error||data); return; }
        await sb.from('sites').update({bilan_ia:data.text,bilan_ia_at:new Date().toISOString()}).eq('id',sid);
        setSites(prev=>prev?prev.map(s=>s.id===sid?{...s,bilan_ia:data.text}:s):prev);
      }catch(e){ console.warn('bilan exception',e); }
      finally{ setBilanGenerating(false); }
    })();
  },[site?.id,site?.conso_annuelle_kwh,site?.bilan_ia,tariffs,globalVars,prodProfilData]);

  const updateSite=async(updates)=>{ await sb.from('sites').update(updates).eq('id',activeId); await load(); };

  const handleAddSite=async(data)=>{
    const{data:ns}=await sb.from('sites').insert({user_id:user.id,...data}).select().single();
    setShowAdd(false); await load(); if(ns)persistActiveSite(ns.id);
  };

  const handleDeleteConfirmed=async()=>{
    await sb.from('sites').delete().eq('id',activeId);
    persistActiveSite(null); setEditMode(false); setShowDeleteConfirm(false); await load();
  };

  // Charger variables globales + listener mobile
  useEffect(()=>{
    sb.from('parametres_nationaux').select('*').eq('id',1).maybeSingle()
      .then(({data})=>{
        if(!data) return;
        // opti_* : le cache localStorage est la source de vérité (cf. mergeGlobalVars)
        const merged=mergeGlobalVars(data);
        setGlobalVars(merged);
        try{localStorage.setItem('starvolt_global_vars_cache',JSON.stringify(merged));}catch{}
      });
    sb.from('prix_materiaux').select('*').eq('id',1).maybeSingle()
      .then(({data})=>setPrixMat(data));
    const handler=()=>setIsMobile(window.innerWidth<640);
    window.addEventListener('resize',handler);
    return()=>window.removeEventListener('resize',handler);
  },[]);

  // Reset PV/stockage à zéro quand le panier est vidé (depuis PanierScreen ou changement de compte)
  useEffect(()=>{
    const onPanierCleared=()=>{
      setPvKwc('0'); setBatKwh('0'); setThermKwh('0');
      setConsoOpen(false); setProdOpen(false); setConsoChartOpen(true);
    };
    window.addEventListener('starvolt_panier_cleared',onPanierCleared);
    return()=>window.removeEventListener('starvolt_panier_cleared',onPanierCleared);
  },[]);

  // Tarif effectif (panier si choisi, sinon site) — utilisé pour hourlyPrices
  const effectiveTariff = useMemo(()=>{
    if(!tariffs.length) return null;
    const optiChosen=!!localStorage.getItem('starvolt_optimisation_chosen');
    const optiId=optiChosen?localStorage.getItem('starvolt_optimisation_tariff_id'):null;
    const tid=optiId||site?.tarif_id;
    return tid?tariffs.find(t=>t.id===tid)||null:null;
  },[tariffs,site?.tarif_id]);

  const isDynamicTariff = !!(effectiveTariff?.tarif_dynamique);

  // Prix horaire (€/kWh) pour l'axe droit du graphique
  const hourlyPrices = useMemo(()=>{
    if(!effectiveTariff) return null;
    const hcWin=[
      {s:parseHcHour(site?.hc_debut1??site?.heure_debut_hc1??globalVars?.hc_debut1), e:parseHcHour(site?.hc_fin1??site?.heure_fin_hc1??globalVars?.hc_fin1)},
      {s:parseHcHour(site?.hc_debut2??site?.heure_debut_hc2??globalVars?.hc_debut2), e:parseHcHour(site?.hc_fin2??site?.heure_fin_hc2??globalVars?.hc_fin2)},
    ].filter(w=>w.s!==null&&w.e!==null);
    const arr=new Float32Array(8784);
    if(effectiveTariff.tarif_dynamique&&spotMap){
      const marge=(effectiveTariff.marge_fournisseur_ceur_kwh||0)/100;
      const accise=(globalVars?.accise||0)/100;
      const tva=(globalVars?.tva??20)/100;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
        const idx=profIdx(m,d,h);
        const spot=spotMap[`${m}_${d}_${h}`]||0;
        arr[idx]=(spot+getTurpeRate(m,h,globalVars,hcWin)+accise+marge)*(1+tva);
      }
    } else if(effectiveTariff.type_tarif==='multi'&&effectiveTariff.periodes?.length>0){
      const periodes=effectiveTariff.periodes;
      const abo=effectiveTariff.abo_annuel||0;
      const kwhGrid=balance
        ?balance.monthly.reduce((s,m)=>s+m.grid_buy,0)
        :(site?.conso_annuelle_kwh||null);
      const aboKwh=abo>0&&kwhGrid>0?abo/kwhGrid:0;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++)
        arr[profIdx(m,d,h)]=getPrixMulti(m,d,h,periodes)+aboKwh;
    } else {
      const ph=parseFloat(effectiveTariff.prix_hp)||0;
      const pc=effectiveTariff.prix_hc!=null?parseFloat(effectiveTariff.prix_hc)||0:ph;
      // Abonnement amorti sur la conso annuelle achetée au réseau (prix frontal réel)
      const abo=effectiveTariff.abo_annuel||0;
      const kwhGrid=balance
        ?balance.monthly.reduce((s,m)=>s+m.grid_buy,0)
        :(site?.conso_annuelle_kwh||null);
      const aboKwh=abo>0&&kwhGrid>0?abo/kwhGrid:0;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
        const idx=profIdx(m,d,h);
        arr[idx]=(hcWin.length>0&&isHcHour(h,hcWin)?pc:ph)+aboKwh;
      }
    }
    // Si ACC au panier : remplacer le prix heures prod non nulle par le prix ACC TTC
    // Formule : (prix_vente_ACC + TURPE_4_taux(m,h)) × (1 + TVA) — sans accise
    // TURPE variable selon saison (été/hiver) et HC/HP — mois début/fin été configurables
    if(localStorage.getItem('starvolt_acc_chosen')==='true'){
      const _accPHT=parseFloat(localStorage.getItem('starvolt_acc_price_ht')||'0.09');
      const _tva=(globalVars?.tva??20)/100;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
        const idx=profIdx(m,d,h);
        if(prodProfilData?!(prodProfilData[idx]>0):(h<9||h>=18)) continue;
        const accTTC=(_accPHT+getTurpeRate(m,h,globalVars,hcWin))*(1+_tva);
        if(accTTC<arr[idx]) arr[idx]=accTTC;
      }
    }
    return arr;
  },[effectiveTariff,site?.heure_debut_hc1,site?.heure_fin_hc1,site?.heure_debut_hc2,site?.heure_fin_hc2,globalVars,spotMap,prodProfilData,balance,site?.conso_annuelle_kwh]);

  // Charger les données spot si tarif dynamique (avec ou sans PV)
  useEffect(()=>{
    const optiChosen=!!localStorage.getItem('starvolt_optimisation_chosen');
    const optiTariffId=optiChosen?localStorage.getItem('starvolt_optimisation_tariff_id'):null;
    const effectiveTariffId=optiTariffId||site?.tarif_id;
    const curT=effectiveTariffId?tariffs.find(t=>t.id===effectiveTariffId):null;
    if(curT?.tarif_dynamique){
      sb.rpc('get_spot_json').then(({data})=>setSpotMap(buildSpotMap(data||[])));
    } else {
      setSpotMap(null);
    }
  },[site?.tarif_id,tariffs]);

  if(sites===null)return(<><div className="screen fade-in"><div style={{textAlign:'center',padding:40,color:'rgba(255,255,255,.5)'}}>Chargement…</div></div><StickyFooter onBack={onBack}/></>);
  if(showFlexForm&&site){
    return <ThermaleForm
      siteId={activeId}
      initial={(site.flex_chauffage||site.flex_type_logement)?{chauffage:site.flex_chauffage,ecs:site.flex_ecs,surface:site.flex_surface,type_logement:site.flex_type_logement,statut:site.flex_statut}:null}
      onBack={()=>setShowFlexForm(false)}
      onDone={(kw)=>{setThermKwh(String(kw));setShowFlexForm(false);load();}}
    />;
  }

  const firstDefault=sites.length===0?{adresse_ligne1:userProfile?.adresse_ligne1||'',code_postal:userProfile?.code_postal||'',ville:userProfile?.ville||'',pdl:userProfile?.pdl||''}:{};
  const showActions=!showAdd&&!editMode;

  return(
    <>
      <div className="screen screen-wide fade-in">
        {/* Titre */}
        <div style={{marginBottom:10,marginTop:4}}>
          <div style={{fontSize:9,letterSpacing:'.6px',color:'rgba(125,217,64,.8)',fontWeight:700,textTransform:'uppercase'}}>Énergie</div>
          <div style={{fontSize:18,fontWeight:900,color:'white',lineHeight:1.1}}>Mon <span className="accent">site</span></div>
        </div>

        {showAdd&&<SiteFormCard initial={firstDefault} onSave={handleAddSite} onCancel={()=>setShowAdd(false)}/>}

        {sites.length===0&&!showAdd&&(
          <div className="card" style={{textAlign:'center',padding:'24px 20px'}}>
            <div style={{fontSize:32,marginBottom:10}}>🏠</div>
            <div style={{color:'white',fontWeight:700,marginBottom:5}}>Aucun site configuré</div>
            <div style={{color:'rgba(255,255,255,.55)',fontSize:13,marginBottom:16}}>Ajoutez votre site pour connecter votre compteur Enedis.</div>
            <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
              <button className="btn btn-primary" style={{fontSize:13}} onClick={()=>{setShowAdd(true);setEditMode(false);}}>🏠 Créer mon site</button>
            </div>
          </div>
        )}

        {site&&!showAdd&&(
          <>
            {/* Info site — compact, sélecteur intégré si plusieurs sites */}
            {!editMode?(
              <div className="card" style={{padding:'8px 14px',marginBottom:8}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  {sites.length>1?(
                    <select className="inp inp-sel" style={{fontSize:13,padding:'6px 30px 6px 10px',maxWidth:200,flexShrink:0}} value={activeId||''} onChange={e=>{
   clearPanierLS();
   persistActiveSite(e.target.value);
   const _reset={id:1,opti_solaire:true,opti_tarif:true,opti_flex:false,opti_acc:false};
   sb.from('parametres_nationaux').upsert(_reset,{onConflict:'id'});
   setGlobalVars(v=>({...v,..._reset}));
   setPvKwc('0'); setBatKwh('0'); setThermKwh('0');
   setConsoOpen(false); setProdOpen(false); setConsoChartOpen(true);
   setEditMode(false);setShowDeleteConfirm(false);
 }}>
                      {sites.map(s=><option key={s.id} value={s.id}>{s.nom}</option>)}
                    </select>
                  ):(
                    <span style={{fontWeight:800,fontSize:14,color:'white',flexShrink:0}}>{site.nom}</span>
                  )}
                  <div style={{display:'flex',gap:5,marginLeft:'auto',flexShrink:0,alignItems:'center'}}>
                    {!showDeleteConfirm&&<button title="Ajouter un site" style={{background:'rgba(125,217,64,.15)',border:'1px solid rgba(125,217,64,.3)',color:'#7dd940',cursor:'pointer',fontSize:15,fontWeight:700,padding:'3px 10px',borderRadius:6,lineHeight:1}} onClick={()=>{setShowAdd(true);setEditMode(false);}}>+</button>}
                    {!showDeleteConfirm
                      ? <button title="Supprimer ce site" style={{background:'rgba(255,80,80,.1)',border:'1px solid rgba(255,80,80,.25)',color:'#ff6b6b',cursor:'pointer',fontSize:15,fontWeight:700,padding:'3px 10px',borderRadius:6,lineHeight:1}} onClick={()=>setShowDeleteConfirm(true)}>−</button>
                      : <><span style={{fontSize:11,color:'#ff6b6b',fontWeight:700,whiteSpace:'nowrap'}}>Supprimer ?</span>
                          <button style={{background:'rgba(255,80,80,.25)',border:'1px solid rgba(255,80,80,.5)',color:'#ff6b6b',cursor:'pointer',fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:6}} onClick={handleDeleteConfirmed}>Oui</button>
                          <button style={{background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.15)',color:'rgba(255,255,255,.6)',cursor:'pointer',fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:6}} onClick={()=>setShowDeleteConfirm(false)}>Non</button>
                        </>
                    }
                    {!showDeleteConfirm&&<button title="Modifier ce site" style={{background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.15)',color:'rgba(255,255,255,.6)',cursor:'pointer',fontSize:14,padding:'3px 9px',borderRadius:6,lineHeight:1}} onClick={()=>setEditMode(true)}>✏️</button>}
                  </div>
                </div>
              </div>
            ):(
              <SiteFormCard initial={site} onSave={async d=>{await updateSite(d);setEditMode(false);}} onCancel={()=>setEditMode(false)}/>
            )}

            {/* ── Tuile Consommation annuelle (graphique + stats) ── */}
            {site.conso_annuelle_kwh>0&&(
              <div className="card" style={{padding:0,marginBottom:8,overflow:'hidden'}}>
                <div
                  style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px 8px',borderBottom:consoChartOpen?'1px solid rgba(255,255,255,.07)':'none',cursor:'pointer',userSelect:'none'}}
                  onClick={()=>setConsoChartOpen(v=>!v)}
                >
                  <div style={{fontWeight:800,fontSize:13,color:'white',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    📊 Ma facture heure par heure
                    {!consoChartOpen&&(
                      <span style={{fontSize:11,fontWeight:600,color:'rgba(255,255,255,.45)',marginLeft:4}}>
                        {Math.round(site.conso_annuelle_kwh).toLocaleString('fr-FR')} kWh/an
                        {(()=>{const curT=tariffs.find(t=>t.id===site.tarif_id);if(!curT||curT.tarif_dynamique)return null;const f=Math.round((curT.abo_annuel||0)+site.conso_annuelle_kwh*(curT.prix_hp||0));return f>0?<span style={{color:'rgba(240,160,80,.7)',marginLeft:4}}>· {f.toLocaleString('fr-FR')} €/an</span>:null;})()}
                      </span>
                    )}
                  </div>
                  <span style={{color:'rgba(255,255,255,.4)',fontSize:16,lineHeight:1,transition:'transform .2s',transform:consoChartOpen?'rotate(0deg)':'rotate(-90deg)',display:'inline-block'}}>▾</span>
                </div>
                {consoChartOpen&&<div style={{padding:'10px 14px 12px'}}>
                  {/* ── AVANT / APRÈS — tableau responsive ── */}
                  {(()=>{
                    const baseTariff=tariffs.find(t=>t.id===site.tarif_id);
                    const consoTot=Math.round(site.conso_annuelle_kwh);
                    const fmtE=v=>Math.round(v/1000)+' MWh/an';
                    // Impact — moteur partagé (identique au Panier)
                    const _imp=deriveSiteImpact({balance,site,prodProfil:prodProfilData,tariffs,spotMap,globalVars,batKwh,thermKwh});
                    const billAvant=_imp.billAvant;
                    const prixAvant=(billAvant&&consoTot)?billAvant/consoTot:null;
                    const flexRev=_imp.flexRev, accRev=_imp.accRev;
                    const hasBalance=_imp.hasBalance;
                    const consoApres=_imp.consoApres;
                    const billApresNet=_imp.billApresNet;
                    const prixApres=(billApresNet!=null&&consoApres>0)?billApresNet/consoApres:null;
                    const totalSaving=_imp.totalSaving;
                    const totalReductionPct=_imp.reductionPct;
                    const hasSaving=totalSaving>0;
                    const hasModifs=hasBalance&&(
                      !!localStorage.getItem('starvolt_solar_chosen')||
                      !!localStorage.getItem('starvolt_box_chosen')||
                      !!localStorage.getItem('starvolt_optimisation_chosen')||
                      localStorage.getItem('starvolt_acc_chosen')==='true'||
                      parseFloat(pvKwc)>0||parseFloat(batKwh)>0||parseFloat(thermKwh)>0
                    );
                    const dash=<span style={{color:'rgba(255,255,255,.2)'}}>—</span>;
                    const aCol=hasModifs?'rgba(125,217,64,.7)':'rgba(255,255,255,.2)';
                    const tbl={width:'100%',borderCollapse:'collapse',marginBottom:12,fontSize:12};
                    const tblD={...tbl,width:'auto',maxWidth:560,fontSize:22};
                    const th={padding:'4px 8px',fontWeight:800,fontSize:9,letterSpacing:1,textTransform:'uppercase',textAlign:'right',border:'none'};
                    const td={padding:'6px 8px',border:'none',textAlign:'right'};
                    const sep={borderTop:'1px solid rgba(255,255,255,.07)'};
                    const U=({c,em=0.5})=><span style={{fontSize:em+'em',fontWeight:400,marginLeft:3,verticalAlign:'middle',opacity:.75}}>{c}</span>;
                    if(isMobile){
                      // Mobile : lignes = métriques, colonnes = Avant | Après
                      const tblM={...tbl,fontSize:18};
                      return(
                        <table style={tblM}>
                          <thead>
                            <tr style={{borderBottom:'1px solid rgba(255,255,255,.1)'}}>
                              <th style={{...th,textAlign:'left',width:'40%',color:'transparent'}}> </th>
                              <th style={{...th,color:'rgba(255,255,255,.4)',background:'rgba(255,255,255,.05)',padding:'5px 8px'}}>AVANT</th>
                              <th style={{...th,color:aCol,background:hasModifs?'rgba(125,217,64,.07)':'rgba(255,255,255,.02)',padding:'5px 8px'}}>APRÈS</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr style={sep}>
                              <td style={{...td,textAlign:'left',color:'rgba(255,255,255,.5)',fontSize:11}}>Élec achetée</td>
                              <td style={{...td,color:'white',fontWeight:700}}>{Math.round(consoTot/1000)}<U c="MWh/an" em={0.4}/></td>
                              <td style={{...td,color:hasModifs?'white':'rgba(255,255,255,.18)',fontWeight:700}}>{hasModifs?<>{Math.round(consoApres/1000)}<U c="MWh/an" em={0.4}/></>:dash}</td>
                            </tr>
                            <tr style={sep}>
                              <td style={{...td,textAlign:'left',color:'rgba(255,255,255,.5)',fontSize:11}}>Facture TTC</td>
                              <td style={{...td,color:'#f0a050',fontWeight:700}}>{billAvant!=null?<>{billAvant.toLocaleString('fr-FR')}<U c="€/an" em={0.4}/></>:dash}</td>
                              <td style={{...td,color:hasModifs?'#7dd940':'rgba(255,255,255,.18)',fontWeight:700}}>{hasModifs?<>{billApresNet.toLocaleString('fr-FR')}<U c="€/an" em={0.4}/></>:dash}</td>
                            </tr>
                            <tr style={sep}>
                              <td style={{...td,textAlign:'left',color:'rgba(255,255,255,.5)',fontSize:11}}>Prix / kWh</td>
                              <td style={{...td,color:'rgba(255,255,255,.5)',fontWeight:600}}>{prixAvant!=null?<>{(prixAvant*100).toFixed(1)}<U c="c€" em={0.4}/></>:dash}</td>
                              <td style={{...td,color:hasModifs?'rgba(125,217,64,.75)':'rgba(255,255,255,.18)',fontWeight:600}}>{hasModifs&&prixApres!=null?<>{(prixApres*100).toFixed(1)}<U c="c€" em={0.4}/></>:dash}</td>
                            </tr>
                            {hasSaving&&<tr><td></td><td></td><td style={{...td,borderTop:'1px solid rgba(125,217,64,.2)',paddingTop:6,whiteSpace:'nowrap'}}>
                              <span style={{fontSize:20,fontWeight:900,color:'#7dd940'}}>-{Math.round(totalSaving).toLocaleString('fr-FR')}<U c="€/an" em={0.4}/></span>
                              {totalReductionPct>0&&<span style={{fontSize:15,color:'rgba(125,217,64,.6)',marginLeft:3}}>({totalReductionPct}%)</span>}
                              {flexRev>0&&<span style={{fontSize:11,color:'rgba(125,217,64,.5)',marginLeft:5}}>dont {flexRev}€ Flex</span>}{accRev>0&&<span style={{fontSize:11,color:'rgba(125,217,64,.5)',marginLeft:5}}>dont {accRev}€ ACC</span>}
                            </td></tr>}
                            {!hasModifs&&<tr><td colSpan={3} style={{...td,textAlign:'center',color:'rgba(255,255,255,.2)',fontSize:10,paddingTop:5,paddingBottom:2}}>Ajoutez des équipements dans votre panier pour voir l'impact</td></tr>}
                          </tbody>
                        </table>
                      );
                    }
                    // Desktop : colonnes = métriques, lignes = Avant | Après
                    const thD={...th,fontSize:16,padding:'6px 14px'};
                    const tdD={...td,padding:'10px 14px'};
                    return(
                      <table style={tblD}>
                        <thead>
                          <tr style={{borderBottom:'1px solid rgba(255,255,255,.1)'}}>
                            <th style={{...thD,textAlign:'left',width:'10%'}}></th>
                            <th style={{...thD,color:'rgba(255,255,255,.38)'}}>Élec achetée</th>
                            <th style={{...thD,color:'rgba(255,255,255,.38)'}}>Facture TTC</th>
                            <th style={{...thD,color:'rgba(255,255,255,.38)'}}>Prix / kWh</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr style={{...sep,background:'rgba(255,255,255,.04)'}}>
                            <td style={{...tdD,textAlign:'left',fontSize:14,fontWeight:800,letterSpacing:1,textTransform:'uppercase',color:'rgba(255,255,255,.38)'}}>Avant</td>
                            <td style={{...tdD,color:'white',fontWeight:700}}>{Math.round(consoTot/1000)}<U c="MWh/an"/></td>
                            <td style={{...tdD,color:'#f0a050',fontWeight:700}}>{billAvant!=null?<>{billAvant.toLocaleString('fr-FR')}<U c="€/an"/></>:dash}</td>
                            <td style={{...tdD,color:'rgba(255,255,255,.5)',fontWeight:600}}>{prixAvant!=null?<>{(prixAvant*100).toFixed(1)}<U c="c€/kWh"/></>:dash}</td>
                          </tr>
                          <tr style={{...sep,background:hasModifs?'rgba(125,217,64,.05)':'rgba(255,255,255,.02)'}}>
                            <td style={{...tdD,textAlign:'left',fontSize:14,fontWeight:800,letterSpacing:1,textTransform:'uppercase',color:aCol}}>Après</td>
                            <td style={{...tdD,color:hasModifs?'white':'rgba(255,255,255,.18)',fontWeight:700}}>{hasModifs?<>{Math.round(consoApres/1000)}<U c="MWh/an"/></>:dash}</td>
                            <td style={{...tdD,color:hasModifs?'#7dd940':'rgba(255,255,255,.18)',fontWeight:700}}>{hasModifs?<>{billApresNet.toLocaleString('fr-FR')}<U c="€/an"/></>:dash}</td>
                            <td style={{...tdD,color:hasModifs?'rgba(125,217,64,.75)':'rgba(255,255,255,.18)',fontWeight:600}}>{hasModifs&&prixApres!=null?<>{(prixApres*100).toFixed(1)}<U c="c€/kWh"/></>:dash}</td>
                          </tr>
                          {hasSaving&&<tr>
                            <td colSpan={2}></td>
                            <td style={{...tdD,borderTop:'1px solid rgba(125,217,64,.2)',paddingTop:6,whiteSpace:'nowrap'}}>
                              <span style={{fontSize:20,fontWeight:900,color:'#7dd940'}}>-{Math.round(totalSaving).toLocaleString('fr-FR')}<U c="€/an"/></span>
                              {totalReductionPct>0&&<span style={{fontSize:13,color:'rgba(125,217,64,.6)',marginLeft:4}}>({totalReductionPct}%)</span>}
                            </td>
                            <td style={{...tdD,borderTop:'1px solid rgba(125,217,64,.2)',paddingTop:6,whiteSpace:'nowrap'}}>
                              {flexRev>0&&<span style={{fontSize:13,color:'rgba(125,217,64,.5)'}}>dont {flexRev} € Flex</span>}{accRev>0&&<span style={{fontSize:13,color:'rgba(125,217,64,.5)',marginLeft:flexRev>0?8:0}}>dont {accRev} € ACC</span>}
                            </td>
                          </tr>}
                          {!hasModifs&&<tr><td colSpan={4} style={{...tdD,textAlign:'right',color:'rgba(255,255,255,.2)',fontSize:12,paddingTop:3,paddingBottom:1}}>Ajoutez des équipements dans votre panier pour voir l'impact</td></tr>}
                        </tbody>
                      </table>
                    );
                  })()}
                  {/* Graphique bilan 12 mois avec zoom */}
                  {balance?(
                    <EnergyBalanceChart balance={balance} level={chartLevel} selMonth={chartMonth} selDay={chartDay} setLevel={setChartLevel} setSelMonth={setChartMonth} setSelDay={setChartDay} hourlyPrices={hourlyPrices} isDynamic={isDynamicTariff}/>
                  ):(
                    <div style={{color:'rgba(255,255,255,.35)',fontSize:12,padding:'8px 0'}}>Sélectionnez un tarif dans « Ma conso » pour afficher le graphique.</div>
                  )}
                </div>}
              </div>
            )}

            {/* ── Tuile Ton bilan en clair (synthèse IA, écrite en dur) ── */}
            {site.conso_annuelle_kwh>0&&(site.bilan_ia||bilanGenerating)&&(
              <div className="card" style={{padding:'14px',marginBottom:8,position:'relative',overflow:'hidden'}}>
                <div style={{fontWeight:800,fontSize:13,color:'white',display:'flex',alignItems:'center',gap:6,marginBottom:site.bilan_ia?10:0}}>
                  ✨ Ton bilan en clair
                </div>
                {site.bilan_ia ? (
                  <>
                    <div style={{
                      fontSize:13.5,lineHeight:1.55,color:'rgba(255,255,255,.85)',whiteSpace:'pre-wrap',
                      ...(bilanOpen?{}:{display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',overflow:'hidden'})
                    }}>
                      {site.bilan_ia}
                    </div>
                    <button
                      onClick={()=>setBilanOpen(v=>!v)}
                      style={{marginTop:8,background:'none',border:'none',color:'rgba(240,160,80,.9)',fontSize:12.5,fontWeight:700,cursor:'pointer',padding:0}}
                    >
                      {bilanOpen?'Réduire ▲':'… Lire la suite ▾'}
                    </button>
                  </>
                ) : (
                  <div style={{display:'flex',alignItems:'center',gap:9,color:'rgba(255,255,255,.55)',fontSize:13,paddingTop:4}}>
                    <span style={{
                      width:15,height:15,border:'2px solid rgba(240,160,80,.3)',borderTopColor:'rgba(240,160,80,.9)',
                      borderRadius:'50%',display:'inline-block',animation:'spin 0.8s linear infinite'
                    }}/>
                    Analyse de ta consommation en cours…
                  </div>
                )}
              </div>
            )}

            {/* ── Tuile Ma conso ── */}
            <div className="card" style={{padding:0,marginBottom:8,overflow:'hidden'}}>
              <div
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px 8px',borderBottom: consoOpen ? '1px solid rgba(255,255,255,.07)' : 'none',cursor:'pointer',userSelect:'none'}}
                onClick={()=>setConsoOpen(v=>!v)}
              >
                <div style={{fontWeight:800,fontSize:13,color:'white',display:'flex',alignItems:'center',gap:6}}>
                  ⚡ Ma conso
                  {!consoOpen && site?.conso_annuelle_kwh > 0 && (
                    <span style={{fontSize:11,fontWeight:600,color:'rgba(255,255,255,.45)',marginLeft:4}}>
                      {Math.round(site.conso_annuelle_kwh).toLocaleString('fr-FR')} kWh/an
                      {(()=>{ const curT=tariffs.find(t=>t.id===site.tarif_id); if(!curT||curT.tarif_dynamique)return null; const f=Math.round((curT.abo_annuel||0)+site.conso_annuelle_kwh*(curT.prix_hp||0)); return f>0?<span style={{color:'rgba(240,160,80,.7)',marginLeft:4}}>· {f.toLocaleString('fr-FR')} €/an</span>:null; })()}
                    </span>
                  )}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}} onClick={e=>e.stopPropagation()}>
                  {(()=>{
                    const total=5;
                    const filled=[site.flex_chauffage,site.flex_ecs,site.flex_surface,site.flex_type_logement,site.flex_statut].filter(Boolean).length;
                    const pct=Math.round(filled/total*100);
                    const done=pct===100;
                    return (
                      <button style={{fontSize:11,padding:'5px 10px',borderRadius:8,flexShrink:0,cursor:'pointer',background:filled>0?'rgba(125,217,64,.12)':'rgba(255,255,255,.06)',border:filled>0?'1px solid rgba(125,217,64,.3)':'1px solid rgba(255,255,255,.15)',color:filled>0?'#7dd940':'rgba(255,255,255,.5)',fontWeight:700}} onClick={()=>setShowFlexForm(true)}>
                        🏠 Mon logement <span style={{fontWeight:600,opacity:.75}}>({pct}%)</span>
                      </button>
                    );
                  })()}
                  <span style={{color:'rgba(255,255,255,.4)',fontSize:16,lineHeight:1,transition:'transform .2s',transform:consoOpen?'rotate(0deg)':'rotate(-90deg)',display:'inline-block'}}>▾</span>
                </div>
              </div>
              {consoOpen && <div style={{padding:'10px 14px 12px'}}>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  <div>
                    <label style={{fontSize:10,color:'rgba(255,255,255,.45)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>TARIF D'ÉLECTRICITÉ</label>
                    <select className="inp inp-sel" style={{fontSize:13,padding:'8px 36px 8px 12px',maxWidth:320}} value={site.tarif_id||''} onChange={e=>updateSite({tarif_id:e.target.value||null})}>
                      <option value=''>— Sélectionner —</option>
                      {tariffs.map(t=><option key={t.id} value={t.id}>{t.nom}</option>)}
                    </select>
                  </div>
                  <div ref={enedisRef}>
                    <label style={{fontSize:10,color:'rgba(255,255,255,.45)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>PDL (numéro compteur Linky)</label>
                    <PDLInput value={site.pdl||''} onSave={v=>updateSite({pdl:v})}/>

                    {/* Type de compte ENEDIS — particulier ou entreprise.
                        Détermine le nom utilisé pour la recherche du compteur (titulaire vs raison sociale)
                        et le signataire du consentement (titulaire vs gérant). */}
                    <div style={{marginTop:8}}>
                      <label style={{fontSize:10,color:'rgba(255,255,255,.35)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>TYPE DE CONTRAT ENEDIS</label>
                      <div style={{display:'flex',gap:6}}>
