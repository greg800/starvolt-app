// ─── PanierScreen ─────────────────────────────
function PanierScreen({ user, onBack, onGoTo, onMonSite }) {
  const [loading,     setLoading]     = useState(true);
  const [currentBill, setCurrentBill] = useState(null);
  const [isDynamic,   setIsDynamic]   = useState(false);
  const [taux,        setTaux]        = useState(4);
  const [taux2,       setTaux2]       = useState(0);
  const [savings,     setSavings]     = useState({ optimisation:0, acc:0, box:0, solar:0 });
  const [validated,   setValidated]   = useState(false);
  const [solGridKwh,    setSolGridKwh]    = useState(null);
  const [solInjKwh,     setSolInjKwh]     = useState(null);
  const [solPrixBase,   setSolPrixBase]   = useState(null);
  const [solPrixRachat, setSolPrixRachat] = useState(0.04);
  const [items,       setItems]       = useState(() => ({
    optimisation: !!localStorage.getItem('starvolt_optimisation_chosen'),
    acc:          localStorage.getItem('starvolt_acc_chosen') === 'true',
    box:          !!localStorage.getItem('starvolt_box_chosen'),
    solar:        !!localStorage.getItem('starvolt_solar_chosen'),
  }));

  const boxChoice   = localStorage.getItem('starvolt_box_chosen');
  const solarChoice = localStorage.getItem('starvolt_solar_chosen');
  const investments = { optimisation:0, acc:0, box: boxChoice==='buy' ? 550 : 0, solar:13000 };
  const investLS = parseInt(localStorage.getItem('starvolt_investissement_total')||'0') || 0;

  useEffect(() => {
    const siteId = localStorage.getItem('starvolt_active_site_id');
    if (!siteId) { setLoading(false); return; }
    Promise.all([
      sb.from('sites').select('id,conso_profil,conso_annuelle_kwh,tarif_id,profil_production_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2').eq('id', siteId).maybeSingle(),
      sb.from('tarifs_electricite').select('*'),
      sb.rpc('get_spot_json'),
      sb.from('parametres_nationaux').select('*').eq('id',1).maybeSingle(),
    ]).then(async ([{ data:site }, { data:tariffs }, { data:spotRows }, { data:nat }]) => {
      if (!site?.conso_profil) { setLoading(false); return; }
      if (nat?.taux_inflation_electricite)   setTaux(Number(nat.taux_inflation_electricite));
      if (nat?.taux_inflation_electricite_2 != null) setTaux2(Number(nat.taux_inflation_electricite_2));

      const { kwh_hc, kwh_hp } = calcHcHp(site.conso_profil, site);
      const kwh_total = kwh_hc + kwh_hp;
      const curTariff = site.tarif_id ? (tariffs||[]).find(t=>t.id===site.tarif_id) : null;

      let bill = null; let isDyn = false;
      if (curTariff?.tarif_dynamique) {
        isDyn = true; setIsDynamic(true);
        if (spotRows && nat) {
          const r = calcDynamicCost(curTariff, site.conso_profil, buildSpotMap(spotRows), nat, site);
          bill = r?.total || null;
        }
      } else if (curTariff) {
        bill = calcTariffCost(curTariff, kwh_hc, kwh_hp)?.total || null;
      }
      if (!bill && kwh_total > 0) bill = Math.round(kwh_total * 0.18);
      bill = bill ? Math.round(bill) : null;
      // Charger le profil de production une fois (ACC + projection solaire)
      let _prodProfil = null;
      if (site.profil_production_id) {
        const { data: pp } = await sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single();
        _prodProfil = pp?.profil || null;
      }
      setCurrentBill(bill);

      if (bill) {
        let optSav = parseInt(localStorage.getItem('starvolt_optimisation_saving')||'0');
        if (!optSav && tariffs?.length) {
          const ranked = tariffs.map(t=>({t,result:calcTariffCost(t,kwh_hc,kwh_hp)})).filter(({result})=>result!==null).sort((a,b)=>a.result.total-b.result.total);
          const cur = site.tarif_id ? ranked.find(r=>r.t.id===site.tarif_id) : null;
          optSav = cur ? Math.max(0, Math.round(cur.result.total - ranked[0].result.total)) : 0;
        }
        let accSav = parseInt(localStorage.getItem('starvolt_acc_saving')||'0');
        if (!accSav && site.conso_profil) {
          let kwh918 = 0;
          for (let m=1;m<=12;m++) for (let d=1;d<=PROF_DAYS[m-1];d++) for (let h=0;h<24;h++) {
            const idx=profIdx(m,d,h);
            if (_prodProfil ? !(_prodProfil[idx]>0) : (h<9||h>=18)) continue;
            kwh918 += (site.conso_profil[idx]||0)/1000;
          }
          accSav = Math.max(0, Math.round(kwh918 * ((curTariff?.prix_hp||0.24) - 0.11)));
        }
        const solDefP=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})();
        const bkvP=parseFloat(solDefP.batKwh)||0, tkvP=parseFloat(solDefP.thermKwh)||0;
        const spP = spotRows ? buildSpotMap(spotRows) : null;
        const storResP = curTariff ? computeStorageOptimization(site.conso_profil, curTariff, curTariff, site, bkvP, tkvP, {...nat, opti_tarif:true}, spP) : null;
        const shiftSavP = storResP?.saving || 0;
        let boxSav;
        if (localStorage.getItem('starvolt_box_chosen') === 'free') {
          boxSav = shiftSavP; // flex reversée à Starvolt, l'utilisateur garde le gain de déplacement
        } else {
          boxSav = parseInt(localStorage.getItem('starvolt_box_saving')||'0');
          const _ratioP = (nat?.ratio_puissance_stockage ?? 50) / 100;
          const flexGainP = Math.round((parseFloat(solDefP.thermKwh)||0)*14 + bkvP*_ratioP*27);
          if (!boxSav) boxSav = Math.round(flexGainP + shiftSavP);
        }
        // Solar savings : utiliser baisse facture calculée (MaProd) si dispo, sinon estimation 70%
        const adjBillSolar = Math.max(0, bill - optSav - accSav);
        const baisseFact0 = parseInt(localStorage.getItem('starvolt_baisse_facture')||'0') || 0;
        let solSav = baisseFact0 > 0 ? baisseFact0 : (solarChoice === 'solar_box' ? Math.round(adjBillSolar * 0.70) : Math.round(adjBillSolar * 0.50));
        // Si solar_box choisi, la Box est comprise dans le 70% — ne pas compter ses économies en double
        const effectiveBoxSav = (solarChoice === 'solar_box') ? 0 : boxSav;
        setSavings({ optimisation: optSav, acc: accSav, box: effectiveBoxSav, solar: solSav });
        // Projection solaire précise : calculer achat réseau et injection heure par heure
        if (solarChoice && site.profil_production_id && site.conso_profil) {
          const siteKwh = site.conso_annuelle_kwh || kwh_total;
          const prixBase = curTariff && !curTariff.tarif_dynamique && siteKwh > 0
            ? Math.round((curTariff.abo_annuel||0) + siteKwh * (curTariff.prix_hp||0)) / siteKwh
            : (bill && kwh_total > 0 ? bill / kwh_total : 0.18);
          const prixRachat = nat?.prix_rachat_injection ?? 0.04;
          setSolPrixBase(prixBase);
          setSolPrixRachat(prixRachat);
          const solarDef = (()=>{ try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};} })();
          const kw = parseFloat(solarDef.pvKwc)||6;
          const bk = parseFloat(solarDef.batKwh)||10;
          const tk = parseFloat(solarDef.thermKwh)||5;
          const ratioBat   = ((nat?.ratio_puissance_stockage              ??50)/100);
          const ratioTherm = ((nat?.ratio_puissance_stockage_thermique    ??50)/100);
          const pBat   = nat?.pertes_batterie  ?? 10;
          const pTherm = nat?.pertes_thermique ?? 0;
          if (_prodProfil) {
            const bal = computeEnergyBalance(site.conso_profil, _prodProfil, kw,
              bk*ratioBat*1000, bk, pBat, tk*ratioTherm, tk, pTherm);
            const gridBuy = bal.monthly.reduce((s,m) => s+m.grid_buy, 0);
            const injKwh  = bal.monthly.reduce((s,m) => s+m.injection, 0);
            setSolGridKwh(gridBuy); setSolInjKwh(injKwh);
            const baisseLSPan = parseInt(localStorage.getItem('starvolt_baisse_facture')||'0') || 0;
            if (baisseLSPan > 0) {
              setSavings(prev => ({...prev, solar: baisseLSPan}));
            } else {
              const curBillPan = Math.round(prixBase * siteKwh);
              const nouvFactPan = Math.max(0, gridBuy * prixBase - injKwh * prixRachat);
              const realSav = Math.max(0, Math.round(curBillPan - nouvFactPan));
              if (realSav > 0) setSavings(prev => ({...prev, solar: realSav}));
            }
          }
        }
      }
      setLoading(false);
    });
  }, []);

  const removeItem = (key) => {
    const removes = {
      optimisation: ['starvolt_optimisation_chosen','starvolt_optimisation_saving','starvolt_optimisation_tariff_id'],
      acc:          ['starvolt_acc_chosen'],
      box:          ['starvolt_box_chosen','starvolt_box_saving'],
      solar:        ['starvolt_solar_chosen','starvolt_solar_saving'],
    };
    removes[key].forEach(k => localStorage.removeItem(k));
    setItems(s => ({...s, [key]: false}));
  };

  const clearPanier = () => {
    ['starvolt_optimisation_chosen','starvolt_optimisation_saving','starvolt_optimisation_tariff_id','starvolt_solar_chosen',
     'starvolt_solar_saving','starvolt_box_chosen','starvolt_box_saving','starvolt_acc_chosen'].forEach(k => localStorage.removeItem(k));
    // Réinitialise les flags services dans le cache
    try{const c=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_global_vars_cache'));}catch{return {};}})();localStorage.setItem('starvolt_global_vars_cache',JSON.stringify({...c,opti_solaire:true,opti_tarif:true,opti_flex:false,opti_acc:false}));}catch{}
    setItems({ optimisation:false, acc:false, box:false, solar:false });
    // Réinitialise les services cochés quand on vide le panier
    sb.from('parametres_nationaux').upsert({id:1,opti_solaire:true,opti_tarif:true,opti_flex:false,opti_acc:false},{onConflict:'id'});
  };

  // Année 1 = pas d'inflation ; année N = (N-1) augmentations
  const projYear = (n, bill) => {
    if (!bill) return 0;
    if (n <= 10) return Math.round(bill * Math.pow(1 + taux/100, n - 1));
    const bill10 = bill * Math.pow(1 + taux/100, 9); // 9 hausses jusqu'en année 10
    return Math.round(bill10 * Math.pow(1 + taux2/100, n - 10));
  };
  const projCum = (bill) => {
    let s = 0;
    for (let n = 1; n <= 25; n++) s += projYear(n, bill);
    return Math.round(s);
  };
  // Projection "avec action" : seul le coût d'achat réseau est indexé sur l'inflation
  // injection (revenus vente surplus) reste fixe, autoconsommation = gratuite
  const projBilledAfter = (n) => {
    if (solGridKwh !== null && solPrixBase !== null) {
      let gridCost;
      if (n <= 10) gridCost = solGridKwh * solPrixBase * Math.pow(1 + taux/100, n - 1);
      else {
        const gc10 = solGridKwh * solPrixBase * Math.pow(1 + taux/100, 9);
        gridCost = gc10 * Math.pow(1 + taux2/100, n - 10);
      }
      return Math.max(0, Math.round(gridCost - solInjKwh * solPrixRachat));
    }
    // Fallback si pas de balance heure/heure disponible
    if (!billedAfter) return 0;
    if (n <= 10) return Math.round(billedAfter * Math.pow(1 + taux/100, n - 1));
    const ba10 = billedAfter * Math.pow(1 + taux/100, 9);
    return Math.round(ba10 * Math.pow(1 + taux2/100, n - 10));
  };
  const projCumBilledAfter = () => {
    let s = 0;
    for (let n = 1; n <= 25; n++) s += projBilledAfter(n);
    return Math.round(s);
  };

  const activeItems        = Object.entries(items).filter(([,v])=>v);
  // Source unique de la réduction : baisse facture calculée par Mon site (inclut énergie + flex + acc)
  const baisseLS           = parseInt(localStorage.getItem('starvolt_baisse_facture')||'0') || 0;
  const totalAnnualSaving  = baisseLS || activeItems.reduce((s,[k])=>s+(savings[k]||0),0);
  const totalInvestment    = investLS || activeItems.reduce((s,[k])=>s+(investments[k]||0),0);
  const billedAfter        = currentBill ? Math.max(0, currentBill - totalAnnualSaving) : null;
  const roiGlobal          = totalInvestment > 0 && totalAnnualSaving > 0 ? Math.ceil(totalInvestment / totalAnnualSaving) : null;
  const gainNet25          = currentBill ? Math.max(0, projCum(currentBill) - projCumBilledAfter() - totalInvestment) : 0;
  const itemsCount         = activeItems.length;

  if (validated) {
    return (
      <>
      <div className="screen fade-in">
        <Fireworks final/>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:10}}>🛒</div>
          <div style={{fontSize:26,fontWeight:900,color:'white',lineHeight:1.2}}>Projet validé !</div>
          <div style={{fontSize:18,color:'rgba(255,255,255,.85)',marginTop:10,lineHeight:1.6}}>
            Un conseiller Starvolt vous contacte<br/>sous 48h pour finaliser votre projet.
          </div>
        </div>
        {gainNet25 > 0 && (
          <div className="card" style={{padding:'22px 18px',textAlign:'center',border:'1.5px solid rgba(125,217,64,.4)',marginBottom:14}}>
            <div style={{fontSize:16,color:'rgba(255,255,255,.8)',marginBottom:6}}>Gain net estimé sur 25 ans</div>
            <div style={{fontSize:38,fontWeight:900,color:'#7dd940'}}>{fmtGrand(gainNet25)} €</div>
            {roiGlobal && <div style={{fontSize:16,color:'rgba(255,210,80,.9)',marginTop:6,fontWeight:700}}>Retour sur investissement : {roiGlobal} an{roiGlobal>1?'s':''}</div>}
          </div>
        )}
        <div className="card" style={{padding:'18px 16px',border:'1px solid rgba(125,217,64,.2)'}}>
          <div style={{fontWeight:700,fontSize:18,color:'#7dd940',marginBottom:8}}>✦ Prochaine étape</div>
          <div style={{fontSize:17,color:'rgba(255,255,255,.9)',lineHeight:1.6}}>
            Étude personnalisée gratuite et sans engagement. Nous analysons votre profil de consommation et vous proposons un plan d'action sur mesure.
          </div>
        </div>
      </div>
      <StickyFooter onBack={onBack}/>
      </>
    );
  }

  return (
    <>
    <div className="screen fade-in">
      <div style={{marginBottom:22,marginTop:4}}>
        <div style={{fontSize:13,letterSpacing:'.8px',color:'rgba(125,217,64,.9)',fontWeight:700,textTransform:'uppercase',marginBottom:8}}>Mon projet Starvolt</div>
        <div style={{fontSize:26,fontWeight:900,color:'white',lineHeight:1.2}}>
          Votre <span className="accent">panier</span><br/>énergétique
        </div>
      </div>

      {loading && <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div>}

      {!loading && !currentBill && (
        <div className="card" style={{textAlign:'center',padding:'32px 20px',marginBottom:14}}>
          <div style={{fontSize:36,marginBottom:10}}>📊</div>
          <div style={{fontSize:18,fontWeight:700,color:'white',marginBottom:8}}>Aucune donnée de consommation</div>
          <div style={{fontSize:16,color:'rgba(255,255,255,.85)',lineHeight:1.6}}>Importez vos données Enedis dans « Ma conso » pour calculer vos économies.</div>
        </div>
      )}

      {!loading && currentBill && (
        <>
          {/* Situation actuelle */}
          <div className="card" style={{padding:'20px 18px',marginBottom:14}}>
            <div style={{fontSize:14,color:'rgba(125,217,64,.9)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:14}}>Situation actuelle</div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <div style={{fontSize:18,color:'rgba(255,255,255,.9)',fontWeight:600}}>Facture annuelle</div>
              <div style={{fontSize:26,fontWeight:900,color:'white'}}>{fmtGrand(currentBill)} €</div>
            </div>
            <div style={{background:'rgba(239,68,68,.09)',borderRadius:12,padding:'14px 16px',border:'1px solid rgba(239,100,100,.3)'}}>
              <div style={{fontSize:14,color:'rgba(255,160,120,.9)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.3px',marginBottom:4}}>Sans action</div>
              <div style={{fontSize:13,color:'rgba(255,160,120,.7)',marginBottom:10}}>
                Hausse {taux}%/an (années 1–10){taux2 > 0 ? ` · ${taux2}%/an (années 11–25)` : ' · 0%/an (années 11–25)'}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <div style={{textAlign:'center'}}>
                  <div style={{fontSize:14,color:'rgba(255,255,255,.7)',marginBottom:4}}>Dans 25 ans</div>
                  <div style={{fontSize:22,fontWeight:900,color:'#fca5a5'}}>{fmtGrand(projYear(25,currentBill))} €/an</div>
                </div>
                <div style={{textAlign:'center'}}>
                  <div style={{fontSize:14,color:'rgba(255,255,255,.7)',marginBottom:4}}>Cumulé 25 ans</div>
                  <div style={{fontSize:22,fontWeight:900,color:'#fca5a5'}}>{fmtGrand(projCum(currentBill))} €</div>
                </div>
              </div>
            </div>
          </div>

          {/* Comparatif panier */}
          {totalAnnualSaving > 0 && (
            <div className="card" style={{padding:'20px 18px',marginBottom:14,border:'1.5px solid rgba(125,217,64,.35)'}}>
              <div style={{fontSize:14,color:'rgba(125,217,64,.9)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:14}}>Impact de votre panier</div>
              {/* Réduction totale — source unique Mon site */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,padding:'12px 16px',background:'rgba(125,217,64,.1)',borderRadius:12,border:'1px solid rgba(125,217,64,.3)'}}>
                <div style={{fontSize:16,color:'rgba(255,255,255,.9)',fontWeight:600}}>Réduction de facture</div>
                <div style={{fontSize:26,fontWeight:900,color:'#7dd940'}}>−{fmtGrand(totalAnnualSaving)} €<span style={{fontSize:16,fontWeight:700}}>/an</span></div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:'6px 8px',marginBottom:14}}>
                <div></div>
                <div style={{fontSize:14,color:'rgba(255,150,110,.9)',fontWeight:700,textAlign:'center'}}>Sans action</div>
                <div style={{fontSize:14,color:'#7dd940',fontWeight:700,textAlign:'center'}}>Passer à l'action</div>
                {[[1,'Année 1'],[10,'Année 10'],[25,'Année 25']].map(([n,lbl])=>(
                  <React.Fragment key={n}>
                    <div style={{fontSize:16,color:'rgba(255,255,255,.85)',padding:'4px 0'}}>{lbl}</div>
                    <div style={{fontSize:18,fontWeight:700,color:'#fca5a5',textAlign:'center',padding:'4px 0'}}>{fmtGrand(projYear(n,currentBill))} €</div>
                    <div style={{fontSize:18,fontWeight:700,color:'#7dd940',textAlign:'center',padding:'4px 0'}}>{fmtGrand(projBilledAfter(n))} €</div>
                  </React.Fragment>
                ))}
                <div style={{fontSize:16,color:'rgba(255,255,255,.85)',fontWeight:700,padding:'4px 0'}}>Cumulé 25 ans</div>
                <div style={{fontSize:18,fontWeight:700,color:'#fca5a5',textAlign:'center',padding:'4px 0'}}>{fmtGrand(projCum(currentBill))} €</div>
                <div style={{fontSize:18,fontWeight:700,color:'#7dd940',textAlign:'center',padding:'4px 0'}}>{fmtGrand(projCumBilledAfter()+totalInvestment)} €</div>
              </div>
              {totalInvestment > 0 && (
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,padding:'10px 14px',background:'rgba(255,255,255,.06)',borderRadius:10}}>
                  <div style={{fontSize:16,color:'rgba(255,255,255,.85)',fontWeight:600}}>Investissement initial</div>
                  <div style={{fontSize:20,fontWeight:900,color:'white'}}>{fmtGrand(totalInvestment)} €</div>
                </div>
              )}

// ─── AdminProductionScreen ────────────────────
function AdminProductionScreen({ onBack }) {
  const [profils, setProfils] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importStep, setImportStep] = useState(null); // null | 'form'
  const [parsedData, setParsedData] = useState(null);
  const [nom, setNom] = useState('');
  const [adresse, setAdresse] = useState('');
  const [saving, setSaving] = useState(false);
  const [importMsg, setImportMsg] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const fileRef = useRef(null);

  const load = async () => {
    const { data } = await sb.from('profils_production').select('*').order('created_at', { ascending: false });
    setProfils(data || []);
  };
  useEffect(() => { load(); }, []);

  const handleFile = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setImporting(true); setImportMsg(null);
    try {
      const result = await processProductionXLS(await file.arrayBuffer());
      if (result.error) { setImportMsg({ type:'err', text: result.error }); return; }
      setParsedData(result);
      setNom(''); setAdresse('');
      setImportStep('form');
    } catch(err) { setImportMsg({ type:'err', text: String(err) }); }
    finally { setImporting(false); if (fileRef.current) fileRef.current.value = ''; }
  };

  const handleSave = async () => {
    if (!nom.trim() || !parsedData) return;
    setSaving(true);
    let lat = null, lon = null;
    if (adresse.trim()) {
      try {
        const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(adresse.trim())}&limit=1`);
        const j = await r.json();
        if (j.features?.[0]) { [lon, lat] = j.features[0].geometry.coordinates; }
      } catch(_) {}
    }
    await sb.from('profils_production').insert({
      nom: nom.trim(),
      adresse: adresse.trim() || null,
      latitude: lat,
      longitude: lon,
      profil: parsedData.profile,
    });
    setImportStep(null); setParsedData(null);
    setImportMsg({ type:'ok', text: `Profil "${nom.trim()}" importé (${Math.round(parsedData.annualKwh)} kWh/an·kWc, max ${Math.round(parsedData.maxKwc)} W/kWc)` });
    setSaving(false);
    await load();
  };

  const handleDelete = async (id) => {
    await sb.from('profils_production').delete().eq('id', id);
    setDeleteConfirm(null);
    await load();
  };

  return (
    <>
    <div className="screen fade-in">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,marginTop:4}}>
        <div>
          <div style={{fontSize:9,letterSpacing:'.6px',color:'rgba(125,217,64,.8)',fontWeight:700,textTransform:'uppercase'}}>Administration</div>
          <div style={{fontSize:18,fontWeight:900,color:'white',lineHeight:1.1}}>Production <span className="accent">solaire</span></div>
        </div>
        <button className="btn btn-sec" style={{fontSize:11,padding:'6px 12px',borderRadius:8}} onClick={()=>fileRef.current?.click()} disabled={importing||importStep==='form'}>
          {importing ? '⏳' : '☀️'} {importing ? 'Lecture…' : 'Importer un profil'}
        </button>
        <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleFile}/>
      </div>

      {importMsg?.type==='err' && (
        <div style={{color:'#ff6b6b',fontSize:12,padding:'7px 12px',background:'rgba(255,50,50,.1)',borderRadius:8,marginBottom:8}}>⚠️ {importMsg.text}</div>
      )}
      {importMsg?.type==='ok' && (
        <div style={{color:'#7dd940',fontSize:12,padding:'7px 12px',background:'rgba(255,255,255,.05)',borderRadius:8,marginBottom:8}}>✅ {importMsg.text}</div>
      )}

      {importStep === 'form' && (
        <div className="card" style={{padding:'14px 16px',marginBottom:12,border:'1px solid rgba(125,217,64,.3)'}}>
          <div style={{fontWeight:800,color:'white',marginBottom:10}}>Nouveau profil — {Math.round(parsedData?.annualKwh||0)} kWh/an·kWc</div>
          <label style={{fontSize:10,color:'rgba(255,255,255,.45)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>NOM DU PROFIL *</label>
          <input className="inp" style={{marginBottom:10}} placeholder="ex : Montpellier plein sud" value={nom} onChange={e=>setNom(e.target.value)}/>
          <label style={{fontSize:10,color:'rgba(255,255,255,.45)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>ADRESSE (pour géolocalisation)</label>
          <input className="inp" style={{marginBottom:12}} placeholder="ex : 1 rue de la Paix, 34000 Montpellier" value={adresse} onChange={e=>setAdresse(e.target.value)}/>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" style={{flex:1,fontSize:13}} onClick={handleSave} disabled={saving||!nom.trim()}>
              {saving ? '⏳ Enregistrement…' : '💾 Enregistrer'}
            </button>
            <button className="btn btn-sec" style={{fontSize:13}} onClick={()=>{setImportStep(null);setParsedData(null);}}>Annuler</button>
          </div>
        </div>
      )}

      {profils === null ? (
        <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div>
      ) : profils.length === 0 && !importStep ? (
        <div className="card" style={{textAlign:'center',padding:'24px 20px'}}>
          <div style={{fontSize:32,marginBottom:10}}>☀️</div>
          <div style={{color:'white',fontWeight:700,marginBottom:5}}>Aucun profil de production</div>
          <div style={{color:'rgba(255,255,255,.55)',fontSize:13}}>Importez un fichier XLSX (colonnes : mois, jour, heure, puissance W/kWc).</div>
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:80}}>
          {profils.map(p => (
            <div key={p.id} className="card" style={{padding:'12px 14px'}}>
              {deleteConfirm === p.id ? (
                <div>
                  <div style={{color:'#ff6b6b',fontWeight:700,marginBottom:6}}>⚠️ Supprimer « {p.nom} » ?</div>
                  <div style={{display:'flex',gap:8}}>
                    <button className="btn btn-no" style={{flex:1,fontSize:13}} onClick={()=>handleDelete(p.id)}>Supprimer</button>
                    <button className="btn btn-sec" style={{flex:1,fontSize:13}} onClick={()=>setDeleteConfirm(null)}>Annuler</button>
                  </div>
                </div>
              ) : (
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:800,fontSize:14,color:'white'}}>{p.nom}</div>
                    {p.adresse && <div style={{fontSize:11,color:'rgba(255,255,255,.5)',marginTop:2}}>{p.adresse}</div>}
                    {p.latitude && <div style={{fontSize:10,color:'rgba(125,217,64,.6)',marginTop:2}}>{p.latitude.toFixed(4)}, {p.longitude.toFixed(4)}</div>}
                    {p.profil && (
                      <div style={{fontSize:11,color:'rgba(255,255,255,.45)',marginTop:4}}>
                        {Math.round(p.profil.reduce((s,v)=>s+v,0)/1000)} kWh/an·kWc · max {Math.round(Math.max(...p.profil))} W/kWc
                      </div>
                    )}
                  </div>
                  <button style={{background:'none',border:'none',color:'rgba(255,80,80,.6)',cursor:'pointer',fontSize:16,flexShrink:0,padding:'2px 4px'}} onClick={()=>setDeleteConfirm(p.id)}>🗑️</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
    <StickyFooter onBack={onBack}/>
    </>
  );
}

// ─── AdminPrixMateriauxScreen ─────────────────
function AdminPrixMateriauxScreen({ onBack }) {
  const [data, setData] = useState(null);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    sb.from('prix_materiaux').select('*').eq('id',1).maybeSingle()
      .then(({data:d}) => {
        if (d) setData(d);
        else setData({pv_prices:[],bat_prices:[],box_prix:500,box_installation:100,box_satellite:200,box_module_deporte:50,box_pinces:100});
      });
  }, []);

  const save = async () => {
    setSaving(true); setMsg(null);
    const payload = {
      id:1,
      pv_prices: data.pv_prices,
      bat_prices: data.bat_prices,
      box_prix: Number(data.box_prix)||0,
      box_installation: Number(data.box_installation)||0,
      box_satellite: Number(data.box_satellite)||0,
      box_module_deporte: Number(data.box_module_deporte)||0,
      box_pinces: Number(data.box_pinces)||0,
    };
    const {error} = await sb.from('prix_materiaux').upsert(payload, {onConflict:'id'});
    setSaving(false);
    setMsg(error ? {ok:false,text:'Erreur : '+error.message} : {ok:true,text:'Sauvegardé ✓'});
    setTimeout(()=>setMsg(null),3000);
  };

  const updPvRow = (i, col, v) => setData(prev => {
    const arr = prev.pv_prices.map((r,ri) => ri===i ? [col===0?Number(v):r[0], col===1?Number(v):r[1]] : r);
    return {...prev, pv_prices: arr};
  });
  const delPvRow = i => setData(prev => ({...prev, pv_prices: prev.pv_prices.filter((_,ri)=>ri!==i)}));
  const addPvRow = () => setData(prev => ({...prev, pv_prices: [...prev.pv_prices, [0,0]]}));

  const updBatRow = (i, col, v) => setData(prev => {
    const arr = prev.bat_prices.map((r,ri) => ri===i ? [col===0?Number(v):r[0], col===1?Number(v):r[1]] : r);
    return {...prev, bat_prices: arr};
  });
  const delBatRow = i => setData(prev => ({...prev, bat_prices: prev.bat_prices.filter((_,ri)=>ri!==i)}));
  const addBatRow = () => setData(prev => ({...prev, bat_prices: [...prev.bat_prices, [0,0]]}));

  const INP = {background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.2)',borderRadius:6,color:'white',fontSize:13,padding:'4px 8px',width:'100%',fontFamily:'inherit'};
  const TH = {fontSize:11,color:'rgba(255,255,255,.45)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',padding:'4px 6px',textAlign:'left'};
  const TD = {padding:'3px 4px',verticalAlign:'middle'};

  if (!data) return <div className="screen fade-in"><div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div></div>;

  const tableStyle = {width:'100%',borderCollapse:'collapse'};

  return (
    <>
    <div className="screen fade-in">
      <div style={{marginBottom:18,marginTop:4}}>
        <div style={{fontSize:13,color:'rgba(125,217,64,.9)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.8px',marginBottom:6}}>Administration</div>
        <div style={{fontSize:22,fontWeight:900,color:'white'}}>Prix matériel et pose</div>
        <div style={{fontSize:13,color:'rgba(255,255,255,.45)',marginTop:4}}>Tarifs fourniture + pose pour le calcul du ROI</div>
      </div>

      {/* ── PV ── */}
      <div className="card" style={{padding:'16px',marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,color:'#fbbf24',marginBottom:10}}>☀️ Installation PV — fourniture + pose</div>
        <div style={{overflowY:'auto',maxHeight:260}}>
          <table style={tableStyle}>
            <thead><tr>
              <th style={TH}>kWc</th>
              <th style={TH}>Prix € TTC</th>
              <th style={{...TH,width:32}}></th>
            </tr></thead>
            <tbody>
              {data.pv_prices.map((row,i) => (
                <tr key={i}>
                  <td style={TD}><input type="number" style={INP} step="0.5" min="0" value={row[0]} onChange={e=>updPvRow(i,0,e.target.value)}/></td>
                  <td style={TD}><input type="number" style={INP} step="100" min="0" value={row[1]} onChange={e=>updPvRow(i,1,e.target.value)}/></td>
                  <td style={TD}><button onClick={()=>delPvRow(i)} style={{background:'rgba(255,80,80,.15)',border:'1px solid rgba(255,80,80,.3)',borderRadius:5,color:'#ff6b6b',cursor:'pointer',fontSize:13,padding:'2px 7px'}}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <button onClick={addPvRow} style={{marginTop:8,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.2)',borderRadius:7,color:'rgba(255,255,255,.7)',fontSize:12,padding:'5px 12px',cursor:'pointer',fontFamily:'inherit'}}>+ Ajouter une ligne</button>
      </div>

      {/* ── Batterie ── */}
      <div className="card" style={{padding:'16px',marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,color:'#38bdf8',marginBottom:10}}>🔋 Batterie chimique — fourniture + pose</div>
        <div style={{overflowY:'auto',maxHeight:220}}>
          <table style={tableStyle}>
            <thead><tr>
              <th style={TH}>kWh</th>
              <th style={TH}>Prix € TTC</th>
              <th style={{...TH,width:32}}></th>
            </tr></thead>
            <tbody>
              {data.bat_prices.map((row,i) => (
                <tr key={i}>
                  <td style={TD}><input type="number" style={INP} step="0.5" min="0" value={row[0]} onChange={e=>updBatRow(i,0,e.target.value)}/></td>
                  <td style={TD}><input type="number" style={INP} step="100" min="0" value={row[1]} onChange={e=>updBatRow(i,1,e.target.value)}/></td>
                  <td style={TD}><button onClick={()=>delBatRow(i)} style={{background:'rgba(255,80,80,.15)',border:'1px solid rgba(255,80,80,.3)',borderRadius:5,color:'#ff6b6b',cursor:'pointer',fontSize:13,padding:'2px 7px'}}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <button onClick={addBatRow} style={{marginTop:8,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.2)',borderRadius:7,color:'rgba(255,255,255,.7)',fontSize:12,padding:'5px 12px',cursor:'pointer',fontFamily:'inherit'}}>+ Ajouter une ligne</button>
      </div>

      {/* ── Box ── */}
      <div className="card" style={{padding:'16px',marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,color:'#7dd940',marginBottom:12}}>📦 Box Comwatt — fourniture et pose séparées</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 14px'}}>
          {[
            ['box_prix','Box Comwatt (fourniture)','€'],
            ['box_installation','Pose / installation','€'],
            ['box_satellite','Box satellite','€'],
            ['box_module_deporte','Module déporté','€'],
            ['box_pinces','Pinces forte puissance','€'],
          ].map(([key,label])=>(
            <div key={key}>
              <div style={{fontSize:11,color:'rgba(255,255,255,.45)',marginBottom:4}}>{label}</div>
              <input type="number" style={INP} step="10" min="0" value={data[key]??''} onChange={e=>setData(p=>({...p,[key]:e.target.value}))}/>
            </div>
          ))}
        </div>
        <div style={{marginTop:10,fontSize:11,color:'rgba(255,255,255,.35)'}}>Pour le ROI : investissement box = fourniture + pose</div>
      </div>

      {msg && <div style={{padding:'10px 14px',borderRadius:8,marginBottom:10,background:msg.ok?'rgba(125,217,64,.15)':'rgba(255,80,80,.15)',color:msg.ok?'#7dd940':'#ff6b6b',fontSize:13,fontWeight:600}}>{msg.text}</div>}

      <div style={{height:80}}/>
    </div>
    <StickyFooter row onBack={onBack}>
      <button className="btn btn-yes" style={{flex:1,fontSize:15}} onClick={save} disabled={saving}>
        {saving?'Sauvegarde…':'Sauvegarder les prix'}
      </button>
    </StickyFooter>
    </>
  );
}

// ─── AdminTariffEditScreen ────────────────────
function AdminTariffEditScreen({ tariff, onSave, onDelete, onBack }) {
  const isNew = !tariff?.id;

  const getInitType = (t) => {
    if (!t) return 'fixe';
    if (t.type_tarif === 'multi') return 'multi';
    if (t.tarif_dynamique || t.type_tarif === 'dynamique') return 'dynamique';
    if (t.prix_hc != null && parseFloat(t.prix_hc) !== parseFloat(t.prix_hp)) return 'hchp';
    return 'fixe';
  };

  const [f, setF] = useState({
    nom:                       tariff?.nom || '',
    abo_annuel:                tariff?.abo_annuel ?? '',
    type_tarif:                getInitType(tariff),
    prix_hp:                   tariff?.prix_hp ?? '',
    prix_hc:                   tariff?.prix_hc ?? '',
    turpe_fixe:                tariff?.turpe_fixe ?? '',
    cta_fixe:                  tariff?.cta_fixe ?? '',
    marge_fournisseur_ceur_kwh:tariff?.marge_fournisseur_ceur_kwh ?? '',
  });
  const [periodes, setPeriodes] = useState(() => tariff?.periodes || []);
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState(null);

  const upd = useCallback((k, v) => setF(p => ({...p, [k]: v})), []);
  const n   = (v) => v === '' || v === null || v === undefined ? null : parseFloat(v);

  const addPeriode = () => setPeriodes(p => [...p, {date_debut:'',date_fin:'',heure_debut:'',heure_fin:'',prix:''}]);
  const delPeriode = (i) => setPeriodes(p => p.filter((_,idx)=>idx!==i));
  const updPeriode = (i,k,v) => setPeriodes(p => p.map((row,idx)=>idx===i?{...row,[k]:v}:row));

  // Compteur d'heures couvertes
  const { covered, remaining } = useMemo(() => {
    const covSet = new Set();
    for (const p of periodes) {
      if (!p.date_debut||!p.date_fin||p.heure_debut===''||p.heure_fin===''||p.prix==='') continue;
      const parts1=p.date_debut.split('/'), parts2=p.date_fin.split('/');
      if(parts1.length<2||parts2.length<2) continue;
      const dj=parseInt(parts1[0]),dm=parseInt(parts1[1]),fj=parseInt(parts2[0]),fm=parseInt(parts2[1]);
      if(!dj||!dm||!fj||!fm) continue;
      const hD=parseInt(p.heure_debut),hF=parseInt(p.heure_fin);
      if(isNaN(hD)||isNaN(hF)) continue;
      const overnight=hF<=hD;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++){
        const cur=m*100+d,s=dm*100+dj,e=fm*100+fj;
        if(!(s<=e?(cur>=s&&cur<=e):(cur>=s||cur<=e))) continue;
        for(let h=0;h<24;h++) if(overnight?(h>=hD||h<hF):(h>=hD&&h<hF)) covSet.add(profIdx(m,d,h));
      }
    }
    const totalH=PROF_DAYS.reduce((s,d)=>s+d,0)*24;
    return { covered:covSet.size, remaining:totalH-covSet.size, totalH };
  }, [periodes]);

  const handleSave = async () => {
    if (!f.nom.trim()) { setError('Le nom est obligatoire.'); return; }
    if (f.type_tarif === 'multi' && remaining > 0) { setError(`${remaining} h non couvertes — toute l'année doit être définie.`); return; }
    setLoading(true); setError(null);
    const isDyn = f.type_tarif === 'dynamique';
    const payload = {
      nom:              f.nom.trim(),
      abo_annuel:       n(f.abo_annuel),
      type_tarif:       f.type_tarif,
      tarif_dynamique:  isDyn,
      prix_hp:          (f.type_tarif==='fixe'||f.type_tarif==='hchp') ? n(f.prix_hp) : null,
      prix_hc:          f.type_tarif==='hchp' ? n(f.prix_hc) : null,
      periodes:         f.type_tarif==='multi' ? periodes : null,
      turpe_fixe:       isDyn ? n(f.turpe_fixe) : null,
      cta_fixe:         isDyn ? n(f.cta_fixe)   : null,
      marge_fournisseur_ceur_kwh: isDyn ? n(f.marge_fournisseur_ceur_kwh) : null,
      bat_virtuelle: false, surcout_abonnement: null, acheminement_hp: null, acheminement_hc: null,
      last_modified: new Date().toISOString(),
    };
    let err;
    if (isNew) ({ error: err } = await sb.from('tarifs_electricite').insert(payload));
    else       ({ error: err } = await sb.from('tarifs_electricite').update(payload).eq('id', tariff.id));
    setLoading(false);
    if (err) { setError(err.message); return; }
    onSave();
  };

  const handleDelete = async () => {
    if (!confirm(`Supprimer "${tariff.nom}" ?`)) return;
    await sb.from('tarifs_electricite').delete().eq('id', tariff.id);
    onDelete();
  };

  const iS = {background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.12)',borderRadius:8,color:'white',padding:'5px 7px',fontSize:12,width:'100%',fontFamily:'inherit',boxSizing:'border-box'};

  return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
          <h1 className="welcome-title">{isNew ? 'Nouveau' : 'Modifier'}<br/><span className="accent">tarif</span></h1>
        </div>
        <div className="form-card">
          <TariffField label="Nom du tarif *" fkey="nom" value={f.nom} onChange={upd} placeholder="EDF TRV HC HP"/>
          <TariffField label="Abonnement annuel (€/an)" fkey="abo_annuel" type="number" value={String(f.abo_annuel)} onChange={upd} placeholder="237.72"/>

          {/* Type de tarif */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:'rgba(255,255,255,.45)',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px'}}>Type de tarif</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {[['fixe','Fixe'],['hchp','HC / HP'],['multi','Multi-périodes'],['dynamique','Dynamique']].map(([v,lbl])=>(
                <label key={v} style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',fontSize:13,color:f.type_tarif===v?'#7dd940':'rgba(255,255,255,.7)',padding:'5px 10px',borderRadius:8,background:f.type_tarif===v?'rgba(125,217,64,.12)':'rgba(255,255,255,.05)',border:`1px solid ${f.type_tarif===v?'rgba(125,217,64,.4)':'rgba(255,255,255,.1)'}`,transition:'all .15s'}}>
                  <input type="radio" name="type_tarif" value={v} checked={f.type_tarif===v} onChange={()=>upd('type_tarif',v)} style={{accentColor:'#7dd940',margin:0}}/>
                  {lbl}
                </label>
              ))}
            </div>
          </div>

          {f.type_tarif==='fixe' && (
            <TariffField label="Prix (€/kWh TTC)" fkey="prix_hp" type="number" value={String(f.prix_hp)} onChange={upd} placeholder="0.2081"/>
          )}
          {f.type_tarif==='hchp' && (
            <div className="inp-row">
              <TariffField label="Prix HP (€/kWh TTC)" fkey="prix_hp" type="number" value={String(f.prix_hp)} onChange={upd} placeholder="0.2081"/>
              <TariffField label="Prix HC (€/kWh TTC)" fkey="prix_hc" type="number" value={String(f.prix_hc)} onChange={upd} placeholder="0.1635"/>
            </div>
          )}
          {f.type_tarif==='dynamique' && (<>
            <div className="inp-row">
              <TariffField label="TURPE fixe (€/an)" fkey="turpe_fixe" type="number" value={String(f.turpe_fixe)} onChange={upd} placeholder="129.79"/>
              <TariffField label="CTA fixe (€/an)" fkey="cta_fixe" type="number" value={String(f.cta_fixe)} onChange={upd} placeholder="19.47"/>
            </div>
            <TariffField label="Marge fournisseur (c€/kWh)" fkey="marge_fournisseur_ceur_kwh" type="number" value={String(f.marge_fournisseur_ceur_kwh)} onChange={upd} placeholder="ex: 1.5"/>
          </>)}

          {f.type_tarif==='multi' && (
            <div style={{marginTop:4}}>
              <div style={{fontSize:11,color:'rgba(255,255,255,.4)',marginBottom:8}}>
                Dates : JJ/MM · Heures : 0–23 · Le total doit atteindre 8 784 h/an (année bissextile)
              </div>
              {/* En-têtes */}
              <div style={{display:'grid',gridTemplateColumns:'68px 68px 52px 52px 1fr 30px',gap:4,marginBottom:4}}>
                {['Deb. date','Fin date','H.deb.','H.fin','€/kWh TTC',''].map((h,i)=>(
                  <div key={i} style={{fontSize:10,color:'rgba(255,255,255,.3)',textAlign:'center'}}>{h}</div>
                ))}
              </div>
              {/* Lignes */}
              {periodes.map((p,i)=>(
                <div key={i} style={{display:'grid',gridTemplateColumns:'68px 68px 52px 52px 1fr 30px',gap:4,marginBottom:5,alignItems:'center'}}>
                  <input style={iS} placeholder="01/04" value={p.date_debut}   onChange={e=>updPeriode(i,'date_debut',  e.target.value)}/>
                  <input style={iS} placeholder="30/10" value={p.date_fin}     onChange={e=>updPeriode(i,'date_fin',    e.target.value)}/>
                  <input style={iS} type="number" min="0" max="23" placeholder="0"  value={p.heure_debut} onChange={e=>updPeriode(i,'heure_debut',e.target.value)}/>
                  <input style={iS} type="number" min="0" max="24" placeholder="24" value={p.heure_fin}   onChange={e=>updPeriode(i,'heure_fin',  e.target.value)}/>
                  <input style={iS} type="number" step="0.0001" placeholder="0.0987" value={p.prix}       onChange={e=>updPeriode(i,'prix',        e.target.value)}/>
                  <button onClick={()=>delPeriode(i)} style={{background:'rgba(248,113,113,.15)',border:'1px solid rgba(248,113,113,.3)',borderRadius:7,color:'#f87171',cursor:'pointer',padding:'5px 0',fontSize:15,lineHeight:1,width:'100%'}}>−</button>
                </div>
              ))}
              <button onClick={addPeriode} style={{fontSize:12,background:'rgba(125,217,64,.08)',border:'1px solid rgba(125,217,64,.25)',borderRadius:8,color:'#7dd940',cursor:'pointer',padding:'6px 14px',fontFamily:'inherit',marginTop:4}}>
                + Ajouter une ligne
              </button>
              {/* Compteur */}
              <div style={{marginTop:10,padding:'8px 12px',borderRadius:8,background:remaining===0?'rgba(74,222,128,.08)':'rgba(255,255,255,.04)',border:`1px solid ${remaining===0?'rgba(74,222,128,.3)':'rgba(255,255,255,.08)'}`}}>
                <span style={{fontSize:13,color:remaining===0?'#4ade80':'rgba(255,255,255,.55)',fontWeight:600}}>
                  {remaining===0?'✓ 8 784 h couvertes':`${covered} h couvertes · ${remaining} h restantes`}
                </span>
              </div>
            </div>
          )}

          {error && <div className="auth-error">{error}</div>}
        </div>
        {!isNew && (
          <button className="btn-link" style={{color:'rgba(255,100,100,.55)',marginTop:8}} onClick={handleDelete}>
            Supprimer ce tarif
          </button>
        )}
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handleSave} disabled={loading||(f.type_tarif==='multi'&&remaining>0)}>
          {loading?'Enregistrement…':'✓ Enregistrer'}
        </button>
        <button className="btn btn-sec" onClick={onBack}>Annuler</button>
      </StickyFooter>
    </>
  );
}

    const { data: sites } = await sb.from('sites').select('id,nom').eq('user_id', u.id).order('nom');
    setCopySites(sites || []);
    setCopyDialog({ userId: u.id, userName: `${u.prenom||''} ${u.nom||''}`.trim() });
  };

  const handleCopySite = async () => {
    if (!copySrcSiteId || !copyTargetUserId) return;
    setCopying(true);
    // Fetch all site data
    const { data: src } = await sb.from('sites').select('*').eq('id', copySrcSiteId).single();
    if (!src) { setCopying(false); return; }
    const { id: _id, created_at: _ca, ...rest } = src;
    await sb.from('sites').insert({ ...rest, user_id: copyTargetUserId });
    setCopying(false);
    setCopyDone(true);
  };

  const closeCopyDialog = () => {
    setCopyDialog(null);
    setCopySites([]);
    setCopySrcSiteId('');
    setCopyTargetUserId('');
    setCopyDone(false);
  };

    const nb = `${b.prenom||''} ${b.nom||''}`.trim().toLowerCase();

    <>
    <div className="screen fade-in" style={{padding:'0 0 80px', maxWidth:'100%', width:'100%'}}>

        <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>

      {loading ? <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div> : (
        <div style={{overflowX:'auto', padding:'0 16px'}}>
          <table style={{width:'100%', minWidth:960, borderCollapse:'collapse', fontSize:13}}>
            <thead>
              <tr>
                {cols.map(c => (

            </thead>
            <tbody>

                      <div style={{display:'flex',gap:5,alignItems:'center',whiteSpace:'nowrap'}}>
                        <span style={{fontSize:11,color:'#fff',fontWeight:600}}>Confirmer ?</span>
                        <button onClick={() => handleDelete(u.id)} style={{
                          background:'#ef4444', border:'none', borderRadius:5,
                          color:'#fff', fontSize:11, padding:'3px 8px', cursor:'pointer'
                        }}>Oui</button>
                        <button onClick={() => setConfirmDel(null)} style={{
                          background:'rgba(255,255,255,.15)', border:'none', borderRadius:5,
                          color:'#fff', fontSize:11, padding:'3px 8px', cursor:'pointer'
                        }}>Non</button>
                      </div>
                    ) : (
                      <button onClick={() => setConfirmDel(u.id)} style={{
                        background:'transparent', border:'none',
                        color:'#fff', fontSize:16, padding:'2px 4px',
                        cursor:'pointer', lineHeight:1, opacity:.7
                      }}>🗑</button>
                    )}
                  </td>
                  <td style={{padding:'10px 10px', whiteSpace:'nowrap'}}>
                    <span style={{fontWeight:600, color:'#fff'}}>{u.prenom || '—'} {u.nom || ''}</span>
                    {u.pseudo && <span style={{color:'rgba(125,217,64,.9)', fontSize:11}}> ({u.pseudo})</span>}

                  <td style={{padding:'10px 10px', color:'rgba(125,217,64,.8)'}}>{u.email}</td>
                  <td style={{padding:'10px 10px', whiteSpace:'nowrap', color:'rgba(255,255,255,.5)'}}>{fmtDate(u.created_at)}</td>
                  <td style={{padding:'10px 10px', whiteSpace:'nowrap', color:'rgba(255,255,255,.5)'}}>{fmtDate(u.last_sign_in_at)}</td>
                  <td style={{padding:'10px 10px', textAlign:'center', color:'rgba(255,255,255,.7)'}}>{u.login_count ?? '—'}</td>
                  <td style={{padding:'10px 10px'}}>
                    <select

                        background:'rgba(255,255,255,.08)', border:'1px solid rgba(255,255,255,.15)',

                  <td style={{padding:'10px 8px'}}>
                    <button onClick={() => openCopyDialog(u)} style={{
                      background:'rgba(255,255,255,.08)', border:'1px solid rgba(255,255,255,.15)',
                      borderRadius:6, color:'rgba(255,255,255,.8)', fontSize:11,
                      padding:'4px 8px', cursor:'pointer', fontFamily:'inherit',
                      whiteSpace:'nowrap'
                    }}>📋 Copier un site</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>

    {/* ── Dialog copier un site ── */}
    {copyDialog&&(
      <div style={{
        position:'fixed',inset:0,zIndex:9999,
        background:'rgba(0,0,0,.7)',
        display:'flex',alignItems:'center',justifyContent:'center',
        padding:'0 16px'
      }} onClick={e=>{if(e.target===e.currentTarget)closeCopyDialog();}}>
        <div style={{
          background:'#1a1d2b',border:'1px solid rgba(255,255,255,.12)',
          borderRadius:14,padding:'22px 20px',width:'100%',maxWidth:480
        }}>
          <div style={{fontWeight:700,fontSize:15,color:'white',marginBottom:4}}>
            📋 Copier un site
          </div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.4)',marginBottom:18}}>

          </div>

          {copyDone ? (
            <div style={{textAlign:'center',padding:'20px 0'}}>
              <div style={{fontSize:28,marginBottom:8}}>✅</div>
              <div style={{color:'rgba(125,217,64,.9)',fontWeight:700,fontSize:14}}>Site copié avec succès !</div>
              <button onClick={closeCopyDialog} style={{

            <>

                {/* Colonne gauche : site source */}
                <div style={{flex:1}}>
                  <div style={{fontSize:10,color:'rgba(255,255,255,.4)',fontWeight:700,textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>Site à copier</div>
                  {copySites.length===0

                    : <select value={copySrcSiteId} onChange={e=>setCopySrcSiteId(e.target.value)} style={{
                        width:'100%',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.2)',

                {/* Colonne droite : utilisateur cible */}
                <div style={{flex:1}}>
                  <div style={{fontSize:10,color:'rgba(255,255,255,.4)',fontWeight:700,textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>Vers l'utilisateur</div>
                  <select value={copyTargetUserId} onChange={e=>setCopyTargetUserId(e.target.value)} style={{
                    width:'100%',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.2)',
                    borderRadius:8,color:'#fff',padding:'8px 10px',fontSize:13,
                    cursor:'pointer',fontFamily:'inherit'
                  }}>
                    <option value="">— Choisir un utilisateur —</option>
                    {sortedUsers.map(u=><option key={u.id} value={u.id}>
                      {`${u.prenom||''} ${u.nom||''}`.trim()||u.email}
                    </option>)}
                  </select>
                </div>
              </div>

              <div style={{display:'flex',gap:10}}>
                <button
                  disabled={!copySrcSiteId||!copyTargetUserId||copying}
                  onClick={handleCopySite}
                  style={{
                    flex:1,padding:'11px 0',borderRadius:9,border:'none',
                    background:(!copySrcSiteId||!copyTargetUserId)?'rgba(125,217,64,.2)':'rgba(125,217,64,.85)',
                    color:(!copySrcSiteId||!copyTargetUserId)?'rgba(255,255,255,.3)':'#0a1a04',
                    fontWeight:700,fontSize:14,cursor:(!copySrcSiteId||!copyTargetUserId)?'not-allowed':'pointer',
                    transition:'background .2s'
                  }}>
                  {copying?'Copie en cours…':'Copier le site'}
                </button>
                <button onClick={closeCopyDialog} style={{
                  flex:1,padding:'11px 0',borderRadius:9,
                  background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.18)',
                  color:'rgba(255,255,255,.8)',fontWeight:700,fontSize:14,cursor:'pointer'
                }}>Annuler</button>
              </div>
            </>
          )}
        </div>
      </div>
    )}

    <StickyFooter onBack={onBack}/>
    </>
  );
}

// ─── ResetPasswordScreen ─────────────────────
function ResetPasswordScreen({ onDone }) {
  const [pwd,     setPwd]     = useState('');
  const [pwd2,    setPwd2]    = useState('');
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);
  const [ok,      setOk]      = useState(false);

  const handle = async () => {
    if (pwd.length < 6)        { setError('6 caractères minimum.'); return; }
    if (pwd !== pwd2)          { setError('Les mots de passe ne correspondent pas.'); return; }
    setLoading(true); setError(null);
    const { error: err } = await sb.auth.updateUser({ password: pwd });
    if (err) { setError(err.message); setLoading(false); return; }
    setOk(true); setLoading(false);
  };

  if (ok) return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <h1 className="welcome-title">Mot de passe<br/><span className="accent">mis à jour ✦</span></h1>
          <p className="welcome-sub" style={{marginTop:12}}>
            Votre nouveau mot de passe est actif.
          </p>
        </div>
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={onDone}>Accéder à mon espace →</button>
      </StickyFooter>
    </>
  );

  return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <div className="welcome-tag">Réinitialisation</div>
          <h1 className="welcome-title">Nouveau<br/><span className="accent">mot de passe</span></h1>
        </div>
        <div className="form-card">
          <div className="inp-group">
            <label className="inp-label">Nouveau mot de passe</label>
            <input className="inp" type="password" value={pwd}
              onChange={e=>setPwd(e.target.value)} placeholder="6 caractères minimum"/>
          </div>
          <div className="inp-group">
            <label className="inp-label">Confirmer</label>
            <input className="inp" type="password" value={pwd2}
              onChange={e=>setPwd2(e.target.value)} placeholder="Même mot de passe"/>
          </div>
          {error && <div className="auth-error">{error}</div>}
        </div>
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handle} disabled={loading}>
          {loading ? 'Enregistrement…' : 'Enregistrer mon mot de passe →'}
        </button>
      </StickyFooter>
    </>
  );
}

// ─── MAIN APP — Machine d'états ──────────────

const INIT = {
  screen:      'WELCOME',
  name:        '',
  address:     '',
  initialBill: 0,
  bill:        0,
  bravoItems:  [],
  investment:  0,
};

function App() {
  const [state,       setState]      = useState(INIT);
  const [history,     setHistory]    = useState([]);
  const [user,        setUser]       = useState(null);
  const [profile,     setProfile]    = useState(null);
  const [authLoading, setAuthLoading]= useState(true);
  const [showDemoPopup, setShowDemoPopup] = useState(false);
  const [cartVersion, setCartVersion]= useState(0);
  const pendingProfileRef            = useRef(null);
  const updateCart = () => setCartVersion(v => v + 1);

  // Charge le profil, hydrate le site actif, et retourne l'écran cible
  const fetchProfile = useCallback(async (userId) => {
    const { data } = await sb.from('profiles')
      .select('prenom, nom, pseudo, adresse_ligne1, code_postal, ville, telephone, pdl, active_site_id')
      .eq('id', userId).single();
    if (data) {
      setProfile(data);
      if (data.active_site_id) {
        localStorage.setItem('starvolt_active_site_id', data.active_site_id);
      } else if (!localStorage.getItem('starvolt_active_site_id')) {
        const { data: sites } = await sb.from('sites').select('id').eq('user_id', userId).order('created_at').limit(1);
        const firstId = sites?.[0]?.id;
        if (firstId) {
          localStorage.setItem('starvolt_active_site_id', firstId);
          sb.from('profiles').update({ active_site_id: firstId }).eq('id', userId);
        }
      }
    }
    // Détermine l'écran cible : SIMULATIONS si conso disponible, sinon HOME
    const siteId = localStorage.getItem('starvolt_active_site_id');
    if (siteId) {
      const { data: site } = await sb.from('sites').select('conso_profil').eq('id', siteId).maybeSingle();
      if (site?.conso_profil) return 'SIMULATIONS';
    }
    return 'HOME_LOGGED_IN';
  }, []);

  // Vide le panier une seule fois par session navigateur (rechargement de page)
  useEffect(() => {
    if (!sessionStorage.getItem('starvolt_session_started')) {
      clearPanierLS();
      sessionStorage.setItem('starvolt_session_started', '1');
    }
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      if (initialHash.includes('type=recovery')) return;
      if (session?.user) {
        setUser(session.user);
        fetchProfile(session.user.id).then(screen => {
          setState(s => ({ ...s, screen }));
          setAuthLoading(false);
        });
      } else {
        setAuthLoading(false);
      }
    });

    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        setUser(session?.user || null);
        setState(s => ({ ...s, screen: 'RESET_PASSWORD' }));
        setHistory([]);
        setAuthLoading(false);
        return;
      }
      if (event === 'SIGNED_IN' && session?.user) {
        setUser(session.user);
        if (pendingProfileRef.current) {
          setProfile(pendingProfileRef.current);
          pendingProfileRef.current = null;
        }
        fetchProfile(session.user.id).then(screen => {
          setState(s => ({ ...s, screen }));
          setHistory([]);
        });
      }
      if (event === 'SIGNED_OUT') {
        setUser(null); setProfile(null);
        setHistory([]); setState(INIT);
        localStorage.removeItem('starvolt_active_site_id');
      }
    });

    return () => subscription.unsubscribe();
  }, [fetchProfile]);

  const goTo = useCallback((screen, updates = {}) => {
    setHistory(h => [...h, state]);
    setState(s => ({ ...s, screen, ...updates }));
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [state]);

  const goBack = useCallback(() => {
    if (!history.length) {
      if (user) setState(s => ({ ...s, screen: 'HOME_LOGGED_IN' }));
      return;
    }
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0,-1));
    setState(prev);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [history, user]);

  const handleLogout = async () => { await sb.auth.signOut(); };

  const isAdmin = user?.email === 'greg@starvolt.fr';

  const render = () => {
    if (authLoading) return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'60vh'}}>
        <div className="spinner"/>
      </div>
    );

    switch (state.screen) {

      case 'HOME_LOGGED_IN':
        return <HomeLoggedInScreen profile={profile}/>;

      case 'PROFILE':
        return <ProfileScreen
          user={user}
          profile={profile}
          onSave={(updated) => { setProfile(p => ({...p, ...updated})); goTo('HOME_LOGGED_IN'); }}
          onCancel={() => goTo('HOME_LOGGED_IN')}
          onLogout={handleLogout}
          onDeleted={() => { setUser(null); setProfile(null); setState(INIT); setHistory([]); }}/>;

      case 'ADMIN':
        return <AdminScreen
          onTariffs={()=>goTo('ADMIN_TARIFFS')}
          onSpot={()=>goTo('SPOT_PRICES')}
          onUsers={()=>goTo('ADMIN_USERS')}
          onAcc={()=>goTo('ADMIN_ACC')}
          onProduction={()=>goTo('ADMIN_PRODUCTION')}
          onGlobalVars={()=>goTo('ADMIN_GLOBAL_VARS')}
          onPrix={()=>goTo('ADMIN_PRIX_MATERIAUX')}
          onBack={goBack}/>;

      case 'ADMIN_PRIX_MATERIAUX':
        return <AdminPrixMateriauxScreen onBack={goBack}/>;

      case 'ADMIN_GLOBAL_VARS':
        return <GlobalVarsScreen onBack={goBack}/>;

      case 'ADMIN_PRODUCTION':
        return <AdminProductionScreen onBack={goBack}/>;

      case 'SPOT_PRICES':
        return <SpotPricesScreen onBack={goBack}/>;

      case 'ADMIN_TARIFFS':
        return <AdminTariffsScreen
          onEdit={(t)=>goTo('ADMIN_TARIFF_EDIT', {editTariff: t})}
          onNew={()=>goTo('ADMIN_TARIFF_EDIT', {editTariff: null})}
          onBack={goBack}/>;

      case 'ADMIN_TARIFF_EDIT':
        return <AdminTariffEditScreen
          tariff={state.editTariff}
          onSave={()=>goTo('ADMIN_TARIFFS')}
          onDelete={()=>goTo('ADMIN_TARIFFS')}
          onBack={goBack}/>;

      case 'ADMIN_USERS':
        return <AdminUsersScreen onBack={goBack}/>;

      case 'ADMIN_ACC':
        return <AdminAccScreen
          onEdit={(s)=>goTo('ADMIN_ACC_EDIT',{editAccSite:s})}
          onNew={()=>goTo('ADMIN_ACC_EDIT',{editAccSite:null})}
          onBack={goBack}/>;

      case 'ADMIN_ACC_EDIT':
        return <AdminAccEditScreen
          site={state.editAccSite}
          onSave={()=>goTo('ADMIN_ACC')}
          onDelete={()=>goTo('ADMIN_ACC')}
          onBack={goBack}/>;

      case 'MA_CONSO':
        return <MonSiteScreen user={user} userProfile={profile} onBack={goBack} onSimulations={()=>goTo('SIMULATIONS')}/>;

      case 'SIMULATIONS': {
        const base = { name: profile?.prenom||'', address:'Zone ACC', initialBill:2000, bill:2000, bravoItems:[], investment:0, eligible:true };
        return <SimulationsScreen
          user={user}
          userProfile={profile}
          onACC={()=>goTo('ACC_MAP')}
          onBox={()=>goTo('BOX_SIM')}
          onSolar={()=>goTo('SOLAR_SIM')}
          onOptimisation={()=>goTo('OPTIMISATION')}
          onBack={goBack}
          onMonSite={()=>goTo('MA_CONSO')}/>;
      }

      case 'PANIER':
        return <PanierScreen user={user} onBack={()=>goTo('SIMULATIONS')} onGoTo={goTo} onMonSite={()=>goTo('MA_CONSO')}/>;

      case 'BOX_SIM':
        return <BoxSimScreen user={user} userProfile={profile} onBack={goBack} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')} onCartUpdate={updateCart}/>;

      case 'SOLAR_SIM':
        return <SolarSimScreen user={user} userProfile={profile} onBack={goBack} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')} onCartUpdate={updateCart}/>;

      case 'OPTIMISATION':
        return <OptimisationScreen user={user} userProfile={profile} onBack={goBack} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')} onCartUpdate={updateCart}/>;

      case 'ACC_MAP':
        return <AccMapScreen user={user} userProfile={profile} onBack={goBack}
          onJoin={(data) => { localStorage.setItem('starvolt_acc_chosen','true'); if(data.accPriceKwh) localStorage.setItem('starvolt_acc_price_ht',String(data.accPriceKwh)); updateCart(); goTo('ACC_RESULT', { ...data, accAction:'join' }); }}
          onCreate={(data) => { localStorage.setItem('starvolt_acc_chosen','true'); updateCart(); goTo('ACC_RESULT', { ...data, accAction:'create' }); }}
          onPanier={()=>goTo('PANIER')}/>;

      case 'ACC_RESULT':
        return <AccResultScreen state={state} onBack={()=>goTo('SIMULATIONS')} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')}/>;

      case 'AUTH_SIGNUP':
        return <AuthSignupScreen
          onGoToLogin={()=>goTo('AUTH_LOGIN')}
          onSignedUp={(p)=>{ pendingProfileRef.current = {...p, pseudo:null, adresse_ligne1:null, code_postal:null, ville:null, telephone:null}; }}
          onDemoImported={()=>setShowDemoPopup(true)}/>;

      case 'AUTH_LOGIN':
        return <AuthLoginScreen onGoToSignup={()=>goTo('AUTH_SIGNUP')}/>;

      case 'RESET_PASSWORD':
        return <ResetPasswordScreen onDone={()=>{ fetchProfile(user?.id); setState(s=>({...s,screen:'HOME_LOGGED_IN'})); setHistory([]); }}/>;

      case 'WELCOME':
        return <WelcomeScreen
          onCreateAccount={()=>goTo('AUTH_SIGNUP')}
          onLogin={()=>goTo('AUTH_LOGIN')}/>;

      case 'ADDRESS': {
        const accSaving = Math.round(state.initialBill * 0.15);
        if (!state.eligible) {
          return <NoACCScreen state={state} onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
        }
        return <EligibleScreen state={state} saving={accSaving}
          onYes={()=>goTo('BRAVO_1',{ bill:state.bill-accSaving, bravoItems:[...state.bravoItems,`Tarif ACC : −${accSaving.toLocaleString('fr-FR')} €/an`] })}
          onNo={()=>goTo('NO_ACC')}
          onBack={goBack}/>;
      }

      case 'NO_ACC':
        return <NoACCScreen state={state} onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;

      case 'BRAVO_1': {
        const accSaving = Math.round(state.initialBill * 0.15);
        return <BravoScreen state={state} stepNumber={1} saving={accSaving} label="Grâce au tarif ACC"
          onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
      }

      case 'COMWATT': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <ComwattScreen state={state} saving={cwSaving}
          onYes={()=>goTo('BRAVO_2',{ bill:state.bill-cwSaving, bravoItems:[...state.bravoItems,`Box Comwatt : −${cwSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+550 })}
          onNo={()=>goTo('SOLAR')}
          onBack={goBack}/>;
      }

      case 'BRAVO_2': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <BravoScreen state={state} stepNumber={2} saving={cwSaving} label="Grâce à la box Comwatt"
          onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;
      }

      case 'SOLAR': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <SolarScreen state={state} saving={solSaving}
          onYes={()=>goTo('BRAVO_3',{ bill:state.bill-solSaving, bravoItems:[...state.bravoItems,`Solaire + batterie : −${solSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+10000 })}
          onNo={()=>goTo('FINAL')}
          onBack={goBack}/>;
      }

      case 'BRAVO_3': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <BravoScreen state={state} stepNumber={3} saving={solSaving} label="Grâce aux panneaux solaires"
          onContinue={()=>goTo('FINAL')} onBack={goBack}/>;
      }

      case 'FINAL':
        return <FinalScreen state={state} onRestart={()=>{ setHistory([]); setState(INIT); }}/>;

      default: return null;
    }
  };

  const isAuthScreen = ['AUTH_SIGNUP','AUTH_LOGIN'].includes(state.screen);
  const isHome = !authLoading && user && state.screen === 'HOME_LOGGED_IN';
  const chipLabel = profile ? (profile.pseudo || profile.prenom || '') : state.name;
  const avatarName = profile ? `${profile.prenom || ''} ${profile.nom || ''}`.trim() : state.name;
  const showNameChip = profile ? true : state.screen !== 'WELCOME';
  const cartCount = user ? [
    localStorage.getItem('starvolt_optimisation_chosen'),
    localStorage.getItem('starvolt_acc_chosen') === 'true' ? 'true' : null,
    localStorage.getItem('starvolt_box_chosen'),
    localStorage.getItem('starvolt_solar_chosen'),
  ].filter(Boolean).length : 0;

  return (
    <div className="app">
      <TopBar
        name={chipLabel}
        avatarName={avatarName}
        showName={!isAuthScreen && showNameChip}
        logoOnly={isAuthScreen}
        onLogoClick={() => user ? goTo('HOME_LOGGED_IN') : goTo('WELCOME')}
        onProfileClick={user ? () => goTo('PROFILE') : null}
        isAdmin={isAdmin}
        onAdmin={()=>goTo('ADMIN')}
        onPanier={user && state.screen !== 'PANIER' ? ()=>goTo('PANIER') : null}
        cartCount={cartCount}
      />
      <div className="chevrons-deco" aria-hidden="true">
        {['»','»','»','»'].map((c,i)=><span key={i}>{c}</span>)}
      </div>
      {render()}
      {showDemoPopup && <DemoSitesPopup onClose={()=>setShowDemoPopup(false)}/>}
      {isHome && (
        <StickyFooter row>
          <button className="btn-home" onClick={()=>goTo('MA_CONSO')}>
            <span>Mon site</span>
            <span className="btn-home-sub">conso · production · box</span>
          </button>
          <button className="btn-home primary" onClick={()=>goTo('SIMULATIONS')}>
            <span>Simulations</span>
            <span className="btn-home-sub">d'économie</span>
          </button>
        </StickyFooter>
      )}
      <InstallBanner/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
