// ─── SpotPricesScreen ─────────────────────────
function SpotPricesScreen({ onBack }) {
  const [meta,       setMeta]       = useState(null);
  const [spotAll,    setSpotAll]    = useState(null);
  const [loading,    setLoading]    = useState(true);
  const [importing,  setImporting]  = useState(false);
  const [importMsg,  setImportMsg]  = useState(null);
  const [natParams,  setNatParams]  = useState(null);
  const [heatmapMode,setHeatmapMode]= useState('spot'); // 'spot' | 'ttc'
  const fileRef = useRef(null);

  const loadData = useCallback(async () => {
    const [{data:m}, {data:jsonRows}, {data:nat}] = await Promise.all([
      sb.from('spot_metadata').select('*').eq('id',1).maybeSingle(),
      sb.rpc('get_spot_json'),
      sb.from('parametres_nationaux').select('*').eq('id',1).maybeSingle(),
    ]);
    setMeta(m);
    setSpotAll(jsonRows && jsonRows.length > 0 ? jsonRows : null);
    setNatParams(nat || null);
    setLoading(false);
  }, []);

  useEffect(() => { loadData(); }, [loadData]);

  const handleImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImporting(true); setImportMsg(null);
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header:0 });
        const records = rows.map(r => ({
          mois:  parseInt(r['mois'] ?? r['Mois'] ?? r['MOIS']),
          jour:  parseInt(r['jour'] ?? r['Jour'] ?? r['JOUR']),
          heure: parseInt(r['heure'] ?? r['Heure'] ?? r['HEURE']),
          prix:  parseFloat(r['spot price'] ?? r['prix'] ?? r['Prix']),
        })).filter(r => !isNaN(r.mois) && !isNaN(r.jour) && !isNaN(r.heure) && !isNaN(r.prix));
        const CHUNK = 500;
        for (let i = 0; i < records.length; i += CHUNK) {
          const { error } = await sb.from('prix_spot').upsert(records.slice(i, i+CHUNK), { onConflict:'mois,jour,heure' });
          if (error) { setImportMsg('Erreur : ' + error.message); setImporting(false); return; }
        }
        await sb.from('spot_metadata').upsert({ id:1, last_update:new Date().toISOString(), rows_count:records.length, source_file:file.name }, { onConflict:'id' });
        setImportMsg(`✓ ${records.length} lignes importées`);
        setImporting(false);
        await loadData();
      } catch(err) {
        setImportMsg('Erreur : ' + err.message);
        setImporting(false);
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  const fmtDate = (ts) => ts ? new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

  return (
    <>
    <div className="screen fade-in">
      {/* Header compact */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',marginBottom:6}}>
        <span style={{fontSize:13,fontWeight:800,color:'white',letterSpacing:.5}}>
          Prix <span style={{color:'var(--green)'}}>spot</span>
        </span>
        <div style={{width:60}}/>
      </div>

      {/* Méta + bouton import — ultra compact */}
      <div style={{background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.12)',borderRadius:10,padding:'8px 12px',marginBottom:6,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,color:'rgba(255,255,255,.5)',fontWeight:600}}>
            {meta ? `${meta.rows_count?.toLocaleString('fr-FR')} lignes · MAJ ${fmtDate(meta.last_update)}` : 'Aucune donnée importée'}
          </div>
          {meta?.source_file && <div style={{fontSize:9,color:'rgba(255,255,255,.35)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{meta.source_file}</div>}
          {importMsg && <div style={{fontSize:10,fontWeight:700,marginTop:2,color:importMsg.startsWith('✓')?'var(--green)':'#ff9090'}}>{importMsg}</div>}
        </div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={handleImport}/>
        <button onClick={()=>fileRef.current?.click()} disabled={importing} style={{
          background:'rgba(8,145,178,.2)',border:'1px solid rgba(8,145,178,.4)',color:'#5de0f5',
          fontFamily:'var(--font)',fontSize:11,fontWeight:700,borderRadius:8,padding:'6px 10px',
          cursor:'pointer',whiteSpace:'nowrap',flexShrink:0
        }}>
          {importing ? '…' : '⚡ Importer'}
        </button>
      </div>

      {/* Sélecteur spot / TTC */}
      {natParams && spotAll && (
        <div style={{display:'flex',background:'rgba(255,255,255,.06)',borderRadius:7,padding:2,gap:2,marginBottom:8,alignSelf:'flex-start'}}>
          {[['spot','Prix spot'],['ttc','Prix TTC']].map(([m,lbl])=>(
            <button key={m} onClick={()=>setHeatmapMode(m)} style={{fontSize:11,fontWeight:700,border:'none',borderRadius:5,padding:'4px 10px',cursor:'pointer',fontFamily:'var(--font)',background:heatmapMode===m?'rgba(125,217,64,.25)':'transparent',color:heatmapMode===m?'#7dd940':'rgba(255,255,255,.45)'}}>
              {lbl}
            </button>
          ))}
        </div>
      )}

      {/* Légende compacte */}
      {heatmapMode === 'ttc' && natParams ? (
        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:5}}>
          {[['<10c',0.08],['10-13',0.115],['13-16',0.145],['16-19',0.175],['19-22',0.205],['22-26',0.24],['26-30',0.28],['30-35',0.33],['35-45',0.40],['>45',0.50]].map(([lbl,v])=>(
            <div key={lbl} style={{display:'flex',alignItems:'center',gap:2,fontSize:8.5,color:'rgba(255,255,255,.55)',fontWeight:700}}>
              <div style={{width:9,height:9,borderRadius:2,background:ttcColor(v),flexShrink:0}}/>
              {lbl}
            </div>
          ))}
          <span style={{fontSize:8.5,color:'rgba(255,255,255,.3)',alignSelf:'center'}}>c€/kWh TTC</span>
        </div>
      ) : (
        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:5}}>
          {[['<3c',0.02],['3-6',0.045],['6-9',0.075],['9-12',0.105],['12-15',0.135],['15-18',0.165],['18-20',0.19],['20-22',0.21],['22-26',0.24],['>26',0.30]].map(([lbl,v])=>(
            <div key={lbl} style={{display:'flex',alignItems:'center',gap:2,fontSize:8.5,color:'rgba(255,255,255,.55)',fontWeight:700}}>
              <div style={{width:9,height:9,borderRadius:2,background:spotColor(v),flexShrink:0}}/>
              {lbl}
            </div>
          ))}
          <span style={{fontSize:8.5,color:'rgba(255,255,255,.3)',alignSelf:'center'}}>c€/kWh</span>
        </div>
      )}

      {/* Heatmap pleine largeur */}
      {loading ? (
        <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div>
      ) : spotAll ? (
        <SpotHeatmapCanvas spotAll={spotAll} natParams={natParams} heatmapMode={heatmapMode}/>
      ) : (
        <div className="card" style={{textAlign:'center',padding:'32px 20px'}}>
          <div style={{fontSize:32,marginBottom:10}}>⚡</div>
          <p style={{color:'rgba(255,255,255,.6)',fontSize:13}}>Aucun prix spot importé.</p>
        </div>
      )}
    </div>
    <StickyFooter onBack={onBack}/>
    </>
  );
}

// ─── AccMapScreen ─────────────────────────────
function AccMapScreen({ user, userProfile, onBack, onJoin, onCreate, onPanier }) {
  const [accSites,      setAccSites]      = useState(null);
  const [activeSite,    setActiveSite]    = useState(null);
  const [activeTariff,  setActiveTariff]  = useState(null);
  const [activeProdData,setActiveProdData]= useState(null);
  const [loading,       setLoading]       = useState(true);
  const [siteLatLng,    setSiteLatLng]    = useState(null);
  const [nearbyAcc,     setNearbyAcc]     = useState([]);
  const [popup,         setPopup]         = useState(null);
  const mapDivRef = useRef(null);
  const leafletRef = useRef(null);

  // Load data + geocode
  useEffect(() => {
    const siteId = localStorage.getItem('starvolt_active_site_id');
    Promise.all([
      sb.from('sites_acc').select('*').order('created_at'),
      siteId
        ? sb.from('sites').select('id,nom,adresse_ligne1,code_postal,ville,conso_profil,tarif_id,profil_production_id').eq('id', siteId).maybeSingle()
        : Promise.resolve({ data: null }),
    ]).then(async ([{ data: acc }, { data: site }]) => {
      const accList = acc || [];
      setAccSites(accList);
      setActiveSite(site || null);
      if (site?.profil_production_id) {
        sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single()
          .then(({data}) => { if(data?.profil) setActiveProdData(data.profil); });
      }
      if (site?.tarif_id) {
        const { data: t } = await sb.from('tarifs_electricite').select('prix_hp,prix_hc,nom').eq('id', site.tarif_id).maybeSingle();
        setActiveTariff(t);
      }
      setLoading(false);
      if (site) {
        const q = [site.adresse_ligne1, site.code_postal, site.ville].filter(Boolean).join(' ');
        fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=1`)
          .then(r => r.json())
          .then(geo => {
            const feat = geo?.features?.[0];
            if (!feat) return;
            const [lon, lat] = feat.geometry.coordinates;
            setSiteLatLng([lat, lon]);
            setNearbyAcc(accList.filter(s => s.latitude && s.longitude && haversine(lat, lon, parseFloat(s.latitude), parseFloat(s.longitude)) <= 20));
          }).catch(() => {});
      }
    });
  }, []);

  // Build map once accSites and loading are ready
  useEffect(() => {
    if (loading || !accSites || !mapDivRef.current || leafletRef.current || !window.L) return;
    const L = window.L;
    const center = siteLatLng || [46.5, 2.3];
    const map = L.map(mapDivRef.current, {
      center, zoom: siteLatLng ? 10 : 6,
      zoomControl: true, scrollWheelZoom: true, attributionControl: true,
    });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com">CARTO</a>',
      subdomains: 'abcd', maxZoom: 19,
    }).addTo(map);

    // ALL acc site markers (all France, user can pan/zoom)
    const SunIcon = L.divIcon({
      className: '',
      html: '<div style="width:28px;height:28px;border-radius:50%;background:#fff7d6;border:2.5px solid #f59e0b;box-shadow:0 2px 8px rgba(245,158,11,.5);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer">☀️</div>',
      iconSize: [28, 28], iconAnchor: [14, 14],
    });
    (accSites || []).forEach(s => {
      if (!s.latitude || !s.longitude) return;
      const m = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], { icon: SunIcon });
      m.addTo(map);
      m.on('click', () => setPopup(s));
    });

    // Proximity rings + house marker if geocoded
    if (siteLatLng) {
      const [lat, lon] = siteLatLng;
      const RINGS = [
        { r: 2,  color: '#16a34a', dash: null,   lbl: '2 km'  },
        { r: 10, color: '#0284c7', dash: '8 6',  lbl: '10 km' },
        { r: 20, color: '#6b7280', dash: '10 8', lbl: '20 km' },
      ];
      // Anneaux (ajoutés une seule fois)
      RINGS.forEach(({ r, color, dash }) => {
        L.circle([lat, lon], { radius:r*1000, color, weight:2, fillOpacity:r===2?0.08:0.02, dashArray:dash, interactive:false }).addTo(map);
      });
      // Labels adaptatifs au zoom — reconstruits sur zoomend
      const _ringLbls = [];
      const _buildRingLabels = () => {
        _ringLbls.forEach(m => map.removeLayer(m));
        _ringLbls.length = 0;
        const z = map.getZoom();
        const fs = Math.max(10, Math.min(30, Math.round((z - 6) * 4)));
        RINGS.forEach(({ r, color, lbl }) => {
          const dLat = r / 111.32;
          _ringLbls.push(L.marker([lat + dLat, lon], {
            icon: L.divIcon({
              className: '',
              html: `<div style="background:rgba(4,20,32,.90);border-radius:7px;padding:2px 9px;display:inline-block;color:${color};font-size:${fs}px;font-weight:900;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.6);font-family:Poppins,sans-serif;transform:translate(-50%,-105%)">${lbl}</div>`,
              iconSize: null,
              iconAnchor: [0, 0],
            }),
            interactive: false,
          }).addTo(map));
        });
      };
      _buildRingLabels();
      map.on('zoomend', _buildRingLabels);
      const houseIcon = L.divIcon({
        className: '',
        html: '<div style="width:34px;height:34px;border-radius:50%;background:#dcfce7;border:2.5px solid #16a34a;box-shadow:0 2px 12px rgba(22,163,74,.5);display:flex;align-items:center;justify-content:center;font-size:17px">🏠</div>',
        iconSize: [34, 34], iconAnchor: [17, 17],
      });
      L.marker([lat, lon], { icon: houseIcon, zIndexOffset: 1000 })
        .bindTooltip('Votre site', { permanent: false, direction: 'top', className: 'acc-ring-lbl' })
        .addTo(map);
      // Fit to 20km bounds
      const deg20 = 20 / 111.32;
      map.fitBounds([[lat - deg20, lon - deg20 / Math.cos(lat*Math.PI/180)], [lat + deg20, lon + deg20 / Math.cos(lat*Math.PI/180)]], { padding: [16, 16] });
    }
    leafletRef.current = map;
  }, [loading, accSites, siteLatLng]);

  // Rebuild map if siteLatLng arrives after initial render
  useEffect(() => {
    if (!siteLatLng || !leafletRef.current || !window.L) return;
    const L = window.L;
    const map = leafletRef.current;
    const [lat, lon] = siteLatLng;
    const RINGS2 = [
      { r: 2,  color: '#16a34a', dash: null,   lbl: '2 km'  },
      { r: 10, color: '#0284c7', dash: '8 6',  lbl: '10 km' },
      { r: 20, color: '#6b7280', dash: '10 8', lbl: '20 km' },
    ];
    RINGS2.forEach(({ r, color, dash }) => {
      L.circle([lat, lon], { radius:r*1000, color, weight:2, fillOpacity:r===2?0.08:0.02, dashArray:dash, interactive:false }).addTo(map);
    });
    const _ringLbls2 = [];
    const _buildRingLabels2 = () => {
      _ringLbls2.forEach(m => map.removeLayer(m));
      _ringLbls2.length = 0;
      const z = map.getZoom();
      const fs = Math.max(10, Math.min(30, Math.round((z - 6) * 4)));
      RINGS2.forEach(({ r, color, lbl }) => {
        const dLat = r / 111.32;
        _ringLbls2.push(L.marker([lat + dLat, lon], {
          icon: L.divIcon({
            className: '',
            html: `<div style="background:rgba(4,20,32,.90);border-radius:7px;padding:2px 9px;display:inline-block;color:${color};font-size:${fs}px;font-weight:900;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.6);font-family:Poppins,sans-serif;transform:translate(-50%,-105%)">${lbl}</div>`,
            iconSize: null,
            iconAnchor: [0, 0],
          }),
          interactive: false,
        }).addTo(map));
      });
    };
    _buildRingLabels2();
    map.on('zoomend', _buildRingLabels2);
    const houseIcon = L.divIcon({
      className: '',
      html: '<div style="width:34px;height:34px;border-radius:50%;background:#dcfce7;border:2.5px solid #16a34a;box-shadow:0 2px 12px rgba(22,163,74,.5);display:flex;align-items:center;justify-content:center;font-size:17px">🏠</div>',
      iconSize: [34, 34], iconAnchor: [17, 17],
    });
    L.marker([lat, lon], { icon: houseIcon, zIndexOffset: 1000 })
      .bindTooltip('Votre site', { permanent: false, direction: 'top', className: 'acc-ring-lbl' })
      .addTo(map);
    const deg20 = 20 / 111.32;
    map.fitBounds([[lat - deg20, lon - deg20 / Math.cos(lat*Math.PI/180)], [lat + deg20, lon + deg20 / Math.cos(lat*Math.PI/180)]], { padding: [16, 16] });
  }, [siteLatLng]);

  const eligible = activeSite && (accSites||[]).some(s => s.code_postal === activeSite.code_postal);
  const eligibleSite = eligible ? (accSites||[]).find(s => s.code_postal === activeSite.code_postal) : null;

  const kwh918 = useMemo(() => {
    if (!activeSite?.conso_profil) return 0;
    let k = 0;
    for (let m=1; m<=12; m++)
      for (let d=1; d<=PROF_DAYS[m-1]; d++)
        for (let h=0; h<24; h++) {
          const idx = profIdx(m,d,h);
          if (activeProdData ? !(activeProdData[idx] > 0) : (h < 9 || h >= 18)) continue;
          k += (activeSite.conso_profil[idx]||0)/1000;
        }
    return Math.round(k);
  }, [activeSite, activeProdData]);

  const priceRef = activeTariff?.prix_hp || 0.24;
  const accPriceKwh = eligibleSite?.prix_vente_ttc || 0.11;
  const accSavings = Math.max(0, Math.round(kwh918 * (priceRef - accPriceKwh)));

  return (
    <div style={{ position:'fixed', inset:0, zIndex:200, display:'flex', flexDirection:'column', background:'linear-gradient(145deg, #065060 0%, #0a9b8c 50%, #0b8264 100%)', overflow:'hidden' }} className="fade-in">

      {/* ── Top bar ── */}
      <div style={{ flexShrink:0, padding:'70px 16px 12px', background:'transparent', position:'relative', zIndex:2 }}>

        {/* Titre + accroche */}
        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:9, letterSpacing:'.8px', color:'rgba(125,217,64,.85)', fontWeight:700, textTransform:'uppercase', marginBottom:4 }}>Autoconsommation collective</div>
          <div style={{ fontSize:20, fontWeight:900, color:'white', lineHeight:1.15, marginBottom:6 }}>
            Payez l'électricité <span className="accent">2× moins cher</span><br/>de 9h à 18h, tous les jours
          </div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,.55)', lineHeight:1.5 }}>
            En rejoignant une boucle ACC locale, vous achetez directement l'énergie solaire produite près de chez vous — à{' '}
            <span style={{ color:'#7dd940', fontWeight:700 }}>{((accPriceKwh||0.09)*100).toFixed(0)} c€/kWh</span>{' '}
            au lieu du tarif EDF heures pleines.
          </div>
        </div>

        {/* Résultat éligibilité */}
        {loading && (
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div className="spinner" style={{ width:14, height:14 }}/>
            <div style={{ fontSize:11, color:'rgba(255,255,255,.4)' }}>Chargement…</div>
          </div>
        )}
        {!loading && activeSite && (eligible ? (
          <div style={{ background:'rgba(255,255,255,.05)', border:'1.5px solid rgba(22,163,74,.45)', borderRadius:12, padding:'10px 14px', display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ fontSize:26, lineHeight:1 }}>✅</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:800, fontSize:14, color:'#4ade80', lineHeight:1.2 }}>{activeSite.nom} — zone éligible !</div>
              {eligibleSite?.nom && <div style={{ fontSize:11, color:'rgba(255,255,255,.45)', marginTop:2 }}>{eligibleSite.nom}{eligibleSite.puissance_pv ? ' · ' + eligibleSite.puissance_pv + ' kWc' : ''}</div>}
            </div>
            {accSavings > 0 && (
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <div style={{ fontSize:22, fontWeight:900, color:'#7dd940', lineHeight:1 }}>-{accSavings.toLocaleString('fr-FR')} €</div>
                <div style={{ fontSize:10, color:'rgba(255,255,255,.4)' }}>/an estimé</div>
              </div>
            )}
          </div>
        ) : (
          <div style={{ background:'rgba(255,255,255,.05)', border:'1px solid rgba(245,158,11,.35)', borderRadius:12, padding:'10px 14px', display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ fontSize:24, lineHeight:1 }}>⏳</div>
            <div>
              <div style={{ fontWeight:700, fontSize:14, color:'#fbbf24', lineHeight:1.2 }}>{activeSite.code_postal} — pas encore disponible</div>
              <div style={{ fontSize:11, color:'rgba(255,255,255,.4)', marginTop:3, lineHeight:1.4 }}>Starvolt déploie progressivement. Vous serez notifié dès l'ouverture d'une boucle près de chez vous.</div>
            </div>
          </div>
        ))}
        {!loading && !activeSite && (
          <div style={{ background:'rgba(255,255,255,.05)', borderRadius:12, padding:'10px 14px', fontSize:13, color:'rgba(255,255,255,.45)' }}>
            Configurez un site dans « Ma conso » pour voir votre éligibilité.
          </div>
        )}
      </div>

      {/* ── Map: fills remaining height ── */}
      <div style={{ flex:1, position:'relative', minHeight:0, overflow:'hidden' }}>
        <div ref={mapDivRef} style={{ width:'100%', height:'100%', position:'absolute', inset:0, zIndex:0 }}/>

        {/* Geocoding spinner overlay */}
        {!loading && activeSite && !siteLatLng && (
          <div style={{ position:'absolute', bottom:80, left:'50%', transform:'translateX(-50%)', zIndex:10, background:'rgba(5,65,78,.85)', borderRadius:20, padding:'6px 14px', display:'flex', alignItems:'center', gap:6 }}>
            <div className="spinner" style={{ width:12, height:12 }}/>
            <div style={{ fontSize:11, color:'rgba(255,255,255,.6)' }}>Géolocalisation en cours…</div>
          </div>
        )}

        {/* Nearby count badge */}
        {siteLatLng && (
          <div style={{ position:'absolute', top:10, right:10, zIndex:10, background:'rgba(5,65,78,.85)', borderRadius:8, padding:'5px 10px' }}>
            <div style={{ fontSize:10, color:'rgba(255,255,255,.5)', letterSpacing:.2 }}>Dans 20 km</div>
            <div style={{ fontSize:16, fontWeight:900, color:'#7dd940', lineHeight:1.1 }}>{nearbyAcc.length} site{nearbyAcc.length!==1?'s':''} ACC</div>
          </div>
        )}

        {/* Popup card floating over map */}
        {popup && (
          <div style={{ position:'absolute', bottom:80, left:12, right:12, zIndex:20, background:'rgba(5,65,78,.95)', border:'1.5px solid rgba(125,217,64,.4)', borderRadius:12, padding:'12px 14px', boxShadow:'0 4px 24px rgba(0,0,0,.5)' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
              <div>
                <div style={{ fontWeight:800, fontSize:14, color:'white' }}>☀️ {popup.nom || 'Site ACC'}</div>
                <div style={{ fontSize:11, color:'rgba(255,255,255,.5)', marginTop:2 }}>
                  {popup.adresse ? popup.adresse + ' · ' : ''}{popup.code_postal}
                </div>
                <div style={{ display:'flex', gap:14, marginTop:6 }}>
                  <div><div style={{ fontSize:9, color:'rgba(255,255,255,.35)', textTransform:'uppercase' }}>Puissance</div><div style={{ fontSize:13, fontWeight:700, color:'#38bdf8' }}>{popup.puissance_pv ? popup.puissance_pv + ' kWc' : '—'}</div></div>
                  <div><div style={{ fontSize:9, color:'rgba(255,255,255,.35)', textTransform:'uppercase' }}>Prix vente</div><div style={{ fontSize:13, fontWeight:700, color:'#7dd940' }}>{((popup.prix_vente_ttc||0.11)*100).toFixed(1)} c€/kWh</div></div>
                  {siteLatLng && popup.latitude && popup.longitude && <div><div style={{ fontSize:9, color:'rgba(255,255,255,.35)', textTransform:'uppercase' }}>Distance</div><div style={{ fontSize:13, fontWeight:700, color:'white' }}>{haversine(siteLatLng[0],siteLatLng[1],parseFloat(popup.latitude),parseFloat(popup.longitude)).toFixed(1)} km</div></div>}
                </div>
              </div>
              <button onClick={()=>setPopup(null)} style={{ background:'rgba(255,255,255,.08)', border:'none', color:'rgba(255,255,255,.6)', cursor:'pointer', fontSize:16, lineHeight:1, borderRadius:6, width:26, height:26, display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
            </div>
          </div>
        )}
      </div>

      {/* ── Sticky footer ── */}
      {!loading && (
        <div style={{ flexShrink:0, padding:'10px 14px', background:'rgba(5,65,78,.97)', borderTop:'1px solid rgba(255,255,255,.08)', display:'flex', alignItems:'center', gap:10, position:'relative', zIndex:1000 }}>
          <button onClick={onBack} style={{
            background:'transparent', border:'1px solid rgba(255,255,255,.2)',
            borderRadius:20, color:'rgba(255,255,255,.7)', fontSize:12,
            padding:'7px 14px', cursor:'pointer', whiteSpace:'nowrap', flexShrink:0
          }}>← Retour</button>
          <div style={{ flex:1 }}/>
          {localStorage.getItem('starvolt_acc_chosen') === 'true' ? (
            <button className="btn btn-yes" style={{ fontSize:13, padding:'11px 18px' }}
              onClick={onPanier}>
              🛒 Boucle déjà rejointe — voir le panier
            </button>
          ) : activeSite && eligible ? (
            <button className="btn btn-yes" style={{ fontSize:13, padding:'11px 18px' }}
              onClick={() => onJoin({ accSavings, accPriceKwh, eligibleSite, activeSite })}>
              🤝 Rejoindre cette boucle
            </button>
          ) : activeSite && !eligible ? (
            <button className="btn btn-yes" style={{ fontSize:12, padding:'11px 14px' }}
              onClick={() => onCreate({ activeSite })}>
              ⭐ Créer votre boucle ACC
            </button>
          ) : null}
        </div>
      )}
    </div>
  );
}

// ─── ThermaleForm ─────────────────────────────
function ThermaleForm({ onDone, onBack, siteId=null, initial=null }) {
  const [tab,          setTab]          = useState('appareils');
  const [chauffage,    setChauffage]    = useState(initial?.chauffage||null);
  const [ecs,          setEcs]          = useState(initial?.ecs||null);
  const [surface,      setSurface]      = useState(initial?.surface||null);
  const [typeLogement, setTypeLogement] = useState(initial?.type_logement||null);
  const [statut,       setStatut]       = useState(initial?.statut||null);

  async function handleDone() {
    const idx = surface === 'small' ? 0 : surface === 'medium' ? 1 : 2;
    let kw = 0;
    if (chauffage === 'elec' || chauffage === 'pac') kw += [3, 7, 12][idx];
    if (ecs === 'elec') kw += [2, 3, 4][idx];
    try {
      const d = JSON.parse(localStorage.getItem('starvolt_solar_defaults') || '{}');
      d.thermKwh = String(kw);
      localStorage.setItem('starvolt_solar_defaults', JSON.stringify(d));
    } catch {}
    // Persiste en base ET en localStorage si on connaît le siteId — await pour que load() voie les nouvelles valeurs
    if (siteId) {
      await sb.from('sites').update({flex_chauffage:chauffage,flex_ecs:ecs,flex_surface:surface,flex_type_logement:typeLogement||null,flex_statut:statut||null}).eq('id',siteId);
      try { localStorage.setItem('starvolt_flex_'+siteId, JSON.stringify({chauffage,ecs,surface,type_logement:typeLogement,statut})); } catch {}
    }
    onDone(kw);
  }

  const ready = true; // toujours autorisé, même si des champs sont null
  let previewKw = null;
  if (ready) {
    const idx = surface === 'small' ? 0 : surface === 'medium' ? 1 : 2;
    previewKw = 0;
    if (chauffage === 'elec' || chauffage === 'pac') previewKw += [3, 7, 12][idx];
    if (ecs === 'elec') previewKw += [2, 3, 4][idx];
  }

  const bS = (active) => ({
    flex: 1, padding: '13px 6px', borderRadius: 12,
    border: `2px solid ${active ? '#7dd940' : 'rgba(255,255,255,.13)'}`,
    background: active ? 'rgba(125,217,64,.11)' : 'rgba(255,255,255,.04)',
    color: 'white', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'center',
  });
  const lS = (active) => ({ fontSize: 12, fontWeight: active ? 800 : 600, color: active ? '#7dd940' : 'rgba(255,255,255,.75)' });
  const sec = { fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,.4)', textTransform: 'uppercase', letterSpacing: '.6px', marginBottom: 10 };

  const tabS = (active) => ({
    flex: 1, padding: '9px 6px', borderRadius: 10, cursor: 'pointer', fontFamily: 'inherit',
    border: `1.5px solid ${active ? '#7dd940' : 'rgba(255,255,255,.13)'}`,
    background: active ? 'rgba(125,217,64,.12)' : 'rgba(255,255,255,.04)',
    color: active ? '#7dd940' : 'rgba(255,255,255,.55)',
    fontWeight: active ? 800 : 600, fontSize: 12, textAlign: 'center',
  });

  return (
    <>
      <div className="screen fade-in">
        <div style={{ marginBottom: 16, marginTop: 4 }}>
          <div style={{ fontSize: 9, letterSpacing: '.8px', color: 'rgba(125,217,64,.85)', fontWeight: 700, textTransform: 'uppercase', marginBottom: 6 }}>Votre logement</div>
          <div style={{ fontSize: 19, fontWeight: 900, color: 'white', lineHeight: 1.25 }}>Quelques infos pour<br/>affiner votre simulation</div>
        </div>

        {/* ── Onglets ── */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
          <button style={tabS(tab==='logement')} onClick={() => setTab('logement')}>🏠 Votre logement</button>
          <button style={tabS(tab==='appareils')} onClick={() => setTab('appareils')}>⚡ Vos appareils</button>
        </div>

        {tab === 'logement' && (
          <>
            <div className="card" style={{ padding: '16px', marginBottom: 10 }}>
              <div style={sec}>Type de logement</div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => setTypeLogement(v => v==='maison'?null:'maison')} style={bS(typeLogement==='maison')}>
                  <div style={{ fontSize: 26, marginBottom: 5 }}>🏠</div>
                  <div style={lS(typeLogement==='maison')}>Maison<br/>individuelle</div>
                </button>
                <button onClick={() => setTypeLogement(v => v==='collectif'?null:'collectif')} style={bS(typeLogement==='collectif')}>
                  <div style={{ fontSize: 26, marginBottom: 5 }}>🏢</div>
                  <div style={lS(typeLogement==='collectif')}>En collectif<br/>(appartement)</div>
                </button>
              </div>
            </div>

            <div className="card" style={{ padding: '16px', marginBottom: 10 }}>
              <div style={sec}>Situation</div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => setStatut(v => v==='locataire'?null:'locataire')} style={bS(statut==='locataire')}>
                  <div style={{ fontSize: 26, marginBottom: 5 }}>🔑</div>
                  <div style={lS(statut==='locataire')}>Locataire</div>
                </button>
                <button onClick={() => setStatut(v => v==='proprietaire'?null:'proprietaire')} style={bS(statut==='proprietaire')}>
                  <div style={{ fontSize: 26, marginBottom: 5 }}>📜</div>

// ─── OnboardingTypeform ───────────────────────
// Questionnaire « une question par écran », auto-avance au clic (pas de bouton valider),
// transition slide. Affiché juste après la signature du consentement, pendant la collecte
// ENEDIS. Persiste les mêmes champs flex_* que ThermaleForm puis envoie vers « Comprendre ».
const ONBOARDING_QUESTIONS = [
  { key:'chauffage', title:'Comment chauffez-vous votre logement ?', cols:3, options:[
    { value:'elec',  emoji:'⚡',  label:'Électrique' },
    { value:'pac',   emoji:'♨️',  label:'Pompe à chaleur' },
    { value:'autre', emoji:'🔥',  label:'Autre' },
  ]},
  { key:'ecs', title:'Et votre eau chaude sanitaire ?', cols:2, options:[
    { value:'elec',  emoji:'⚡',  label:'Électrique' },
    { value:'autre', emoji:'🔥',  label:'Autre' },
  ]},
  { key:'surface', title:'Quelle est la surface de votre logement ?', cols:3, options:[
    { value:'small',  emoji:'🏠', label:'< 70 m²' },
    { value:'medium', emoji:'🏡', label:'70–150 m²' },
    { value:'large',  emoji:'🏰', label:'> 150 m²' },
  ]},
  { key:'type_logement', title:'Vous habitez…', cols:2, options:[
    { value:'maison',    emoji:'🏠', label:'Une maison individuelle' },
    { value:'collectif', emoji:'🏢', label:'En collectif (appartement)' },
  ]},
  { key:'statut', title:'Vous êtes…', cols:2, options:[
    { value:'locataire',    emoji:'🔑', label:'Locataire' },
    { value:'proprietaire', emoji:'📜', label:'Propriétaire' },
  ]},
];

function OnboardingTypeform({ siteId, onDone }) {
  const [step,    setStep]    = useState(0);
  const [answers, setAnswers] = useState({});
  const [busy,    setBusy]    = useState(false); // bloque les clics pendant l'auto-avance
  const advanceRef = useRef(null);
  useEffect(() => () => clearTimeout(advanceRef.current), []);

  const q = ONBOARDING_QUESTIONS[step];
  const total = ONBOARDING_QUESTIONS.length;

  const finish = async (allAnswers) => {
    const { chauffage=null, ecs=null, surface=null, type_logement=null, statut=null } = allAnswers;
    const idx = surface === 'small' ? 0 : surface === 'medium' ? 1 : 2;
    let kw = 0;
    if (chauffage === 'elec' || chauffage === 'pac') kw += [3, 7, 12][idx];
    if (ecs === 'elec') kw += [2, 3, 4][idx];
    try {
      const d = JSON.parse(localStorage.getItem('starvolt_solar_defaults') || '{}');
      d.thermKwh = String(kw);
      localStorage.setItem('starvolt_solar_defaults', JSON.stringify(d));
    } catch {}
    if (siteId) {
      try {
        await sb.from('sites').update({ flex_chauffage:chauffage, flex_ecs:ecs, flex_surface:surface, flex_type_logement:type_logement, flex_statut:statut }).eq('id', siteId);
        localStorage.setItem('starvolt_flex_'+siteId, JSON.stringify({ chauffage, ecs, surface, type_logement, statut }));
      } catch {}
    }
    onDone?.();
  };

  const pick = (value) => {
    if (busy) return;
    setBusy(true);
    const next = { ...answers, [q.key]: value };
    setAnswers(next);
    advanceRef.current = setTimeout(() => {
      if (step + 1 >= total) { finish(next); return; }
      setStep(step + 1);
      setBusy(false);
    }, 320);
  };

  return (
    <div className="screen" style={{ display:'flex', flexDirection:'column', minHeight:'100vh', padding:'0 0 40px' }}>
      {/* progression */}
      <div style={{ display:'flex', gap:6, padding:'22px 18px 0' }}>
        {ONBOARDING_QUESTIONS.map((_, i) => (
          <div key={i} style={{
            flex:1, height:4, borderRadius:2,
            background: i <= step ? '#7dd940' : 'rgba(255,255,255,.12)',
            transition:'background .3s',
          }}/>
        ))}
      </div>

      <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center', padding:'0 18px' }}>
        <div key={step} className="slide-in-right">
          <div style={{ fontSize:9, letterSpacing:'.8px', color:'rgba(125,217,64,.85)', fontWeight:700, textTransform:'uppercase', marginBottom:10 }}>
            Question {step + 1} / {total}
          </div>
          <h1 style={{ fontSize:24, fontWeight:900, color:'white', lineHeight:1.25, margin:'0 0 26px' }}>{q.title}</h1>

          <div style={{ display:'grid', gridTemplateColumns:`repeat(${q.cols}, 1fr)`, gap:10 }}>
            {q.options.map(opt => {
              const active = answers[q.key] === opt.value;
              return (
                <button key={opt.value} onClick={() => pick(opt.value)} style={{
                  padding:'22px 8px', borderRadius:16,
                  border:`2px solid ${active ? '#7dd940' : 'rgba(255,255,255,.13)'}`,
                  background: active ? 'rgba(125,217,64,.13)' : 'rgba(255,255,255,.04)',
                  color:'white', cursor:'pointer', fontFamily:'inherit', textAlign:'center',
                  transition:'border-color .15s, background .15s, transform .1s',
                }}>
                  <div style={{ fontSize:34, marginBottom:10 }}>{opt.emoji}</div>
                  <div style={{ fontSize:13, fontWeight: active ? 800 : 600, color: active ? '#7dd940' : 'rgba(255,255,255,.82)', lineHeight:1.3 }}>{opt.label}</div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── BoxSimScreen ─────────────────────────────
function BoxSimScreen({ user, userProfile, onBack, onPanier, onMonSite, onCartUpdate }) {
  const [loading,      setLoading]      = useState(true);
  const [currentBill,  setCurrentBill]  = useState(null);
  const [isDynamic,    setIsDynamic]    = useState(false);
  const [chosen,       setChosen]       = useState(() => localStorage.getItem('starvolt_box_chosen') || null);
  const [justConfirmed,setJustConfirmed]= useState(false);
  const [showThermForm,setShowThermForm]= useState(false);
  const [activeSiteId, setActiveSiteId] = useState(null);
  const [siteFlex,     setSiteFlex]     = useState(null); // {chauffage,ecs,surface}
  const [shiftSaving,  setShiftSaving]  = useState(0);
  const [storageRatio, setStorageRatio] = useState(0.5);

  useEffect(() => {
    const siteId = localStorage.getItem('starvolt_active_site_id');
    if (!siteId) { setLoading(false); return; }
    Promise.all([
      sb.from('sites').select('id,conso_profil,tarif_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2,flex_chauffage,flex_ecs,flex_surface').eq('id', siteId).maybeSingle(),
      sb.from('tarifs_electricite').select('*'),
      sb.rpc('get_spot_json'),
      sb.from('parametres_nationaux').select('*').eq('id', 1).maybeSingle(),
    ]).then(([{ data: site }, { data: tariffs }, { data: spotRows }, { data: nat }]) => {
      if (!site?.conso_profil) { setLoading(false); return; }
      setActiveSiteId(siteId);
      const _lsFlex=(()=>{try{const v=localStorage.getItem('starvolt_flex_'+siteId);const p=v?JSON.parse(v):null;return(p?.chauffage&&p?.ecs&&p?.surface)?p:null;}catch{return null;}})();
      const _flex=_lsFlex||(site.flex_chauffage&&site.flex_ecs&&site.flex_surface?{chauffage:site.flex_chauffage,ecs:site.flex_ecs,surface:site.flex_surface}:null);
      if(_flex) setSiteFlex(_flex);
      const curTariff = site.tarif_id ? (tariffs || []).find(t => t.id === site.tarif_id) : null;
      const { kwh_hc, kwh_hp } = calcHcHp(site.conso_profil, site);
      const kwh_total = kwh_hc + kwh_hp;
      let bill = null;
      if (curTariff?.tarif_dynamique) {
        setIsDynamic(true);
        if (spotRows && nat) {
          const r = calcDynamicCost(curTariff, site.conso_profil, buildSpotMap(spotRows), nat, site);
          bill = r?.total || null;
        }
      } else if (curTariff) {
        bill = calcTariffCost(curTariff, kwh_hc, kwh_hp)?.total || null;
      }
      if (!bill && kwh_total > 0) bill = Math.round(kwh_total * 0.18);
      setCurrentBill(bill ? Math.round(bill) : null);
      // Gain réel du déplacement de consommation calculé heure par heure
      const solDef=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})();
      const bkv=parseFloat(solDef.batKwh)||0, tkv=parseFloat(solDef.thermKwh)||0;
      if (curTariff && (bkv > 0 || tkv > 0)) {
        const sp = spotRows ? buildSpotMap(spotRows) : null;
        const res = computeStorageOptimization(site.conso_profil, curTariff, curTariff, site, bkv, tkv, {...nat, opti_tarif:true}, sp);
        setShiftSaving(res?.saving || 0);
      }
      setStorageRatio((nat?.ratio_puissance_stockage ?? 50) / 100);
      setLoading(false);
    });
  }, []);

  const _solDef = (() => { try { return JSON.parse(localStorage.getItem('starvolt_solar_defaults')) || {}; } catch { return {}; } })();
  const thermKwhFlex = parseFloat(_solDef.thermKwh) || 10;
  const batKwhFlex   = parseFloat(_solDef.batKwh)   || 10;
  const flexGain  = Math.round(thermKwhFlex * 14 + batKwhFlex * storageRatio * 27);
  const shiftGain = shiftSaving > 0 ? shiftSaving : null;
  const totalGain = flexGain + (shiftGain || 0);
  const newBill   = currentBill ? Math.round(currentBill - (shiftGain || 0)) : null;

  // Helper : calcule thermKwh depuis les données flex déjà connues
  const applyExistingFlex=(flex)=>{
    const idx=flex.surface==='small'?0:flex.surface==='medium'?1:2;
    let kw=0;
    if(flex.chauffage==='elec'||flex.chauffage==='pac') kw+=[3,7,12][idx];
    if(flex.ecs==='elec') kw+=[2,3,4][idx];
    try{const d=JSON.parse(localStorage.getItem('starvolt_solar_defaults')||'{}');d.thermKwh=String(kw);localStorage.setItem('starvolt_solar_defaults',JSON.stringify(d));}catch{}
    return kw;
  };

  if (showThermForm) {
    return <ThermaleForm
      siteId={activeSiteId}
      initial={siteFlex}
      onBack={() => setShowThermForm(false)}
      onDone={(kw) => {
        const _bkv = parseFloat((()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})().batKwh)||0;
        const fg = Math.round(kw * 14 + _bkv * storageRatio * 27);
        const boxSav = fg + (shiftSaving || 0);
        if (boxSav > 0) localStorage.setItem('starvolt_box_saving', String(boxSav));
        localStorage.removeItem('starvolt_baisse_facture');
        setSiteFlex(null); setShowThermForm(false); setJustConfirmed(true); if(onCartUpdate) onCartUpdate();
      }}

  }

  if (justConfirmed) {
    return (
      <>
      <div className="screen fade-in">
        <Fireworks final/>
        <div style={{ textAlign:'center', marginBottom:16 }}>
          <div style={{ fontSize:38, marginBottom:4 }}>{chosen === 'buy' ? '📦' : '🎁'}</div>

// ─── InstallSoiMemeScreen ──────────────────────
function InstallSoiMemeScreen({ user, userProfile, onBack, onPanier, onMonSite, onCartUpdate }) {
  const [loading,     setLoading]   = useState(true);
  const [prixMat,     setPrixMat]   = useState(null);
  const [siteId,      setSiteId]    = useState(null);
  const [siteFlex,    setSiteFlex]  = useState(null); // flex déjà rempli
  const [step,        setStep]      = useState('therm'); // 'therm' | 'catalog' | 'confirmed'
  const [theorKw,     setTheorKw]   = useState(0);
  const [qty,         setQty]       = useState({});
  const [showWarn,    setShowWarn]  = useState(false);

  useEffect(() => {
    const sid = localStorage.getItem('starvolt_active_site_id');
    setSiteId(sid);
    Promise.all([
      sb.from('prix_materiaux').select('*').eq('id',1).maybeSingle(),
      sid ? sb.from('sites').select('id,flex_chauffage,flex_ecs,flex_surface,flex_type_logement,flex_statut').eq('id',sid).maybeSingle() : Promise.resolve({data:null}),
    ]).then(([{data:pm},{data:site}]) => {
      setPrixMat(pm);
      // Vérifier si le formulaire équipements est déjà rempli
      const lsFlex = sid ? (()=>{try{const v=localStorage.getItem('starvolt_flex_'+sid);const p=v?JSON.parse(v):null;return(p?.chauffage&&p?.ecs&&p?.surface)?p:null;}catch{return null;}})() : null;
      const flex = lsFlex || (site?.flex_chauffage&&site?.flex_ecs&&site?.flex_surface ? {chauffage:site.flex_chauffage,ecs:site.flex_ecs,surface:site.flex_surface,type_logement:site.flex_type_logement,statut:site.flex_statut} : null);
      if (flex) {
        setSiteFlex(flex);
        // Calculer la capacité théorique depuis les données existantes
        const idx = flex.surface==='small'?0:flex.surface==='medium'?1:2;
        let kw = 0;
        if(flex.chauffage==='elec'||flex.chauffage==='pac') kw += [3,7,12][idx];
        if(flex.ecs==='elec') kw += [2,3,4][idx];
        setTheorKw(kw);
        setStep('catalog'); // formulaire déjà rempli → aller directement au catalogue

      setLoading(false);
    });
  }, []);

  const chg = (k, delta) => setQty(q => ({...q, [k]: Math.max(0, (q[k]||0) + delta)}));
  const CHKBG = 'repeating-conic-gradient(rgba(255,255,255,.06) 0% 25%,transparent 0% 50%) 0 0/8px 8px';

    { diyFlag:'diy_box_prix',          priceKey:'box_prix',          imgKey:'img_box_prix',         label:'Box Comwatt',           kw:6, emoji:'📦' },

    { diyFlag:'diy_box_pinces',        priceKey:'box_pinces',        imgKey:'img_box_pinces',        label:'Pinces forte puissance', kw:0, emoji:'🔗' },

// ─── SolarSimScreen ───────────────────────────
function SolarSimScreen({ user, userProfile, onBack, onPanier, onMonSite, onCartUpdate }) {
  const [loading,      setLoading]      = useState(true);
  const [currentBill,  setCurrentBill]  = useState(null);
  const [adjustedBill, setAdjustedBill] = useState(null);
  const [isDynamic,    setIsDynamic]    = useState(false);
  const [chosen,       setChosen]       = useState(() => localStorage.getItem('starvolt_solar_chosen') || null);
  const [justConfirmed,setJustConfirmed]= useState(false);
  const [showThermForm,setShowThermForm]= useState(false);
  const [activeSiteId, setActiveSiteId] = useState(null);
  const [siteFlex,     setSiteFlex]     = useState(null);
  // Params installation — init depuis starvolt_solar_defaults (source partagée avec Ma prod)
  const [pvKwc,    setPvKwc]    = useState(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))?.pvKwc||'6';}catch{return'6';}});
  const [batKwh,   setBatKwh]   = useState(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))?.batKwh||'10';}catch{return'10';}});
  const [thermKwh, setThermKwh] = useState(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))?.thermKwh||'5';}catch{return'5';}});

  // Persister les valeurs dans localStorage → Ma prod peut les copier comme defaults
  useEffect(()=>{
    localStorage.setItem('starvolt_solar_defaults',JSON.stringify({pvKwc,batKwh,thermKwh}));
  },[pvKwc,batKwh,thermKwh]);

  // Données pour calcul réel
  const [siteRef,    setSiteRef]    = useState(null);  // {conso_profil, currentBill, curTariff, site}
  const [prodData,   setProdData]   = useState(null);
  const [globalVars, setGlobalVars] = useState(null);
  const [realSaving, setRealSaving] = useState(null);
  const [autoPct,    setAutoPct]    = useState(null);

  useEffect(() => {
    const siteId = localStorage.getItem('starvolt_active_site_id');
    if (!siteId) { setLoading(false); return; }
    setActiveSiteId(siteId);
    Promise.all([
      sb.from('sites').select('id,conso_profil,conso_annuelle_kwh,tarif_id,profil_production_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2,flex_chauffage,flex_ecs,flex_surface').eq('id', siteId).maybeSingle(),
      sb.from('tarifs_electricite').select('*'),
      sb.rpc('get_spot_json'),
      sb.from('parametres_nationaux').select('*').eq('id', 1).maybeSingle(),
    ]).then(async ([{ data: site }, { data: tariffs }, { data: spotRows }, { data: nat }]) => {
      const _lsFlexS=(()=>{try{const v=localStorage.getItem('starvolt_flex_'+siteId);const p=v?JSON.parse(v):null;return(p?.chauffage&&p?.ecs&&p?.surface)?p:null;}catch{return null;}})();
      const _flexS=_lsFlexS||(site?.flex_chauffage&&site.flex_ecs&&site.flex_surface?{chauffage:site.flex_chauffage,ecs:site.flex_ecs,surface:site.flex_surface}:null);
      if(_flexS) setSiteFlex(_flexS);
      if (!site?.conso_profil) { setLoading(false); return; }
      const curTariff = site.tarif_id ? (tariffs || []).find(t => t.id === site.tarif_id) : null;
      const { kwh_hc, kwh_hp } = calcHcHp(site.conso_profil, site);
      const kwh_total = kwh_hc + kwh_hp;
      // Utiliser conso_annuelle_kwh (DB) pour cohérence avec l'affichage Ma conso
      const siteKwh = site.conso_annuelle_kwh || kwh_total;
      let bill = null;
      if (curTariff?.tarif_dynamique) {
        setIsDynamic(true);
        if (spotRows && nat) {
          const r = calcDynamicCost(curTariff, site.conso_profil, buildSpotMap(spotRows), nat, site);
          bill = r?.total || null;
        }
      } else if (curTariff && siteKwh > 0) {
        // Même formule que MonSiteScreen : abo + conso_annuelle_kwh * prix_hp
        bill = Math.round((curTariff.abo_annuel||0) + siteKwh * (curTariff.prix_hp||0));
      }
      if (!bill && siteKwh > 0) bill = Math.round(siteKwh * 0.18);
      const roundedBill = bill ? Math.round(bill) : null;
      const optiSavLS = parseInt(localStorage.getItem('starvolt_optimisation_saving')||'0');
      // Charger le profil de production en premier (utilisé pour accSavComp + calcul solaire)
      let _pp = null;
      if (site.profil_production_id) {
        const { data: ppData } = await sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single();
        _pp = ppData?.profil || null;
        if (_pp) setProdData(_pp);
      }
      let accSavComp = 0;
      if (site.conso_profil) {
        let kwh918 = 0;
        for (let m=1;m<=12;m++) for (let d=1;d<=PROF_DAYS[m-1];d++) for (let h=0;h<24;h++) {
          const idx=profIdx(m,d,h);
          if (_pp ? !(_pp[idx]>0) : (h<9||h>=18)) continue;
          kwh918+=(site.conso_profil[idx]||0)/1000;
        }
        accSavComp = Math.max(0, Math.round(kwh918*((curTariff?.prix_hp||0.24)-0.11)));
      }
      const adj = roundedBill ? Math.max(0, roundedBill - optiSavLS - accSavComp) : null;
      setCurrentBill(roundedBill);
      setAdjustedBill(adj || roundedBill);
      setGlobalVars(nat);
      setSiteRef({ conso_profil: site.conso_profil, currentBill: roundedBill, curTariff, site, kwh_total: siteKwh, kwh_hc, kwh_hp });
      setLoading(false);
    });
  }, []);

  // Calcul réel des économies solaires heure par heure
  useEffect(() => {
    if (!siteRef?.conso_profil || !prodData) return;
    const gv = globalVars || {};
    const ratioBat   = (gv.ratio_puissance_stockage              ?? 50) / 100;
    const ratioTherm = (gv.ratio_puissance_stockage_thermique    ?? 50) / 100;
    const pBat   = gv.pertes_batterie   ?? 10;
    const pTherm = gv.pertes_thermique  ?? 0;
    const kw  = parseFloat(pvKwc)   || 0;
    const bk  = parseFloat(batKwh)  || 0;
    const tk  = parseFloat(thermKwh)|| 0;
    const bal = computeEnergyBalance(
      siteRef.conso_profil, prodData, kw,
      bk * ratioBat  * 1000, bk, pBat,
      tk * ratioTherm,       tk, pTherm
    );
    const gridBuy = bal.monthly.reduce((s,m) => s + m.grid_buy, 0);
    const injKwh = bal.monthly.reduce((s,m) => s + m.injection, 0);
    const { kwh_total, currentBill } = siteRef;
    const prixMoyen = kwh_total > 0 && currentBill ? currentBill / kwh_total : 0.18;
    const prixRachat = gv.prix_rachat_injection ?? 0.04;
    // Formule directe Greg : nouvFact = achat_réseau × prixMoyen - injection × prixRachat
    // Évite le double-comptage de on_site + via_bat + via_therm dans computeEnergyBalance
    const nouvFact = Math.max(0, gridBuy * prixMoyen - injKwh * prixRachat);
    const saving = Math.max(0, Math.round(currentBill - nouvFact));
    const trueAutoKwh = Math.max(0, kwh_total - gridBuy);
    if(saving > 0) localStorage.setItem('starvolt_baisse_facture', String(saving));
    setRealSaving(saving > 0 ? saving : null);
    setAutoPct(kwh_total > 0 ? Math.round(trueAutoKwh / kwh_total * 100) : 0);
  }, [pvKwc, batKwh, thermKwh, siteRef, prodData, globalVars]);

  // Gains solaires (fallback %-based si pas de profil prod)
  const solarBoxSaving = adjustedBill ? Math.round(adjustedBill * 0.70) : null;
  const baisseFactureLS = parseInt(localStorage.getItem('starvolt_baisse_facture')||'0') || null;
  const finalSolarSaving = realSaving ?? baisseFactureLS ?? solarBoxSaving;

  // Gains box (rappel)
  const shiftPct  = isDynamic ? 0.20 : 0.10;
  const shiftGain = currentBill ? Math.round(currentBill * shiftPct) : null;

  // Helper : calcule thermKwh depuis flex existant
  const applyExistingFlexSolar=(flex)=>{
    const idx=flex.surface==='small'?0:flex.surface==='medium'?1:2;
    let kw=0;
    if(flex.chauffage==='elec'||flex.chauffage==='pac') kw+=[3,7,12][idx];
    if(flex.ecs==='elec') kw+=[2,3,4][idx];
    try{const d=JSON.parse(localStorage.getItem('starvolt_solar_defaults')||'{}');d.thermKwh=String(kw);localStorage.setItem('starvolt_solar_defaults',JSON.stringify(d));}catch{}
    setThermKwh(String(kw));
  };

  if (showThermForm) {
    return <ThermaleForm
      siteId={activeSiteId}
      initial={siteFlex}
      onBack={() => setShowThermForm(false)}
      onDone={(kw) => { setThermKwh(String(kw)); setSiteFlex(null); setShowThermForm(false); setJustConfirmed(true); if(onCartUpdate) onCartUpdate(); }}
    />;
  }

  if (justConfirmed) {
    return (
      <>
      <div className="screen fade-in">
        <Fireworks final/>
        <div style={{ textAlign:'center', marginBottom:16 }}>
          <div style={{ fontSize:38, marginBottom:4 }}>☀️</div>
          <div style={{ fontSize:22, fontWeight:900, color:'white', lineHeight:1.2 }}>
            Solaire + Box activés !
          </div>
          <div style={{ fontSize:13, color:'rgba(255,255,255,.5)', marginTop:6 }}>
            Un conseiller Starvolt vous contacte sous 48h pour l'étude personnalisée.
          </div>
        </div>

        {currentBill && (
          <div className="card" style={{ padding:'16px', marginBottom:10, textAlign:'center' }}>
            <div style={{ fontSize:11, color:'rgba(255,255,255,.4)', marginBottom:10, textTransform:'uppercase', letterSpacing:'.5px' }}>Votre facture évolue</div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:18, marginBottom:14 }}>
              <div>
                <div style={{ fontSize:28, fontWeight:900, color:'rgba(255,100,100,.7)', textDecoration:'line-through', lineHeight:1 }}>
                  {currentBill.toLocaleString('fr-FR')} €
                </div>
                <div style={{ fontSize:10, color:'rgba(255,255,255,.35)', marginTop:3 }}>AVANT</div>
              </div>
              <div style={{ fontSize:22, color:'#7dd940' }}>→</div>
              <div>
                <div style={{ fontSize:36, fontWeight:900, color:'#7dd940', lineHeight:1 }}>
                  {currentBill && finalSolarSaving ? (currentBill - finalSolarSaving).toLocaleString('fr-FR') : '—'} €
                </div>
                <div style={{ fontSize:10, color:'rgba(255,255,255,.35)', marginTop:3 }}>APRÈS SOLAIRE + BOX</div>
              </div>
            </div>
            <div style={{ background:'rgba(255,255,255,.05)', borderRadius:8, padding:'10px 12px' }}>
              <div style={{ fontSize:11, color:'rgba(255,255,255,.5)', marginBottom:2 }}>Baisse de la facture électrique</div>
              <div style={{ fontSize:24, fontWeight:900, color:'#7dd940' }}>-{finalSolarSaving?.toLocaleString('fr-FR')} €TTC/an</div>
              {autoPct !== null && <div style={{ fontSize:10, color:'rgba(255,255,255,.35)', marginTop:2 }}>{autoPct}% d'autoproduction · solaire + batterie + Box Comwatt</div>}
            </div>
          </div>
        )}

        <div className="card" style={{ padding:'14px 16px', border:'1px solid rgba(125,217,64,.25)' }}>
          <div style={{ fontWeight:700, fontSize:13, color:'#7dd940', marginBottom:6 }}>✦ Prochaine étape</div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,.6)' }}>
            Notre expert réalise une étude de votre toiture et dimensionne votre installation. Gratuit et sans engagement.
          </div>
        </div>
      </div>
      <StickyFooter row onBack={onBack}>
        <button className="btn btn-yes" onClick={onMonSite||onPanier}>Mon site →</button>
      </StickyFooter>
      </>
    );
  }

  return (
    <>
      <div className="screen fade-in">

        {/* ── 1. Titre ── */}
        <div style={{ marginBottom:16, marginTop:4 }}>
          <div style={{ fontSize:9, letterSpacing:'.8px', color:'rgba(125,217,64,.85)', fontWeight:700, textTransform:'uppercase', marginBottom:6 }}>Simulation</div>
          <div style={{ fontSize:20, fontWeight:900, color:'white', lineHeight:1.2 }}>
            Gagnez{' '}
            {finalSolarSaving
              ? <span className="accent">{finalSolarSaving.toLocaleString('fr-FR')} €/an</span>
              : <span className="accent">jusqu'à 70%</span>
            }{' '}
            grâce au solaire et aux batteries Comwatt
          </div>
        </div>

        {loading ? (
          <div style={{ textAlign:'center', padding:40 }}><div className="spinner" style={{ margin:'0 auto' }}/></div>
        ) : (<>

          {/* ── 2. Baisse de la facture ── */}
          {(()=>{
            const displayed = realSaving ?? (parseInt(localStorage.getItem('starvolt_baisse_facture')||'0') || null);
            if(!displayed) return null;
            return (
              <div className="card" style={{ padding:'12px 14px', marginBottom:10 }}>
                <div style={{ fontSize:10, color:'rgba(255,255,255,.4)', fontWeight:700, letterSpacing:'.5px', marginBottom:6 }}>BAISSE DE LA FACTURE</div>
                <div style={{ display:'flex', alignItems:'baseline', gap:10, flexWrap:'wrap', marginBottom:4 }}>
                  <div style={{ fontSize:24, fontWeight:900, color:'#7dd940' }}>-{displayed.toLocaleString('fr-FR')} €TTC/an</div>
                  {currentBill && (()=>{const pct=Math.min(100,Math.round(displayed/currentBill*100));return(<div style={{fontSize:16,fontWeight:700,color:'#7dd940'}}>-{pct}%</div>);})()}
                </div>
                {currentBill && <div style={{fontSize:12,color:'rgba(255,255,255,.35)'}}>Nouvelle facture estimée : {Math.max(0,currentBill-displayed).toLocaleString('fr-FR')} €/an (vs {currentBill.toLocaleString('fr-FR')} €)</div>}
              </div>
            );
          })()}

          {/* ── 3. Énergie potagère ── */}
          <div className="card" style={{ padding:'18px 16px', marginBottom:12 }}>
            <div style={{ display:'flex', alignItems:'center', gap:16 }}>
              <img src="/energie-potagere.png" alt="Énergie potagère" style={{ width:64, height:64, flexShrink:0, filter:'brightness(0) invert(1)', objectFit:'contain' }}/>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:16, fontWeight:800, color:'white', marginBottom:8, lineHeight:1.3 }}>
                  L'énergie <span className="accent">potagère</span>
                </div>
                <div style={{ fontSize:14, color:'rgba(255,255,255,.65)', lineHeight:1.6 }}>
                  Installation simple et rapide afin de rejoindre la famille des petits producteurs qui échangent l'électricité entre eux — c'est ce que nous appelons <strong style={{color:'white'}}>l'énergie potagère</strong>.
                </div>
              </div>
            </div>
          </div>

          {/* ── 4. Solaire + batterie + Box Comwatt ── */}
          <div className="card" style={{ padding:'18px 16px', marginBottom:12, border:'1.5px solid rgba(125,217,64,.4)' }}>
            <div style={{ display:'flex', alignItems:'flex-start', gap:14 }}>
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, flexShrink:0 }}>
                <img src="/maison.png" alt="Solaire" style={{ width:36, height:36, filter:'brightness(0) invert(1)', objectFit:'contain' }}/>
                <img src="/batterie.png" alt="Batterie" style={{ width:30, height:30, filter:'brightness(0) invert(1)', objectFit:'contain' }}/>
                <img src="/comwatt-box.png" alt="Box" style={{ width:36, height:36, objectFit:'contain', borderRadius:6 }}/>
              </div>
              <div>
                <div style={{ fontWeight:900, fontSize:17, color:'white', marginBottom:6 }}>
                  Gagnez{' '}
                  <span style={{color:'#7dd940'}}>
                    {finalSolarSaving !== null ? `${finalSolarSaving.toLocaleString('fr-FR')} €` : 'jusqu\'à 70%'}
                  </span>{' '}
                  avec solaire + batterie + Box Comwatt
                </div>
                <div style={{ fontSize:14, color:'rgba(255,255,255,.65)', lineHeight:1.55 }}>
                  La Box Comwatt orchestre votre installation : flexibilité réseau, autoconsommation collective, optimisation tarifaire. Ensemble, ils réduisent significativement votre facture.
                </div>
              </div>
            </div>
          </div>

        </>)}
      </div>

      {!loading && (
        chosen ? (
          <StickyFooter row onBack={onBack}>
            <button className="btn btn-yes" onClick={onMonSite||onPanier}>Mon site →</button>
          </StickyFooter>
        ) : (
          <StickyFooter onBack={onBack}>
            <button className="btn btn-yes" onClick={() => { localStorage.setItem('starvolt_solar_chosen','solar_box'); try{const d=JSON.parse(localStorage.getItem('starvolt_solar_defaults')||'{}');localStorage.setItem('starvolt_solar_defaults',JSON.stringify({...d,pvKwc:'6',batKwh:'10'}));}catch{localStorage.setItem('starvolt_solar_defaults',JSON.stringify({pvKwc:'6',batKwh:'10',thermKwh:'0'}));} setPvKwc('6'); setBatKwh('10'); if(solarBoxSaving) localStorage.setItem('starvolt_solar_saving',String(solarBoxSaving)); localStorage.removeItem('starvolt_box_chosen'); localStorage.removeItem('starvolt_box_saving'); setPanierServicesChecked({opti_solaire:true,opti_tarif:true,opti_flex:true}); setChosen('solar_box'); if(siteFlex){applyExistingFlexSolar(siteFlex);setJustConfirmed(true);if(onCartUpdate)onCartUpdate();}else{setShowThermForm(true);} }}>
              ☀️ Je veux des panneaux + batterie + Box
            </button>
          </StickyFooter>
        )
      )}
    </>
  );
}

// ─── PanierScreen ─────────────────────────────
function PanierScreen({ user, onBack, onGoTo, onMonSite }) {
  const [loading,     setLoading]     = useState(true);
  const [currentBill, setCurrentBill] = useState(null);
  const [isDynamic,   setIsDynamic]   = useState(false);
  const [taux,        setTaux]        = useState(4);
  const [taux2,       setTaux2]       = useState(0);
  const [impact,      setImpact]      = useState(null);
  const [validated,   setValidated]   = useState(false);
  const [items,       setItems]       = useState(() => ({
    optimisation: !!localStorage.getItem('starvolt_optimisation_chosen'),
    acc:          localStorage.getItem('starvolt_acc_chosen') === 'true',
    box:          !!localStorage.getItem('starvolt_box_chosen') && localStorage.getItem('starvolt_box_chosen') !== 'diy',
    diy:          !!localStorage.getItem('starvolt_diy_box_chosen'),
    solar:        !!localStorage.getItem('starvolt_solar_chosen'),
  }));

  const boxChoice   = localStorage.getItem('starvolt_box_chosen');
  const solarChoice = localStorage.getItem('starvolt_solar_chosen');
  const diyTotal    = (() => { try { return JSON.parse(localStorage.getItem('starvolt_diy_box_chosen')||'{}').total || 0; } catch { return 0; } })();
  const investments = { optimisation:0, acc:0, box: boxChoice==='buy' ? 600 : 0, diy: diyTotal, solar:13000 };
  const investLS = parseInt(localStorage.getItem('starvolt_investissement_total')||'0') || 0;

  useEffect(() => {
    const siteId = localStorage.getItem('starvolt_active_site_id');
    if (!siteId) { setLoading(false); return; }
    Promise.all([
      sb.from('sites').select('id,conso_profil,conso_annuelle_kwh,tarif_id,profil_production_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2,hc_debut1,hc_fin1,hc_debut2,hc_fin2').eq('id', siteId).maybeSingle(),
      sb.from('tarifs_electricite').select('*'),
      sb.rpc('get_spot_json'),
      sb.from('parametres_nationaux').select('*').eq('id',1).maybeSingle(),
    ]).then(async ([{ data:site }, { data:tariffs }, { data:spotRows }, { data:nat }]) => {
      if (!site?.conso_profil) { setLoading(false); return; }
      if (nat?.taux_inflation_electricite)   setTaux(Number(nat.taux_inflation_electricite));
      if (nat?.taux_inflation_electricite_2 != null) setTaux2(Number(nat.taux_inflation_electricite_2));

      const { kwh_hc, kwh_hp } = calcHcHp(site.conso_profil, site);
      const kwh_total = kwh_hc + kwh_hp;
      const curTariff = site.tarif_id ? (tariffs||[]).find(t=>t.id===site.tarif_id) : null;

      let bill = null; let isDyn = false;
      if (curTariff?.tarif_dynamique) {
        isDyn = true; setIsDynamic(true);
        if (spotRows && nat) {
          const r = calcDynamicCost(curTariff, site.conso_profil, buildSpotMap(spotRows), nat, site);
          bill = r?.total || null;
        }
      } else if (curTariff) {
        bill = calcTariffCost(curTariff, kwh_hc, kwh_hp)?.total || null;
      }
      if (!bill && kwh_total > 0) bill = Math.round(kwh_total * 0.18);
      bill = bill ? Math.round(bill) : null;
      // Charger le profil de production une fois (ACC + projection solaire)
      let _prodProfil = null;
      if (site.profil_production_id) {
        const { data: pp } = await sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single();
        _prodProfil = pp?.profil || null;
      }
      // SOURCE UNIQUE : même moteur intégré que "Mon site" (buildSiteBalance + deriveSiteImpact)
      // gv = nat + override opti_* depuis le cache (sinon flags périmés → divergence)
      const gv = mergeGlobalVars(nat);
      const spotMap = spotRows ? buildSpotMap(spotRows) : null;
      const eq = resolveCartEquipment(site);
      const balance = buildSiteBalance({ site, prodProfil:_prodProfil, tariffs, spotMap, globalVars:gv, pvKwc:eq.pvKwc, batKwh:eq.batKwh, thermKwh:eq.thermKwh });
      const imp = deriveSiteImpact({ balance, site, prodProfil:_prodProfil, tariffs, spotMap, globalVars:gv, batKwh:eq.batKwh, thermKwh:eq.thermKwh });
      setCurrentBill(imp.billAvant != null ? Math.round(imp.billAvant) : bill);
      setImpact(imp);
      setLoading(false);
    });
  }, []);

  const removeItem = (key) => {
    const removes = {
      optimisation: ['starvolt_optimisation_chosen','starvolt_optimisation_saving','starvolt_optimisation_tariff_id'],
      acc:          ['starvolt_acc_chosen'],
      box:          ['starvolt_box_chosen','starvolt_box_saving','starvolt_investissement_total'],
      diy:          ['starvolt_diy_box_chosen','starvolt_box_chosen','starvolt_investissement_total'],
      solar:        ['starvolt_solar_chosen','starvolt_solar_saving','starvolt_investissement_total'],
    };
    removes[key].forEach(k => localStorage.removeItem(k));
    setItems(s => ({...s, [key]: false}));
  };

  const clearPanier = () => {
    clearPanierLS(); // vide LS + solar_defaults + dispatch starvolt_panier_cleared
    setItems({ optimisation:false, acc:false, box:false, diy:false, solar:false });
    // Réinitialise les services cochés quand on vide le panier
    sb.from('parametres_nationaux').upsert({id:1,opti_solaire:true,opti_tarif:true,opti_flex:false,opti_acc:false},{onConflict:'id'});
  };

  // Année 1 = pas d'inflation ; année N = (N-1) augmentations
  const projYear = (n, bill) => {
    if (!bill) return 0;
    if (n <= 10) return Math.round(bill * Math.pow(1 + taux/100, n - 1));
    const bill10 = bill * Math.pow(1 + taux/100, 9); // 9 hausses jusqu'en année 10
    return Math.round(bill10 * Math.pow(1 + taux2/100, n - 10));
  };
  const projCum = (bill) => {
    let s = 0;
    for (let n = 1; n <= 25; n++) s += projYear(n, bill);
    return Math.round(s);
  };
  // Projection "avec action" : la facture nette après action est indexée sur l'inflation
  const projBilledAfter = (n) => projYear(n, billedAfter);
  const projCumBilledAfter = () => {
    let s = 0;
    for (let n = 1; n <= 25; n++) s += projBilledAfter(n);
    return Math.round(s);
  };

  const activeItems        = Object.entries(items).filter(([,v])=>v);
  // SOURCE UNIQUE : réduction issue du moteur intégré (identique à "Mon site")
  const totalAnnualSaving  = Math.round(impact?.totalSaving || 0);
  // investLS est calculé par Mon site (PV + bat + box fournis+posés) — on l'utilise seulement si solar ou box (non-DIY) au panier
  const _hasSolarOrBox = items.solar || items.box;
  const totalInvestment    = (_hasSolarOrBox && investLS) ? investLS : activeItems.reduce((s,[k])=>s+(investments[k]||0),0);
  const billedAfter        = impact?.billApresNet != null ? Math.max(0, Math.round(impact.billApresNet)) : (currentBill ? Math.max(0, currentBill - totalAnnualSaving) : null);
  const roiGlobal          = totalInvestment > 0 && totalAnnualSaving > 0 ? Math.ceil(totalInvestment / totalAnnualSaving) : null;
  const gainNet25          = currentBill ? Math.max(0, projCum(currentBill) - projCumBilledAfter() - totalInvestment) : 0;
  const itemsCount         = activeItems.length;

  if (validated) {
    return (
      <>
      <div className="screen fade-in">
        <Fireworks final/>
        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:48,marginBottom:10}}>🛒</div>
          <div style={{fontSize:26,fontWeight:900,color:'white',lineHeight:1.2}}>Projet validé !</div>
          <div style={{fontSize:18,color:'rgba(255,255,255,.85)',marginTop:10,lineHeight:1.6}}>
            Un conseiller Starvolt vous contacte<br/>sous 48h pour finaliser votre projet.
          </div>
        </div>
        {gainNet25 > 0 && (
          <div className="card" style={{padding:'22px 18px',textAlign:'center',border:'1.5px solid rgba(125,217,64,.4)',marginBottom:14}}>
            <div style={{fontSize:16,color:'rgba(255,255,255,.8)',marginBottom:6}}>Gain net estimé sur 25 ans</div>
            <div style={{fontSize:38,fontWeight:900,color:'#7dd940'}}>{fmtGrand(gainNet25)} €</div>
            {roiGlobal && <div style={{fontSize:16,color:'rgba(255,210,80,.9)',marginTop:6,fontWeight:700}}>Retour sur investissement : {roiGlobal} an{roiGlobal>1?'s':''}</div>}
          </div>
        )}
        <div className="card" style={{padding:'18px 16px',border:'1px solid rgba(125,217,64,.2)'}}>

// ─── AdminProductionScreen ────────────────────
function AdminProductionScreen({ onBack }) {
  const [profils, setProfils] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importStep, setImportStep] = useState(null); // null | 'form'
  const [parsedData, setParsedData] = useState(null);
  const [nom, setNom] = useState('');
  const [adresse, setAdresse] = useState('');
  const [saving, setSaving] = useState(false);
  const [importMsg, setImportMsg] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const fileRef = useRef(null);

  const load = async () => {
    const { data } = await sb.from('profils_production').select('*').order('created_at', { ascending: false });
    setProfils(data || []);
  };
  useEffect(() => { load(); }, []);

  const handleFile = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setImporting(true); setImportMsg(null);
    try {
      const result = await processProductionXLS(await file.arrayBuffer());
      if (result.error) { setImportMsg({ type:'err', text: result.error }); return; }
      setParsedData(result);
      setNom(''); setAdresse('');
      setImportStep('form');
    } catch(err) { setImportMsg({ type:'err', text: String(err) }); }
    finally { setImporting(false); if (fileRef.current) fileRef.current.value = ''; }
  };

  const handleSave = async () => {
    if (!nom.trim() || !parsedData) return;
    setSaving(true);
    let lat = null, lon = null;
    if (adresse.trim()) {
      try {
        const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(adresse.trim())}&limit=1`);
        const j = await r.json();
        if (j.features?.[0]) { [lon, lat] = j.features[0].geometry.coordinates; }
      } catch(_) {}
    }
    await sb.from('profils_production').insert({
      nom: nom.trim(),
      adresse: adresse.trim() || null,
      latitude: lat,
      longitude: lon,
      profil: parsedData.profile,
    });
    setImportStep(null); setParsedData(null);
    setImportMsg({ type:'ok', text: `Profil "${nom.trim()}" importé (${Math.round(parsedData.annualKwh)} kWh/an·kWc, max ${Math.round(parsedData.maxKwc)} W/kWc)` });
    setSaving(false);
    await load();
  };

  const handleDelete = async (id) => {
    await sb.from('profils_production').delete().eq('id', id);
    setDeleteConfirm(null);
    await load();
  };

  return (
    <>
    <div className="screen fade-in">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,marginTop:4}}>
        <div>
          <div style={{fontSize:9,letterSpacing:'.6px',color:'rgba(125,217,64,.8)',fontWeight:700,textTransform:'uppercase'}}>Administration</div>
          <div style={{fontSize:18,fontWeight:900,color:'white',lineHeight:1.1}}>Production <span className="accent">solaire</span></div>
        </div>
        <button className="btn btn-sec" style={{fontSize:11,padding:'6px 12px',borderRadius:8}} onClick={()=>fileRef.current?.click()} disabled={importing||importStep==='form'}>
          {importing ? '⏳' : '☀️'} {importing ? 'Lecture…' : 'Importer un profil'}
        </button>
        <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleFile}/>
      </div>

      {importMsg?.type==='err' && (
        <div style={{color:'#ff6b6b',fontSize:12,padding:'7px 12px',background:'rgba(255,50,50,.1)',borderRadius:8,marginBottom:8}}>⚠️ {importMsg.text}</div>
      )}
      {importMsg?.type==='ok' && (
        <div style={{color:'#7dd940',fontSize:12,padding:'7px 12px',background:'rgba(255,255,255,.05)',borderRadius:8,marginBottom:8}}>✅ {importMsg.text}</div>
      )}

      {importStep === 'form' && (
        <div className="card" style={{padding:'14px 16px',marginBottom:12,border:'1px solid rgba(125,217,64,.3)'}}>
          <div style={{fontWeight:800,color:'white',marginBottom:10}}>Nouveau profil — {Math.round(parsedData?.annualKwh||0)} kWh/an·kWc</div>
          <label style={{fontSize:10,color:'rgba(255,255,255,.45)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>NOM DU PROFIL *</label>
          <input className="inp" style={{marginBottom:10}} placeholder="ex : Montpellier plein sud" value={nom} onChange={e=>setNom(e.target.value)}/>
          <label style={{fontSize:10,color:'rgba(255,255,255,.45)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>ADRESSE (pour géolocalisation)</label>
          <input className="inp" style={{marginBottom:12}} placeholder="ex : 1 rue de la Paix, 34000 Montpellier" value={adresse} onChange={e=>setAdresse(e.target.value)}/>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" style={{flex:1,fontSize:13}} onClick={handleSave} disabled={saving||!nom.trim()}>
              {saving ? '⏳ Enregistrement…' : '💾 Enregistrer'}
            </button>
            <button className="btn btn-sec" style={{fontSize:13}} onClick={()=>{setImportStep(null);setParsedData(null);}}>Annuler</button>
          </div>
        </div>
      )}

      {profils === null ? (
        <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div>
      ) : profils.length === 0 && !importStep ? (
        <div className="card" style={{textAlign:'center',padding:'24px 20px'}}>
          <div style={{fontSize:32,marginBottom:10}}>☀️</div>
          <div style={{color:'white',fontWeight:700,marginBottom:5}}>Aucun profil de production</div>
          <div style={{color:'rgba(255,255,255,.55)',fontSize:13}}>Importez un fichier XLSX (colonnes : mois, jour, heure, puissance W/kWc).</div>
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:80}}>
          {profils.map(p => (
            <div key={p.id} className="card" style={{padding:'12px 14px'}}>
              {deleteConfirm === p.id ? (
                <div>
                  <div style={{color:'#ff6b6b',fontWeight:700,marginBottom:6}}>⚠️ Supprimer « {p.nom} » ?</div>
                  <div style={{display:'flex',gap:8}}>
                    <button className="btn btn-no" style={{flex:1,fontSize:13}} onClick={()=>handleDelete(p.id)}>Supprimer</button>
                    <button className="btn btn-sec" style={{flex:1,fontSize:13}} onClick={()=>setDeleteConfirm(null)}>Annuler</button>
                  </div>
                </div>
              ) : (
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:800,fontSize:14,color:'white'}}>{p.nom}</div>
                    {p.adresse && <div style={{fontSize:11,color:'rgba(255,255,255,.5)',marginTop:2}}>{p.adresse}</div>}
                    {p.latitude && <div style={{fontSize:10,color:'rgba(125,217,64,.6)',marginTop:2}}>{p.latitude.toFixed(4)}, {p.longitude.toFixed(4)}</div>}
                    {p.profil && (
                      <div style={{fontSize:11,color:'rgba(255,255,255,.45)',marginTop:4}}>
                        {Math.round(p.profil.reduce((s,v)=>s+v,0)/1000)} kWh/an·kWc · max {Math.round(Math.max(...p.profil))} W/kWc
                      </div>
                    )}
                  </div>
                  <button style={{background:'none',border:'none',color:'rgba(255,80,80,.6)',cursor:'pointer',fontSize:16,flexShrink:0,padding:'2px 4px'}} onClick={()=>setDeleteConfirm(p.id)}>🗑️</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
    <StickyFooter onBack={onBack}/>
    </>
  );
}

// ─── processImageTransparent : resize 250×200 + suppression fond ──────
async function processImageTransparent(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const W = 250, H = 200;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      // Fond transparent + dessin avec letterbox
      ctx.clearRect(0, 0, W, H);
      const scale = Math.min(W / img.width, H / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      const dx = (W - dw) / 2, dy = (H - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
      // Suppression fond : sample couleur des 4 coins, rendre transparents les pixels proches
      const idata = ctx.getImageData(0, 0, W, H);
      const d = idata.data;
      // Récupérer couleur de fond depuis les coins (moyenne)
      const samplePx = (x, y) => { const i=(y*W+x)*4; return [d[i],d[i+1],d[i+2]]; };
      const corners = [samplePx(0,0), samplePx(W-1,0), samplePx(0,H-1), samplePx(W-1,H-1)];
      const bgR = Math.round(corners.reduce((s,c)=>s+c[0],0)/4);
      const bgG = Math.round(corners.reduce((s,c)=>s+c[1],0)/4);
      const bgB = Math.round(corners.reduce((s,c)=>s+c[2],0)/4);
      // Flood-fill BFS depuis les 4 coins pour supprimer le fond
      const threshold = 40;
      const visited = new Uint8Array(W * H);
      const queue = [];
      const push = (x, y) => { if(x<0||y<0||x>=W||y>=H)return; const idx=y*W+x; if(visited[idx])return; const pi=idx*4; const dr=d[pi]-bgR,dg=d[pi+1]-bgG,db=d[pi+2]-bgB; if(Math.sqrt(dr*dr+dg*dg+db*db)>threshold)return; visited[idx]=1; queue.push(idx); };
      [[0,0],[W-1,0],[0,H-1],[W-1,H-1]].forEach(([x,y])=>push(x,y));
      let qi=0;
      while(qi<queue.length){
        const idx=queue[qi++];
        d[idx*4+3]=0; // transparent
        const x=idx%W, y=Math.floor(idx/W);
        push(x-1,y);push(x+1,y);push(x,y-1);push(x,y+1);
      }
      // Adoucir les bords (anti-aliasing léger sur pixels semi-transparents de bord)
      ctx.putImageData(idata, 0, 0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = url;
  });
}
