<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starvolt — Calculateur d'économies</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- React + ReactDOM + Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti (fireworks) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* =============================================
       RESET & ROOT
       ============================================= */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --teal-deep:   #065060;
      --teal:        #0891b2;
      --teal-light:  #0da890;
      --green:       #7dd940;
      --green-light: #a3ed6a;
      --white:       #ffffff;
      --font:        'Poppins', sans-serif;
      --r-card:      22px;
      --r-btn:       14px;
      --shadow:      0 20px 60px rgba(0,0,0,0.25);
    }

    html, body {
      min-height: 100%;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: linear-gradient(145deg, #065060 0%, #0a9b8c 50%, #0b8264 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =============================================
       APP SHELL
       ============================================= */

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 76px 16px 150px;
      position: relative;
      overflow: hidden;
    }

    /* Blob decorations */
    .app::before {
      content: '';
      position: fixed;
      top: -180px; right: -180px;
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(125,217,64,.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .app::after {
      content: '';
      position: fixed;
      bottom: -220px; left: -220px;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(8,145,178,.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Chevrons */
    .chevrons-deco {
      position: fixed;
      right: -8px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 2px;
      opacity: .07; pointer-events: none;
    }
    .chevrons-deco span {
      font-size: 72px; color: var(--green);
      line-height: 1; font-weight: 900;
    }

    /* =============================================
       TOP BAR
       ============================================= */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
      background: rgba(5,65,78,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,.1);
      z-index: 300;
    }

    .user-chip {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px;
      padding: 4px 12px 4px 5px;
      max-width: 160px;
      overflow: hidden;
    }
    .user-chip-av {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: #1a4500;
      flex-shrink: 0;
    }
    .user-chip span {
      font-size: 12px; font-weight: 700; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* =============================================
       STICKY FOOTER
       ============================================= */
    .sticky-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 24px 16px 22px;
      background: linear-gradient(to top, rgba(5,65,78,1) 65%, rgba(5,65,78,.92) 85%, transparent);
      z-index: 200;
    }
    .sticky-footer-inner {
      max-width: 520px;
      margin: 0 auto;
      display: flex; flex-direction: column; gap: 9px;
    }
    .sticky-footer-inner.row { flex-direction: row; gap: 10px; }
    .sticky-footer-inner.row .btn { flex: 1; }

    /* =============================================
       SCREEN
       ============================================= */
    .screen {
      width: 100%; max-width: 520px;
      display: flex; flex-direction: column;
      gap: 0;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:none; }
    }
    .fade-in { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }

    /* =============================================
       BILL METER
       ============================================= */
    .bill-meter {
      text-align: center;
      padding: 18px 0 14px;
    }
    .bill-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(255,255,255,.6);
      margin-bottom: 2px;
    }
    .bill-amount-row {
      display: flex; align-items: baseline;
      justify-content: center; gap: 4px; line-height: 1;
    }
    .bill-num {
      font-size: 80px; font-weight: 900; color: white;
      transition: color .6s ease;
      font-variant-numeric: tabular-nums;
    }
    .bill-num.saving {
      color: var(--green);
      text-shadow: 0 0 40px rgba(125,217,64,.45);
    }
    .bill-cur {
      font-size: 30px; font-weight: 700;
      color: rgba(255,255,255,.75);
    }
    .bill-period {
      font-size: 12px; color: rgba(255,255,255,.45);
      margin-top: 2px;
    }
    .savings-badge {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px;
      background: rgba(125,217,64,.16);
      border: 1px solid rgba(125,217,64,.32);
      border-radius: 20px; padding: 5px 14px;
      font-size: 12px; font-weight: 700; color: var(--green);
      animation: fadeUp .5s ease both;
    }

    /* =============================================
       CARD
       ============================================= */
    .card {
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-card);
      padding: 26px 22px;
      color: white;
      box-shadow: var(--shadow);
    }

    /* =============================================
       TYPOGRAPHY
       ============================================= */
    .screen-title {
      font-size: 23px; font-weight: 800;
      line-height: 1.22; margin-bottom: 8px;
    }
    .screen-sub {
      font-size: 13.5px; line-height: 1.6;
      color: rgba(255,255,255,.75);
      margin-bottom: 18px;
    }
    .q-title {
      font-size: 15px; font-weight: 700;
      margin: 18px 0 12px; line-height: 1.4;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 13px; border-radius: 20px;
      font-size: 11.5px; font-weight: 700;
      margin-bottom: 12px;
    }
    .badge.success {
      background: rgba(125,217,64,.18);
      border: 1px solid rgba(125,217,64,.35);
      color: var(--green);
    }
    .badge.info {
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.25);
      color: rgba(255,255,255,.88);
    }

    /* =============================================
       BUTTONS
       ============================================= */
    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%;
      padding: 14px 18px;
      border-radius: var(--r-btn); border: none;
      font-family: var(--font); font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      line-height: 1.2;
    }
    .btn:hover  { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-primary { background: var(--green); color: #1a4500; }
    .btn-primary:hover { box-shadow: 0 8px 28px rgba(125,217,64,.35); }

    .btn-yes { background: var(--green); color: #1a4500; }
    .btn-yes:hover {
      background: var(--green-light);
      box-shadow: 0 8px 28px rgba(125,217,64,.32);
    }

    .btn-no {
      background: rgba(255,255,255,.10); color: rgba(255,255,255,.85);
      border: 1.5px solid rgba(255,255,255,.22);
    }
    .btn-no:hover { background: rgba(255,255,255,.18); }

    .btn-sec {
      background: rgba(255,255,255,.12); color: white;
      border: 1.5px solid rgba(255,255,255,.25);
      font-size: 13px;
    }
    .btn-sec:hover { background: rgba(255,255,255,.2); }

    .btn-group { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }

    /* =============================================
       BACK BUTTON
       ============================================= */
    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: none;
      color: rgba(255,255,255,.55);
      font-family: var(--font); font-size: 12.5px; font-weight: 600;
      cursor: pointer; padding: 0; margin-bottom: 10px;
      transition: color .2s;
    }
    .back-btn:hover { color: white; }

    /* =============================================
       WELCOME
       ============================================= */
    .welcome-header { text-align: center; margin-bottom: 22px; }
    .welcome-tag {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--green); margin-bottom: 10px;
    }
    .welcome-title {
      font-size: 34px; font-weight: 900;
      color: white; line-height: 1.15; margin-bottom: 8px;
    }
    .welcome-title .accent { color: var(--green); }
    .welcome-sub { font-size: 14px; color: rgba(255,255,255,.6); }

    .form-card {
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-card);
      padding: 22px; margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .inp-group { display: flex; flex-direction: column; gap: 5px; }
    .inp-label {
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,.65);
      letter-spacing: .5px; text-transform: uppercase;
    }
    .inp {
      width: 100%; padding: 12px 15px;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.11);
      color: white; font-family: var(--font);
      font-size: 15px; font-weight: 600;
      outline: none;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none;
    }
    .inp::placeholder { color: rgba(255,255,255,.38); }
    .inp:focus { border-color: var(--green); background: rgba(255,255,255,.16); }
    .inp[type=number]::-webkit-inner-spin-button,
    .inp[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .bill-wrap { position: relative; }
    .bill-sfx {
      position: absolute; right: 15px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,.45);
      font-size: 13px; font-weight: 600;
      pointer-events: none;
    }

    .acc-map-thumb {
      width: 100%; border-radius: 12px; overflow: hidden;
      cursor: zoom-in; margin-top: 16px;
      border: 1px solid rgba(255,255,255,.15);
      position: relative;
    }
    .acc-map-thumb img { width: 100%; display: block; }
    .acc-map-hint {
      text-align: center; font-size: 11px;
      color: rgba(255,255,255,.45); margin-top: 5px;
    }
    .lightbox-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.88); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lightbox-overlay img {
      max-width: 96vw; max-height: 92vh;
      border-radius: 8px;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }

    /* =============================================
       ADDRESS / LOADING
       ============================================= */
    .loading-card {
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-card);
      padding: 48px 22px;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      text-align: center; color: white;
    }
    .loading-card p { font-size: 14.5px; font-weight: 600; }
    .loading-card .sub { font-size: 12.5px; color: rgba(255,255,255,.55); }

    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,.18);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .addr-found {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,.09);
      border-radius: 14px; padding: 12px 15px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.13);
    }
    .addr-icon { font-size: 26px; }
    .addr-text { display: flex; flex-direction: column; gap: 2px; }
    .addr-text strong { font-size: 14.5px; font-weight: 700; color: white; }
    .addr-text span { font-size: 12px; color: rgba(255,255,255,.55); }

    /* =============================================
       MAP ACC
       ============================================= */
    .map-container {
      border-radius: 14px; overflow: hidden;
      margin: 14px 0;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
    }
    .map-legend {
      display: flex; flex-direction: column; gap: 7px;
      margin: 10px 0 18px;
    }
    .leg-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 12.5px; color: rgba(255,255,255,.82);
    }
    .leg-dot {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .leg-dot.house { background: rgba(255,255,255,.18); }
    .leg-dot.pv    { background: rgba(255,220,0,.18); }
    .leg-dot.zone  {
      background: rgba(125,217,64,.12);
      border: 1.5px dashed var(--green);
    }

    /* =============================================
       TARIFF
       ============================================= */
    .tariff-box {
      background: rgba(0,0,0,.14);
      border-radius: 14px; padding: 14px; margin: 14px 0;
    }
    .tariff-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; }
    .tariff-lbl { font-size: 12.5px; color: rgba(255,255,255,.68); }
    .tariff-val { font-size: 17px; font-weight: 800; }
    .tariff-val.old { text-decoration: line-through; color: rgba(255,255,255,.42); font-size: 14px; }
    .tariff-val.grn { color: var(--green); }
    .tariff-arrow { text-align: center; color: var(--green); font-size: 18px; padding: 4px 0; }

    .saving-est {
      background: rgba(125,217,64,.11);
      border: 1.5px solid rgba(125,217,64,.28);
      border-radius: 14px; padding: 14px;
      text-align: center; margin: 14px 0;
    }
    .sav-lbl {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.55); margin-bottom: 3px;
    }
    .sav-amt { font-size: 40px; font-weight: 900; color: var(--green); line-height: 1; }
    .sav-note { font-size: 11.5px; color: rgba(255,255,255,.48); margin-top: 3px; }

    /* =============================================
       OFFER CARD
       ============================================= */
    .offer-box {
      background: rgba(0,0,0,.14);
      border-radius: 14px; padding: 14px; margin: 14px 0;
    }
    .offer-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; }
    .offer-lbl { font-size: 12.5px; color: rgba(255,255,255,.68); }
    .offer-val { font-size: 17px; font-weight: 800; color: white; }
    .offer-val.grn { color: var(--green); }
    .offer-div { height: 1px; background: rgba(255,255,255,.09); margin: 3px 0; }
    .offer-promo {
      font-size: 11.5px; color: rgba(255,255,255,.65);
      margin-top: 9px; padding-top: 9px;
      border-top: 1px solid rgba(255,255,255,.09);
      line-height: 1.55;
    }
    .offer-promo strong { color: var(--green); }

    .dev-icon { font-size: 38px; text-align: center; margin-bottom: 10px; }

    /* =============================================
       NO ACC STEPS
       ============================================= */
    .steps-list { display: flex; flex-direction: column; gap: 11px; margin: 14px 0 18px; }
    .step-item  { display: flex; align-items: flex-start; gap: 11px; }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green); color: #1a4500;
      font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .step-txt { font-size: 13.5px; color: rgba(255,255,255,.82); line-height: 1.5; }

    /* =============================================
       BRAVO
       ============================================= */
    .bravo-card { text-align: center; padding: 30px 22px; }

    .bravo-num {
      font-size: 86px; font-weight: 900; color: var(--green); line-height: 1;
      text-shadow: 0 0 60px rgba(125,217,64,.45);
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .bravo-title {
      font-size: 44px; font-weight: 900; color: white;
      letter-spacing: 3px;
      animation: popIn .5s .1s cubic-bezier(.34,1.56,.64,1) both;
    }
    .bravo-sub { font-size: 13px; color: rgba(255,255,255,.65); margin: 8px 0 4px; }
    .bravo-sav-row {
      display: flex; align-items: baseline; justify-content: center;
      gap: 5px; margin: 4px 0 6px;
      animation: popIn .5s .2s cubic-bezier(.34,1.56,.64,1) both;
    }
    .bravo-sav-amt { font-size: 50px; font-weight: 900; color: var(--green); line-height: 1; }
    .bravo-sav-per { font-size: 17px; font-weight: 600; color: rgba(255,255,255,.65); }
    .bravo-lbl { font-size: 12.5px; color: rgba(255,255,255,.48); margin-bottom: 22px; }

    @keyframes popIn {
      0%   { transform: scale(.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* =============================================
       FINAL
       ============================================= */
    .final-cmp {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      background: rgba(0,0,0,.12);
      border-radius: 14px; padding: 14px; margin: 14px 0;
    }
    .cmp-item { width: 100%; text-align: center; }
    .cmp-lbl {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.45); margin-bottom: 3px;
    }
    .cmp-amt { font-size: 26px; font-weight: 800; }
    .cmp-amt.old { color: rgba(255,255,255,.4); text-decoration: line-through; }
    .cmp-amt.new { color: var(--green); }
    .cmp-arrow { font-size: 20px; color: var(--green); }

    .final-total {
      background: rgba(125,217,64,.11);
      border: 1.5px solid rgba(125,217,64,.28);
      border-radius: 14px; padding: 16px;
      text-align: center; margin: 10px 0;
    }
    .tot-lbl {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.55); margin-bottom: 3px;
    }
    .tot-amt { font-size: 50px; font-weight: 900; color: var(--green); line-height: 1; }

    .final-items { display: flex; flex-direction: column; gap: 7px; margin: 10px 0; }
    .final-item {
      display: flex; align-items: center; gap: 9px;
      font-size: 13.5px; color: rgba(255,255,255,.8);
      background: rgba(255,255,255,.07);
      border-radius: 10px; padding: 9px 13px;
    }
    .fi-check { color: var(--green); font-weight: 800; font-size: 15px; }

    .roi-block {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px; padding: 14px 12px;
      margin: 10px 0;
    }
    .roi-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: rgba(255,255,255,.5); text-align: center;
      margin-bottom: 10px;
    }
    .roi-row {
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .roi-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1;
    }
    .roi-val {
      font-size: 14px; font-weight: 800; color: white; text-align: center;
    }
    .roi-val.roi-years {
      color: var(--green); font-size: 22px;
    }
    .roi-sub {
      font-size: 9px; color: rgba(255,255,255,.42);
      text-transform: uppercase; letter-spacing: .8px; text-align: center;
    }
    .roi-divider {
      font-size: 18px; font-weight: 700; color: rgba(255,255,255,.3);
      flex-shrink: 0;
    }

    .final-msg {
      margin-top: 18px; padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.1);
      font-size: 13.5px; font-style: italic;
      color: rgba(255,255,255,.5);
      line-height: 1.6; text-align: center;
    }

    /* =============================================
       RESPONSIVE
       ============================================= */
    @media (min-width: 768px) {
      .app { padding: 80px 24px 120px; }
      .screen { max-width: 560px; }
      .welcome-title { font-size: 42px; }
      .bill-num { font-size: 96px; }
      .card { padding: 30px 26px; }
      .bravo-title { font-size: 52px; }
      .bravo-num { font-size: 100px; }
    }
    @media (max-width: 400px) {
      .bill-num { font-size: 64px; }

// ─── Animated bill counter ─────────────────────
function useAnimatedBill(target) {
  const [cur, setCur]     = useState(target);
  const fromRef           = useRef(target);
  const rafRef            = useRef(null);

  useEffect(() => {
    if (fromRef.current === target) return;
    const from     = fromRef.current;
    const duration = 1400;
    const t0       = performance.now();

    const animate = (now) => {
      const p = Math.min((now - t0) / duration, 1);
      const e = 1 - Math.pow(1 - p, 4);
      setCur(Math.round(from + (target - from) * e));
      if (p < 1) { rafRef.current = requestAnimationFrame(animate); }
      else        { fromRef.current = target; }
    };

    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(animate);
    return () => rafRef.current && cancelAnimationFrame(rafRef.current);
  }, [target]);

  return cur;
}

// ─── Fireworks ────────────────────────────────
function Fireworks({ final = false }) {
  useEffect(() => {
    const colors  = ['#7dd940','#00c4c4','#ffffff','#ffd700','#a3ed6a','#0891b2'];
    const dur     = final ? 1000 : 1000;
    const end     = Date.now() + dur;

    const burst = () => {
      if (Date.now() > end) return;
      confetti({ particleCount: final?18:13, angle:60,  spread:55, origin:{x:0, y:.65}, colors, startVelocity:final?45:32, gravity:.85, ticks:180 });
      confetti({ particleCount: final?18:13, angle:120, spread:55, origin:{x:1, y:.65}, colors, startVelocity:final?45:32, gravity:.85, ticks:180 });
      if (final) confetti({ particleCount:9, spread:360, origin:{x:Math.random(), y:Math.random()*.4}, colors, startVelocity:20, gravity:.6, ticks:160 });
      requestAnimationFrame(burst);
    };

    confetti({ particleCount:final?37:23, spread:80, origin:{x:.5,y:.55}, colors, startVelocity:50, gravity:.9, ticks:220 });
    const h = setTimeout(burst, 200);
    return () => clearTimeout(h);
  }, [final]);

  return null;
}

  const roi        = state.investment > 0 && savings > 0
    ? Math.round((state.investment / savings) * 10) / 10
    : null;
  if (savings === 0) return (
    <>
      <div className="screen fade-in">
        <div className="card" style={{textAlign:'center', padding:'40px 24px'}}>
          <div style={{fontSize:48, marginBottom:16}}>🙏</div>
          <h2 className="screen-title">Merci pour votre temps</h2>
          <p className="screen-sub" style={{marginTop:10}}>
            Nous vous invitons à refaire une simulation dans quelques temps pour vérifier si nos prochaines offres répondent davantage à vos attentes.
          </p>
        </div>
      </div>
      <StickyFooter>
        <button className="btn btn-sec" onClick={onRestart}>🔄 Recommencer la simulation</button>
      </StickyFooter>
    </>
  );

  return (
    <>
      <div className="screen fade-in">
        <Fireworks final/>
        <BillMeter bill={state.bill} initialBill={state.initialBill}/>
        <div className="card">
          <h2 className="screen-title" style={{marginBottom:2}}>Récapitulatif</h2>
          <p className="screen-sub" style={{marginBottom:0}}>
            Voici ce que Starvolt peut faire pour {state.name.split(' ')[0]}
          </p>
          <div className="final-cmp">
            <div className="cmp-item">
              <div className="cmp-lbl">Facture initiale</div>
              <div className="cmp-amt old">{state.initialBill.toLocaleString('fr-FR')} €/an</div>
            </div>
            <div className="cmp-arrow">↓</div>
            <div className="cmp-item">
              <div className="cmp-lbl">Avec Starvolt</div>
              <div className="cmp-amt new">{state.bill.toLocaleString('fr-FR')} €/an</div>
            </div>
          </div>
          {savings > 0 && (
            <div className="final-total">
              <div className="tot-lbl">Économies totales</div>
              <div className="tot-amt">
                {savings.toLocaleString('fr-FR')} €<span style={{fontSize:20,fontWeight:600}}>/an</span>
              </div>
            </div>
          )}
          {state.bravoItems.length > 0 && (
            <div className="final-items">
              {state.bravoItems.map((item,i) => (
                <div key={i} className="final-item">
                  <span className="fi-check">✓</span>
                  <span>{item}</span>
                </div>
              ))}
            </div>
          )}
          {roi !== null && (
            <div className="roi-block">
              <div className="roi-label">Retour sur investissement</div>
              <div className="roi-row">
                <div className="roi-item">
                  <span className="roi-val">{state.investment.toLocaleString('fr-FR')} €</span>
                  <span className="roi-sub">Investissement total</span>
                </div>
                <div className="roi-divider">÷</div>
                <div className="roi-item">
                  <span className="roi-val">{savings.toLocaleString('fr-FR')} €/an</span>
                  <span className="roi-sub">Économies annuelles</span>
                </div>
                <div className="roi-divider">=</div>
                <div className="roi-item">
                  <span className="roi-val roi-years">{roi} ans</span>
                  <span className="roi-sub">ROI</span>
                </div>
              </div>
            </div>
          )}

          <div className="final-msg">
            "Ceci n'est qu'une simulation, mais bientôt, tout sera réel."
          </div>
        </div>
      </div>
      <StickyFooter>
        <button className="btn btn-sec" onClick={onRestart}>🔄 Recommencer la simulation</button>
      </StickyFooter>
    </>
  );
}

// ─── MAIN APP — Machine d'états ──────────────

const INIT = {
  screen:      'WELCOME',
  name:        '',
  address:     '',
  initialBill: 0,
  bill:        0,
  bravoItems:  [],
  investment:  0,
};

function App() {
  const [state,   setState]   = useState(INIT);
  const [history, setHistory] = useState([]);

  const goTo = useCallback((screen, updates = {}) => {
    setHistory(h => [...h, state]);
    setState(s => ({ ...s, screen, ...updates }));
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [state]);

  const goBack = useCallback(() => {
    if (!history.length) return;
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0,-1));
    setState(prev);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [history]);

  const render = () => {
    switch (state.screen) {

      case 'WELCOME':
        return <WelcomeScreen state={state}
          onStart={({name,bill,address})=>{
            const cp = extractPostalCode(address);
            const eligible = cp ? ELIGIBLE_CODES.has(cp) : false;
            goTo('ADDRESS',{name,address,initialBill:bill,bill,bravoItems:[],eligible});
          }} />;

      case 'ADDRESS': {
        const accSaving = Math.round(state.initialBill * 0.15);
        if (!state.eligible) {
          return <NoACCScreen state={state} onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
        }
        return <EligibleScreen state={state} saving={accSaving}
          onYes={()=>goTo('BRAVO_1',{ bill:state.bill-accSaving, bravoItems:[...state.bravoItems,`Tarif ACC : −${accSaving.toLocaleString('fr-FR')} €/an`] })}
          onNo={()=>goTo('NO_ACC')}
          onBack={goBack}/>;
      }

      case 'NO_ACC':
        return <NoACCScreen state={state} onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;

      case 'BRAVO_1': {
        const accSaving = Math.round(state.initialBill * 0.15);
        return <BravoScreen state={state} stepNumber={1} saving={accSaving} label="Grâce au tarif ACC"
          onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
      }

      case 'COMWATT': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <ComwattScreen state={state} saving={cwSaving}
          onYes={()=>goTo('BRAVO_2',{ bill:state.bill-cwSaving, bravoItems:[...state.bravoItems,`Box Comwatt : −${cwSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+550 })}
          onNo={()=>goTo('SOLAR')}
          onBack={goBack}/>;
      }

      case 'BRAVO_2': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <BravoScreen state={state} stepNumber={2} saving={cwSaving} label="Grâce à la box Comwatt"
          onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;
      }

      case 'SOLAR': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <SolarScreen state={state} saving={solSaving}
          onYes={()=>goTo('BRAVO_3',{ bill:state.bill-solSaving, bravoItems:[...state.bravoItems,`Solaire + batterie : −${solSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+10000 })}
          onNo={()=>goTo('FINAL')}
          onBack={goBack}/>;
      }

      case 'BRAVO_3': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <BravoScreen state={state} stepNumber={3} saving={solSaving} label="Grâce aux panneaux solaires"
          onContinue={()=>goTo('FINAL')} onBack={goBack}/>;
      }

      case 'FINAL':
        return <FinalScreen state={state} onRestart={()=>{ setHistory([]); setState(INIT); }}/>;

      default: return null;
    }
  };

  return (
    <div className="app">
      <TopBar name={state.name} showName={state.screen !== 'WELCOME'}/>
      <div className="chevrons-deco" aria-hidden="true">
        {['»','»','»','»'].map((c,i)=><span key={i}>{c}</span>)}
      </div>
      {render()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
