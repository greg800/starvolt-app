// ─── SimulationsScreen ────────────────────────
function SimulationsScreen({ onACC, onBox, onSolar, onOptimisation, onBack, onMonSite, user, userProfile }) {
  const [hasConso,  setHasConso]  = useState(false);
  const [maxSaving, setMaxSaving] = useState(null);
  const [accSaving, setAccSaving] = useState(null);
  const [boxSaving,   setBoxSaving]   = useState(null);
  const [solarSaving, setSolarSaving] = useState(null);
  // Pour la projection correcte : achat réseau après solar, injection, prix base
  const [solGridKwh,    setSolGridKwh]    = useState(null);
  const [solInjKwh,     setSolInjKwh]     = useState(null);
  const [solPrixBase,   setSolPrixBase]   = useState(null);
  const [solPrixRachat, setSolPrixRachat] = useState(0.04);
  const [bestTariffName, setBestTariffName] = useState(null);
  const [changedTariff, setChangedTariff] = useState(false);

  useEffect(() => {
    if (!user) return;
    const activeId = localStorage.getItem('starvolt_active_site_id');
    Promise.all([
      activeId
        ? sb.from('sites').select('id,conso_profil,tarif_id,profil_production_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2').eq('id', activeId).maybeSingle()
        : sb.from('sites').select('id,conso_profil,tarif_id,profil_production_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2').eq('user_id', user.id).not('conso_profil','is',null).order('created_at').limit(1).maybeSingle(),
      sb.from('tarifs_electricite').select('*').order('nom'),
      sb.from('parametres_nationaux').select('*').eq('id',1).maybeSingle(),
      sb.rpc('get_spot_json'),
    ]).then(async ([{ data: siteData }, { data: tariffs }, { data: nat }, { data: spotRows }]) => {
      const site = Array.isArray(siteData) ? siteData[0] : siteData;
      if (!site?.conso_profil) return;
      setHasConso(true);

      const { kwh_hc, kwh_hp } = calcHcHp(site.conso_profil, site);
      const kwh_total = kwh_hc + kwh_hp;

      // Optimisation savings
      if (tariffs?.length && kwh_total > 0) {
        const ranked = tariffs.map(t=>({t,result:calcTariffCost(t,kwh_hc,kwh_hp)})).filter(({result})=>result!==null).sort((a,b)=>a.result.total-b.result.total);
        if (ranked.length) {
          const cur = site.tarif_id ? ranked.find(r=>r.t.id===site.tarif_id) : null;
          const saving = cur ? Math.round(cur.result.total - ranked[0].result.total) : null;
          setMaxSaving(saving);
          if (saving > 0) setBestTariffName(ranked[0].t.nom);

          // Box saving: 140€ flex + gain réel du stockage calculé heure par heure
          const curTariff = site.tarif_id ? tariffs.find(t => t.id === site.tarif_id) : null;
          const curBill = cur?.result?.total || (kwh_total * 0.18);
          const solDef=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})();
          const bkv=parseFloat(solDef.batKwh)||0, tkv=parseFloat(solDef.thermKwh)||0;
          const sp = spotRows ? buildSpotMap(spotRows) : null;
          const storRes = curTariff ? computeStorageOptimization(site.conso_profil, curTariff, curTariff, site, bkv, tkv, {...nat, opti_tarif:true}, sp) : null;
          const _ratioSim = (nat?.ratio_puissance_stockage ?? 50) / 100;
          const flexGainSim = Math.round((parseFloat(solDef.thermKwh)||10)*14 + (parseFloat(solDef.batKwh)||10)*_ratioSim*27);
          const bSav = Math.round(flexGainSim + (storRes?.saving || 0));
          if (bSav > 0) setBoxSaving(bSav);
          // Charger le profil de production (utilisé pour estim ACC + solar)
          let _prodProfil = null;
          if (site.profil_production_id && site.conso_profil) {
            const { data: pp } = await sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single();
            _prodProfil = pp?.profil || null;
          }
          // accSavEst : heures prod non nulle (ou 9h–18h si pas de profil)
          const accSavEst = (() => {
            let k=0;
            for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
              const idx=profIdx(m,d,h);
              if(_prodProfil?!(_prodProfil[idx]>0):(h<9||h>=18)) continue;
              k+=(site.conso_profil[idx]||0)/1000;
            }
            return Math.max(0,Math.round(k*((site.tarif_id?tariffs.find(t=>t.id===site.tarif_id)?.prix_hp||0.24:0.24)-0.11)));
          })();
          const adjBillSolar = Math.max(0, curBill - (saving||0) - accSavEst);
          // Calcul réel des économies solaires
          if (_prodProfil) {
              const ratioBat   = ((nat?.ratio_puissance_stockage              ?? 50) / 100);
              const ratioTherm = ((nat?.ratio_puissance_stockage_thermique    ?? 50) / 100);
              const pBat   = nat?.pertes_batterie   ?? 10;
              const pTherm = nat?.pertes_thermique  ?? 0;
              const solDef=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})();
              const kw=parseFloat(solDef.pvKwc)||6, bk=parseFloat(solDef.batKwh)||10, tk=parseFloat(solDef.thermKwh)||5;
              const bal = computeEnergyBalance(site.conso_profil, _prodProfil, kw,
                bk*ratioBat*1000, bk, pBat, tk*ratioTherm, tk, pTherm);
              const gridBuy = bal.monthly.reduce((s,m) => s + m.grid_buy, 0);
              const injKwh  = bal.monthly.reduce((s,m) => s + m.injection, 0);
              const prixMoyen = kwh_total > 0 && curBill ? curBill / kwh_total : 0.18;
              const prixRachat = nat?.prix_rachat_injection ?? 0.04;
              const nouvFact = Math.max(0, gridBuy * prixMoyen - injKwh * prixRachat);
              const realSav = Math.max(0, Math.round(curBill - nouvFact));
              setSolarSaving(realSav > 0 ? realSav : Math.round(adjBillSolar * 0.70));
              setSolGridKwh(gridBuy); setSolInjKwh(injKwh);
              setSolPrixBase(prixMoyen); setSolPrixRachat(prixRachat);
          } else {
            setSolarSaving(Math.round(adjBillSolar * 0.70));
          }
        }
      }

      // ACC savings : heures prod non nulle (ou 9h–18h si pas de profil)
      if (site.conso_profil) {
        let _prodProfilAcc = null;
        if (site.profil_production_id) {
          const { data: pp } = await sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single();
          _prodProfilAcc = pp?.profil || null;
        }
        let kwh918 = 0;
        for (let m=1; m<=12; m++)
          for (let d=1; d<=PROF_DAYS[m-1]; d++)
            for (let h=0; h<24; h++) {
              const idx=profIdx(m,d,h);
              if(_prodProfilAcc?!(_prodProfilAcc[idx]>0):(h<9||h>=18)) continue;
              kwh918 += (site.conso_profil[idx]||0)/1000;
            }
        let priceRef = 0.24;
        if (site.tarif_id && tariffs?.length) {
          const t = tariffs.find(x=>x.id===site.tarif_id);
          if (t?.prix_hp) priceRef = t.prix_hp;
        }
        const sav = Math.round(kwh918 * (priceRef - 0.11));
        if (sav > 0) setAccSaving(sav);
      }
    });
  }, [user?.id]);

  if (changedTariff) {
    return (
      <>
      <div className="screen fade-in">
        <Fireworks final/>
        <div style={{ textAlign:'center', marginBottom:20, marginTop:8 }}>
          <div style={{ fontSize:52, marginBottom:8 }}>⚡</div>
          <div style={{ fontSize:22, fontWeight:900, color:'white', lineHeight:1.2, marginBottom:8 }}>
            Changement lancé !
          </div>
          <div style={{ fontSize:14, color:'rgba(255,255,255,.6)', lineHeight:1.6 }}>
            Votre demande de changement de fournisseur est enregistrée.
            Un conseiller vous contacte sous 48h.
          </div>
        </div>
        {maxSaving > 0 && (
          <div className="card" style={{ padding:'16px', marginBottom:12, textAlign:'center', border:'1.5px solid rgba(125,217,64,.4)' }}>
            <div style={{ fontSize:11, color:'rgba(255,255,255,.45)', textTransform:'uppercase', letterSpacing:'.5px', marginBottom:4 }}>Économies estimées</div>
            <div style={{ fontSize:36, fontWeight:900, color:'#7dd940', lineHeight:1 }}>-{maxSaving.toLocaleString('fr-FR')} €<span style={{fontSize:18}}>/an</span></div>
            {bestTariffName && <div style={{ fontSize:12, color:'rgba(255,255,255,.45)', marginTop:6 }}>En passant sur le tarif <strong style={{color:'#7dd940'}}>{bestTariffName}</strong></div>}
          </div>
        )}
        <div className="card" style={{ padding:'14px 16px', border:'1px solid rgba(125,217,64,.2)' }}>
          <div style={{ fontWeight:700, fontSize:13, color:'#7dd940', marginBottom:6 }}>✦ Prochaine étape</div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,.55)', lineHeight:1.6 }}>
            Nous vérifions votre éligibilité et préparons votre dossier de changement. Aucune démarche de votre côté — on s'occupe de tout.
          </div>
        </div>
      </div>
      <StickyFooter onBack={onBack}/>
      </>
    );
  }

  return (
    <>
    <div className="screen fade-in">
      <div className="sim-header">
        <div className="welcome-tag">Vos leviers d'économie</div>
        <h1 className="welcome-title">Simulations<br/><span className="accent">d'économie</span></h1>
      </div>
      <div className="sim-btns">
        {hasConso && (
          <button className="sim-btn" onClick={onOptimisation} style={{border:'1.5px solid rgba(125,217,64,.35)'}}>
            <img src="/optimisation.png" alt="Optimisation" className="sim-icon" style={{mixBlendMode:'screen'}}/>
            <div className="sim-text">
              <div className="sim-title">Optimisation fournisseur</div>
              {maxSaving !== null && maxSaving > 0
                ? <div className="sim-sub green" style={{color:'#7dd940',fontWeight:700}}>Jusqu'à -{maxSaving.toLocaleString('fr-FR')} €/an d'économie</div>
                : <div className="sim-sub">Comparez tous les tarifs sur votre conso réelle</div>
              }
            </div>
            <span className="sim-arrow">→</span>
          </button>
        )}
        <button className="sim-btn" onClick={onACC}>
          <img src="/acc.png" alt="ACC" className="sim-icon"/>
          <div className="sim-text">
            <div className="sim-title">Économiser avec l'ACC</div>
            {accSaving !== null && accSaving > 0
              ? <div className="sim-sub green" style={{color:'#7dd940',fontWeight:700}}>Jusqu'à -{accSaving.toLocaleString('fr-FR')} €/an d'économie</div>
              : <div className="sim-sub">Autoconsommation collective locale</div>
            }
          </div>
          <span className="sim-arrow">→</span>
        </button>
        <button className="sim-btn" onClick={onBox}>

// ─── Optimisation utilities ───────────────────
function parseHcHour(s) { if (s == null || s === '') return null; if (typeof s === 'number') return Math.round(s); const n = parseInt(String(s).split(':')[0]); return isNaN(n) ? null : n; }

// Formatte une heure HC pour affichage : "1H36" → "01:36", "07:00" → "07:00"
function fmtHcTime(v) {
  if (!v && v !== 0) return null;
  const s = String(v).trim();
  const hm = s.match(/^(\d{1,2})H(\d{2})$/i);
  if (hm) return `${hm[1].padStart(2,'0')}:${hm[2]}`;
  const co = s.match(/^(\d{1,2}):(\d{2})/);
  if (co) return `${co[1].padStart(2,'0')}:${co[2]}`;
  return s;
}

// Libellé court de l'option tarifaire ENEDIS à partir du code C68 (ex: "BTINFMU4" → "HC/HP")
function labelOptionTarifaire(code) {
  if (!code) return null;
  const c = code.toUpperCase();
  if (c.includes('MU'))    return 'HC/HP';
  if (c.includes('EJP'))   return 'EJP';
  if (c.includes('TEMPO')) return 'TEMPO';
  return 'BASE';
}

function isHcHour(h, windows) {
  for (const { s, e } of windows) {
    if (s === null || e === null) continue;
    if (s < e) { if (h >= s && h < e) return true; }
    else { if (h >= s || h < e) return true; } // crosses midnight
  }
  return false;
}

function calcHcHp(consoProfile, userProfile) {
  const windows = [
    { s: parseHcHour(userProfile?.heure_debut_hc1), e: parseHcHour(userProfile?.heure_fin_hc1) },
    { s: parseHcHour(userProfile?.heure_debut_hc2), e: parseHcHour(userProfile?.heure_fin_hc2) },
  ].filter(w => w.s !== null && w.e !== null);

  let kwh_hc = 0, kwh_hp = 0;
  for (let m = 1; m <= 12; m++)
    for (let d = 1; d <= PROF_DAYS[m - 1]; d++)
      for (let h = 0; h < 24; h++) {
        const kwh = (consoProfile[profIdx(m, d, h)] || 0) / 1000;
        (windows.length > 0 && isHcHour(h, windows) ? kwh_hc : (kwh_hp += kwh, 0)) && (kwh_hc += kwh);
      }
  // fix the ternary side-effect above with cleaner version:
  kwh_hc = 0; kwh_hp = 0;
  for (let m = 1; m <= 12; m++)
    for (let d = 1; d <= PROF_DAYS[m - 1]; d++)
      for (let h = 0; h < 24; h++) {
        const kwh = (consoProfile[profIdx(m, d, h)] || 0) / 1000;
        if (windows.length > 0 && isHcHour(h, windows)) kwh_hc += kwh;
        else kwh_hp += kwh;
      }
  return { kwh_hc: Math.round(kwh_hc), kwh_hp: Math.round(kwh_hp), hasHC: windows.length > 0 };
}

function calcTariffCost(tariff, kwh_hc, kwh_hp, dynamicCtx = null) {
  if (tariff.tarif_dynamique || tariff.type_tarif === 'dynamique') {
    const { consoProfile, spotMap, natParams, site } = dynamicCtx || {};
    if (!consoProfile || !spotMap || !natParams) return null;
    return calcDynamicCost(tariff, consoProfile, spotMap, natParams, site);
  }
  if (tariff.type_tarif === 'multi' && tariff.periodes?.length > 0) {
    const consoProfile = dynamicCtx?.consoProfile;
    if (!consoProfile) return null;
    let varCost = 0;
    for (let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++)
      varCost += (consoProfile[profIdx(m,d,h)]||0)/1000 * getPrixMulti(m,d,h,tariff.periodes);
    return { total: Math.round((tariff.abo_annuel||0) + varCost), abo: tariff.abo_annuel||0, is_base: false };
  }
  const abo = tariff.abo_annuel || 0;
  const hp  = tariff.prix_hp || 0;
  const hc  = tariff.prix_hc != null ? tariff.prix_hc : hp;
  return { total: abo + kwh_hp * hp + kwh_hc * hc, abo, hp_cost: kwh_hp * hp, hc_cost: kwh_hc * hc, is_base: tariff.prix_hc == null || tariff.prix_hc === tariff.prix_hp };
}

// ─── Helpers TURPE / TTC / Spot ───────────────
// ─── Multi-période helpers ─────────────────────
function isInDateRange(m, d, sm, sd, em, ed) {
  const cur=m*100+d, s=sm*100+sd, e=em*100+ed;
  return s<=e?(cur>=s&&cur<=e):(cur>=s||cur<=e);
}
function getPrixMulti(m, d, h, periodes) {
  if (!periodes?.length) return 0;
  for (const p of periodes) {
    if (!p.date_debut||!p.date_fin||p.heure_debut===''||p.heure_fin===''||p.prix==='') continue;
    const parts1=p.date_debut.split('/'), parts2=p.date_fin.split('/');
    if(parts1.length<2||parts2.length<2) continue;
    const [dj,dm]=[parseInt(parts1[0]),parseInt(parts1[1])];
    const [fj,fm]=[parseInt(parts2[0]),parseInt(parts2[1])];
    if(!dj||!dm||!fj||!fm) continue;
    if(!isInDateRange(m,d,dm,dj,fm,fj)) continue;
    const hD=parseInt(p.heure_debut), hF=parseInt(p.heure_fin);
    if(isNaN(hD)||isNaN(hF)) continue;
    const overnight=hF<=hD;
    if(overnight?(h>=hD||h<hF):(h>=hD&&h<hF)) return parseFloat(p.prix)||0;
  }
  return 0;
}

function getTurpeRate(mois, heure, natParams, hcWindows) {
  const debut = natParams?.turpe_ete_debut ?? 4;
  const fin   = natParams?.turpe_ete_fin   ?? 10;
  const isEte = mois >= debut && mois <= fin;
  const isHc  = hcWindows?.length > 0 && isHcHour(heure, hcWindows);
  if (isEte  && isHc)  return (natParams?.turpe_hc_ete   || 0) / 100;
  if (isEte  && !isHc) return (natParams?.turpe_hp_ete   || 0) / 100;
  if (!isEte && isHc)  return (natParams?.turpe_hc_hiver || 0) / 100;
  return (natParams?.turpe_hp_hiver || 0) / 100;
}

function calcPrixTTC(spotEuroKwh, mois, heure, natParams, hcWindows) {
  const turpe  = getTurpeRate(mois, heure, natParams, hcWindows);
  const accise = (natParams?.accise || 0) / 100;
  const tva    = (natParams?.tva ?? 20) / 100;
  return (spotEuroKwh + turpe + accise) * (1 + tva);
}

function buildSpotMap(spotAll) {
  const m = {};
  (spotAll || []).forEach(r => { m[`${r.mois}_${r.jour}_${r.heure}`] = parseFloat(r.prix); });
  return m;
}

function calcDynamicCost(tariff, consoProfile, spotMap, natParams, userProfile) {
  const windows = [
    { s: parseHcHour(userProfile?.heure_debut_hc1), e: parseHcHour(userProfile?.heure_fin_hc1) },
    { s: parseHcHour(userProfile?.heure_debut_hc2), e: parseHcHour(userProfile?.heure_fin_hc2) },
  ].filter(w => w.s !== null && w.e !== null);
  const marge  = (tariff.marge_fournisseur_ceur_kwh || 0) / 100;
  const accise = (natParams?.accise || 0) / 100;
  const tva    = (natParams?.tva ?? 20) / 100;
  let varCost = 0, varCost_ete = 0, varCost_hiver = 0, kwh_ete = 0, kwh_hiver = 0;
  for (let mo = 1; mo <= 12; mo++) {
    const isEte = mo >= 4 && mo <= 10;
    for (let d = 1; d <= PROF_DAYS[mo - 1]; d++)
      for (let h = 0; h < 24; h++) {
        const kwh  = (consoProfile[profIdx(mo, d, h)] || 0) / 1000;
        if (!kwh) continue;
        const spot = spotMap[`${mo}_${d}_${h}`] || 0;
        const cv   = kwh * (spot + getTurpeRate(mo, h, natParams, windows) + accise + marge);
        varCost += cv;
        if (isEte) { varCost_ete += cv; kwh_ete += kwh; }
        else       { varCost_hiver += cv; kwh_hiver += kwh; }
      }
  }
  const kwh_total_dyn = kwh_ete + kwh_hiver;
  const fixedHT = (tariff.abo_annuel || 0) + (tariff.turpe_fixe || 0) + (tariff.cta_fixe || 0);
  const total   = (varCost + fixedHT) * (1 + tva);
  const avgCeur = (vc, kwh) => {
    if (!kwh || !kwh_total_dyn) return null;
    return ((vc + fixedHT * kwh / kwh_total_dyn) * (1 + tva) / kwh) * 100;
  };
  return {
    total, varCost: varCost * (1 + tva), fixedCost: fixedHT * (1 + tva), abo: fixedHT * (1 + tva),
    is_base: false, is_dynamic: true,
    avg_ete_ceur:   avgCeur(varCost_ete,   kwh_ete),
    avg_hiver_ceur: avgCeur(varCost_hiver, kwh_hiver),
  };
}

                    <div style={{ display:'flex', gap:8, marginTop:12, paddingTop:12, borderTop:'1px solid rgba(255,255,255,.08)' }}>

          </div>
        </>
      )}
    </div>
    </>
  );
}

// ─── ProfileScreen ───────────────────────────
function ProfileScreen({ user, profile, onSave, onCancel, onLogout, onDeleted }) {
  const [prenom,    setPrenom]    = useState(profile?.prenom || '');
  const [nom,       setNom]       = useState(profile?.nom || '');
  const [pseudo,    setPseudo]    = useState(profile?.pseudo || '');
  const [adresse,   setAdresse]   = useState(profile?.adresse_ligne1 || '');
  const [cp,        setCp]        = useState(profile?.code_postal || '');
  const [ville,     setVille]     = useState(profile?.ville || '');
  const [tel,       setTel]       = useState(profile?.telephone || '');
  const [email,     setEmail]     = useState(user?.email || '');
  const [loading,   setLoading]   = useState(false);
  const [error,     setError]     = useState(null);
  const [showDelete, setShowDelete] = useState(false);
  const [deleteEmail, setDeleteEmail] = useState('');
  const [deleting,  setDeleting]  = useState(false);
  const [deleteErr, setDeleteErr] = useState(null);

  const handleSave = async () => {
    if (!prenom.trim() || !nom.trim()) {
      setError('Le prénom et le nom sont obligatoires.'); return;
    }
    setLoading(true); setError(null);
    const { error: err } = await sb.from('profiles').update({
      prenom:         prenom.trim(),
      nom:            nom.trim(),
      pseudo:         pseudo.trim() || null,
      adresse_ligne1: adresse.trim() || null,
      code_postal:    cp.trim() || null,
      ville:          ville.trim() || null,
      telephone:      tel.trim() || null,
    }).eq('id', user.id);
    if (err) { setError(err.message); setLoading(false); return; }
    if (email.trim() && email.trim() !== user.email) {
      await sb.auth.updateUser({ email: email.trim() });
    }
    setLoading(false);
    onSave({ prenom:prenom.trim(), nom:nom.trim(), pseudo:pseudo.trim()||null,
             adresse_ligne1:adresse.trim()||null, code_postal:cp.trim()||null,
             ville:ville.trim()||null, telephone:tel.trim()||null });
  };

  const handleDeleteConfirm = async () => {
    if (deleteEmail.trim() !== user.email) {
      setDeleteErr("L'email ne correspond pas à votre compte."); return;
    }
    setDeleting(true); setDeleteErr(null);
    await sb.rpc('delete_account');
    await sb.auth.signOut();
    onDeleted?.();
  };

  return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <div className="welcome-tag">Mon compte</div>
          <h1 className="welcome-title">Mes informations<br/><span className="accent">personnelles</span></h1>
        </div>
        <div className="form-card">
          <div className="inp-row">
            <div className="inp-group">
              <label className="inp-label">Prénom *</label>
              <input className="inp" value={prenom} onChange={e=>setPrenom(e.target.value)}/>
            </div>
            <div className="inp-group">
              <label className="inp-label">Nom *</label>
              <input className="inp" value={nom} onChange={e=>setNom(e.target.value)}/>
            </div>
          </div>
          <div className="inp-group">
            <label className="inp-label">Pseudo (affiché dans l'app)</label>
            <input className="inp" value={pseudo} onChange={e=>setPseudo(e.target.value)} placeholder={prenom || 'Marie'}/>
          </div>
          <div className="inp-group">
            <label className="inp-label">Numéro et rue</label>
            <input className="inp" value={adresse} onChange={e=>setAdresse(e.target.value)} placeholder="12 rue de la Paix"/>
          </div>
          <div className="inp-row">
            <div className="inp-group">
              <label className="inp-label">Code postal</label>
              <input className="inp" value={cp} onChange={e=>setCp(e.target.value)} placeholder="75001"/>
            </div>
            <div className="inp-group">
              <label className="inp-label">Ville</label>
              <input className="inp" value={ville} onChange={e=>setVille(e.target.value)} placeholder="Paris"/>
            </div>
          </div>
          <div className="inp-group">
            <label className="inp-label">Téléphone</label>
            <input className="inp" type="tel" value={tel} onChange={e=>setTel(e.target.value)} placeholder="06 12 34 56 78"/>
          </div>
          <div className="inp-group">
            <label className="inp-label">Email</label>
            <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
          </div>
          {error && <div className="auth-error">{error}</div>}
        </div>

        <button className="btn-link" style={{color:'white'}} onClick={onLogout}>
          Se déconnecter
        </button>

        {!showDelete ? (
          <button className="btn-link" style={{color:'rgba(255,120,120,.55)',fontSize:12,paddingTop:4}}
            onClick={()=>setShowDelete(true)}>
            Supprimer ce compte et toutes les données associées
          </button>
        ) : (
          <div className="delete-confirm-card">
            <h3>Supprimer le compte</h3>
            <p>Cette action est irréversible. Toutes vos données seront effacées.<br/>
               Saisissez votre email pour confirmer.</p>
            <div className="inp-group" style={{marginBottom:12}}>
              <input className="inp" type="email" value={deleteEmail}
                onChange={e=>setDeleteEmail(e.target.value)}
                placeholder={user.email}/>
            </div>
            {deleteErr && <div className="auth-error" style={{marginBottom:10}}>{deleteErr}</div>}
            <div style={{display:'flex',gap:8}}>
              <button className="btn-danger" onClick={handleDeleteConfirm} disabled={deleting}>
                {deleting ? 'Suppression…' : 'Confirmer la suppression'}
              </button>
              <button className="btn btn-sec" style={{flex:'0 0 auto',padding:'12px 16px'}}
                onClick={()=>{setShowDelete(false);setDeleteErr(null);setDeleteEmail('');}}>
                Annuler
              </button>
            </div>
          </div>
        )}
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handleSave} disabled={loading}>
          {loading ? 'Enregistrement…' : '✓ Enregistrer et quitter'}
        </button>
        <button className="btn btn-sec" onClick={onCancel}>Quitter sans enregistrer</button>
      </StickyFooter>
    </>
  );
}

// ─── couleur spot ─────────────────────────────
function spotColor(prix) {
  if (prix === null || prix === undefined) return 'rgba(255,255,255,.08)';
  if (prix < 0.03) return '#c8f0c8';
  if (prix < 0.06) return '#90d890';
  if (prix < 0.09) return '#58c058';
  if (prix < 0.12) return '#28a028';
  if (prix < 0.15) return '#b0c820';
  if (prix < 0.18) return '#d8b000';
  if (prix < 0.20) return '#e07818';
  if (prix < 0.22) return '#d84010';
  if (prix < 0.26) return '#b01010';
  return '#600010';
}

function ttcColor(prix) {
  if (prix === null || prix === undefined) return 'rgba(255,255,255,.08)';
  if (prix < 0.10) return '#c8f0c8';
  if (prix < 0.13) return '#90d890';
  if (prix < 0.16) return '#58c058';
  if (prix < 0.19) return '#28a028';
  if (prix < 0.22) return '#b0c820';
  if (prix < 0.26) return '#d8b000';
  if (prix < 0.30) return '#e07818';
  if (prix < 0.35) return '#d84010';
  if (prix < 0.45) return '#b01010';
  return '#600010';
}

// ─── SpotHeatmapCanvas ────────────────────────
const DAYS_IN_MONTH = [31,29,31,30,31,30,31,31,30,31,30,31];
const MOIS_LABELS   = ['Jan','Fév','Mar','Avr','Mai','Jui','Jul','Aoû','Sep','Oct','Nov','Déc'];

function SpotHeatmapCanvas({ spotAll, natParams, heatmapMode }) {
  const wrapperRef = useRef(null);
  const canvasRef  = useRef(null);

  const hcWindows = useMemo(() => natParams ? [
    { s: natParams.hc_debut1 ?? null, e: natParams.hc_fin1 ?? null },
    { s: natParams.hc_debut2 ?? null, e: natParams.hc_fin2 ?? null },
  ].filter(w => w.s !== null && w.e !== null) : [], [natParams]);

  const draw = useCallback((containerW) => {
    if (!canvasRef.current || !spotAll || spotAll.length === 0 || containerW < 10) return;
    const canvas = canvasRef.current;
    const ctx    = canvas.getContext('2d');
    const dpr    = window.devicePixelRatio || 1;
    const isTTC  = heatmapMode === 'ttc' && natParams;

    const dayMap = {};
    spotAll.forEach(r => {
      const k = `${r.mois}_${r.jour}`;
      if (!dayMap[k]) dayMap[k] = new Array(24).fill(null);
      dayMap[k][r.heure] = parseFloat(r.prix);
    });

    const days = [];
    for (let m = 1; m <= 12; m++)
      for (let d = 1; d <= DAYS_IN_MONTH[m-1]; d++)
        days.push({ mois:m, jour:d, prices: dayMap[`${m}_${d}`] || new Array(24).fill(null) });

    const LBL_W = 26;
    const HDR_H = 16;
    const CELL_W = Math.max(4, Math.floor((containerW - LBL_W) / 24));
    const CELL_H = 3;
    const W = LBL_W + 24 * CELL_W;
    const H = HDR_H + days.length * CELL_H;

    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);

    ctx.fillStyle = 'rgba(4,55,66,0.85)';
    ctx.fillRect(0, 0, W, H);

    // Header heures — centré sur chaque colonne
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    for (let h = 0; h < 24; h += 3)
      ctx.fillText(`${h}h`, LBL_W + h * CELL_W + CELL_W / 2, 12);

    // Dessine le label d'un mois centré verticalement sur son bloc
    const drawMonthLabel = (mois, startRow, endRow) => {
      const cy = HDR_H + (startRow + endRow) / 2 * CELL_H + 3;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = 'bold 8px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(MOIS_LABELS[mois-1], LBL_W - 3, cy);
    };

    let prevMonth = 0, mStartRow = 0;
    days.forEach((day, di) => {
      const y = HDR_H + di * CELL_H;
      if (day.mois !== prevMonth) {
        if (prevMonth !== 0) {
          drawMonthLabel(prevMonth, mStartRow, di);
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          ctx.fillRect(LBL_W, y, 24 * CELL_W, 1);
        }
        mStartRow = di;
        prevMonth = day.mois;
      }
      day.prices.forEach((prix, h) => {
        let p = prix;
        if (isTTC && prix !== null) p = calcPrixTTC(prix, day.mois, h, natParams, hcWindows);
        ctx.fillStyle = isTTC ? ttcColor(p) : spotColor(p);
        ctx.fillRect(LBL_W + h * CELL_W, y, CELL_W - 1, CELL_H - 1);
      });
    });
    if (prevMonth) drawMonthLabel(prevMonth, mStartRow, days.length);
  }, [spotAll, natParams, heatmapMode, hcWindows]);

  useEffect(() => {
    if (!wrapperRef.current) return;
    const ro = new ResizeObserver(entries =>
      draw(Math.floor(entries[0].contentRect.width))
    );
    ro.observe(wrapperRef.current);
    return () => ro.disconnect();
  }, [draw]);

  return (
    <div ref={wrapperRef} style={{width:'100%',overflowY:'auto',maxHeight:'calc(100vh - 230px)',borderRadius:8,border:'1px solid rgba(255,255,255,.1)'}}>
      <canvas ref={canvasRef} style={{display:'block'}}/>
    </div>
  );
}

// ─── SpotPricesScreen ─────────────────────────
function SpotPricesScreen({ onBack }) {
  const [meta,       setMeta]       = useState(null);
  const [spotAll,    setSpotAll]    = useState(null);
  const [loading,    setLoading]    = useState(true);
  const [importing,  setImporting]  = useState(false);
  const [importMsg,  setImportMsg]  = useState(null);
  const [natParams,  setNatParams]  = useState(null);
  const [heatmapMode,setHeatmapMode]= useState('spot'); // 'spot' | 'ttc'
  const fileRef = useRef(null);

  const loadData = useCallback(async () => {
    const [{data:m}, {data:jsonRows}, {data:nat}] = await Promise.all([
      sb.from('spot_metadata').select('*').eq('id',1).maybeSingle(),
      sb.rpc('get_spot_json'),
      sb.from('parametres_nationaux').select('*').eq('id',1).maybeSingle(),
    ]);
    setMeta(m);
    setSpotAll(jsonRows && jsonRows.length > 0 ? jsonRows : null);
    setNatParams(nat || null);
    setLoading(false);
  }, []);

  useEffect(() => { loadData(); }, [loadData]);

  const handleImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImporting(true); setImportMsg(null);
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header:0 });
        const records = rows.map(r => ({
          mois:  parseInt(r['mois'] ?? r['Mois'] ?? r['MOIS']),
          jour:  parseInt(r['jour'] ?? r['Jour'] ?? r['JOUR']),
          heure: parseInt(r['heure'] ?? r['Heure'] ?? r['HEURE']),
          prix:  parseFloat(r['spot price'] ?? r['prix'] ?? r['Prix']),
        })).filter(r => !isNaN(r.mois) && !isNaN(r.jour) && !isNaN(r.heure) && !isNaN(r.prix));
        const CHUNK = 500;
        for (let i = 0; i < records.length; i += CHUNK) {
          const { error } = await sb.from('prix_spot').upsert(records.slice(i, i+CHUNK), { onConflict:'mois,jour,heure' });
          if (error) { setImportMsg('Erreur : ' + error.message); setImporting(false); return; }
        }
        await sb.from('spot_metadata').upsert({ id:1, last_update:new Date().toISOString(), rows_count:records.length, source_file:file.name }, { onConflict:'id' });
        setImportMsg(`✓ ${records.length} lignes importées`);
        setImporting(false);
        await loadData();
      } catch(err) {
        setImportMsg('Erreur : ' + err.message);
        setImporting(false);
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  const fmtDate = (ts) => ts ? new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

  return (
    <>
    <div className="screen fade-in">
      {/* Header compact */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',marginBottom:6}}>
        <span style={{fontSize:13,fontWeight:800,color:'white',letterSpacing:.5}}>
          Prix <span style={{color:'var(--green)'}}>spot</span>
        </span>
        <div style={{width:60}}/>
      </div>

      {/* Méta + bouton import — ultra compact */}
      <div style={{background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.12)',borderRadius:10,padding:'8px 12px',marginBottom:6,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:10,color:'rgba(255,255,255,.5)',fontWeight:600}}>
            {meta ? `${meta.rows_count?.toLocaleString('fr-FR')} lignes · MAJ ${fmtDate(meta.last_update)}` : 'Aucune donnée importée'}
          </div>
          {meta?.source_file && <div style={{fontSize:9,color:'rgba(255,255,255,.35)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{meta.source_file}</div>}
          {importMsg && <div style={{fontSize:10,fontWeight:700,marginTop:2,color:importMsg.startsWith('✓')?'var(--green)':'#ff9090'}}>{importMsg}</div>}
        </div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={handleImport}/>
        <button onClick={()=>fileRef.current?.click()} disabled={importing} style={{
          background:'rgba(8,145,178,.2)',border:'1px solid rgba(8,145,178,.4)',color:'#5de0f5',
          fontFamily:'var(--font)',fontSize:11,fontWeight:700,borderRadius:8,padding:'6px 10px',
          cursor:'pointer',whiteSpace:'nowrap',flexShrink:0
        }}>
          {importing ? '…' : '⚡ Importer'}
        </button>
      </div>

      {/* Sélecteur spot / TTC */}
      {natParams && spotAll && (
        <div style={{display:'flex',background:'rgba(255,255,255,.06)',borderRadius:7,padding:2,gap:2,marginBottom:8,alignSelf:'flex-start'}}>
          {[['spot','Prix spot'],['ttc','Prix TTC']].map(([m,lbl])=>(
            <button key={m} onClick={()=>setHeatmapMode(m)} style={{fontSize:11,fontWeight:700,border:'none',borderRadius:5,padding:'4px 10px',cursor:'pointer',fontFamily:'var(--font)',background:heatmapMode===m?'rgba(125,217,64,.25)':'transparent',color:heatmapMode===m?'#7dd940':'rgba(255,255,255,.45)'}}>
              {lbl}
            </button>
          ))}
        </div>
      )}

      {/* Légende compacte */}
      {heatmapMode === 'ttc' && natParams ? (
        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:5}}>
          {[['<10c',0.08],['10-13',0.115],['13-16',0.145],['16-19',0.175],['19-22',0.205],['22-26',0.24],['26-30',0.28],['30-35',0.33],['35-45',0.40],['>45',0.50]].map(([lbl,v])=>(
            <div key={lbl} style={{display:'flex',alignItems:'center',gap:2,fontSize:8.5,color:'rgba(255,255,255,.55)',fontWeight:700}}>
              <div style={{width:9,height:9,borderRadius:2,background:ttcColor(v),flexShrink:0}}/>
              {lbl}
            </div>
          ))}
          <span style={{fontSize:8.5,color:'rgba(255,255,255,.3)',alignSelf:'center'}}>c€/kWh TTC</span>
        </div>
      ) : (
        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:5}}>
          {[['<3c',0.02],['3-6',0.045],['6-9',0.075],['9-12',0.105],['12-15',0.135],['15-18',0.165],['18-20',0.19],['20-22',0.21],['22-26',0.24],['>26',0.30]].map(([lbl,v])=>(
            <div key={lbl} style={{display:'flex',alignItems:'center',gap:2,fontSize:8.5,color:'rgba(255,255,255,.55)',fontWeight:700}}>
              <div style={{width:9,height:9,borderRadius:2,background:spotColor(v),flexShrink:0}}/>
              {lbl}
            </div>
          ))}
          <span style={{fontSize:8.5,color:'rgba(255,255,255,.3)',alignSelf:'center'}}>c€/kWh</span>
        </div>
      )}

      {/* Heatmap pleine largeur */}
      {loading ? (
        <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div>
      ) : spotAll ? (
        <SpotHeatmapCanvas spotAll={spotAll} natParams={natParams} heatmapMode={heatmapMode}/>
      ) : (
        <div className="card" style={{textAlign:'center',padding:'32px 20px'}}>
          <div style={{fontSize:32,marginBottom:10}}>⚡</div>
          <p style={{color:'rgba(255,255,255,.6)',fontSize:13}}>Aucun prix spot importé.</p>
        </div>
      )}
    </div>
    <StickyFooter onBack={onBack}/>
    </>
  );
}

// ─── AccMapScreen ─────────────────────────────
function AccMapScreen({ user, userProfile, onBack, onJoin, onCreate, onPanier }) {
  const [accSites,      setAccSites]      = useState(null);
  const [activeSite,    setActiveSite]    = useState(null);
  const [activeTariff,  setActiveTariff]  = useState(null);
  const [activeProdData,setActiveProdData]= useState(null);
  const [loading,       setLoading]       = useState(true);
  const [siteLatLng,    setSiteLatLng]    = useState(null);
  const [nearbyAcc,     setNearbyAcc]     = useState([]);
  const [popup,         setPopup]         = useState(null);
  const mapDivRef = useRef(null);
  const leafletRef = useRef(null);

  // Load data + geocode
  useEffect(() => {
    const siteId = localStorage.getItem('starvolt_active_site_id');
    Promise.all([
      sb.from('sites_acc').select('*').order('created_at'),
      siteId
        ? sb.from('sites').select('id,nom,adresse_ligne1,code_postal,ville,conso_profil,tarif_id,profil_production_id').eq('id', siteId).maybeSingle()
        : Promise.resolve({ data: null }),
    ]).then(async ([{ data: acc }, { data: site }]) => {
      const accList = acc || [];
      setAccSites(accList);
      setActiveSite(site || null);
      if (site?.profil_production_id) {
        sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single()
          .then(({data}) => { if(data?.profil) setActiveProdData(data.profil); });
      }
      if (site?.tarif_id) {
        const { data: t } = await sb.from('tarifs_electricite').select('prix_hp,prix_hc,nom').eq('id', site.tarif_id).maybeSingle();
        setActiveTariff(t);
      }
      setLoading(false);
      if (site) {
        const q = [site.adresse_ligne1, site.code_postal, site.ville].filter(Boolean).join(' ');
        fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=1`)
          .then(r => r.json())
          .then(geo => {
            const feat = geo?.features?.[0];
            if (!feat) return;
            const [lon, lat] = feat.geometry.coordinates;
            setSiteLatLng([lat, lon]);
            setNearbyAcc(accList.filter(s => s.latitude && s.longitude && haversine(lat, lon, parseFloat(s.latitude), parseFloat(s.longitude)) <= 20));
          }).catch(() => {});
      }
    });
  }, []);

  // Build map once accSites and loading are ready
  useEffect(() => {
    if (loading || !accSites || !mapDivRef.current || leafletRef.current || !window.L) return;
    const L = window.L;
    const center = siteLatLng || [46.5, 2.3];
    const map = L.map(mapDivRef.current, {
      center, zoom: siteLatLng ? 10 : 6,
      zoomControl: true, scrollWheelZoom: true, attributionControl: true,
    });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com">CARTO</a>',
      subdomains: 'abcd', maxZoom: 19,
    }).addTo(map);

    // ALL acc site markers (all France, user can pan/zoom)
    const SunIcon = L.divIcon({
      className: '',
      html: '<div style="width:28px;height:28px;border-radius:50%;background:#fff7d6;border:2.5px solid #f59e0b;box-shadow:0 2px 8px rgba(245,158,11,.5);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer">☀️</div>',
      iconSize: [28, 28], iconAnchor: [14, 14],
    });
    (accSites || []).forEach(s => {
      if (!s.latitude || !s.longitude) return;
      const m = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], { icon: SunIcon });
      m.addTo(map);
      m.on('click', () => setPopup(s));
    });

    // Proximity rings + house marker if geocoded
    if (siteLatLng) {
      const [lat, lon] = siteLatLng;
      const ringLabel = (rLat, rLon, radiusKm, text, color) => {
        const dLon = radiusKm / (111.32 * Math.cos(rLat * Math.PI / 180));
        L.marker([rLat, rLon + dLon], {
          icon: L.divIcon({
            className: 'acc-ring-lbl',
            html: `<span style="color:${color};font-weight:800">${text}</span>`,
            iconAnchor: [0, 10],
          }),
          interactive: false,
        }).addTo(map);
      };
      [
        { r: 2,  color: '#16a34a', dash: null,   lbl: '2 km'  },
        { r: 10, color: '#0284c7', dash: '8 6',  lbl: '10 km' },
        { r: 20, color: '#6b7280', dash: '10 8', lbl: '20 km' },
      ].forEach(({ r, color, dash, lbl }) => {
        L.circle([lat, lon], {
          radius: r * 1000, color, weight: 2,
          fillOpacity: r === 2 ? 0.08 : 0.02, dashArray: dash, interactive: false,
        }).addTo(map);
        ringLabel(lat, lon, r, lbl, color);
      });
      const houseIcon = L.divIcon({
        className: '',
        html: '<div style="width:34px;height:34px;border-radius:50%;background:#dcfce7;border:2.5px solid #16a34a;box-shadow:0 2px 12px rgba(22,163,74,.5);display:flex;align-items:center;justify-content:center;font-size:17px">🏠</div>',
        iconSize: [34, 34], iconAnchor: [17, 17],
      });
      L.marker([lat, lon], { icon: houseIcon, zIndexOffset: 1000 })
        .bindTooltip('Votre site', { permanent: false, direction: 'top', className: 'acc-ring-lbl' })
        .addTo(map);
      // Fit to 20km bounds
      const deg20 = 20 / 111.32;
      map.fitBounds([[lat - deg20, lon - deg20 / Math.cos(lat*Math.PI/180)], [lat + deg20, lon + deg20 / Math.cos(lat*Math.PI/180)]], { padding: [16, 16] });
    }
    leafletRef.current = map;
  }, [loading, accSites, siteLatLng]);

  // Rebuild map if siteLatLng arrives after initial render
  useEffect(() => {
    if (!siteLatLng || !leafletRef.current || !window.L) return;
    const L = window.L;
    const map = leafletRef.current;
    const [lat, lon] = siteLatLng;
    const ringLabel = (rLat, rLon, radiusKm, text, color) => {
      const dLon = radiusKm / (111.32 * Math.cos(rLat * Math.PI / 180));
      L.marker([rLat, rLon + dLon], {
        icon: L.divIcon({ className: 'acc-ring-lbl', html: `<span style="color:${color};font-weight:800">${text}</span>`, iconAnchor: [0, 10] }),
        interactive: false,
      }).addTo(map);
    };
    [
      { r: 2,  color: '#16a34a', dash: null,   lbl: '2 km'  },
      { r: 10, color: '#0284c7', dash: '8 6',  lbl: '10 km' },
      { r: 20, color: '#6b7280', dash: '10 8', lbl: '20 km' },
    ].forEach(({ r, color, dash, lbl }) => {
      L.circle([lat, lon], { radius: r*1000, color, weight:2, fillOpacity: r===2?0.08:0.02, dashArray:dash, interactive:false }).addTo(map);
      ringLabel(lat, lon, r, lbl, color);
    });
    const houseIcon = L.divIcon({
      className: '',
      html: '<div style="width:34px;height:34px;border-radius:50%;background:#dcfce7;border:2.5px solid #16a34a;box-shadow:0 2px 12px rgba(22,163,74,.5);display:flex;align-items:center;justify-content:center;font-size:17px">🏠</div>',
      iconSize: [34, 34], iconAnchor: [17, 17],
    });
    L.marker([lat, lon], { icon: houseIcon, zIndexOffset: 1000 })
      .bindTooltip('Votre site', { permanent: false, direction: 'top', className: 'acc-ring-lbl' })
      .addTo(map);
    const deg20 = 20 / 111.32;
    map.fitBounds([[lat - deg20, lon - deg20 / Math.cos(lat*Math.PI/180)], [lat + deg20, lon + deg20 / Math.cos(lat*Math.PI/180)]], { padding: [16, 16] });
  }, [siteLatLng]);

  const eligible = activeSite && (accSites||[]).some(s => s.code_postal === activeSite.code_postal);
  const eligibleSite = eligible ? (accSites||[]).find(s => s.code_postal === activeSite.code_postal) : null;

  const kwh918 = useMemo(() => {
    if (!activeSite?.conso_profil) return 0;
    let k = 0;
    for (let m=1; m<=12; m++)
      for (let d=1; d<=PROF_DAYS[m-1]; d++)
        for (let h=0; h<24; h++) {
          const idx = profIdx(m,d,h);
          if (activeProdData ? !(activeProdData[idx] > 0) : (h < 9 || h >= 18)) continue;
          k += (activeSite.conso_profil[idx]||0)/1000;
        }
    return Math.round(k);
  }, [activeSite, activeProdData]);

  const priceRef = activeTariff?.prix_hp || 0.24;
  const accPriceKwh = eligibleSite?.prix_vente_ttc || 0.11;
  const accSavings = Math.max(0, Math.round(kwh918 * (priceRef - accPriceKwh)));

  return (
    <div style={{ position:'fixed', inset:0, zIndex:200, display:'flex', flexDirection:'column', background:'linear-gradient(145deg, #065060 0%, #0a9b8c 50%, #0b8264 100%)', overflow:'hidden' }} className="fade-in">

      {/* ── Top bar ── */}
      <div style={{ flexShrink:0, padding:'70px 16px 12px', background:'transparent', position:'relative', zIndex:2 }}>

        {/* Titre + accroche */}
        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:9, letterSpacing:'.8px', color:'rgba(125,217,64,.85)', fontWeight:700, textTransform:'uppercase', marginBottom:4 }}>Autoconsommation collective</div>
          <div style={{ fontSize:20, fontWeight:900, color:'white', lineHeight:1.15, marginBottom:6 }}>
            Payez l'électricité <span className="accent">2× moins cher</span><br/>de 9h à 18h, tous les jours
          </div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,.55)', lineHeight:1.5 }}>
            En rejoignant une boucle ACC locale, vous achetez directement l'énergie solaire produite près de chez vous — à{' '}
            <span style={{ color:'#7dd940', fontWeight:700 }}>{((accPriceKwh||0.09)*100).toFixed(0)} c€/kWh</span>{' '}
            au lieu du tarif EDF heures pleines.
          </div>
        </div>

        {/* Résultat éligibilité */}
        {loading && (
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div className="spinner" style={{ width:14, height:14 }}/>
            <div style={{ fontSize:11, color:'rgba(255,255,255,.4)' }}>Chargement…</div>
          </div>
        )}
        {!loading && activeSite && (eligible ? (
          <div style={{ background:'rgba(255,255,255,.05)', border:'1.5px solid rgba(22,163,74,.45)', borderRadius:12, padding:'10px 14px', display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ fontSize:26, lineHeight:1 }}>✅</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:800, fontSize:14, color:'#4ade80', lineHeight:1.2 }}>{activeSite.nom} — zone éligible !</div>
              {eligibleSite?.nom && <div style={{ fontSize:11, color:'rgba(255,255,255,.45)', marginTop:2 }}>{eligibleSite.nom}{eligibleSite.puissance_pv ? ' · ' + eligibleSite.puissance_pv + ' kWc' : ''}</div>}
            </div>
            {accSavings > 0 && (
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <div style={{ fontSize:22, fontWeight:900, color:'#7dd940', lineHeight:1 }}>-{accSavings.toLocaleString('fr-FR')} €</div>
                <div style={{ fontSize:10, color:'rgba(255,255,255,.4)' }}>/an estimé</div>
              </div>
            )}
          </div>
        ) : (
          <div style={{ background:'rgba(255,255,255,.05)', border:'1px solid rgba(245,158,11,.35)', borderRadius:12, padding:'10px 14px', display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ fontSize:24, lineHeight:1 }}>⏳</div>
            <div>
              <div style={{ fontWeight:700, fontSize:14, color:'#fbbf24', lineHeight:1.2 }}>{activeSite.code_postal} — pas encore disponible</div>
              <div style={{ fontSize:11, color:'rgba(255,255,255,.4)', marginTop:3, lineHeight:1.4 }}>Starvolt déploie progressivement. Vous serez notifié dès l'ouverture d'une boucle près de chez vous.</div>
            </div>
          </div>
        ))}
        {!loading && !activeSite && (
          <div style={{ background:'rgba(255,255,255,.05)', borderRadius:12, padding:'10px 14px', fontSize:13, color:'rgba(255,255,255,.45)' }}>
            Configurez un site dans « Ma conso » pour voir votre éligibilité.
          </div>
        )}
      </div>

      {/* ── Map: fills remaining height ── */}
      <div style={{ flex:1, position:'relative', minHeight:0, overflow:'hidden' }}>
        <div ref={mapDivRef} style={{ width:'100%', height:'100%', position:'absolute', inset:0, zIndex:0 }}/>

        {/* Geocoding spinner overlay */}
        {!loading && activeSite && !siteLatLng && (
          <div style={{ position:'absolute', bottom:80, left:'50%', transform:'translateX(-50%)', zIndex:10, background:'rgba(5,65,78,.85)', borderRadius:20, padding:'6px 14px', display:'flex', alignItems:'center', gap:6 }}>

        {/* Nearby count badge */}
        {siteLatLng && (
          <div style={{ position:'absolute', top:10, right:10, zIndex:10, background:'rgba(5,65,78,.85)', borderRadius:8, padding:'5px 10px' }}>

            <div style={{ fontSize:16, fontWeight:900, color:'#7dd940', lineHeight:1.1 }}>{nearbyAcc.length} site{nearbyAcc.length!==1?'s':''} ACC</div>
          </div>
        )}

        {/* Popup card floating over map */}
        {popup && (
          <div style={{ position:'absolute', bottom:80, left:12, right:12, zIndex:20, background:'rgba(5,65,78,.95)', border:'1.5px solid rgba(125,217,64,.4)', borderRadius:12, padding:'12px 14px', boxShadow:'0 4px 24px rgba(0,0,0,.5)' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
              <div>
                <div style={{ fontWeight:800, fontSize:14, color:'white' }}>☀️ {popup.nom || 'Site ACC'}</div>
                <div style={{ fontSize:11, color:'rgba(255,255,255,.5)', marginTop:2 }}>
                  {popup.adresse ? popup.adresse + ' · ' : ''}{popup.code_postal}
                </div>
                <div style={{ display:'flex', gap:14, marginTop:6 }}>
                  <div><div style={{ fontSize:9, color:'rgba(255,255,255,.35)', textTransform:'uppercase' }}>Puissance</div><div style={{ fontSize:13, fontWeight:700, color:'#38bdf8' }}>{popup.puissance_pv ? popup.puissance_pv + ' kWc' : '—'}</div></div>

                </div>

              <button onClick={()=>setPopup(null)} style={{ background:'rgba(255,255,255,.08)', border:'none', color:'rgba(255,255,255,.6)', cursor:'pointer', fontSize:16, lineHeight:1, borderRadius:6, width:26, height:26, display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>

      {/* ── Sticky footer ── */}
      {!loading && (
        <div style={{ flexShrink:0, padding:'10px 14px', background:'rgba(5,65,78,.97)', borderTop:'1px solid rgba(255,255,255,.08)', display:'flex', alignItems:'center', gap:10, position:'relative', zIndex:1000 }}>

  );

// ─── ThermaleForm ─────────────────────────────
function ThermaleForm({ onDone, onBack }) {
  const [chauffage, setChauffage] = useState(null);
  const [ecs,       setEcs]       = useState(null);
  const [surface,   setSurface]   = useState(null);

  function handleDone() {
    const idx = surface === 'small' ? 0 : surface === 'medium' ? 1 : 2;
    let kw = 0;
    if (chauffage === 'elec' || chauffage === 'pac') kw += [3, 7, 12][idx];
    if (ecs === 'elec') kw += [2, 3, 4][idx];
    try {
      const d = JSON.parse(localStorage.getItem('starvolt_solar_defaults') || '{}');
      d.thermKwh = String(kw);
      localStorage.setItem('starvolt_solar_defaults', JSON.stringify(d));
    } catch {}
    onDone(kw);
  }

  const ready = chauffage && ecs && surface;
  let previewKw = null;
  if (ready) {
    const idx = surface === 'small' ? 0 : surface === 'medium' ? 1 : 2;
    previewKw = 0;
    if (chauffage === 'elec' || chauffage === 'pac') previewKw += [3, 7, 12][idx];
    if (ecs === 'elec') previewKw += [2, 3, 4][idx];
  }

  const bS = (active) => ({
    flex: 1, padding: '13px 6px', borderRadius: 12,
    border: `2px solid ${active ? '#7dd940' : 'rgba(255,255,255,.13)'}`,
    background: active ? 'rgba(125,217,64,.11)' : 'rgba(255,255,255,.04)',
    color: 'white', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'center',
  });
  const lS = (active) => ({ fontSize: 12, fontWeight: active ? 800 : 600, color: active ? '#7dd940' : 'rgba(255,255,255,.75)' });
  const sec = { fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,.4)', textTransform: 'uppercase', letterSpacing: '.6px', marginBottom: 10 };

  return (
    <>
      <div className="screen fade-in">
        <div style={{ marginBottom: 22, marginTop: 4 }}>
          <div style={{ fontSize: 9, letterSpacing: '.8px', color: 'rgba(125,217,64,.85)', fontWeight: 700, textTransform: 'uppercase', marginBottom: 6 }}>Votre logement</div>
          <div style={{ fontSize: 19, fontWeight: 900, color: 'white', lineHeight: 1.25 }}>Quelques infos pour<br/>affiner votre simulation</div>
        </div>

        <div className="card" style={{ padding: '16px', marginBottom: 10 }}>
          <div style={sec}>Type de chauffage</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={() => setChauffage('elec')} style={bS(chauffage==='elec')}>
              <div style={{ fontSize: 22, marginBottom: 5 }}>⚡</div>
              <div style={lS(chauffage==='elec')}>Électrique</div>
            </button>
            <button onClick={() => setChauffage('pac')} style={bS(chauffage==='pac')}>
              <div style={{ fontSize: 22, marginBottom: 5 }}>♨️</div>
              <div style={lS(chauffage==='pac')}>PAC</div>
            </button>
            <button onClick={() => setChauffage('autre')} style={bS(chauffage==='autre')}>
              <div style={{ fontSize: 22, marginBottom: 5 }}>🔥</div>
              <div style={lS(chauffage==='autre')}>Autre</div>
            </button>
          </div>
        </div>

        <div className="card" style={{ padding: '16px', marginBottom: 10 }}>
          <div style={sec}>Eau chaude sanitaire</div>
          <div style={{ display: 'flex', gap: 10 }}>
            <button onClick={() => setEcs('elec')} style={bS(ecs==='elec')}>
              <div style={{ fontSize: 22, marginBottom: 5 }}>⚡</div>
              <div style={lS(ecs==='elec')}>Électrique</div>
            </button>
            <button onClick={() => setEcs('autre')} style={bS(ecs==='autre')}>
              <div style={{ fontSize: 22, marginBottom: 5 }}>🔥</div>
              <div style={lS(ecs==='autre')}>Autre</div>
            </button>
          </div>
        </div>

        <div className="card" style={{ padding: '16px', marginBottom: 10 }}>
          <div style={sec}>Surface du logement</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={() => setSurface('small')} style={bS(surface==='small')}>
              <div style={lS(surface==='small')}>{'< 70 m²'}</div>
            </button>
            <button onClick={() => setSurface('medium')} style={bS(surface==='medium')}>
              <div style={lS(surface==='medium')}>{'70–150 m²'}</div>
            </button>
            <button onClick={() => setSurface('large')} style={bS(surface==='large')}>
              <div style={lS(surface==='large')}>{' > 150 m²'}</div>
            </button>
          </div>
        </div>

        {previewKw !== null && (
          <div style={{ textAlign: 'center', padding: '14px 0 4px' }}>
            <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)', marginBottom: 4 }}>Stockage thermique estimé</div>
            {previewKw > 0
              ? <div style={{ fontSize: 34, fontWeight: 900, color: '#7dd940', lineHeight: 1 }}>
                  {previewKw} <span style={{ fontSize: 18, fontWeight: 600, color: 'rgba(125,217,64,.7)' }}>kWh</span>
                </div>
              : <div style={{ fontSize: 15, fontWeight: 700, color: 'rgba(255,255,255,.35)' }}>Stockage thermique non applicable</div>
            }
          </div>
        )}
      </div>
      <StickyFooter row onBack={onBack}>
        <button className="btn btn-yes" onClick={handleDone} disabled={!ready}
          style={{ opacity: ready ? 1 : 0.35, flex: 1 }}>
          Continuer →
        </button>
      </StickyFooter>
    </>
  );
}

// ─── BoxSimScreen ─────────────────────────────
function BoxSimScreen({ user, userProfile, onBack, onPanier, onMonSite, onCartUpdate }) {
  const [loading,      setLoading]      = useState(true);
  const [currentBill,  setCurrentBill]  = useState(null);
  const [isDynamic,    setIsDynamic]    = useState(false);
  const [chosen,       setChosen]       = useState(() => localStorage.getItem('starvolt_box_chosen') || null);
  const [justConfirmed,setJustConfirmed]= useState(false);
  const [showThermForm,setShowThermForm]= useState(false);
  const [shiftSaving,  setShiftSaving]  = useState(0);
  const [storageRatio, setStorageRatio] = useState(0.5);

  useEffect(() => {
    const siteId = localStorage.getItem('starvolt_active_site_id');
    if (!siteId) { setLoading(false); return; }
    Promise.all([
      sb.from('sites').select('id,conso_profil,tarif_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2').eq('id', siteId).maybeSingle(),
      sb.from('tarifs_electricite').select('*'),
      sb.rpc('get_spot_json'),
      sb.from('parametres_nationaux').select('*').eq('id', 1).maybeSingle(),
    ]).then(([{ data: site }, { data: tariffs }, { data: spotRows }, { data: nat }]) => {
      if (!site?.conso_profil) { setLoading(false); return; }
      const curTariff = site.tarif_id ? (tariffs || []).find(t => t.id === site.tarif_id) : null;
      const { kwh_hc, kwh_hp } = calcHcHp(site.conso_profil, site);
      const kwh_total = kwh_hc + kwh_hp;
      let bill = null;
      if (curTariff?.tarif_dynamique) {
        setIsDynamic(true);
        if (spotRows && nat) {
          const r = calcDynamicCost(curTariff, site.conso_profil, buildSpotMap(spotRows), nat, site);
          bill = r?.total || null;
        }
      } else if (curTariff) {
        bill = calcTariffCost(curTariff, kwh_hc, kwh_hp)?.total || null;
      }
      if (!bill && kwh_total > 0) bill = Math.round(kwh_total * 0.18);
      setCurrentBill(bill ? Math.round(bill) : null);
      // Gain réel du déplacement de consommation calculé heure par heure
      const solDef=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})();
      const bkv=parseFloat(solDef.batKwh)||0, tkv=parseFloat(solDef.thermKwh)||0;
      if (curTariff && (bkv > 0 || tkv > 0)) {
        const sp = spotRows ? buildSpotMap(spotRows) : null;
        const res = computeStorageOptimization(site.conso_profil, curTariff, curTariff, site, bkv, tkv, {...nat, opti_tarif:true}, sp);
        setShiftSaving(res?.saving || 0);
      }
      setStorageRatio((nat?.ratio_puissance_stockage ?? 50) / 100);
      setLoading(false);
    });
  }, []);

  const _solDef = (() => { try { return JSON.parse(localStorage.getItem('starvolt_solar_defaults')) || {}; } catch { return {}; } })();
  const thermKwhFlex = parseFloat(_solDef.thermKwh) || 10;
  const batKwhFlex   = parseFloat(_solDef.batKwh)   || 10;
  const flexGain  = Math.round(thermKwhFlex * 14 + batKwhFlex * storageRatio * 27);
  const shiftGain = shiftSaving > 0 ? shiftSaving : null;
  const totalGain = flexGain + (shiftGain || 0);
  const newBill   = currentBill ? Math.round(currentBill - (shiftGain || 0)) : null;

  if (showThermForm) {
    return <ThermaleForm
      onBack={() => setShowThermForm(false)}
      onDone={() => { setShowThermForm(false); setJustConfirmed(true); if(onCartUpdate) onCartUpdate(); }}
    />;
  }

  if (justConfirmed) {
    return (
      <>
      <div className="screen fade-in">
        <Fireworks final/>
        <div style={{ textAlign:'center', marginBottom:16 }}>
          <div style={{ fontSize:38, marginBottom:4 }}>{chosen === 'buy' ? '📦' : '🎁'}</div>
          <div style={{ fontSize:22, fontWeight:900, color:'white', lineHeight:1.2 }}>
            {chosen === 'buy' ? 'Box commandée !' : 'Box gratuite activée !'}
          </div>
          <div style={{ fontSize:13, color:'rgba(255,255,255,.5)', marginTop:6 }}>
            {chosen === 'buy' ? 'Votre box Comwatt arrive sous 5–10 jours.' : 'Vos revenus de flexibilité financent votre box pendant 3 ans.'}
          </div>
        </div>
        {currentBill && (
          <div className="card" style={{ padding:'16px', marginBottom:10, textAlign:'center' }}>
            <div style={{ fontSize:11, color:'rgba(255,255,255,.4)', marginBottom:8, textTransform:'uppercase', letterSpacing:'.5px' }}>Votre facture évolue</div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:18 }}>
              <div>

function SolarSimScreen({ user, userProfile, onBack, onPanier, onMonSite, onCartUpdate }) {
  const [loading,      setLoading]      = useState(true);
  const [currentBill,  setCurrentBill]  = useState(null);
  const [adjustedBill, setAdjustedBill] = useState(null);
  const [isDynamic,    setIsDynamic]    = useState(false);
  const [chosen,       setChosen]       = useState(() => localStorage.getItem('starvolt_solar_chosen') || null);
  const [justConfirmed,setJustConfirmed]= useState(false);
  const [showThermForm,setShowThermForm]= useState(false);
  // Params installation — init depuis starvolt_solar_defaults (source partagée avec Ma prod)
  const [pvKwc,    setPvKwc]    = useState(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))?.pvKwc||'6';}catch{return'6';}});
  const [batKwh,   setBatKwh]   = useState(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))?.batKwh||'10';}catch{return'10';}});
  const [thermKwh, setThermKwh] = useState(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))?.thermKwh||'5';}catch{return'5';}});

  // Persister les valeurs dans localStorage → Ma prod peut les copier comme defaults
  useEffect(()=>{
    localStorage.setItem('starvolt_solar_defaults',JSON.stringify({pvKwc,batKwh,thermKwh}));
  },[pvKwc,batKwh,thermKwh]);

  // Données pour calcul réel
  const [siteRef,    setSiteRef]    = useState(null);  // {conso_profil, currentBill, curTariff, site}
  const [prodData,   setProdData]   = useState(null);
  const [globalVars, setGlobalVars] = useState(null);
  const [realSaving, setRealSaving] = useState(null);
  const [autoPct,    setAutoPct]    = useState(null);

  useEffect(() => {
    const siteId = localStorage.getItem('starvolt_active_site_id');
    if (!siteId) { setLoading(false); return; }
    Promise.all([
      sb.from('sites').select('id,conso_profil,conso_annuelle_kwh,tarif_id,profil_production_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2').eq('id', siteId).maybeSingle(),
      sb.from('tarifs_electricite').select('*'),
      sb.rpc('get_spot_json'),
      sb.from('parametres_nationaux').select('*').eq('id', 1).maybeSingle(),
    ]).then(async ([{ data: site }, { data: tariffs }, { data: spotRows }, { data: nat }]) => {
      if (!site?.conso_profil) { setLoading(false); return; }
      const curTariff = site.tarif_id ? (tariffs || []).find(t => t.id === site.tarif_id) : null;
      const { kwh_hc, kwh_hp } = calcHcHp(site.conso_profil, site);
      const kwh_total = kwh_hc + kwh_hp;
      // Utiliser conso_annuelle_kwh (DB) pour cohérence avec l'affichage Ma conso
      const siteKwh = site.conso_annuelle_kwh || kwh_total;
      let bill = null;
      if (curTariff?.tarif_dynamique) {
        setIsDynamic(true);
        if (spotRows && nat) {
          const r = calcDynamicCost(curTariff, site.conso_profil, buildSpotMap(spotRows), nat, site);
          bill = r?.total || null;
        }
      } else if (curTariff && siteKwh > 0) {
        // Même formule que MonSiteScreen : abo + conso_annuelle_kwh * prix_hp
        bill = Math.round((curTariff.abo_annuel||0) + siteKwh * (curTariff.prix_hp||0));
      }
      if (!bill && siteKwh > 0) bill = Math.round(siteKwh * 0.18);
      const roundedBill = bill ? Math.round(bill) : null;
      const optiSavLS = parseInt(localStorage.getItem('starvolt_optimisation_saving')||'0');
      // Charger le profil de production en premier (utilisé pour accSavComp + calcul solaire)
      let _pp = null;
      if (site.profil_production_id) {
        const { data: ppData } = await sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single();
        _pp = ppData?.profil || null;
        if (_pp) setProdData(_pp);
      }
      let accSavComp = 0;
      if (site.conso_profil) {
        let kwh918 = 0;
        for (let m=1;m<=12;m++) for (let d=1;d<=PROF_DAYS[m-1];d++) for (let h=0;h<24;h++) {
          const idx=profIdx(m,d,h);
          if (_pp ? !(_pp[idx]>0) : (h<9||h>=18)) continue;
          kwh918+=(site.conso_profil[idx]||0)/1000;
        }
        accSavComp = Math.max(0, Math.round(kwh918*((curTariff?.prix_hp||0.24)-0.11)));
      }
      const adj = roundedBill ? Math.max(0, roundedBill - optiSavLS - accSavComp) : null;
      setCurrentBill(roundedBill);
      setAdjustedBill(adj || roundedBill);
      setGlobalVars(nat);
      setSiteRef({ conso_profil: site.conso_profil, currentBill: roundedBill, curTariff, site, kwh_total: siteKwh, kwh_hc, kwh_hp });
      setLoading(false);
    });
  }, []);

  // Calcul réel des économies solaires heure par heure
  useEffect(() => {
    if (!siteRef?.conso_profil || !prodData) return;
    const gv = globalVars || {};
    const ratioBat   = (gv.ratio_puissance_stockage              ?? 50) / 100;
    const ratioTherm = (gv.ratio_puissance_stockage_thermique    ?? 50) / 100;
    const pBat   = gv.pertes_batterie   ?? 10;
    const pTherm = gv.pertes_thermique  ?? 0;
    const kw  = parseFloat(pvKwc)   || 0;
    const bk  = parseFloat(batKwh)  || 0;
    const tk  = parseFloat(thermKwh)|| 0;
    const bal = computeEnergyBalance(
      siteRef.conso_profil, prodData, kw,
      bk * ratioBat  * 1000, bk, pBat,
      tk * ratioTherm,       tk, pTherm
    );
    const gridBuy = bal.monthly.reduce((s,m) => s + m.grid_buy, 0);
    const injKwh = bal.monthly.reduce((s,m) => s + m.injection, 0);
    const { kwh_total, currentBill } = siteRef;
    const prixMoyen = kwh_total > 0 && currentBill ? currentBill / kwh_total : 0.18;
    const prixRachat = gv.prix_rachat_injection ?? 0.04;
    // Formule directe Greg : nouvFact = achat_réseau × prixMoyen - injection × prixRachat
    // Évite le double-comptage de on_site + via_bat + via_therm dans computeEnergyBalance
    const nouvFact = Math.max(0, gridBuy * prixMoyen - injKwh * prixRachat);
    const saving = Math.max(0, Math.round(currentBill - nouvFact));
    const trueAutoKwh = Math.max(0, kwh_total - gridBuy);
    if(saving > 0) localStorage.setItem('starvolt_baisse_facture', String(saving));
    setRealSaving(saving > 0 ? saving : null);
    setAutoPct(kwh_total > 0 ? Math.round(trueAutoKwh / kwh_total * 100) : 0);
  }, [pvKwc, batKwh, thermKwh, siteRef, prodData, globalVars]);

  // Gains solaires (fallback %-based si pas de profil prod)
  const solarBoxSaving = adjustedBill ? Math.round(adjustedBill * 0.70) : null;
  const baisseFactureLS = parseInt(localStorage.getItem('starvolt_baisse_facture')||'0') || null;
  const finalSolarSaving = realSaving ?? baisseFactureLS ?? solarBoxSaving;

  // Gains box (rappel)
  const shiftPct  = isDynamic ? 0.20 : 0.10;
  const shiftGain = currentBill ? Math.round(currentBill * shiftPct) : null;

  if (showThermForm) {
    return <ThermaleForm
      onBack={() => setShowThermForm(false)}
      onDone={(kw) => { setThermKwh(String(kw)); setShowThermForm(false); setJustConfirmed(true); if(onCartUpdate) onCartUpdate(); }}
    />;
  }

  if (justConfirmed) {
    return (
      <>
      <div className="screen fade-in">
        <Fireworks final/>
        <div style={{ textAlign:'center', marginBottom:16 }}>
          <div style={{ fontSize:38, marginBottom:4 }}>☀️</div>
          <div style={{ fontSize:22, fontWeight:900, color:'white', lineHeight:1.2 }}>
            Solaire + Box activés !
          </div>
          <div style={{ fontSize:13, color:'rgba(255,255,255,.5)', marginTop:6 }}>
            Un conseiller Starvolt vous contacte sous 48h pour l'étude personnalisée.
          </div>
        </div>

        {currentBill && (
          <div className="card" style={{ padding:'16px', marginBottom:10, textAlign:'center' }}>

            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:18, marginBottom:14 }}>
              <div>
                <div style={{ fontSize:28, fontWeight:900, color:'rgba(255,100,100,.7)', textDecoration:'line-through', lineHeight:1 }}>
                  {currentBill.toLocaleString('fr-FR')} €
                </div>
                <div style={{ fontSize:10, color:'rgba(255,255,255,.35)', marginTop:3 }}>AVANT</div>
              </div>
              <div style={{ fontSize:22, color:'#7dd940' }}>→</div>
              <div>
                <div style={{ fontSize:36, fontWeight:900, color:'#7dd940', lineHeight:1 }}>
                  {currentBill && finalSolarSaving ? (currentBill - finalSolarSaving).toLocaleString('fr-FR') : '—'} €
                </div>
                <div style={{ fontSize:10, color:'rgba(255,255,255,.35)', marginTop:3 }}>APRÈS SOLAIRE + BOX</div>
              </div>
            </div>
            <div style={{ background:'rgba(255,255,255,.05)', borderRadius:8, padding:'10px 12px' }}>
              <div style={{ fontSize:11, color:'rgba(255,255,255,.5)', marginBottom:2 }}>Baisse de la facture électrique</div>
              <div style={{ fontSize:24, fontWeight:900, color:'#7dd940' }}>-{finalSolarSaving?.toLocaleString('fr-FR')} €TTC/an</div>
              {autoPct !== null && <div style={{ fontSize:10, color:'rgba(255,255,255,.35)', marginTop:2 }}>{autoPct}% d'autoproduction · solaire + batterie + Box Comwatt</div>}
            </div>
          </div>
        )}

        <div className="card" style={{ padding:'14px 16px', border:'1px solid rgba(125,217,64,.25)' }}>
          <div style={{ fontWeight:700, fontSize:13, color:'#7dd940', marginBottom:6 }}>✦ Prochaine étape</div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,.6)' }}>
            Notre expert réalise une étude de votre toiture et dimensionne votre installation. Gratuit et sans engagement.
          </div>
        </div>
      </div>
      <StickyFooter row onBack={onBack}>
        <button className="btn btn-yes" onClick={onMonSite||onPanier}>Mon site →</button>
      </StickyFooter>
      </>
    );
  }

  return (
    <>
      <div className="screen fade-in">

        {/* ── 1. Titre ── */}
        <div style={{ marginBottom:16, marginTop:4 }}>
          <div style={{ fontSize:9, letterSpacing:'.8px', color:'rgba(125,217,64,.85)', fontWeight:700, textTransform:'uppercase', marginBottom:6 }}>Simulation</div>
          <div style={{ fontSize:20, fontWeight:900, color:'white', lineHeight:1.2 }}>
            Gagnez{' '}
            {finalSolarSaving
              ? <span className="accent">{finalSolarSaving.toLocaleString('fr-FR')} €/an</span>
              : <span className="accent">jusqu'à 70%</span>
            }{' '}
            grâce au solaire et aux batteries Comwatt
          </div>
        </div>

        {loading ? (
          <div style={{ textAlign:'center', padding:40 }}><div className="spinner" style={{ margin:'0 auto' }}/></div>
        ) : (<>

          {/* ── 2. Baisse de la facture ── */}
          {(()=>{
            const displayed = realSaving ?? (parseInt(localStorage.getItem('starvolt_baisse_facture')||'0') || null);
            if(!displayed) return null;
            return (
              <div className="card" style={{ padding:'12px 14px', marginBottom:10 }}>

                </div>
              </div>
            </div>
          </div>

        </>)}
      </div>

      {!loading && (
        chosen ? (
          <StickyFooter row onBack={onBack}>
            <button className="btn btn-yes" onClick={onMonSite||onPanier}>Mon site →</button>
          </StickyFooter>
        ) : (
          <StickyFooter onBack={onBack}>
            <button className="btn btn-yes" onClick={() => { localStorage.setItem('starvolt_solar_chosen','solar_box'); try{const d=JSON.parse(localStorage.getItem('starvolt_solar_defaults')||'{}');localStorage.setItem('starvolt_solar_defaults',JSON.stringify({...d,pvKwc:'6',batKwh:'10'}));}catch{localStorage.setItem('starvolt_solar_defaults',JSON.stringify({pvKwc:'6',batKwh:'10',thermKwh:'0'}));} if(solarBoxSaving) localStorage.setItem('starvolt_solar_saving',String(solarBoxSaving)); localStorage.removeItem('starvolt_box_chosen'); localStorage.removeItem('starvolt_box_saving'); setPanierServicesChecked({opti_solaire:true,opti_tarif:true,opti_flex:true}); setChosen('solar_box'); setShowThermForm(true); }}>
              ☀️ Je veux des panneaux + batterie + Box
            </button>
          </StickyFooter>
        )
      )}
    </>
  );
}

        }}>✕</button>
