// ─── ResetPasswordScreen ─────────────────────
function ResetPasswordScreen({ onDone }) {
  const [pwd,     setPwd]     = useState('');
  const [pwd2,    setPwd2]    = useState('');
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);
  const [ok,      setOk]      = useState(false);

  const handle = async () => {
    if (pwd.length < 6)        { setError('6 caractères minimum.'); return; }
    if (pwd !== pwd2)          { setError('Les mots de passe ne correspondent pas.'); return; }
    setLoading(true); setError(null);
    const { error: err } = await sb.auth.updateUser({ password: pwd });
    if (err) { setError(err.message); setLoading(false); return; }
    setOk(true); setLoading(false);
  };

  if (ok) return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <h1 className="welcome-title">Mot de passe<br/><span className="accent">mis à jour ✦</span></h1>
          <p className="welcome-sub" style={{marginTop:12}}>
            Votre nouveau mot de passe est actif.
          </p>
        </div>
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={onDone}>Accéder à mon espace →</button>
      </StickyFooter>
    </>
  );

  return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <div className="welcome-tag">Réinitialisation</div>
          <h1 className="welcome-title">Nouveau<br/><span className="accent">mot de passe</span></h1>
        </div>
        <div className="form-card">
          <div className="inp-group">
            <label className="inp-label">Nouveau mot de passe</label>
            <input className="inp" type="password" value={pwd}
              onChange={e=>setPwd(e.target.value)} placeholder="6 caractères minimum"/>
          </div>
          <div className="inp-group">
            <label className="inp-label">Confirmer</label>
            <input className="inp" type="password" value={pwd2}
              onChange={e=>setPwd2(e.target.value)} placeholder="Même mot de passe"/>
          </div>
          {error && <div className="auth-error">{error}</div>}
        </div>
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handle} disabled={loading}>
          {loading ? 'Enregistrement…' : 'Enregistrer mon mot de passe →'}
        </button>
      </StickyFooter>
    </>
  );
}

// ─── FeedbackModal : recueille un commentaire positif/négatif ──────────────────
function FeedbackModal({ sentiment, user, screen, onClose }) {
  const [text, setText] = useState('');
  const [saving, setSaving] = useState(false);
  const [done, setDone] = useState(false);
  const [file, setFile] = useState(null);
  const taRef = useRef(null);
  const fileRef = useRef(null);
  // Capturé au montage : le détail contextuel (ex : la question de quiz affichée)
  const detailRef = useRef(typeof window !== 'undefined' ? window.__feedbackDetail : null);
  const detail = detailRef.current;
  const positif = sentiment === 'up';
  const accent = positif ? '#7dd940' : '#ff8a6a';
  const accentBg = positif ? 'rgba(125,217,64,.12)' : 'rgba(255,138,106,.12)';
  const accentBd = positif ? 'rgba(125,217,64,.4)' : 'rgba(255,138,106,.4)';
  const pageNom = screenLabel(screen);

  useEffect(() => { const t = setTimeout(() => taRef.current?.focus(), 120); return () => clearTimeout(t); }, []);

  const pickFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) { alert('Fichier trop volumineux (max 10 Mo).'); return; }
    setFile(f);
  };

  const submit = async () => {
    if (saving || !user) return;
    setSaving(true);
    let attachment_url = null;
    if (file) {
      try { attachment_url = await uploadFeedbackFile(file); }
      catch (err) { setSaving(false); alert('Erreur lors de l’envoi de la pièce jointe : ' + err.message); return; }
    }
    const { error } = await sb.from('app_feedback').insert({
      user_id: user.id, sentiment, comment: text.trim() || null,
      screen, page_label: pageNom,
      context_detail: detail || null, attachment_url,
    });
    setSaving(false);
    if (error) { alert('Erreur lors de l’envoi : ' + error.message); return; }
    setDone(true);
    setTimeout(onClose, 1100);
  };

  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',backdropFilter:'blur(4px)',WebkitBackdropFilter:'blur(4px)',zIndex:10000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#13212e',border:`1px solid ${accentBd}`,borderRadius:18,padding:'22px 20px',maxWidth:380,width:'100%',boxShadow:'0 18px 50px rgba(0,0,0,.45)'}} className="fade-in">
        {done ? (
          <div style={{textAlign:'center',padding:'14px 0'}}>
            <div style={{fontSize:40,marginBottom:8}}>{positif?'🙌':'🙏'}</div>
            <div style={{fontWeight:900,fontSize:17,color:'white'}}>Merci pour votre retour !</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginTop:6,lineHeight:1.5}}>Votre message nous aide à améliorer Starvolt.</div>
          </div>
        ) : (
          <>
            <div style={{display:'flex',alignItems:'center',gap:11,marginBottom:14}}>
              <div style={{width:44,height:44,borderRadius:12,background:accentBg,border:`1px solid ${accentBd}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <ThumbIcon up={positif} size={22} color={accent}/>
              </div>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:900,fontSize:16,color:'white',lineHeight:1.2}}>{positif?'Ce qui vous plaît':'Ce qui ne va pas'}</div>
                <div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginTop:2}}>Page : <span style={{color:accent,fontWeight:700}}>{pageNom}</span></div>
              </div>
            </div>
            {detail && (
              <div style={{background:accentBg,border:`1px solid ${accentBd}`,borderRadius:10,padding:'8px 11px',marginBottom:12,fontSize:12,color:'rgba(255,255,255,.78)',lineHeight:1.45}}>
                <span style={{color:accent,fontWeight:700}}>Contexte : </span>{detail}
              </div>
            )}
            <textarea
              ref={taRef}
              value={text}
              onChange={e=>setText(e.target.value)}
              placeholder={positif?'Dites-nous ce que vous appréciez…':'Décrivez le problème ou ce qui pourrait être amélioré…'}
              rows={4}
              style={{width:'100%',boxSizing:'border-box',background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.15)',borderRadius:11,color:'white',fontSize:14,fontFamily:'inherit',padding:'11px 13px',lineHeight:1.5,resize:'vertical',outline:'none'}}
            />
            <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf" onChange={pickFile} style={{display:'none'}}/>
            {file ? (
              <div style={{display:'flex',alignItems:'center',gap:9,marginTop:10,background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.14)',borderRadius:10,padding:'8px 11px'}}>
                <span style={{fontSize:16,flexShrink:0}}>{file.type==='application/pdf'?'📄':'🖼️'}</span>
                <span style={{flex:1,minWidth:0,fontSize:12.5,color:'rgba(255,255,255,.82)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{file.name}</span>
                <button onClick={()=>{ setFile(null); if(fileRef.current) fileRef.current.value=''; }} style={{flexShrink:0,background:'none',border:'none',color:'rgba(255,255,255,.5)',cursor:'pointer',fontSize:16,fontFamily:'inherit',lineHeight:1,padding:2}}>✕</button>
              </div>
            ) : (
              <button onClick={()=>fileRef.current?.click()} style={{display:'flex',alignItems:'center',gap:7,marginTop:10,background:'rgba(255,255,255,.05)',border:'1px dashed rgba(255,255,255,.22)',borderRadius:10,color:'rgba(255,255,255,.62)',padding:'9px 13px',cursor:'pointer',fontFamily:'inherit',fontSize:12.5,fontWeight:600,width:'100%'}}>
                <span style={{fontSize:15}}>📎</span> Ajouter une pièce jointe (image ou PDF)
              </button>
            )}
            <div style={{display:'flex',gap:10,marginTop:14}}>
              <button onClick={onClose} style={{flex:'0 0 auto',background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.18)',borderRadius:11,color:'rgba(255,255,255,.7)',padding:'11px 16px',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:700}}>Annuler</button>
              <button onClick={submit} disabled={saving} style={{flex:1,background:accentBg,border:`1px solid ${accentBd}`,borderRadius:11,color:accent,padding:'11px',cursor:saving?'default':'pointer',fontFamily:'inherit',fontSize:14,fontWeight:800,opacity:saving?.6:1}}>{saving?'Envoi…':'Envoyer'}</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ─── Utilitaires Learn ────────────────────────────────────────────────────────
async function uploadLearnImage(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const filename = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await sb.storage.from('learn-images').upload(filename, file, { contentType: file.type, upsert: true });
  if (error) throw error;
  const { data: { publicUrl } } = sb.storage.from('learn-images').getPublicUrl(filename);
  return publicUrl;
}
// Upload d'une pièce jointe de feedback (png/jpg/pdf…) vers son bucket dédié
async function uploadFeedbackFile(file) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const filename = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await sb.storage.from('feedback-attachments').upload(filename, file, { contentType: file.type || 'application/octet-stream', upsert: true });
  if (error) throw error;
  const { data: { publicUrl } } = sb.storage.from('feedback-attachments').getPublicUrl(filename);
  return publicUrl;
}
function getVideoEmbed(url) {
  if (!url) return null;
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([^&?/]+)/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  return url;
}

      (qs || []).forEach(q => { qCountBySubject[q.subject_id] = (qCountBySubject[q.subject_id] || 0) + 1; });
      let learned = 0, okQuiz = 0;
      if (user) {
        const { data: p } = await sb.from('user_learn_progress').select('subject_id,completed_at,failed_question_ids').eq('user_id', user.id);
        if (p) p.forEach(r => {
          if (r.completed_at) learned++;
          const qc = qCountBySubject[r.subject_id] || 0;
          const failed = (r.failed_question_ids && r.failed_question_ids.length) || 0;
          okQuiz += Math.max(0, qc - failed);
        });
      }
      const pct = totalQuiz > 0 ? (okQuiz / totalQuiz) * 100 : 0;
      if (!cancelled) setLearnStats({ learned, totalSubjects, okQuiz, totalQuiz, pct });
    }
    load();
    return () => { cancelled = true; };
  }, [user]);

  const medal = (() => {
    const pct = learnStats?.pct ?? 0;
    if (pct < 10)  return { emoji:'🐻', label:'Ourson' };
    if (pct < 33)  return { emoji:'⭐', label:'1ʳᵉ étoile' };
    if (pct < 66)  return { emoji:'⭐⭐', label:'2ᵉ étoile' };
    return { emoji:'⭐⭐⭐', label:'3ᵉ étoile' };
  })();

// ─── GroupDescription : sous-titre groupe — 4 lignes + "Lire la suite / Réduire" (ergonomie du bilan)
function GroupDescription({ text }) {
  const [expanded, setExpanded] = useState(false);
  const [overflowing, setOverflowing] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (el) setOverflowing(el.scrollHeight - el.clientHeight > 1);
  }, [text]);
  const toggle = (e) => { e.stopPropagation(); setExpanded(v => !v); };
  return (
    <div>
      <div ref={ref} style={{
        fontSize:15.5, color:'white', lineHeight:1.4,
        ...(expanded ? {} : { display:'-webkit-box', WebkitLineClamp:4, WebkitBoxOrient:'vertical', overflow:'hidden' })
      }}>{text}</div>
      {(overflowing || expanded) && (
        <span onClick={toggle}
          style={{ display:'inline-block', cursor:'pointer', color:'#7dd940', fontWeight:700, fontSize:12.5, marginTop:6, userSelect:'none' }}>
          {expanded ? 'Réduire ▲' : '… Lire la suite ▾'}
        </span>
      )}
    </div>
  );
}

      const { data: grps } = await sb.from('learn_groups').select('id,title,description,ordre').order('ordre');
      const { data: subs } = await sb.from('learn_subjects').select('id,group_id').order('ordre');

// ─── ComprendreQuizScreen ─────────────────────────────────────────────────────
function ComprendreQuizScreen({ user, questions, subject, isRevision, onDone, onBack }) {
  const [idx, setIdx] = useState(0);
  const [selectedIds, setSelectedIds] = useState([]); // réponses sélectionnées pour la question courante
  const [answered, setAnswered] = useState(false);
  const [results, setResults] = useState([]);

  const q = questions[idx];

  // Renseigne le détail contextuel du feedback avec la question affichée
  useEffect(() => {
    if (!window.__setFeedbackDetail) return;
    if (q) window.__setFeedbackDetail(`Question ${idx+1}/${questions.length} : ${q.question}`);
    return () => window.__setFeedbackDetail(null);
  }, [idx, q && q.id]);

  if (!q) return null;

  const choices      = q.learn_choices || [];
  const correctIds   = choices.filter(c => c.is_correct).map(c => c.id);
  const correctCount = Math.max(1, correctIds.length); // nb de réponses attendues
  const multi        = correctCount > 1;
  // Réponse correcte = exactement le bon ensemble sélectionné
  const isCurrentCorrect = selectedIds.length === correctCount && selectedIds.every(id => correctIds.includes(id));

  const handleSelect = (choice) => {
    if (answered) return;
    const isSel = selectedIds.includes(choice.id);
    const next  = isSel ? selectedIds.filter(id => id !== choice.id) : [...selectedIds, choice.id];
    setSelectedIds(next);
    // Dès que le nombre de réponses attendu est atteint → vérification
    if (next.length === correctCount) {
      const ok = next.every(id => correctIds.includes(id));
      setAnswered(true);
      setResults(r => [...r, { questionId: q.id, correct: ok }]);
    }
  };

  const handleNext = () => {
    if (idx < questions.length - 1) {
      setIdx(i => i+1);
      setSelectedIds([]);
      setAnswered(false);
    } else {
      onDone({ correct: results.filter(r => r.correct).length, total: questions.length, results });
    }
  };

  const pct = Math.round((idx / questions.length) * 100);

  return (
    <>
    <div className="screen fade-in">
      <div style={{marginBottom:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <span style={{fontSize:12,color:'rgba(255,255,255,.5)'}}>Question {idx+1} / {questions.length}</span>
          {isRevision && <span style={{fontSize:11,color:'#ffb340',fontWeight:700}}>🔁 Révision</span>}
        </div>
        <div style={{height:4,background:'rgba(255,255,255,.12)',borderRadius:4,overflow:'hidden'}}>
          <div style={{width:`${pct}%`,height:'100%',background:'#7dd940',borderRadius:4,transition:'width .3s'}}/>
        </div>
      </div>
      {q.image_url && <div style={{marginBottom:14,borderRadius:12,overflow:'hidden'}}><ImageWithLightbox src={q.image_url} style={{width:'100%',display:'block',borderRadius:12}}/></div>}
      <div className="card" style={{marginBottom:multi?8:16,padding:'18px 18px'}}>
        <div style={{fontSize:16,fontWeight:700,color:'white',lineHeight:1.5}}>{q.question}</div>
      </div>
      {multi && (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:7,marginBottom:14,padding:'9px 12px',borderRadius:10,background:'rgba(255,179,64,.12)',border:'1px solid rgba(255,179,64,.3)',color:'#ffb340',fontSize:12.5,fontWeight:600,textAlign:'center'}}>
          <span style={{fontSize:14}}>🔢</span> Plusieurs réponses attendues — sélectionnez les {correctCount} bonnes réponses
        </div>
      )}
      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
        {choices.map(c => {
          const isSel = selectedIds.includes(c.id);
          let bg = 'rgba(255,255,255,.07)';
          let border = '1px solid rgba(255,255,255,.12)';
          let color = 'white';
          if (answered) {
            if (c.is_correct) { bg='rgba(125,217,64,.18)'; border='1.5px solid rgba(125,217,64,.5)'; color='#7dd940'; }
            else if (isSel) { bg='rgba(255,80,80,.15)'; border='1.5px solid rgba(255,80,80,.4)'; color='#ff6060'; }
          } else if (isSel) { bg='rgba(255,255,255,.14)'; border='1.5px solid rgba(255,255,255,.3)'; }
          const showCheck = isSel || (answered && c.is_correct);
          return (
            <button key={c.id} onClick={() => handleSelect(c)}
              style={{background:bg,border,borderRadius:12,padding:'14px 16px',textAlign:'left',cursor:answered?'default':'pointer',color,fontSize:14,fontWeight:500,transition:'all .2s',width:'100%',display:'flex',alignItems:'center',gap:11}}>
              <span style={{flexShrink:0,width:20,height:20,borderRadius:multi?6:'50%',border:`1.5px solid ${showCheck?'currentColor':'rgba(255,255,255,.28)'}`,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:12,lineHeight:1,color:'currentColor'}}>
                {showCheck ? '✓' : ''}
              </span>
              <span style={{flex:1}}>{c.text}</span>
            </button>
          );
        })}
      </div>
      {answered && (
        <div style={{textAlign:'center',padding:'10px 0',color:isCurrentCorrect ? '#7dd940':'#ff9060',fontWeight:700,fontSize:15,marginBottom:8}}>
          {isCurrentCorrect ? (multi ? '✓ Bonnes réponses !' : '✓ Bonne réponse !') : '✗ Mauvaise réponse'}
        </div>
      )}
    </div>
    {answered && (
      <StickyFooter>
        <button className="btn btn-yes" style={{width:'100%'}} onClick={handleNext}>
          {idx < questions.length-1 ? 'Question suivante →' : 'Voir mon score →'}
        </button>
      </StickyFooter>
    )}
    {!answered && multi && (
      <StickyFooter onBack={onBack}>
        <div style={{flex:1,textAlign:'center',padding:'11px 12px',borderRadius:10,background:'rgba(255,255,255,.05)',border:'1px dashed rgba(255,255,255,.18)',color:'rgba(255,255,255,.5)',fontWeight:600,fontSize:13,cursor:'not-allowed',userSelect:'none'}}>
          En attente d'un autre choix
          <span style={{display:'block',fontSize:11,color:'rgba(255,255,255,.35)',marginTop:2}}>{selectedIds.length} / {correctCount} sélectionné{selectedIds.length>1?'s':''}</span>
        </div>
      </StickyFooter>
    )}
    {!answered && !multi && <StickyFooter onBack={onBack}/>}
    </>
  );
}

// ─── ComprendreScoreScreen ────────────────────────────────────────────────────
function ComprendreScoreScreen({ user, subject, score, total, results, isRevision, revisionQuestions, allSubjects, onNext, onHome, onRetry }) {
  const correct = results.filter(r=>r.correct).length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  const mastered = pct >= 70;
  const failedIds = results.filter(r=>!r.correct).map(r=>r.questionId);

  useEffect(() => {
    // L'upsert supabase-js est paresseux : il faut l'attendre (await) pour que
    // la requête parte réellement. Sans await, la progression n'est jamais enregistrée.
    if (user && subject && !isRevision) {
      (async () => {
        const { error } = await sb.from('user_learn_progress').upsert({
          user_id: user.id, subject_id: subject.id,
          completed_at: mastered ? new Date().toISOString() : null,
          score: pct,
          failed_question_ids: failedIds,
        }, { onConflict: 'user_id,subject_id' });
        if (error) console.error('Erreur enregistrement progression quiz', error);
      })();
    }
    // Révision : on retire les questions désormais réussies de failed_question_ids,
    // par sujet. Une question encore ratée reste en révision. Sans ça, le bouton
    // « Révision disponible » resterait affiché à vie.
    if (user && isRevision && revisionQuestions?.length) {
      (async () => {
        const subjOf = {};
        const subjectsInRevision = new Set();
        revisionQuestions.forEach(q => { subjOf[q.id] = q._subjectId; subjectsInRevision.add(q._subjectId); });
        const stillFailed = {};
        subjectsInRevision.forEach(sid => { stillFailed[sid] = []; });
        results.forEach(r => {
          const sid = subjOf[r.questionId];
          if (sid != null && !r.correct) stillFailed[sid].push(r.questionId);
        });
        for (const sid of subjectsInRevision) {
          const { error } = await sb.from('user_learn_progress')
            .update({ failed_question_ids: stillFailed[sid] })
            .eq('user_id', user.id).eq('subject_id', sid);
          if (error) console.error('Erreur MAJ révision', error);
        }
      })();
    }
    if (mastered) {
      try { confetti({ particleCount: 120, spread: 70, origin: { y: .6 } }); } catch {}
    }
  }, []);

  return (
    <>
    <div className="screen fade-in">
      <div style={{textAlign:'center',padding:'30px 0 20px'}}>
        <div style={{fontSize:56,marginBottom:12}}>{mastered ? '🎉' : '💪'}</div>
        <div style={{fontSize:22,fontWeight:900,color:'white',marginBottom:6}}>{isRevision ? 'Révision terminée !' : 'Quiz terminé !'}</div>
        <div style={{fontSize:60,fontWeight:900,color:mastered?'#7dd940':'#ffb340',lineHeight:1}}>{pct}%</div>
        <div style={{fontSize:14,color:'rgba(255,255,255,.55)',marginTop:6}}>{correct} bonne{correct>1?'s':''} réponse{correct>1?'s':''} sur {total}</div>
      </div>
      {mastered ? (
        <div className="card" style={{textAlign:'center',padding:'14px 18px',border:'1.5px solid rgba(125,217,64,.3)',marginBottom:12}}>
          <div style={{color:'#7dd940',fontWeight:700,fontSize:15}}>✓ Sujet maîtrisé !</div>
          {failedIds.length > 0 && <div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginTop:4}}>Les {failedIds.length} question{failedIds.length>1?'s':''} ratée{failedIds.length>1?'s':''} seront proposées en révision lors de ta prochaine session.</div>}
        </div>
      ) : (

function AdminLearnQuestionEdit({ question, subjectId, onSave, onClose }) {
  const isNew = !question?.id;
  const [qText, setQText] = useState(question?.question||'');
  const [qImg, setQImg] = useState(question?.image_url||'');
  const [ordre, setOrdre] = useState(question?.ordre??0);
  const [choices, setChoices] = useState(question?.learn_choices?.slice().sort((a,b)=>a.ordre-b.ordre).map(c=>({...c}))||[{id:'tmp1',text:'',is_correct:false,ordre:0},{id:'tmp2',text:'',is_correct:false,ordre:1}]);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');
  const [uploadingImg, setUploadingImg] = useState(false);

  const uploadQImg = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    setUploadingImg(true);
    try { setQImg(await uploadLearnImage(file)); } catch(err) { setMsg('Erreur: '+err.message); }
    setUploadingImg(false);
  };

  const setChoice = (i, field, val) => setChoices(cs => cs.map((c,j) => j===i ? {...c,[field]:val} : c));
  const toggleCorrect = (i) => setChoices(cs => cs.map((c,j) => j===i ? {...c, is_correct: !c.is_correct} : c));
  const addChoice = () => setChoices(cs => [...cs, {id:'tmp'+Date.now(),text:'',is_correct:false,ordre:cs.length}]);
  const removeChoice = (i) => setChoices(cs => cs.filter((_,j)=>j!==i));

  const validate = () => {
    if (!qText.trim()) return 'La question est obligatoire.';
    if (choices.filter(c=>c.text.trim()).length < 2) return 'Au moins 2 choix de réponse.';
    if (!choices.some(c=>c.is_correct)) return 'Cochez au moins une bonne réponse.';
    return null;
  };

  const save = async () => {
    const err = validate(); if (err) { setMsg(err); return; }
    setSaving(true);
    let qId = question?.id;
    if (isNew) {
      const { data, error } = await sb.from('learn_questions').insert({ subject_id:subjectId, question:qText.trim(), image_url:qImg||null, ordre:parseInt(ordre)||0 }).select('id').single();
      if (error) { setMsg(error.message); setSaving(false); return; }
      qId = data.id;
    } else {
      await sb.from('learn_questions').update({ question:qText.trim(), image_url:qImg||null, ordre:parseInt(ordre)||0 }).eq('id',qId);
      await sb.from('learn_choices').delete().eq('question_id',qId);
    }
    const validChoices = choices.filter(c=>c.text.trim()).map((c,i)=>({ question_id:qId, text:c.text.trim(), is_correct:c.is_correct, ordre:i }));
    await sb.from('learn_choices').insert(validChoices);
    setSaving(false); onSave();
  };

  const del = async () => {
    if (!window.confirm('Supprimer cette question ?')) return;
    await sb.from('learn_questions').delete().eq('id',question.id);
    onSave();
  };

  return (
    <div style={{marginTop:16,background:'rgba(0,0,0,.3)',borderRadius:14,padding:'18px 16px',border:'1px solid rgba(255,255,255,.12)'}}>
      <div style={{fontWeight:700,color:'white',fontSize:14,marginBottom:12}}>{isNew?'Nouvelle question':'Modifier la question'}</div>
      <div className="inp-group"><label className="inp-label">Question *</label><textarea className="inp" rows={2} value={qText} onChange={e=>setQText(e.target.value)} style={{resize:'vertical'}}/></div>
      <div className="inp-group">
        <label className="inp-label">Image (optionnel)</label>
        {qImg && <img src={qImg} alt="" style={{width:'100%',maxHeight:100,objectFit:'cover',borderRadius:8,marginBottom:4}}/>}
        <input type="file" accept="image/*" onChange={uploadQImg} style={{fontSize:11,color:'rgba(255,255,255,.5)'}}/>
        {uploadingImg && <span style={{fontSize:11,color:'rgba(255,255,255,.4)'}}>Upload…</span>}
      </div>
      <div className="inp-group"><label className="inp-label">Ordre</label><input className="inp" type="number" value={ordre} onChange={e=>setOrdre(e.target.value)}/></div>
      <div style={{marginBottom:8,fontWeight:600,color:'rgba(255,255,255,.6)',fontSize:12,textTransform:'uppercase',letterSpacing:.5}}>Choix de réponses <span style={{color:'rgba(255,255,255,.3)',fontWeight:400}}>(cochez la ou les bonnes — plusieurs possibles)</span></div>
      {choices.map((c,i) => (
        <div key={c.id||i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
          <input type="checkbox" checked={c.is_correct} onChange={()=>toggleCorrect(i)} style={{accentColor:'#7dd940',flexShrink:0,width:16,height:16,cursor:'pointer'}}/>
          <input className="inp" value={c.text} onChange={e=>setChoice(i,'text',e.target.value)} placeholder={`Choix ${i+1}`} style={{flex:1,padding:'8px 12px',fontSize:13}}/>
          {choices.length > 2 && <button onClick={()=>removeChoice(i)} style={{background:'none',border:'none',color:'rgba(255,80,80,.6)',cursor:'pointer',fontSize:16,padding:'0 4px'}}>×</button>}
        </div>
      ))}
      {choices.length < 5 && <button onClick={addChoice} style={{background:'none',border:'1px dashed rgba(255,255,255,.2)',borderRadius:8,color:'rgba(255,255,255,.4)',fontSize:12,padding:'6px 12px',cursor:'pointer',width:'100%',marginBottom:8}}>+ Ajouter un choix</button>}
      {msg && <div style={{color: msg.startsWith('✓')?'#7dd940':'#ff6060',fontSize:12,marginBottom:8}}>{msg}</div>}
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-yes" style={{flex:1,fontSize:13}} onClick={save} disabled={saving}>{saving?'…':'Enregistrer'}</button>
        {!isNew && <button className="btn" style={{fontSize:13,color:'#ff6060',border:'1px solid rgba(255,96,96,.3)'}} onClick={del}>Supprimer</button>}
        <button className="btn" style={{fontSize:13}} onClick={onClose}>Annuler</button>
      </div>
    </div>
  );
}

function App() {
  const [state,       setState]      = useState(INIT);
  const [history,     setHistory]    = useState([]);
  const [user,        setUser]       = useState(null);
  const [profile,     setProfile]    = useState(null);
  const [authLoading, setAuthLoading]= useState(true);
  // showDemoPopup supprimé — plus de popup démo
  const [cartVersion, setCartVersion]= useState(0);
  const [feedbackSentiment, setFeedbackSentiment] = useState(null); // null | 'up' | 'down'
  const pendingProfileRef            = useRef(null);
  const justSignedUpRef              = useRef(false); // empêche la nav auto pendant l'écran de succès signup
  const updateCart = () => setCartVersion(v => v + 1);

  // Charge le profil, hydrate le site actif, et retourne l'écran cible
  const fetchProfile = useCallback(async (userId) => {
    const { data } = await sb.from('profiles')
      .select('prenom, nom, pseudo, adresse_ligne1, code_postal, ville, telephone, pdl, active_site_id, role')
      .eq('id', userId).single();
    if (data) {
      setProfile(data);
      if (data.active_site_id) {
        localStorage.setItem('starvolt_active_site_id', data.active_site_id);
      } else if (!localStorage.getItem('starvolt_active_site_id')) {
        const { data: sites } = await sb.from('sites').select('id').eq('user_id', userId).order('created_at').limit(1);
        const firstId = sites?.[0]?.id;
        if (firstId) {
          localStorage.setItem('starvolt_active_site_id', firstId);
          sb.from('profiles').update({ active_site_id: firstId }).eq('id', userId);
        }
      }
    }
    return 'HOME_CHOICE';
  }, []);

  // Vide le panier une seule fois par session navigateur (rechargement de page)
  useEffect(() => {
    if (!sessionStorage.getItem('starvolt_session_started')) {
      clearPanierLS();
      sessionStorage.setItem('starvolt_session_started', '1');
    }
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      if (initialHash.includes('type=recovery')) return;
      if (session?.user) {
        window.__trackUserId = session.user.id; // init tracker pour sessions persistées
        setUser(session.user);
        fetchProfile(session.user.id).then(screen => {
          setState(s => ({ ...s, screen }));
          setAuthLoading(false);
        });
      } else {
        setAuthLoading(false);
      }
    });

    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        setUser(session?.user || null);
        setState(s => ({ ...s, screen: 'RESET_PASSWORD' }));
        setHistory([]);
        setAuthLoading(false);
        return;
      }
      if (event === 'SIGNED_IN' && session?.user) {
        setUser(session.user);
        // Stocker l'uid pour le tracking (évite un appel réseau à chaque clic)
        window.__trackUserId = session.user.id;
        // Logger la connexion dans user_events (sauf en mode debug admin)
        if (!window.__impersonating) {
          sb.from('user_events').insert({ user_id: session.user.id, event_type: 'login', label: 'Connexion', screen: 'AUTH_LOGIN' })
            .then(({ error }) => { if (error) console.warn('[login track]', error.message); });
        }
        if (pendingProfileRef.current) {
          setProfile(pendingProfileRef.current);
          pendingProfileRef.current = null;
        }
        // Si on vient de créer un compte, ne pas naviguer : le composant signup
        // affiche l'écran de succès et appellera onSuccessDone pour naviguer.
        if (justSignedUpRef.current) return;
        fetchProfile(session.user.id).then(screen => {
          setState(s => ({ ...s, screen }));
          setHistory([]);
        });
      }
      if (event === 'SIGNED_OUT') {
        window.__trackUserId = null;
        setUser(null); setProfile(null);
        setHistory([]); setState(INIT);
        localStorage.removeItem('starvolt_active_site_id');
      }
    });

    return () => subscription.unsubscribe();
  }, [fetchProfile]);

  const goTo = useCallback((screen, updates = {}) => {
    setHistory(h => [...h, state]);
    setState(s => ({ ...s, screen, ...updates }));
    window.__setTrackScreen && window.__setTrackScreen(screen);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [state]);

  const goBack = useCallback(() => {
    if (!history.length) {
      if (user) setState(s => ({ ...s, screen: 'HOME_LOGGED_IN' }));
      return;
    }
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0,-1));
    setState(prev);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, [history, user]);

  const handleLogout = async () => { await sb.auth.signOut(); };

  // ─── Impersonation admin (mode debug) ───────────────
  const [imperso, setImperso] = useState(() => {
    try { const raw = localStorage.getItem('starvolt_imp'); if (raw) { window.__impersonating = true; return JSON.parse(raw); } } catch(_){}
    return null;
  });

  const startImpersonation = async (u) => {
    try {
      // 1) Mémoriser la session admin courante pour pouvoir y revenir
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { alert('Session admin introuvable.'); return; }
      const adminInfo = { access: session.access_token, refresh: session.refresh_token };
      // 2) Activer le flag AVANT le changement de session (coupe le tracking + le log de connexion)
      window.__impersonating = true;
      // 3) Demander une session pour l'utilisateur cible
      const { data, error } = await sb.functions.invoke('admin-impersonate', { body: { target_user_id: u.id } });
      if (error || !data?.access_token) {
        window.__impersonating = false;
        console.error('impersonate', error || data);
        alert("Impossible de se connecter en tant que cet utilisateur.");
        return;
      }
      const impInfo = { name: u.prenom || u.email, adminAccess: adminInfo.access, adminRefresh: adminInfo.refresh };
      localStorage.setItem('starvolt_imp', JSON.stringify(impInfo));
      setImperso(impInfo);
      // 4) Basculer sur la session de l'utilisateur cible → déclenche SIGNED_IN → navigation
      await sb.auth.setSession({ access_token: data.access_token, refresh_token: data.refresh_token });
    } catch (e) {
      window.__impersonating = false;
      console.error(e);
      alert("Erreur lors de l'impersonation.");
    }
  };

  const stopImpersonation = async () => {
    try {
      const raw = localStorage.getItem('starvolt_imp');
      const info = raw ? JSON.parse(raw) : imperso;
      localStorage.removeItem('starvolt_imp');
      setImperso(null);
      if (info?.adminAccess && info?.adminRefresh) {
        await sb.auth.setSession({ access_token: info.adminAccess, refresh_token: info.adminRefresh });
      } else {
        await sb.auth.signOut();
      }
    } catch (e) {
      console.error(e);
      await sb.auth.signOut();
    } finally {
      window.__impersonating = false;
    }
  };

  const isAdmin = ['admin','superadmin'].includes(profile?.role);
  const isSuperadmin = profile?.role === 'superadmin';

  const render = () => {
    if (authLoading) return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'60vh'}}>
        <div className="spinner"/>
      </div>
    );

    switch (state.screen) {

      case 'HOME_CHOICE':
        return <HomeChoiceScreen profile={profile} user={user} onComprendre={()=>goTo('COMPRENDRE_HOME')} onAction={()=>goTo('MA_CONSO')}/>;

      case 'COMPRENDRE_HOME':
        return <ComprendreHomeScreen user={user} onGroup={(g)=>goTo('COMPRENDRE_GROUP',{learnGroup:g})} onAction={()=>goTo('MA_CONSO')} onBack={()=>goTo('HOME_CHOICE')}/>;

      case 'COMPRENDRE_GROUP': {
        const g = state.learnGroup;
        if (g?.isRevision) {
          return <ComprendreGroupScreen user={user} group={g}
            onSubject={(s,grp)=>goTo('COMPRENDRE_SUBJECT',{learnSubject:s,learnGroup:grp})}
            onRevision={async (subjectIds)=>{
              const qAll = [];
              for (const sid of subjectIds) {
                const { data: prog } = await sb.from('user_learn_progress').select('failed_question_ids').eq('user_id',user.id).eq('subject_id',sid).single();
                const failedIds = prog?.failed_question_ids||[];
                if (failedIds.length) {
                  const { data: qs } = await sb.from('learn_questions').select('id,question,image_url,ordre,learn_choices(id,text,is_correct,ordre)').in('id',failedIds);
                  if (qs) qAll.push(...qs.map(q=>({...q,_subjectId:sid})));
                }
              }
              if (qAll.length) goTo('COMPRENDRE_QUIZ',{learnQuestions:qAll,learnSubject:null,isRevision:true});
            }}
            onAction={()=>goTo('MA_CONSO')} onBack={()=>goTo('COMPRENDRE_HOME')}/>;
        }
        return <ComprendreGroupScreen user={user} group={g}
          onSubject={(s)=>goTo('COMPRENDRE_SUBJECT',{learnSubject:s,learnGroup:g})}
          onRevision={()=>{}}
          onAction={()=>goTo('MA_CONSO')} onBack={()=>goTo('COMPRENDRE_HOME')}/>;
      }

      case 'COMPRENDRE_SUBJECT':
        return <ComprendreSubjectScreen subject={state.learnSubject}
          onQuiz={async ()=>{
            const { data: qs } = await sb.from('learn_questions').select('id,question,image_url,ordre,learn_choices(id,text,is_correct,ordre)').eq('subject_id',state.learnSubject.id).order('ordre');
            goTo('COMPRENDRE_QUIZ',{learnQuestions:qs||[],learnSubject:state.learnSubject,learnGroup:state.learnGroup,isRevision:false});
          }}
          onBack={goBack}/>;

      case 'COMPRENDRE_QUIZ':
        return <ComprendreQuizScreen user={user} questions={state.learnQuestions||[]} subject={state.learnSubject} isRevision={!!state.isRevision}
          onDone={(res)=>goTo('COMPRENDRE_SCORE',{learnSubject:state.learnSubject,learnGroup:state.learnGroup,quizResults:res,isRevision:!!state.isRevision})}
          onBack={goBack}/>;

      case 'COMPRENDRE_SCORE': {
        const { learnSubject, learnGroup, quizResults, isRevision } = state;
        return <ComprendreScoreScreen user={user} subject={learnSubject} results={quizResults?.results||[]} total={quizResults?.total||0} isRevision={!!isRevision} revisionQuestions={state.learnQuestions}
          onRetry={async ()=>{
            const { data: qs } = await sb.from('learn_questions').select('id,question,image_url,ordre,learn_choices(id,text,is_correct,ordre)').eq('subject_id',learnSubject.id).order('ordre');
            goTo('COMPRENDRE_QUIZ',{learnQuestions:qs||[],learnSubject,learnGroup,isRevision:false});
          }}
          onNext={async ()=>{
            if (!learnGroup?.id) { goTo('COMPRENDRE_HOME'); return; }
            const { data: subs } = await sb.from('learn_subjects').select('id,title,content,image_url,video_url,ordre').eq('group_id',learnGroup.id).order('ordre');
            const idx = (subs||[]).findIndex(s=>s.id===learnSubject?.id);
            const next = subs?.[idx+1];
            if (next) goTo('COMPRENDRE_SUBJECT',{learnSubject:next,learnGroup});
            else goTo('COMPRENDRE_GROUP',{learnGroup});
          }}
          onHome={()=>goTo('COMPRENDRE_HOME')}/>;
      }

      case 'HOME_LOGGED_IN':
        return <HomeLoggedInScreen profile={profile}/>;

      case 'PROFILE':
        return <ProfileScreen
          user={user}
          profile={profile}
          onSave={(updated) => { setProfile(p => ({...p, ...updated})); goTo('MA_CONSO'); }}
          onCancel={() => goTo('MA_CONSO')}
          onLogout={handleLogout}
          onDeleted={() => { setUser(null); setProfile(null); setState(INIT); setHistory([]); }}/>;

      case 'ADMIN':
        return <AdminScreen
          onTariffs={()=>goTo('ADMIN_TARIFFS')}
          onSpot={()=>goTo('SPOT_PRICES')}
          onUsers={()=>goTo('ADMIN_USERS')}
          onSites={()=>goTo('ADMIN_SITES')}
          onAcc={()=>goTo('ADMIN_ACC')}
          onProduction={()=>goTo('ADMIN_PRODUCTION')}
          onGlobalVars={()=>goTo('ADMIN_GLOBAL_VARS')}
          onPrix={()=>goTo('ADMIN_PRIX_MATERIAUX')}
          onOffres={()=>goTo('ADMIN_OFFRES')}
          onLearn={()=>goTo('ADMIN_LEARN')}
          onFeedback={()=>goTo('ADMIN_FEEDBACK')}
          onProofread={()=>goTo('ADMIN_PROOFREAD')}
          onAICosts={()=>goTo('ADMIN_AI_COSTS')}
          onAIPrompts={()=>goTo('ADMIN_AI_PROMPTS')}
          onViewLogs={(u)=>goTo('ADMIN_USER_LOGS', { logUser: u })}
          onImpersonate={startImpersonation}
          onBack={goBack}/>;

      case 'ADMIN_FEEDBACK':
        return <AdminFeedbackScreen onBack={goBack}/>;

      case 'ADMIN_PROOFREAD':
        return <AdminProofreadScreen onBack={goBack}/>;

      case 'ADMIN_AI_COSTS':
        return <AdminAICostsScreen onBack={goBack}/>;

      case 'ADMIN_AI_PROMPTS':
        return <AdminAIPromptsScreen onBack={goBack}/>;

      case 'ADMIN_LEARN':
        return <AdminLearnScreen
          onGroup={(g)=>goTo('ADMIN_LEARN_GROUP',{editLearnGroup:g})}
          onNew={()=>goTo('ADMIN_LEARN_GROUP',{editLearnGroup:null})}
          onBack={goBack}/>;

      case 'ADMIN_LEARN_GROUP':
        return <AdminLearnGroupEditScreen
          group={state.editLearnGroup}
          onSubject={(s,gid)=>goTo('ADMIN_LEARN_SUBJECT',{editLearnSubject:s,learnGroupId:gid})}
          onSave={()=>goTo('ADMIN_LEARN')}
          onBack={goBack}/>;

      case 'ADMIN_LEARN_SUBJECT':
        return <AdminLearnSubjectEditScreen
          subjectId={state.editLearnSubject?.id||null}
          groupId={state.learnGroupId}
          onSave={()=>goBack()}
          onBack={goBack}/>;

      case 'ADMIN_OFFRES':
        return <AdminOffresScreen
          onEdit={(o)=>goTo('ADMIN_OFFRE_EDIT', {editOffre: o})}
          onNew={()=>goTo('ADMIN_OFFRE_EDIT', {editOffre: null})}
          onFiltres={()=>goTo('ADMIN_FILTRES')}
          onBack={goBack}/>;

      case 'ADMIN_FILTRES':
        return <AdminFiltresScreen onBack={goBack}/>;

      case 'ADMIN_OFFRE_EDIT':
        return <AdminOffreEditScreen
          offre={state.editOffre}
          onSave={()=>goTo('ADMIN_OFFRES')}
          onDelete={()=>goTo('ADMIN_OFFRES')}
          onBack={goBack}/>;

      case 'ADMIN_PRIX_MATERIAUX':
        return <AdminPrixMateriauxScreen onBack={goBack}/>;

      case 'ADMIN_GLOBAL_VARS':
        return <GlobalVarsScreen onBack={goBack}/>;

      case 'ADMIN_PRODUCTION':
        return <AdminProductionScreen onBack={goBack}/>;

      case 'SPOT_PRICES':
        return <SpotPricesScreen onBack={goBack}/>;

      case 'ADMIN_TARIFFS':
        return <AdminTariffsScreen
          onEdit={(t)=>goTo('ADMIN_TARIFF_EDIT', {editTariff: t})}
          onNew={()=>goTo('ADMIN_TARIFF_EDIT', {editTariff: null})}
          onBack={goBack}/>;

      case 'ADMIN_TARIFF_EDIT':
        return <AdminTariffEditScreen
          tariff={state.editTariff}
          onSave={()=>goTo('ADMIN_TARIFFS')}
          onDelete={()=>goTo('ADMIN_TARIFFS')}
          onBack={goBack}/>;

      case 'ADMIN_USERS':
        return <AdminUsersScreen onBack={goBack} isSuperadmin={isSuperadmin} onViewLogs={(u) => goTo('ADMIN_USER_LOGS', { logUser: u })}/>;
      case 'ADMIN_SITES':
        return <AdminSitesScreen onBack={goBack} onEdit={(s)=>goTo('ADMIN_SITE_EDIT', { editSite: s })}/>;
      case 'ADMIN_SITE_EDIT':
        return <AdminSiteEditScreen site={state.editSite} onSave={()=>goTo('ADMIN_SITES')} onBack={goBack}/>;
      case 'ADMIN_USER_LOGS':
        return <AdminUserLogsScreen userId={state.logUser?.id} userName={`${state.logUser?.prenom||''} ${state.logUser?.nom||''}`.trim() || state.logUser?.email} onBack={goBack}/>;

      case 'ADMIN_ACC':
        return <AdminAccScreen
          onEdit={(s)=>goTo('ADMIN_ACC_EDIT',{editAccSite:s})}
          onNew={()=>goTo('ADMIN_ACC_EDIT',{editAccSite:null})}
          onBack={goBack}/>;

      case 'ADMIN_ACC_EDIT':
        return <AdminAccEditScreen
          site={state.editAccSite}
          onSave={()=>goTo('ADMIN_ACC')}
          onDelete={()=>goTo('ADMIN_ACC')}
          onBack={goBack}/>;

      case 'MA_CONSO':
        return <MonSiteScreen user={user} userProfile={profile} onBack={goBack} onSimulations={()=>goTo('SIMULATIONS')} onComprendre={()=>goTo('COMPRENDRE_HOME')} onOnboardingQuestions={(sid)=>goTo('ONBOARDING_QUESTIONS',{onbSiteId:sid})} cartVersion={cartVersion}/>;
      case 'ONBOARDING_QUESTIONS':
        return <OnboardingTypeform siteId={state.onbSiteId} onDone={()=>goTo('COMPRENDRE_HOME')}/>;

      case 'SIMULATIONS': {
        const base = { name: profile?.prenom||'', address:'Zone ACC', initialBill:2000, bill:2000, bravoItems:[], investment:0, eligible:true };
        return <SimulationsScreen
          user={user}
          userProfile={profile}
          onACC={()=>goTo('ACC_MAP')}
          onBox={()=>goTo('BOX_SIM')}
          onSolar={()=>goTo('SOLAR_SIM')}
          onOptimisation={()=>goTo('OPTIMISATION')}
          onDiyBox={()=>goTo('DIY_BOX_SIM')}
          onBack={goBack}
          onMonSite={()=>goTo('MA_CONSO')}
          onComprendre={()=>goTo('COMPRENDRE_HOME')}/>;
      }

      case 'PANIER':
        return <PanierScreen user={user} onBack={()=>goTo('SIMULATIONS')} onGoTo={goTo} onMonSite={()=>goTo('MA_CONSO')}/>;

      case 'BOX_SIM':
        return <BoxSimScreen user={user} userProfile={profile} onBack={goBack} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')} onCartUpdate={updateCart}/>;

      case 'DIY_BOX_SIM':
        return <InstallSoiMemeScreen user={user} userProfile={profile} onBack={goBack} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')} onCartUpdate={updateCart}/>;

      case 'SOLAR_SIM':
        return <SolarSimScreen user={user} userProfile={profile} onBack={goBack} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')} onCartUpdate={updateCart}/>;

      case 'OPTIMISATION':
        return <OptimisationScreen user={user} userProfile={profile} onBack={goBack} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')} onCartUpdate={updateCart}/>;

      case 'ACC_MAP':
        return <AccMapScreen user={user} userProfile={profile} onBack={goBack}
          onJoin={(data) => { localStorage.setItem('starvolt_acc_chosen','true'); if(data.accPriceKwh) localStorage.setItem('starvolt_acc_price_ht',String(data.accPriceKwh)); updateCart(); goTo('ACC_RESULT', { ...data, accAction:'join' }); }}
          onCreate={(data) => { localStorage.setItem('starvolt_acc_chosen','true'); updateCart(); goTo('ACC_RESULT', { ...data, accAction:'create' }); }}
          onPanier={()=>goTo('PANIER')}/>;

      case 'ACC_RESULT':
        return <AccResultScreen state={state} onBack={()=>goTo('SIMULATIONS')} onPanier={()=>goTo('PANIER')} onMonSite={()=>goTo('MA_CONSO')}/>;

      case 'AUTH_SIGNUP':
        return <AuthSignupScreen
          onGoToLogin={()=>goTo('AUTH_LOGIN')}
          onSignedUp={(p)=>{ justSignedUpRef.current = true; pendingProfileRef.current = {...p, pseudo:null, adresse_ligne1:null, code_postal:null, ville:null, telephone:null}; }}
          onSuccessDone={(userId, forceScreen)=>{ justSignedUpRef.current = false; fetchProfile(userId).then(screen=>{ setState(s=>({...s,screen: forceScreen||screen})); setHistory([]); }); }}/>;

      case 'AUTH_LOGIN':
        return <AuthLoginScreen onGoToSignup={()=>goTo('AUTH_SIGNUP')}/>;

      case 'RESET_PASSWORD':
        return <ResetPasswordScreen onDone={()=>{ fetchProfile(user?.id); setState(s=>({...s,screen:'HOME_LOGGED_IN'})); setHistory([]); }}/>;

      case 'WELCOME':
        return <WelcomeScreen
          onCreateAccount={()=>goTo('AUTH_SIGNUP')}
          onLogin={()=>goTo('AUTH_LOGIN')}/>;

      case 'ADDRESS': {
        const accSaving = Math.round(state.initialBill * 0.15);
        if (!state.eligible) {
          return <NoACCScreen state={state} onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
        }
        return <EligibleScreen state={state} saving={accSaving}
          onYes={()=>goTo('BRAVO_1',{ bill:state.bill-accSaving, bravoItems:[...state.bravoItems,`Tarif ACC : −${accSaving.toLocaleString('fr-FR')} €/an`] })}
          onNo={()=>goTo('NO_ACC')}
          onBack={goBack}/>;
      }

      case 'NO_ACC':
        return <NoACCScreen state={state} onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;

      case 'BRAVO_1': {
        const accSaving = Math.round(state.initialBill * 0.15);
        return <BravoScreen state={state} stepNumber={1} saving={accSaving} label="Grâce au tarif ACC"
          onContinue={()=>goTo('COMWATT')} onBack={goBack}/>;
      }

      case 'COMWATT': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <ComwattScreen state={state} saving={cwSaving}
          onYes={()=>goTo('BRAVO_2',{ bill:state.bill-cwSaving, bravoItems:[...state.bravoItems,`Box Comwatt : −${cwSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+600 })}
          onNo={()=>goTo('SOLAR')}
          onBack={goBack}/>;
      }

      case 'BRAVO_2': {
        const cwSaving = Math.round(state.initialBill * 0.10);
        return <BravoScreen state={state} stepNumber={2} saving={cwSaving} label="Grâce à la box Comwatt"
          onContinue={()=>goTo('SOLAR')} onBack={goBack}/>;
      }

      case 'SOLAR': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <SolarScreen state={state} saving={solSaving}
          onYes={()=>goTo('BRAVO_3',{ bill:state.bill-solSaving, bravoItems:[...state.bravoItems,`Solaire + batterie : −${solSaving.toLocaleString('fr-FR')} €/an`], investment:state.investment+10000 })}
          onNo={()=>goTo('FINAL')}
          onBack={goBack}/>;
      }

      case 'BRAVO_3': {
        const solSaving = Math.round(state.initialBill * 0.45);
        return <BravoScreen state={state} stepNumber={3} saving={solSaving} label="Grâce aux panneaux solaires"
          onContinue={()=>goTo('FINAL')} onBack={goBack}/>;
      }

      case 'FINAL':
        return <FinalScreen state={state} onRestart={()=>{ setHistory([]); setState(INIT); }}/>;

      default: return null;
    }
  };

  const isAuthScreen = ['AUTH_SIGNUP','AUTH_LOGIN'].includes(state.screen);
  const isHome = false; // page d'accueil connecté supprimée
  const chipLabel = profile ? (profile.pseudo || profile.prenom || '') : state.name;
  const avatarName = profile ? `${profile.prenom || ''} ${profile.nom || ''}`.trim() : state.name;
  const showNameChip = profile ? true : state.screen !== 'WELCOME';
  const cartCount = user ? [
    localStorage.getItem('starvolt_optimisation_chosen'),
    localStorage.getItem('starvolt_acc_chosen') === 'true' ? 'true' : null,
    localStorage.getItem('starvolt_box_chosen'),
    localStorage.getItem('starvolt_solar_chosen'),
  ].filter(Boolean).length : 0;

  return (
    <div className="app">
      {imperso && (
        <div style={{
          position:'sticky', top:0, zIndex:9999,
          background:'linear-gradient(90deg,#b8412e,#d4632e)', color:'#fff',
          display:'flex', alignItems:'center', justifyContent:'center', gap:12,
          padding:'8px 14px', fontSize:13, fontWeight:700, flexWrap:'wrap',
          boxShadow:'0 2px 8px rgba(0,0,0,.3)'
        }}>
          <span style={{display:'flex', alignItems:'center', gap:7}}>
            <span style={{fontSize:15}}>👁</span>
            Mode debug — connecté en tant que <strong>{imperso.name}</strong>
          </span>
          <button onClick={stopImpersonation} style={{
            background:'rgba(255,255,255,.95)', color:'#b8412e', border:'none',
            borderRadius:8, padding:'5px 12px', fontWeight:800, fontSize:12.5,
            cursor:'pointer', fontFamily:'inherit'
          }}>
            ← Revenir à mon compte admin
          </button>
        </div>
      )}
      <TopBar
        name={chipLabel}
        avatarName={avatarName}
        showName={!isAuthScreen && showNameChip}
        logoOnly={isAuthScreen}
        onLogoClick={() => user ? goTo('HOME_CHOICE') : goTo('WELCOME')}
        onProfileClick={user ? () => goTo('PROFILE') : null}
        isAdmin={isAdmin}
        onAdmin={()=>goTo('ADMIN')}
        onPanier={user && state.screen !== 'PANIER' ? ()=>goTo('PANIER') : null}
        cartCount={cartCount}
        onFeedback={user && !isAuthScreen ? (s)=>setFeedbackSentiment(s) : null}
      />
      {feedbackSentiment && (
        <FeedbackModal sentiment={feedbackSentiment} user={user} screen={state.screen} onClose={()=>setFeedbackSentiment(null)}/>
      )}
      {user && !isAuthScreen && <ApproxConsoBanner screen={state.screen} userId={user.id}/>}
      <div className="chevrons-deco" aria-hidden="true">
        {['»','»','»','»'].map((c,i)=><span key={i}>{c}</span>)}
      </div>
      {render()}
      {/* DemoSitesPopup supprimé */}
      {isHome && (
        <StickyFooter row>
          <button className="btn-home" onClick={()=>goTo('MA_CONSO')}>
            <span>Mon site</span>
            <span className="btn-home-sub">conso · production · box</span>
          </button>
          <button className="btn-home primary" onClick={()=>goTo('SIMULATIONS')}>
            <span>Simulations</span>
            <span className="btn-home-sub">d'économie</span>
          </button>
        </StickyFooter>
      )}
      {user && !isAuthScreen && state.screen!=='WELCOME' && state.screen!=='RESET_PASSWORD' && <InstallBanner/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
