                        {[['particulier','👤 Particulier'],['entreprise','🏢 Entreprise']].map(([val,lbl])=>{
                          const active=(site.account_type||'particulier')===val;
                          return (
                            <button key={val} type="button" onClick={()=>updateSite({account_type:val})}
                              style={{flex:1,padding:'8px 6px',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s',
                                border:`1.5px solid ${active?'#f7c948':'rgba(255,255,255,.18)'}`,
                                background:active?'rgba(247,201,72,.14)':'transparent',
                                color:active?'#f7c948':'rgba(255,255,255,.6)'}}>{lbl}</button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Raison sociale — entreprise uniquement. Sert de nom de recherche ENEDIS. */}
                    {(site.account_type==='entreprise')&&(
                      <div style={{marginTop:6}}>
                        <label style={{fontSize:10,color:'rgba(255,255,255,.35)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>RAISON SOCIALE (nom recherché chez ENEDIS)</label>
                        <TxtInput value={site.raison_sociale||''} placeholder="Boulangerie Dupont SARL" onSave={v=>updateSite({raison_sociale:v.trim()||null})}/>
                      </div>
                    )}

                    <div style={{marginTop:6}}>
                      <label style={{fontSize:10,color:'rgba(255,255,255,.35)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>{site.account_type==='entreprise'?'TITULAIRE DU CONTRAT (personne)':'TITULAIRE DU CONTRAT ENEDIS'}</label>
                      <div style={{display:'flex',gap:6}}>
                        <TxtInput value={site.titulaire_prenom||''} placeholder="Prénom" onSave={v=>updateSite({titulaire_prenom:v.trim()||null})} style={{flex:1}}/>
                        <TxtInput value={site.titulaire_nom||''} placeholder="Nom" onSave={v=>updateSite({titulaire_nom:v.trim()||null})} style={{flex:1}}/>
                      </div>
                    </div>
                    <div style={{marginTop:6}}>
                      <label style={{fontSize:10,color:'rgba(255,255,255,.35)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>ADRESSE DU COMPTEUR (doit correspondre à ENEDIS)</label>
                      <div style={{display:'flex',flexDirection:'column',gap:5}}>
                        <TxtInput value={site.adresse_ligne1||''} placeholder="Rue et numéro" onSave={v=>updateSite({adresse_ligne1:v})}/>
                        <div style={{display:'flex',gap:6}}>
                          <TxtInput value={site.code_postal||''} placeholder="Code postal" onSave={v=>updateSite({code_postal:v})} style={{flex:'0 0 105px'}}/>
                          <TxtInput value={site.ville||''} placeholder="Ville" onSave={v=>updateSite({ville:v})} style={{flex:1}}/>
                        </div>
                      </div>
                    </div>

                    {/* Signataire du consentement — entreprise uniquement (gérant / représentant légal). */}
                    {(site.account_type==='entreprise')&&(
                      <div style={{marginTop:6}}>
                        <label style={{fontSize:10,color:'rgba(255,255,255,.35)',fontWeight:700,letterSpacing:'.5px',display:'block',marginBottom:4}}>SIGNATAIRE DU CONSENTEMENT (gérant)</label>
                        <div style={{display:'flex',gap:6,marginBottom:5}}>
                          <TxtInput value={site.signer_prenom||''} placeholder="Prénom" onSave={v=>updateSite({signer_prenom:v.trim()||null})} style={{flex:1}}/>
                          <TxtInput value={site.signer_nom||''} placeholder="Nom" onSave={v=>updateSite({signer_nom:v.trim()||null})} style={{flex:1}}/>
                        </div>
                        <TxtInput value={site.signer_email||''} placeholder="email@entreprise.fr" onSave={v=>updateSite({signer_email:v.trim()||null})}/>
                      </div>
                    )}
                    {/* Bouton : visible seulement au départ et sur erreur (pour réessayer).
                        Masqué dès que le processus est lancé, le consentement signé,
                        OU que le site dispose déjà de la totalité des données heure par heure. */}
                    {((!linkyStatus&&!siteHasFullHourly)||linkyStatus==='error')&&(
                      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginTop:8}}>
                        <button
                          onClick={()=>handleLinkyImport(site)}
                          style={{
                            background: linkyStatus==='error'?'rgba(255,50,50,.25)':'rgba(247,201,72,.15)',
                            border: `1px solid ${linkyStatus==='error'?'#ff6b6b':'rgba(247,201,72,.5)'}`,
                            borderRadius:8, color: linkyStatus==='error'?'#ff9090':'#f7c948',
                            fontSize:12, fontWeight:700, padding:'8px 12px', cursor:'pointer', whiteSpace:'nowrap',
                          }}
                        >
                          {linkyStatus==='error'?'⚠️ Réessayer':'⚡ Récupérer depuis Linky'}
                        </button>
                      </div>
                    )}

                    {/* Bouton de mise à jour : visible quand le site possède déjà des données ENEDIS
                        et qu'aucune demande n'est en cours. Permet de relancer une collecte
                        (nouvelle version d'API) ; les nouvelles données n'écrasent les anciennes
                        que si elles sont de meilleure qualité (côté Edge Function). */}
                    {(siteHasFullHourly||site.conso_source)&&(!linkyStatus||linkyStatus==='done')&&(
                      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginTop:8}}>
                        <button
                          onClick={()=>handleLinkyImport(site)}
                          style={{
                            background:'rgba(125,217,64,.12)',
                            border:'1px solid rgba(125,217,64,.4)',
                            borderRadius:8, color:'#7dd940',
                            fontSize:12, fontWeight:700, padding:'8px 12px', cursor:'pointer', whiteSpace:'nowrap',
                          }}
                        >
                          🔄 Mettre à jour les données ENEDIS
                        </button>
                        <span style={{fontSize:10,color:'rgba(255,255,255,.4)',lineHeight:1.4}}>
                          Relance une collecte ENEDIS. Les nouvelles données ne remplacent les actuelles que si elles sont plus complètes.
                        </span>
                      </div>
                    )}

                    {/* Suivi par étapes du processus ENEDIS */}
                    <LinkyProgress status={effectiveLinkyStatus} errorStep={linkyErrorStep} consoSource={site.conso_source}/>

                    {/* Étape 2 en cours : lien de consentement (disparaît dès le consentement signé).
                        Gardé par linkyLive : si le consentement est déjà donné, le poll renvoie
                        'ordering' et ce bloc ne s'affiche jamais. */}
                    {linkyLive&&linkyStatus==='pending'&&linkyUserUrl&&(()=>{
                      const isEnt = site.account_type==='entreprise';
                      const signerLbl = isEnt
                        ? [site.signer_prenom,site.signer_nom].filter(Boolean).join(' ').trim()
                        : [site.titulaire_prenom,site.titulaire_nom].filter(Boolean).join(' ').trim();
                      return (
                      <div style={{marginTop:10,background:'rgba(247,201,72,.1)',border:'1px solid rgba(247,201,72,.3)',borderRadius:8,padding:'10px 12px'}}>
                        <div style={{color:'#f7c948',fontWeight:700,fontSize:12,marginBottom:6}}>
                          ⚡ {isEnt?'Le gérant signataire doit valider le consentement':'Le propriétaire du compteur doit signer le consentement'}
                        </div>
                        <div style={{color:'rgba(255,255,255,.7)',fontSize:11,marginBottom:8,lineHeight:1.5}}>
                          {isEnt
                            ? <>Aucun email n'est envoyé automatiquement. <strong style={{color:'#fff'}}>Transmettez le lien ci-dessous{signerLbl?<> à {signerLbl}</>:" au gérant"}{site.signer_email?<> ({site.signer_email})</>:null}</strong> : c'est lui qui doit l'ouvrir et signer pour autoriser l'accès aux données ENEDIS. Cette page se met à jour automatiquement une fois le consentement validé.</>
                            : <>Ouvrez le lien ci-dessous (ou transmettez-le au titulaire du contrat) pour autoriser Starvolt à accéder aux données ENEDIS. Cette page se mettra à jour automatiquement une fois le consentement validé.</>}
                        </div>
                        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                          <button type="button" onClick={()=>setConsentModal('iframe')}
                            style={{background:'#f7c948',color:'#061e2a',fontWeight:800,fontSize:12,borderRadius:7,padding:'8px 14px',border:'none',cursor:'pointer'}}>
                            Signer le consentement ENEDIS →
                          </button>
                          <button type="button"
                            onClick={()=>{ navigator.clipboard?.writeText(linkyUserUrl).then(()=>{setLinkCopied(true);setTimeout(()=>setLinkCopied(false),2000);}).catch(()=>{}); }}
                            style={{background:'transparent',border:'1px solid rgba(247,201,72,.5)',borderRadius:7,color:'#f7c948',fontSize:12,fontWeight:700,padding:'8px 12px',cursor:'pointer',whiteSpace:'nowrap'}}>
                            {linkCopied?'✓ Lien copié':'📋 Copier le lien'}
                          </button>
                        </div>
                      </div>
                      );
                    })()}
                    {linkyStatus==='pending'&&!linkyUserUrl&&(
                      <div style={{marginTop:8,color:'rgba(255,255,255,.5)',fontSize:11}}>Préparation du lien de consentement…</div>
                    )}

                    {/* Étape 4 terminée : courbe de charge indisponible → repli journalier */}
                    {linkyStatus==='done'&&site.conso_source==='daily'&&(
                      <div style={{marginTop:10,padding:'8px 10px',background:'rgba(220,38,38,.15)',border:'1px solid rgba(248,113,113,.5)',borderRadius:8,color:'#ffb4b4',fontSize:11,lineHeight:1.5}}>
                        ⚠️ <strong style={{color:'#fff'}}>Courbe de charge indisponible chez ENEDIS</strong> pour ce compteur. Seules les <strong>consommations journalières</strong> ont pu être récupérées : les calculs seront <strong>approximatifs</strong> (pas de détail heure par heure). Réessayez l'import dans quelques jours, une fois la courbe de charge activée par ENEDIS.
                      </div>
                    )}

                    {/* Erreur : explication claire selon l'étape concernée */}
                    {linkyStatus==='error'&&(
                      <div style={{marginTop:10,padding:'10px 12px',background:'rgba(255,50,50,.12)',border:'1px solid rgba(255,107,107,.45)',borderRadius:8}}>
                        <div style={{color:'#ff9090',fontWeight:700,fontSize:12,marginBottom:4}}>
                          {linkyErrorStep===0?'⚠️ Compteur introuvable':linkyErrorStep===1?'⚠️ Consentement non validé':linkyErrorStep===2?'⚠️ Données indisponibles chez ENEDIS':'⚠️ Une erreur est survenue'}
                        </div>
                        <div style={{color:'rgba(255,255,255,.72)',fontSize:11,lineHeight:1.5}}>
                          {linkyErrorStep===0?"Vérifiez le nom et prénom du titulaire ainsi que le PDL (14 chiffres) ou l'adresse exacte enregistrée chez ENEDIS, puis réessayez.":
                           linkyErrorStep===1?"Le propriétaire du compteur n'a pas (encore) validé le consentement, ou le lien a expiré. Relancez l'import pour générer un nouveau lien de consentement.":
                           linkyErrorStep===2?"ENEDIS n'a pas de courbe de charge enregistrée pour ce compteur, ou le quota de demandes du jour est atteint. Réessayez dans quelques jours, une fois la mesure activée par ENEDIS.":
                           "Une erreur inattendue s'est produite. Réessayez dans quelques instants."}
                        </div>
                        {linkyError&&<div style={{color:'rgba(255,255,255,.45)',fontSize:10,marginTop:6,whiteSpace:'pre-wrap'}}>{linkyError}</div>}
                      </div>
                    )}
                  </div>
                  {/* Heatmap */}
                  {site.conso_profil?.length===8784&&(
                    <div>
                      <div style={{fontWeight:700,fontSize:10,color:'rgba(255,255,255,.4)',marginBottom:4,letterSpacing:'.4px'}}>HEATMAP · 0–23h × JOURS</div>
                      <ConsoHeatmapCanvas profile={site.conso_profil} months={heatmapExpanded?undefined:[1,2,3]}/>
                      <button onClick={()=>setHeatmapExpanded(v=>!v)} style={{background:'none',border:'none',cursor:'pointer',color:'rgba(255,255,255,.4)',fontSize:10,padding:'4px 0 0',display:'flex',alignItems:'center',gap:3}}>
                        {heatmapExpanded?'▲ Replier':'▼ Année entière'}
                      </button>
                    </div>
                  )}
                </div>
              </div>}
            </div>

            {/* ── Tuile Ma production, mon stockage et ma box ── */}
            {/* Masquée tant que le panier est vide */}
            {(!!localStorage.getItem('starvolt_box_chosen')||!!localStorage.getItem('starvolt_solar_chosen')||!!localStorage.getItem('starvolt_optimisation_chosen')||localStorage.getItem('starvolt_acc_chosen')==='true'||!!localStorage.getItem('starvolt_diy_box_chosen'))&&<div className="card" style={{padding:0,marginBottom:8,overflow:'hidden'}}>
              <div
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px 8px',borderBottom: prodOpen ? '1px solid rgba(255,255,255,.07)' : 'none',cursor:'pointer',userSelect:'none'}}
                onClick={()=>setProdOpen(v=>!v)}
              >
                <div style={{fontWeight:800,fontSize:13,color:'white',display:'flex',alignItems:'center',gap:6}}>☀️ Ma production, mon stockage et ma box</div>
                <span style={{color:'rgba(255,255,255,.4)',fontSize:16,lineHeight:1,transition:'transform .2s',transform:prodOpen?'rotate(0deg)':'rotate(-90deg)',display:'inline-block'}}>▾</span>
              </div>
              {prodOpen && <div style={{padding:'10px 14px 12px',display:'flex',flexDirection:'column',gap:8}}>
                {(()=>{
                  const T={background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:10,padding:isMobile?'6px 10px':'12px',display:'flex',flexDirection:'column',gap:isMobile?3:6,flex:'1 1 130px'};
                  const LBL={fontSize:13,color:'rgba(255,255,255,.65)',fontWeight:700,letterSpacing:'.3px'};
                  let pts=null,autoconso=0,achat=0,injection=0,prod=0,conso=0,tauxAC=0,tauxAP=0,unit='kWh',scale=1,period='Année',fmt=v=>v.toFixed(0)+' kWh';
                  if(balance){
                    if(chartLevel==='month') pts=balance.monthly;
                    else if(chartLevel==='day') pts=balance.hourly.filter(p=>p&&p.m===chartMonth);
                    else pts=balance.hourly.filter(p=>p&&p.m===chartMonth&&p.d===chartDay);
                    autoconso=pts.reduce((s,m)=>s+m.on_site,0);
                    achat=pts.reduce((s,m)=>s+m.grid_buy,0);
                    injection=pts.reduce((s,m)=>s+m.injection,0);
                    prod=autoconso+injection; conso=autoconso+achat;
                    tauxAC=prod>0?Math.round(autoconso/prod*100):0;
                    tauxAP=conso>0?Math.round(autoconso/conso*100):0;
                    unit=(autoconso+achat)>=100?'MWh':'kWh'; scale=unit==='MWh'?0.001:1;
                    period=chartLevel==='hour'?`${chartDay}/${chartMonth}`:chartLevel==='day'?`Mois ${chartMonth}`:'Année';
                    fmt=v=>(v*scale).toFixed(unit==='MWh'?1:0)+' '+unit;
                  }
                  // Impact — moteur partagé (identique à la table Avant/Après et au Panier)
                  const _impT=deriveSiteImpact({balance,site,prodProfil:prodProfilData,tariffs,spotMap,globalVars,batKwh,thermKwh});
                  const _boxLS=localStorage.getItem('starvolt_box_chosen');
                  // hasBox : box choisie seule OU incluse dans solar_box (DIY exclu — son investissement est géré séparément)
                  const hasBox=(_boxLS&&_boxLS!=='diy')||localStorage.getItem('starvolt_solar_chosen')==='solar_box';
                  const hasAcc=localStorage.getItem('starvolt_acc_chosen')==='true';
                  const flexRevenue=_impT.flexRev;
                  const accSavings=_impT.accRev;
                  // Économie énergie = bilan stockage/combiné ; fallback bilan PV pur (tarif non dynamique, pas de stockage)
                  let baisseFacture=_impT.energySaving;
                  if(!_impT.hasBalance&&balance&&site?.conso_profil&&site.conso_annuelle_kwh>0){
                    const annInj=balance.monthly.reduce((s,m)=>s+m.injection,0);
                    const annGrid=balance.monthly.reduce((s,m)=>s+m.grid_buy,0);
                    const curT=tariffs.find(t=>t.id===site.tarif_id);
                    if(curT&&!curT.tarif_dynamique){
                      const _bill=Math.round((curT.abo_annuel||0)+site.conso_annuelle_kwh*(curT.prix_hp||0));
                      if(_bill>0){
                        const _pm=_bill/site.conso_annuelle_kwh;
                        const _pr=globalVars?.prix_rachat_injection??0.04;
                        const nouvFact=Math.max(0,annGrid*_pm-annInj*_pr);
                        baisseFacture=Math.max(0,Math.round(_bill-nouvFact));
                      }
                    }
                  }
                  // Baisse totale : énergie + flex + acc — cache pour SimulationsScreen / SolarSim
                  const baisseTotale=(baisseFacture||0)+flexRevenue+accSavings;
                  if(baisseTotale>0) localStorage.setItem('starvolt_baisse_facture',String(baisseTotale));
                  // Investissement global (PV + batterie + box) depuis les tarifs admin
                  const _pvInv = interpPrix(parseFloat(pvKwc)||0, prixMat?.pv_prices||[]);
                  const _batInv = interpPrix(parseFloat(batKwh)||0, prixMat?.bat_prices||[]);
                  const _boxInv = hasBox ? ((prixMat?.box_prix||500)+(prixMat?.box_installation||100)) : 0;
                  const totalInvestissement = _pvInv + _batInv + _boxInv;
                  // Toujours écrire (même 0) pour éviter que l'ancienne valeur persiste
                  localStorage.setItem('starvolt_investissement_total',String(Math.round(totalInvestissement)));
                  return(<>
                    {/* ── Rangée 1 : PROFIL · kWc · Autoconso · Autoprod (si solaire au panier) ── */}
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      {/* ACHATS */}
                      <div style={T}>
                        <div style={LBL}>ACHATS</div>
                        {effectiveTariff?(
                          <div style={{display:'flex',flexDirection:'column',gap:3}}>
                            <div style={{fontSize:13,color:'white',fontWeight:700,lineHeight:1.2}}>{effectiveTariff.nom}</div>
                            {(()=>{const optiChosen=!!localStorage.getItem('starvolt_optimisation_chosen');return optiChosen?<div style={{fontSize:10,color:'rgba(125,217,64,.8)',fontWeight:600}}>Offre panier</div>:<div style={{fontSize:10,color:'rgba(255,255,255,.4)'}}>Tarif par défaut</div>;})()}
                            {totalInvestissement>0&&<div style={{fontSize:11,color:'rgba(255,210,80,.85)',fontWeight:700,marginTop:2}}>Invest. {Math.round(totalInvestissement).toLocaleString('fr-FR')} €</div>}
                          </div>
                        ):(
                          <div style={{fontSize:13,color:'rgba(255,255,255,.4)'}}>Non défini</div>
                        )}
                      </div>
                      {/* kWc PV */}
                      <div style={T}>
                        <div style={LBL}>kWc PV</div>
                        <StepInput compact value={pvKwc} onChange={setPvKwc}
                          onBlur={()=>{const v=parseFloat(pvKwc);updateSite({puissance_pv_kwc:isNaN(v)?null:v});}}
                          step={0.5} min={0} placeholder="6"/>
                      </div>
                      {/* Baisse facture €TTC */}
                      {balance&&
                        <div style={{...T,alignItems:'center',justifyContent:'center',textAlign:'center'}}>
                          <div style={LBL}>BAISSE FACTURE</div>
                          <div style={{fontSize:isMobile?19:26,fontWeight:900,color:'#7dd940',lineHeight:1.1}}>
                            {baisseTotale>0?baisseTotale.toLocaleString('fr-FR'):'—'}<span style={{fontSize:isMobile?10:13}}> €TTC</span>
                          </div>
                          {!isMobile&&(baisseFacture>0||flexRevenue>0||accSavings>0)&&<div style={{fontSize:11,color:'rgba(255,255,255,.45)'}}>
                            {baisseFacture>0?`Énergie ${baisseFacture.toLocaleString('fr-FR')} €`:''}
                            {flexRevenue>0?` · Flex ${flexRevenue} €`:''}
                            {accSavings>0?` · ACC ${accSavings} €`:''}
                          </div>}
                        </div>
                      }
                      {/* Activation des services — affiché dès que box ou ACC en panier, sans attendre le bilan */}
                      {(hasBox||hasAcc)&&<div style={{...T,flexDirection:'column',gap:5,justifyContent:'center',minWidth:155}}>
                          <div style={{fontSize:9,color:'rgba(255,255,255,.4)',fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase'}}>Activation des services</div>
                          {(()=>{
                            const hasStorage=(parseFloat(batKwh)||0)>0||(parseFloat(thermKwh)||0)>0;
                            const hasPV=(parseFloat(pvKwc)||0)>0;
                            return[
                              {key:'opti_solaire', label:'☀️ Optimisation solaire', enabled:hasBox&&hasStorage&&hasPV, def:true},
                              {key:'opti_tarif',   label:'⚡ Optimisation tarifaire', enabled:hasBox&&hasStorage, def:true},
                              {key:'opti_flex',    label:'🔄 Flex', enabled:hasBox&&hasStorage, def:false},
                              {key:'opti_acc',     label:'🤝 ACC', enabled:hasAcc, def:true},
                            ];
                          })().map(({key,label,enabled,def})=>(
                            <label key={key} style={{display:'flex',alignItems:'center',gap:6,cursor:enabled?'pointer':'not-allowed',opacity:enabled?1:0.35}}>
                              <input type="checkbox"
                                disabled={!enabled}
                                checked={!!(globalVars?.[key]??def)}
                                onChange={enabled?e=>{
                                  const val=e.target.checked;
                                  setGlobalVars(prev=>{const next={...prev,[key]:val};try{localStorage.setItem('starvolt_global_vars_cache',JSON.stringify(next));}catch{}return next;});
                                  sb.from('parametres_nationaux').upsert({id:1,[key]:val},{onConflict:'id'});
                                }:undefined}
                                style={{accentColor:'#7dd940',width:14,height:14,cursor:enabled?'pointer':'not-allowed'}}
                              />
                              <span style={{fontSize:11,color:'rgba(255,255,255,.85)',fontWeight:600}}>{label}</span>
                            </label>
                          ))}
                        </div>
                      }
                      {/* Messages quand pas encore de bilan */}
                      {prodProfilId&&!balance&&site?.conso_profil&&(
                        <div style={{...T,alignItems:'center',justifyContent:'center',color:'rgba(255,255,255,.35)',fontSize:13}}>Calcul…</div>
                      )}
                      {prodProfilId&&!site?.conso_profil&&(
                        <div style={{...T,fontSize:13,color:'rgba(255,200,80,.7)',background:'rgba(255,200,0,.04)',alignItems:'center',justifyContent:'center',textAlign:'center'}}>⚠️ Importez votre consommation</div>
                      )}
                    </div>

                    {/* ── Rangée 2 : Batterie · Thermique · Box · Solaire · Achat · Injection ── */}
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      {/* Batterie chimique */}
                      <div style={T}>
                        <div style={{display:'flex',alignItems:'center',gap:5}}>
                          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" style={{flexShrink:0}}>
                            <rect x="1" y="5" width="15" height="10" rx="2" stroke="white" strokeWidth="1.5"/>
                            <rect x="16" y="7.5" width="3" height="5" rx="1" fill="white"/>
                            <rect x="3" y="7" width="7" height="6" rx="1" fill="white" fillOpacity="0.8"/>
                          </svg>
                          <span style={{fontSize:13,fontWeight:800,color:'white'}}>Batterie chimique</span>
                        </div>
                        <div><div style={LBL}>Capacité kWh</div>
                          <StepInput compact value={batKwh} onChange={setBatKwh}
                            onBlur={()=>{const v=parseFloat(batKwh);updateSite({batterie_capacite_kwh:isNaN(v)?null:v});}}
                            step={0.5} min={0} placeholder="10"/></div>
                      </div>
                      {/* Stockage thermique */}
                      <div style={{...T,background:'rgba(255,160,50,.06)',border:'1px solid rgba(255,160,50,.3)'}}>
                        <div style={{display:'flex',alignItems:'center',gap:5}}>
                          <img src="/comwatt-box.png" style={{width:14,height:14,objectFit:'contain',mixBlendMode:'screen',flexShrink:0}} onError={e=>e.target.style.display='none'}/>
                          <span style={{fontSize:13,fontWeight:800,color:'white'}}>Stockage thermique</span>
                        </div>
                        <div><div style={LBL}>Capacité kW</div>
                          <StepInput compact value={thermKwh}
                            onChange={v=>{setThermKwh(v);activeId&&localStorage.setItem(`starvolt_therm_kwh_${activeId}`,v);}}
                            onBlur={()=>{}} step={0.5} min={0} placeholder="10"/></div>
                      </div>
                      {/* Tuiles énergie */}
                      {balance&&[
                        {
                          icon: <img src="/maison.png" style={{width:48,height:48,objectFit:'contain',mixBlendMode:'screen',filter:'brightness(0) invert(1)',opacity:.85}} onError={e=>e.target.style.display='none'}/>,
                          color:'#f0a050',bg:'rgba(240,160,80,.08)',label:'Solaire sur place',value:fmt(autoconso)
                        },
                        {
                          // Pylône HT — flèche qui PART du pylône (achat réseau)
                          // Pylon centré à droite (bras ±9 vs ±19 avant), flèche ← inchangée
                          icon: (()=>{
                            const P=({x1,y1,x2,y2,w=1.2})=><line x1={x1} y1={y1} x2={x2} y2={y2} stroke="white" strokeWidth={w} strokeLinecap="round"/>;
                            return <svg width="72" height="56" viewBox="0 0 80 64" fill="none">
                              {/* Mât */}
                              <P x1="54" y1="3" x2="54" y2="9" w={2}/>
                              {/* Bras supérieur (±9) */}
                              <P x1="45" y1="9" x2="63" y2="9" w={2.2}/>
                              <P x1="45" y1="9" x2="43" y2="14" w={1.8}/>
                              <P x1="63" y1="9" x2="65" y2="14" w={1.8}/>
                              {/* Bras inférieur (±8) */}
                              <P x1="46" y1="16" x2="62" y2="16" w={2}/>
                              <P x1="46" y1="16" x2="44" y2="21" w={1.8}/>
                              <P x1="62" y1="16" x2="64" y2="21" w={1.8}/>
                              {/* Croix entre bras */}
                              <P x1="45" y1="9" x2="62" y2="16" w={0.9}/>
                              <P x1="63" y1="9" x2="46" y2="16" w={0.9}/>
                              {/* Corps section 1 */}
                              <P x1="49" y1="16" x2="47" y2="32" w={1.4}/>
                              <P x1="59" y1="16" x2="61" y2="32" w={1.4}/>
                              <P x1="49" y1="16" x2="61" y2="32" w={0.8}/>
                              <P x1="59" y1="16" x2="47" y2="32" w={0.8}/>
                              {/* Corps section 2 */}
                              <P x1="47" y1="32" x2="45" y2="48" w={1.4}/>
                              <P x1="61" y1="32" x2="63" y2="48" w={1.4}/>
                              <P x1="47" y1="32" x2="63" y2="48" w={0.8}/>
                              <P x1="61" y1="32" x2="45" y2="48" w={0.8}/>
                              {/* Corps section 3 */}
                              <P x1="45" y1="48" x2="43" y2="61" w={1.4}/>
                              <P x1="63" y1="48" x2="65" y2="61" w={1.4}/>
                              <P x1="45" y1="48" x2="63" y2="48" w={0.9}/>
                              <P x1="45" y1="48" x2="65" y2="61" w={0.8}/>
                              <P x1="63" y1="48" x2="43" y2="61" w={0.8}/>
                              {/* Flèche ← inchangée */}
                              <P x1="31" y1="12" x2="4" y2="12" w={3}/>
                              <polyline points="13,7 4,12 13,17" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>;
                          })(),
                          color:'white',bg:'rgba(200,200,200,.06)',label:'Achat réseau',value:fmt(achat)
                        },
                        {
                          // Pylône HT — même structure réduite, flèche → inchangée
                          icon: (()=>{
                            const P=({x1,y1,x2,y2,w=1.2})=><line x1={x1} y1={y1} x2={x2} y2={y2} stroke="white" strokeWidth={w} strokeLinecap="round"/>;
                            return <svg width="72" height="56" viewBox="0 0 80 64" fill="none">
                              {/* Mât */}
                              <P x1="54" y1="3" x2="54" y2="9" w={2}/>
                              {/* Bras supérieur (±9) */}
                              <P x1="45" y1="9" x2="63" y2="9" w={2.2}/>
                              <P x1="45" y1="9" x2="43" y2="14" w={1.8}/>
                              <P x1="63" y1="9" x2="65" y2="14" w={1.8}/>
                              {/* Bras inférieur (±8) */}
                              <P x1="46" y1="16" x2="62" y2="16" w={2}/>
                              <P x1="46" y1="16" x2="44" y2="21" w={1.8}/>
                              <P x1="62" y1="16" x2="64" y2="21" w={1.8}/>
                              {/* Croix entre bras */}
                              <P x1="45" y1="9" x2="62" y2="16" w={0.9}/>
                              <P x1="63" y1="9" x2="46" y2="16" w={0.9}/>
                              {/* Corps section 1 */}
                              <P x1="49" y1="16" x2="47" y2="32" w={1.4}/>
                              <P x1="59" y1="16" x2="61" y2="32" w={1.4}/>
                              <P x1="49" y1="16" x2="61" y2="32" w={0.8}/>
                              <P x1="59" y1="16" x2="47" y2="32" w={0.8}/>
                              {/* Corps section 2 */}
                              <P x1="47" y1="32" x2="45" y2="48" w={1.4}/>
                              <P x1="61" y1="32" x2="63" y2="48" w={1.4}/>
                              <P x1="47" y1="32" x2="63" y2="48" w={0.8}/>
                              <P x1="61" y1="32" x2="45" y2="48" w={0.8}/>
                              {/* Corps section 3 */}
                              <P x1="45" y1="48" x2="43" y2="61" w={1.4}/>
                              <P x1="63" y1="48" x2="65" y2="61" w={1.4}/>
                              <P x1="45" y1="48" x2="63" y2="48" w={0.9}/>
                              <P x1="45" y1="48" x2="65" y2="61" w={0.8}/>
                              <P x1="63" y1="48" x2="43" y2="61" w={0.8}/>
                              {/* Flèche → inchangée */}
                              <P x1="4" y1="12" x2="31" y2="12" w={3}/>
                              <polyline points="22,7 31,12 22,17" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>;
                          })(),
                          color:'#f0e86a',bg:'rgba(240,232,106,.06)',label:'Injection réseau',value:fmt(injection)
                        },
                      ].map(({icon,color,bg,label,value})=>(
                        <div key={label} style={{
                          ...T, background:bg,
                          flexDirection: isMobile ? 'column' : 'row',
                          alignItems:'center',
                          justifyContent: isMobile ? 'center' : 'flex-start',
                          textAlign: isMobile ? 'center' : 'left',
                          gap: isMobile ? 3 : 10,
                        }}>
                          {!isMobile && <div style={{display:'flex',flexShrink:0,alignSelf:'stretch',alignItems:'center'}}>{icon}</div>}
                          <div style={{display:'flex',flexDirection:'column',gap:2,justifyContent:'center'}}>
                            <div style={{fontSize:isMobile?11:13,color:'rgba(255,255,255,.7)',fontWeight:600}}>{label}</div>
                            <div style={{fontSize:isMobile?16:20,fontWeight:900,color}}>{value}</div>
                          </div>
                        </div>
                      ))}
                    </div>

                  </>);
                })()}
              </div>}
            </div>}

          </>
        )}
      </div>

      <StickyFooter row onBack={onBack}>
        {onSimulations&&<button className="btn btn-primary" style={{fontSize:13}} onClick={onSimulations}>Simulations d'économies →</button>}
        {onComprendre&&<button className="btn" style={{fontSize:13}} onClick={onComprendre}>💡 Comprendre</button>}
      </StickyFooter>

      {/* ── Fenêtre de consentement ENEDIS in-app : invite « bravo » puis iframe Switchgrid ── */}
      {consentModal&&linkyUserUrl&&(
        <div style={{position:'fixed',inset:0,zIndex:9000,background:'rgba(3,12,18,.82)',backdropFilter:'blur(4px)',WebkitBackdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',padding:consentModal==='iframe'?0:16}}>
          {consentModal==='invite'?(
            <div className="card" style={{maxWidth:380,width:'100%',textAlign:'center',padding:'26px 22px'}}>
              <div style={{fontSize:42,marginBottom:8}}>🎉</div>
              <div style={{fontSize:18,fontWeight:900,color:'#fff',marginBottom:8,lineHeight:1.2}}>Bravo !</div>
              <div style={{color:'rgba(255,255,255,.78)',fontSize:13,lineHeight:1.55,marginBottom:18}}>
                Nous avons trouvé dans la base ENEDIS ce qui semble être <strong style={{color:'#fff'}}>votre dossier</strong>. Dernière étape : donnez votre consentement pour autoriser l'accès à vos données de consommation.
              </div>
              <button onClick={()=>setConsentModal('iframe')}
                style={{width:'100%',background:'#f7c948',color:'#061e2a',fontWeight:800,fontSize:14,borderRadius:10,padding:'12px',border:'none',cursor:'pointer'}}>
                Donner mon consentement →
              </button>
              <button onClick={()=>setConsentModal(null)}
                style={{marginTop:10,background:'none',border:'none',color:'rgba(255,255,255,.45)',fontSize:12,cursor:'pointer'}}>Plus tard</button>
            </div>
          ):(
            <div style={{width:'100%',maxWidth:760,height:'100%',maxHeight:isMobile?'100vh':'92vh',display:'flex',flexDirection:'column',background:'#0a1a24',borderRadius:isMobile?0:14,overflow:'hidden',boxShadow:'0 20px 60px rgba(0,0,0,.5)'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderBottom:'1px solid rgba(255,255,255,.1)',flexShrink:0}}>
                <div style={{fontWeight:800,fontSize:13,color:'#fff',display:'flex',alignItems:'center',gap:6}}>⚡ Consentement ENEDIS</div>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <a href={linkyUserUrl} target="_blank" rel="noopener noreferrer"
                    style={{fontSize:11,color:'rgba(247,201,72,.9)',textDecoration:'none',fontWeight:600,whiteSpace:'nowrap'}}>Ouvrir dans un onglet ↗</a>
                  <button onClick={()=>setConsentModal(null)}
                    style={{background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.15)',color:'rgba(255,255,255,.7)',borderRadius:7,fontSize:13,fontWeight:700,padding:'5px 11px',cursor:'pointer'}}>✕ Fermer</button>
                </div>
              </div>
              <iframe src={linkyUserUrl} title="Consentement ENEDIS" allow="clipboard-write"
                style={{flex:1,width:'100%',border:'none',background:'#fff'}}/>
              <div style={{padding:'7px 14px',borderTop:'1px solid rgba(255,255,255,.08)',color:'rgba(255,255,255,.5)',fontSize:10,lineHeight:1.4,flexShrink:0,textAlign:'center'}}>
                Cette fenêtre se fermera automatiquement une fois le consentement signé.
              </div>
            </div>
          )}
        </div>
      )}
    </>
  );
}

// ─── SimulationsScreen ────────────────────────
// ─── GameSlider ──────────────────────────────────────────────────────────────
// Distribution uniforme des crans (pas proportionnelle aux valeurs)
// Fix bord écran Android : padding interne + touch-action:none
// Fix sensibilité : snap basé sur index, pas sur valeur brute
function GameSlider({ icon, label, snapValues, value, onChange, format }) {
  const [dragging, setDragging] = React.useState(false);
  const trackRef = React.useRef(null);
  const N = snapValues.length;

  // Position uniforme : chaque cran occupe 1/(N-1) de la largeur
  const currentIdx = snapValues.indexOf(value);
  const safeIdx    = currentIdx === -1 ? N - 1 : currentIdx;
  const pct        = N <= 1 ? 100 : (safeIdx / (N - 1)) * 100;

  // Convertit une position X en index de cran (distribution uniforme)
  const posToIdx = (clientX) => {
    const rect = trackRef.current?.getBoundingClientRect();
    if (!rect) return safeIdx;
    // Marge interne pour éviter que le pouce touche les bords (fix Android)
    const PAD  = 20;
    const w    = Math.max(1, rect.width - PAD * 2);
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left - PAD) / w));
    return Math.round(ratio * (N - 1));
  };

  const onPointerDown = (e) => {
    e.preventDefault();
    setDragging(true);
    trackRef.current?.setPointerCapture(e.pointerId);
    const idx = posToIdx(e.clientX);
    if (snapValues[idx] !== value) onChange(snapValues[idx]);
  };
  const onPointerMove = (e) => {
    if (!dragging) return;
    const idx = posToIdx(e.clientX);
    if (snapValues[idx] !== value) onChange(snapValues[idx]);
  };
  const onPointerUp = () => setDragging(false);

  return (
    <div className="gs-wrap">
      <div className="gs-header">
        <div className="gs-label"><span>{icon}</span>{label}</div>
        <div className={`gs-val${dragging?' gs-val-active':''}`}>{format(value)}</div>
      </div>
      <div className="gs-track-wrap"
        ref={trackRef}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
        style={{touchAction:'none', userSelect:'none'}}
      >
        <div className="gs-track">
          <div className="gs-fill" style={{width:`${pct}%`}}/>
          {/* Crans uniformément répartis */}
          {snapValues.map((v, i) => {
            const p = N <= 1 ? 0 : (i / (N - 1)) * 100;
            const active = i <= safeIdx;
            return <div key={i} className="gs-tick" style={{
              left:`${p}%`,
              background: active ? 'rgba(125,217,64,.6)' : 'rgba(255,255,255,.2)',
            }}/>;
          })}
          <div className={`gs-thumb${dragging?' dragging':''}`} style={{left:`${pct}%`}}/>
        </div>
      </div>
      {/* Labels des crans uniformément répartis, plus grands */}
      <div style={{position:'relative',height:22,marginTop:4}}>
        {snapValues.map((v, i) => {
          const p = N <= 1 ? 0 : (i / (N - 1)) * 100;
          const active = i <= safeIdx;
          return (
            <div key={i} style={{
              position:'absolute',
              left:`${p}%`,
              transform:'translateX(-50%)',
              fontSize: i === safeIdx ? 13 : 10,
              fontWeight: i === safeIdx ? 900 : 500,
              color: active ? (i === safeIdx ? '#7dd940' : 'rgba(125,217,64,.55)') : 'rgba(255,255,255,.2)',
              transition:'all .15s',
              whiteSpace:'nowrap',
            }}>{format(v)}</div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Pictos par défaut (4 types en dur) ─────────────────────────────────────
const PICTOS_DEFAUT = {
  optimisation_fournisseur: '/optimisation.png',
  acc:                      '/acc.png',
  box:                      '/comwatt-box.png',
  solaire:                  '/maison.png',
};

function SimulationsScreen({ onACC, onBox, onSolar, onOptimisation, onDiyBox, onBack, onMonSite, onComprendre, user, userProfile }) {
  const [hasConso,  setHasConso]  = useState(false);
  const [maxSaving, setMaxSaving] = useState(null);
  const [accSaving, setAccSaving] = useState(null);
  const [boxSaving,   setBoxSaving]   = useState(null);
  const [solarSaving, setSolarSaving] = useState(null);
  // Pour la projection correcte : achat réseau après solar, injection, prix base
  const [solGridKwh,    setSolGridKwh]    = useState(null);
  const [solInjKwh,     setSolInjKwh]     = useState(null);
  const [solPrixBase,   setSolPrixBase]   = useState(null);
  const [solPrixRachat, setSolPrixRachat] = useState(0.04);
  const [bestTariffName, setBestTariffName] = useState(null);
  const [changedTariff, setChangedTariff] = useState(false);

  // ── Offres depuis la DB ────────────────────────
  const [offres, setOffres] = useState([]);
  const [filtresActifs, setFiltresActifs] = useState({ vitesse: true, investissement: true, economie: true });
  const [siteProfile, setSiteProfile] = useState(null); // {type_logement, statut}
  useEffect(() => {
    sb.from('offres').select('*').order('created_at').then(({data}) => setOffres(data || []));
    sb.from('filtres_config').select('*').then(({ data }) => {
      if (!data) return;
      const map = { vitesse: true, investissement: true, economie: true };
      data.forEach(r => { map[r.filtre_key] = r.actif; });
      setFiltresActifs(map);
    });
    if (user?.id) {
      const activeId = localStorage.getItem('starvolt_active_site_id');
      const q = activeId
        ? sb.from('sites').select('flex_type_logement,flex_statut').eq('id', activeId).maybeSingle()
        : sb.from('sites').select('flex_type_logement,flex_statut').eq('user_id', user.id).order('created_at').limit(1).maybeSingle();
      q.then(({ data }) => { if (data) setSiteProfile({ type_logement: data.flex_type_logement, statut: data.flex_statut }); });
    }
  }, []);

  // ── Calcul des valeurs snap pour chaque slider ─
  const delaiVals   = React.useMemo(() => { const v = [...new Set(offres.map(o=>o.delai_min_jours).filter(x=>x!=null))].sort((a,b)=>a-b); return v.length >= 2 ? v : (v.length===1 ? [0,v[0]] : [0,365]); }, [offres]);
  const investVals  = React.useMemo(() => { const v = [...new Set(offres.map(o=>o.investissement_min).filter(x=>x!=null))].sort((a,b)=>a-b); return v.length >= 2 ? v : (v.length===1 ? [0,v[0]] : [0,10000]); }, [offres]);
  const reductVals  = React.useMemo(() => { const v = [...new Set(offres.map(o=>o.reduction_pct).filter(x=>x!=null))].sort((a,b)=>a-b); return v.length >= 2 ? v : (v.length===1 ? [0,v[0]] : [0,100]); }, [offres]);

  // ── État des sliders (initialisés au max/min permissif) ─
  const [delaiFilter,  setDelaiFilter]  = useState(null);
  const [investFilter, setInvestFilter] = useState(null);
  const [reductFilter, setReductFilter] = useState(null);

  // Init sliders quand les offres chargent
  useEffect(() => {
    if (offres.length === 0) return;
    setDelaiFilter(v  => v  ?? delaiVals[delaiVals.length-1]);
    setInvestFilter(v => v  ?? investVals[investVals.length-1]);
    setReductFilter(v => v  ?? reductVals[0]);
  }, [offres]);

  const fmtDelai  = v => v === 0 ? 'Immédiat' : `${v}j`;
  const fmtInvest = v => v === 0 ? '0 €' : `${v.toLocaleString('fr-FR')} €`;
  const fmtReduct = v => `${v}%`;

  // ── Mapping type → handler ─────────────────────
  const typeHandler = { optimisation_fournisseur: onOptimisation, acc: onACC, box: onBox, solaire: onSolar, diy_box: onDiyBox };
  const typeSaving  = React.useMemo(() => ({
    optimisation_fournisseur: maxSaving,
    acc:    accSaving,
    box:    boxSaving,
    solaire: parseInt(localStorage.getItem('starvolt_baisse_facture')||'0') || solarSaving,
  }), [maxSaving, accSaving, boxSaving, solarSaving]);

  // ── Filtrage des offres ───────────────────────
  const offresFiltrees = React.useMemo(() => offres.filter(o => {
    if (delaiFilter  != null && o.delai_min_jours    != null && o.delai_min_jours    > delaiFilter)  return false;
    if (investFilter != null && o.investissement_min != null && o.investissement_min > investFilter) return false;
    if (reductFilter != null && o.reduction_pct      != null && o.reduction_pct      < reductFilter) return false;
    // Exclusion public : si le profil du site correspond à une case cochée → masquer l'offre
    const exclusions = o.public_cibles;
    if (exclusions && exclusions.length > 0 && siteProfile) {
      const typeLog = siteProfile.type_logement; // 'maison' | 'collectif' | null
      const statut  = siteProfile.statut;         // 'proprietaire' | 'locataire' | null
      if (typeLog && exclusions.includes(typeLog)) return false;
      if (statut  && exclusions.includes(statut))  return false;
    }
    return true;
  }), [offres, delaiFilter, investFilter, reductFilter, siteProfile]);

  // ── Picto d'une offre ─────────────────────────
  const getPicto = (o) => {
    if (o.picto_url) return o.picto_url;
    const firstType = (o.types_offre || [])[0];
    return PICTOS_DEFAUT[firstType] || '/optimisation.png';
  };

  // ── Handler clic tuile ─────────────────────────
  const handleTileClick = (o) => {
    const firstType = (o.types_offre || []).find(t => typeHandler[t]);
    if (firstType) typeHandler[firstType]?.();
  };

  // ── Économies pour une offre ──────────────────
  const getSaving = (o) => {
    const savings = (o.types_offre || []).map(t => typeSaving[t]).filter(s => s != null && s > 0);
    return savings.length ? Math.max(...savings) : null;
  };

  const anyFiltreActif = filtresActifs.vitesse || filtresActifs.investissement || filtresActifs.economie;
  const showSliders = offres.length > 0 && anyFiltreActif && (delaiFilter != null);

  useEffect(() => {
    if (!user) return;
    const activeId = localStorage.getItem('starvolt_active_site_id');
    Promise.all([
      activeId
        ? sb.from('sites').select('id,conso_profil,tarif_id,profil_production_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2').eq('id', activeId).maybeSingle()
        : sb.from('sites').select('id,conso_profil,tarif_id,profil_production_id,heure_debut_hc1,heure_fin_hc1,heure_debut_hc2,heure_fin_hc2').eq('user_id', user.id).not('conso_profil','is',null).order('created_at').limit(1).maybeSingle(),
      sb.from('tarifs_electricite').select('*').order('nom'),
      sb.from('parametres_nationaux').select('*').eq('id',1).maybeSingle(),
      sb.rpc('get_spot_json'),
    ]).then(async ([{ data: siteData }, { data: tariffs }, { data: nat }, { data: spotRows }]) => {
      const site = Array.isArray(siteData) ? siteData[0] : siteData;
      if (!site?.conso_profil) return;
      setHasConso(true);

      const { kwh_hc, kwh_hp } = calcHcHp(site.conso_profil, site);
      const kwh_total = kwh_hc + kwh_hp;

      // Optimisation savings
      if (tariffs?.length && kwh_total > 0) {
        const ranked = tariffs.map(t=>({t,result:calcTariffCost(t,kwh_hc,kwh_hp)})).filter(({result})=>result!==null).sort((a,b)=>a.result.total-b.result.total);
        if (ranked.length) {
          const cur = site.tarif_id ? ranked.find(r=>r.t.id===site.tarif_id) : null;
          const saving = cur ? Math.round(cur.result.total - ranked[0].result.total) : null;
          setMaxSaving(saving);
          if (saving > 0) setBestTariffName(ranked[0].t.nom);

          // Box saving: 140€ flex + gain réel du stockage calculé heure par heure
          const curTariff = site.tarif_id ? tariffs.find(t => t.id === site.tarif_id) : null;
          const curBill = cur?.result?.total || (kwh_total * 0.18);
          const solDef=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})();
          const bkv=parseFloat(solDef.batKwh)||0, tkv=parseFloat(solDef.thermKwh)||0;
          const sp = spotRows ? buildSpotMap(spotRows) : null;
          const storRes = curTariff ? computeStorageOptimization(site.conso_profil, curTariff, curTariff, site, bkv, tkv, {...nat, opti_tarif:true}, sp) : null;
          const _ratioSim = (nat?.ratio_puissance_stockage ?? 50) / 100;
          const flexGainSim = Math.round((parseFloat(solDef.thermKwh)||10)*14 + (parseFloat(solDef.batKwh)||10)*_ratioSim*27);
          const bSav = Math.round(flexGainSim + (storRes?.saving || 0));
          if (bSav > 0) setBoxSaving(bSav);
          // Charger le profil de production (utilisé pour estim ACC + solar)
          let _prodProfil = null;
          if (site.profil_production_id && site.conso_profil) {
            const { data: pp } = await sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single();
            _prodProfil = pp?.profil || null;
          }
          // accSavEst : heures prod non nulle (ou 9h–18h si pas de profil)
          const accSavEst = (() => {
            let k=0;
            for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++){
              const idx=profIdx(m,d,h);
              if(_prodProfil?!(_prodProfil[idx]>0):(h<9||h>=18)) continue;
              k+=(site.conso_profil[idx]||0)/1000;
            }
            return Math.max(0,Math.round(k*((site.tarif_id?tariffs.find(t=>t.id===site.tarif_id)?.prix_hp||0.24:0.24)-0.11)));
          })();
          const adjBillSolar = Math.max(0, curBill - (saving||0) - accSavEst);
          // Calcul réel des économies solaires
          if (_prodProfil) {
              const ratioBat   = ((nat?.ratio_puissance_stockage              ?? 50) / 100);
              const ratioTherm = ((nat?.ratio_puissance_stockage_thermique    ?? 50) / 100);
              const pBat   = nat?.pertes_batterie   ?? 10;
              const pTherm = nat?.pertes_thermique  ?? 0;
              const solDef=(()=>{try{return JSON.parse(localStorage.getItem('starvolt_solar_defaults'))||{};}catch{return{};}})();
              const kw=parseFloat(solDef.pvKwc)||6, bk=parseFloat(solDef.batKwh)||10, tk=parseFloat(solDef.thermKwh)||5;
              const bal = computeEnergyBalance(site.conso_profil, _prodProfil, kw,
                bk*ratioBat*1000, bk, pBat, tk*ratioTherm, tk, pTherm);
              const gridBuy = bal.monthly.reduce((s,m) => s + m.grid_buy, 0);
              const injKwh  = bal.monthly.reduce((s,m) => s + m.injection, 0);
              const prixMoyen = kwh_total > 0 && curBill ? curBill / kwh_total : 0.18;
              const prixRachat = nat?.prix_rachat_injection ?? 0.04;
              const nouvFact = Math.max(0, gridBuy * prixMoyen - injKwh * prixRachat);
              const realSav = Math.max(0, Math.round(curBill - nouvFact));
              setSolarSaving(realSav > 0 ? realSav : Math.round(adjBillSolar * 0.70));
              setSolGridKwh(gridBuy); setSolInjKwh(injKwh);
              setSolPrixBase(prixMoyen); setSolPrixRachat(prixRachat);
          } else {
            setSolarSaving(Math.round(adjBillSolar * 0.70));
          }
        }
      }

      // ACC savings : heures prod non nulle (ou 9h–18h si pas de profil)
      if (site.conso_profil) {
        let _prodProfilAcc = null;
        if (site.profil_production_id) {
          const { data: pp } = await sb.from('profils_production').select('profil').eq('id', site.profil_production_id).single();
          _prodProfilAcc = pp?.profil || null;
        }
        let kwh918 = 0;
        for (let m=1; m<=12; m++)
          for (let d=1; d<=PROF_DAYS[m-1]; d++)
            for (let h=0; h<24; h++) {
              const idx=profIdx(m,d,h);
              if(_prodProfilAcc?!(_prodProfilAcc[idx]>0):(h<9||h>=18)) continue;
              kwh918 += (site.conso_profil[idx]||0)/1000;
            }
        let priceRef = 0.24;
        if (site.tarif_id && tariffs?.length) {
          const t = tariffs.find(x=>x.id===site.tarif_id);
          if (t?.prix_hp) priceRef = t.prix_hp;
        }
        const sav = Math.round(kwh918 * (priceRef - 0.11));
        if (sav > 0) setAccSaving(sav);
      }
    });
  }, [user?.id]);

  if (changedTariff) {
    return (
      <>
      <div className="screen fade-in">
        <Fireworks final/>
        <div style={{ textAlign:'center', marginBottom:20, marginTop:8 }}>
          <div style={{ fontSize:52, marginBottom:8 }}>⚡</div>
          <div style={{ fontSize:22, fontWeight:900, color:'white', lineHeight:1.2, marginBottom:8 }}>
            Changement lancé !
          </div>
          <div style={{ fontSize:14, color:'rgba(255,255,255,.6)', lineHeight:1.6 }}>
            Votre demande de changement de fournisseur est enregistrée.
            Un conseiller vous contacte sous 48h.
          </div>
        </div>
        {maxSaving > 0 && (
          <div className="card" style={{ padding:'16px', marginBottom:12, textAlign:'center', border:'1.5px solid rgba(125,217,64,.4)' }}>
            <div style={{ fontSize:11, color:'rgba(255,255,255,.45)', textTransform:'uppercase', letterSpacing:'.5px', marginBottom:4 }}>Économies estimées</div>
            <div style={{ fontSize:36, fontWeight:900, color:'#7dd940', lineHeight:1 }}>-{maxSaving.toLocaleString('fr-FR')} €<span style={{fontSize:18}}>/an</span></div>
            {bestTariffName && <div style={{ fontSize:12, color:'rgba(255,255,255,.45)', marginTop:6 }}>En passant sur le tarif <strong style={{color:'#7dd940'}}>{bestTariffName}</strong></div>}
          </div>
        )}
        <div className="card" style={{ padding:'14px 16px', border:'1px solid rgba(125,217,64,.2)' }}>
          <div style={{ fontWeight:700, fontSize:13, color:'#7dd940', marginBottom:6 }}>✦ Prochaine étape</div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,.55)', lineHeight:1.6 }}>
            Nous vérifions votre éligibilité et préparons votre dossier de changement. Aucune démarche de votre côté — on s'occupe de tout.
          </div>
        </div>
      </div>
      <StickyFooter onBack={onBack}/>
      </>
    );
  }

  // Padding bas pour laisser la place au sticky (sliders ou bouton retour)
  const bottomPad = showSliders ? 210 : 80;

  return (
    <>
    <div className="screen fade-in" style={{paddingBottom: bottomPad}}>
      <div className="sim-header">
        <div className="welcome-tag sim-welcome-tag">Vos leviers d'économie</div>
        <h1 className="welcome-title sim-title-h1" style={{marginBottom:14}}>Simulations<br/><span className="accent">d'économie</span></h1>
      </div>

      {/* ── Tuiles d'offres ── */}
      {offres.length > 0 ? (
        <div className="sim-btns" style={{gap:6}}>
          {offresFiltrees.map(o => {
            const saving = getSaving(o);
            const isFree = o.investissement_min === 0 || o.investissement_min == null;
            const isFreeEngagement = isFree && (o.duree_engagement === 0 || o.duree_engagement == null);
            return (
              <button key={o.id}
                className="sim-btn sim-tile-visible"
                onClick={() => handleTileClick(o)}
                style={{border:'1.5px solid rgba(125,217,64,.25)', padding:'10px 14px', gap:0, flexDirection:'column', alignItems:'stretch'}}
              >
                {isFreeEngagement && (
                  <div className="offer-stamp">Gratuit &amp;<br/>sans engagement</div>
                )}
                {/* Ligne du haut : image + texte + flèche */}
                <div style={{display:'flex', alignItems:'flex-start', gap:12}}>
                  <img src={getPicto(o)} alt={o.titre} className="sim-icon" style={{mixBlendMode:'screen', width:34, height:34, marginTop:2, flexShrink:0}}/>
                  <div style={{flex:1}}>
                    <div className="sim-title">{o.titre}</div>
                    {o.sous_titre && <div className="sim-sub">{o.sous_titre}</div>}
                  </div>
                  <span className="sim-arrow" style={{marginTop:2, flexShrink:0}}>→</span>
                </div>
                {/* Chips : pleine largeur, alignés à gauche */}
                <div className="offer-meta" style={{marginTop:7}}>
                  {o.reduction_pct != null && (
                    <span className="offer-chip chip-green" title="Pourcentage d'économie sur votre facture">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
                        <line x1="9" y1="15" x2="15" y2="9"/><circle cx="9.5" cy="9.5" r="1.5"/><circle cx="14.5" cy="14.5" r="1.5"/>
                      </svg>
                      -{o.reduction_pct}%
                    </span>
                  )}
                  {saving != null && (
                    <span className="offer-chip chip-green" title="Économie estimée sur votre facture annuelle">
                      -{saving.toLocaleString('fr-FR')} €/an
                    </span>
                  )}
                  {isFree ? (
                    <span className={`offer-chip chip-free${isFreeEngagement ? ' chip-hide-mobile' : ''}`} title="Aucun investissement requis">
                      <span className="chip-ring">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                          <line x1="12" y1="2" x2="12" y2="4"/>
                        </svg>
                      </span>
                      Gratuit
                    </span>
                  ) : o.investissement_min != null && (
                    <span className="offer-chip" title="Investissement initial estimé">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="12" r="10"/><path d="M15 9H9a3 3 0 0 0 0 6h6"/><path d="M12 6v2m0 8v2"/>
                      </svg>
                      {o.investissement_min.toLocaleString('fr-FR')} €
                    </span>
                  )}
                  {o.delai_min_jours != null && (
                    <span className="offer-chip" title="Délai de mise en œuvre">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                      </svg>
                      {o.delai_min_jours === 0 ? 'Immédiat' : `${o.delai_min_jours}j`}
                    </span>
                  )}
                </div>
              </button>
            );
          })}
          {offresFiltrees.length === 0 && (

// ─── Optimisation utilities ───────────────────
function parseHcHour(s) { if (s == null || s === '') return null; if (typeof s === 'number') return Math.round(s); const n = parseInt(String(s).split(':')[0]); return isNaN(n) ? null : n; }

// Formatte une heure HC pour affichage : "1H36" → "01:36", "07:00" → "07:00"
function fmtHcTime(v) {
  if (!v && v !== 0) return null;
  const s = String(v).trim();
  const hm = s.match(/^(\d{1,2})H(\d{2})$/i);
  if (hm) return `${hm[1].padStart(2,'0')}:${hm[2]}`;
  const co = s.match(/^(\d{1,2}):(\d{2})/);
  if (co) return `${co[1].padStart(2,'0')}:${co[2]}`;
  return s;
}

// Libellé court de l'option tarifaire ENEDIS à partir du code C68 (ex: "BTINFMU4" → "HC/HP")
function labelOptionTarifaire(code) {
  if (!code) return null;
  const c = code.toUpperCase();
  if (c.includes('MU'))    return 'HC/HP';
  if (c.includes('EJP'))   return 'EJP';
  if (c.includes('TEMPO')) return 'TEMPO';
  return 'BASE';
}

function isHcHour(h, windows) {
  for (const { s, e } of windows) {
    if (s === null || e === null) continue;
    if (s < e) { if (h >= s && h < e) return true; }
    else { if (h >= s || h < e) return true; } // crosses midnight
  }
  return false;
}

function calcHcHp(consoProfile, userProfile) {
  const windows = [
    { s: parseHcHour(userProfile?.heure_debut_hc1), e: parseHcHour(userProfile?.heure_fin_hc1) },
    { s: parseHcHour(userProfile?.heure_debut_hc2), e: parseHcHour(userProfile?.heure_fin_hc2) },
  ].filter(w => w.s !== null && w.e !== null);

  let kwh_hc = 0, kwh_hp = 0;
  for (let m = 1; m <= 12; m++)
    for (let d = 1; d <= PROF_DAYS[m - 1]; d++)
      for (let h = 0; h < 24; h++) {
        const kwh = (consoProfile[profIdx(m, d, h)] || 0) / 1000;
        (windows.length > 0 && isHcHour(h, windows) ? kwh_hc : (kwh_hp += kwh, 0)) && (kwh_hc += kwh);
      }
  // fix the ternary side-effect above with cleaner version:
  kwh_hc = 0; kwh_hp = 0;
  for (let m = 1; m <= 12; m++)
    for (let d = 1; d <= PROF_DAYS[m - 1]; d++)
      for (let h = 0; h < 24; h++) {
        const kwh = (consoProfile[profIdx(m, d, h)] || 0) / 1000;
        if (windows.length > 0 && isHcHour(h, windows)) kwh_hc += kwh;
        else kwh_hp += kwh;
      }
  return { kwh_hc: Math.round(kwh_hc), kwh_hp: Math.round(kwh_hp), hasHC: windows.length > 0 };
}

function calcTariffCost(tariff, kwh_hc, kwh_hp, dynamicCtx = null) {
  if (tariff.tarif_dynamique || tariff.type_tarif === 'dynamique') {
    const { consoProfile, spotMap, natParams, site } = dynamicCtx || {};
    if (!consoProfile || !spotMap || !natParams) return null;
    return calcDynamicCost(tariff, consoProfile, spotMap, natParams, site);
  }
  if (tariff.type_tarif === 'multi' && tariff.periodes?.length > 0) {
    const consoProfile = dynamicCtx?.consoProfile;
    if (!consoProfile) return null;
    let varCost = 0;
    for (let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++) for(let h=0;h<24;h++)
      varCost += (consoProfile[profIdx(m,d,h)]||0)/1000 * getPrixMulti(m,d,h,tariff.periodes);
    return { total: Math.round((tariff.abo_annuel||0) + varCost), abo: tariff.abo_annuel||0, is_base: false };
  }
  const abo = tariff.abo_annuel || 0;
  const hp  = tariff.prix_hp || 0;
  const hc  = tariff.prix_hc != null ? tariff.prix_hc : hp;
  return { total: abo + kwh_hp * hp + kwh_hc * hc, abo, hp_cost: kwh_hp * hp, hc_cost: kwh_hc * hc, is_base: tariff.prix_hc == null || tariff.prix_hc === tariff.prix_hp };
}

// ─── Helpers TURPE / TTC / Spot ───────────────
// ─── Multi-période helpers ─────────────────────
function isInDateRange(m, d, sm, sd, em, ed) {
  const cur=m*100+d, s=sm*100+sd, e=em*100+ed;
  return s<=e?(cur>=s&&cur<=e):(cur>=s||cur<=e);
}
function getPrixMulti(m, d, h, periodes) {
  if (!periodes?.length) return 0;
  for (const p of periodes) {
    if (!p.date_debut||!p.date_fin||p.heure_debut===''||p.heure_fin===''||p.prix==='') continue;
    const parts1=p.date_debut.split('/'), parts2=p.date_fin.split('/');
    if(parts1.length<2||parts2.length<2) continue;
    const [dj,dm]=[parseInt(parts1[0]),parseInt(parts1[1])];
    const [fj,fm]=[parseInt(parts2[0]),parseInt(parts2[1])];
    if(!dj||!dm||!fj||!fm) continue;
    if(!isInDateRange(m,d,dm,dj,fm,fj)) continue;
    const hD=parseInt(p.heure_debut), hF=parseInt(p.heure_fin);
    if(isNaN(hD)||isNaN(hF)) continue;
    const overnight=hF<=hD;
    if(overnight?(h>=hD||h<hF):(h>=hD&&h<hF)) return parseFloat(p.prix)||0;
  }
  return 0;
}

function getTurpeRate(mois, heure, natParams, hcWindows) {
  const debut = natParams?.turpe_ete_debut ?? 4;
  const fin   = natParams?.turpe_ete_fin   ?? 10;
  const isEte = mois >= debut && mois <= fin;
  const isHc  = hcWindows?.length > 0 && isHcHour(heure, hcWindows);
  if (isEte  && isHc)  return (natParams?.turpe_hc_ete   || 0) / 100;
  if (isEte  && !isHc) return (natParams?.turpe_hp_ete   || 0) / 100;
  if (!isEte && isHc)  return (natParams?.turpe_hc_hiver || 0) / 100;
  return (natParams?.turpe_hp_hiver || 0) / 100;
}

function calcPrixTTC(spotEuroKwh, mois, heure, natParams, hcWindows) {
  const turpe  = getTurpeRate(mois, heure, natParams, hcWindows);
  const accise = (natParams?.accise || 0) / 100;
  const tva    = (natParams?.tva ?? 20) / 100;
  return (spotEuroKwh + turpe + accise) * (1 + tva);
}

function buildSpotMap(spotAll) {
  const m = {};
  (spotAll || []).forEach(r => { m[`${r.mois}_${r.jour}_${r.heure}`] = parseFloat(r.prix); });
  return m;
}

function calcDynamicCost(tariff, consoProfile, spotMap, natParams, userProfile) {
  const windows = [
    { s: parseHcHour(userProfile?.heure_debut_hc1), e: parseHcHour(userProfile?.heure_fin_hc1) },
    { s: parseHcHour(userProfile?.heure_debut_hc2), e: parseHcHour(userProfile?.heure_fin_hc2) },
  ].filter(w => w.s !== null && w.e !== null);
  const marge  = (tariff.marge_fournisseur_ceur_kwh || 0) / 100;
  const accise = (natParams?.accise || 0) / 100;
  const tva    = (natParams?.tva ?? 20) / 100;
  let varCost = 0, varCost_ete = 0, varCost_hiver = 0, kwh_ete = 0, kwh_hiver = 0;
  for (let mo = 1; mo <= 12; mo++) {
    const isEte = mo >= 4 && mo <= 10;
    for (let d = 1; d <= PROF_DAYS[mo - 1]; d++)
      for (let h = 0; h < 24; h++) {
        const kwh  = (consoProfile[profIdx(mo, d, h)] || 0) / 1000;
        if (!kwh) continue;
        const spot = spotMap[`${mo}_${d}_${h}`] || 0;
        const cv   = kwh * (spot + getTurpeRate(mo, h, natParams, windows) + accise + marge);
        varCost += cv;
        if (isEte) { varCost_ete += cv; kwh_ete += kwh; }
        else       { varCost_hiver += cv; kwh_hiver += kwh; }
      }
  }
  const kwh_total_dyn = kwh_ete + kwh_hiver;
  const fixedHT = (tariff.abo_annuel || 0) + (tariff.turpe_fixe || 0) + (tariff.cta_fixe || 0);
  const total   = (varCost + fixedHT) * (1 + tva);
  const avgCeur = (vc, kwh) => {
    if (!kwh || !kwh_total_dyn) return null;
    return ((vc + fixedHT * kwh / kwh_total_dyn) * (1 + tva) / kwh) * 100;
  };
  return {
    total, varCost: varCost * (1 + tva), fixedCost: fixedHT * (1 + tva), abo: fixedHT * (1 + tva),
    is_base: false, is_dynamic: true,
    avg_ete_ceur:   avgCeur(varCost_ete,   kwh_ete),
    avg_hiver_ceur: avgCeur(varCost_hiver, kwh_hiver),
  };
}

// ─── ProfileScreen ───────────────────────────
function ProfileScreen({ user, profile, onSave, onCancel, onLogout, onDeleted }) {
  const [prenom,    setPrenom]    = useState(profile?.prenom || '');
  const [nom,       setNom]       = useState(profile?.nom || '');
  const [pseudo,    setPseudo]    = useState(profile?.pseudo || '');
  const [adresse,   setAdresse]   = useState(profile?.adresse_ligne1 || '');
  const [cp,        setCp]        = useState(profile?.code_postal || '');
  const [ville,     setVille]     = useState(profile?.ville || '');
  const [tel,       setTel]       = useState(profile?.telephone || '');
  const [email,     setEmail]     = useState(user?.email || '');
  const [loading,   setLoading]   = useState(false);
  const [error,     setError]     = useState(null);
  const [showDelete, setShowDelete] = useState(false);
  const [deleteEmail, setDeleteEmail] = useState('');
  const [deleting,  setDeleting]  = useState(false);
  const [deleteErr, setDeleteErr] = useState(null);

  const handleSave = async () => {
    if (!prenom.trim() || !nom.trim()) {
      setError('Le prénom et le nom sont obligatoires.'); return;
    }
    setLoading(true); setError(null);
    const { error: err } = await sb.from('profiles').update({
      prenom:         prenom.trim(),
      nom:            nom.trim(),
      pseudo:         pseudo.trim() || null,
      adresse_ligne1: adresse.trim() || null,
      code_postal:    cp.trim() || null,
      ville:          ville.trim() || null,
      telephone:      tel.trim() || null,
    }).eq('id', user.id);
    if (err) { setError(err.message); setLoading(false); return; }
    if (email.trim() && email.trim() !== user.email) {
      await sb.auth.updateUser({ email: email.trim() });
    }
    setLoading(false);
    onSave({ prenom:prenom.trim(), nom:nom.trim(), pseudo:pseudo.trim()||null,
             adresse_ligne1:adresse.trim()||null, code_postal:cp.trim()||null,
             ville:ville.trim()||null, telephone:tel.trim()||null });
  };

  const handleDeleteConfirm = async () => {
    if (deleteEmail.trim() !== user.email) {
      setDeleteErr("L'email ne correspond pas à votre compte."); return;
    }
    setDeleting(true); setDeleteErr(null);
    await sb.rpc('delete_account');
    await sb.auth.signOut();
    onDeleted?.();
  };

  return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <div className="welcome-tag">Mon compte</div>
          <h1 className="welcome-title">Mes informations<br/><span className="accent">personnelles</span></h1>
        </div>
        <div className="form-card">
          <div className="inp-row">
            <div className="inp-group">
              <label className="inp-label">Prénom *</label>
              <input className="inp" value={prenom} onChange={e=>setPrenom(e.target.value)}/>
            </div>
            <div className="inp-group">
              <label className="inp-label">Nom *</label>
              <input className="inp" value={nom} onChange={e=>setNom(e.target.value)}/>
            </div>
          </div>
          <div className="inp-group">
            <label className="inp-label">Pseudo (affiché dans l'app)</label>
            <input className="inp" value={pseudo} onChange={e=>setPseudo(e.target.value)} placeholder={prenom || 'Marie'}/>
          </div>
          <div className="inp-group">
            <label className="inp-label">Numéro et rue</label>
            <input className="inp" value={adresse} onChange={e=>setAdresse(e.target.value)} placeholder="12 rue de la Paix"/>
          </div>
          <div className="inp-row">
            <div className="inp-group">
              <label className="inp-label">Code postal</label>
              <input className="inp" value={cp} onChange={e=>setCp(e.target.value)} placeholder="75001"/>
            </div>
            <div className="inp-group">
              <label className="inp-label">Ville</label>
              <input className="inp" value={ville} onChange={e=>setVille(e.target.value)} placeholder="Paris"/>
            </div>
          </div>
          <div className="inp-group">
            <label className="inp-label">Téléphone</label>
            <input className="inp" type="tel" value={tel} onChange={e=>setTel(e.target.value)} placeholder="06 12 34 56 78"/>
          </div>
          <div className="inp-group">
            <label className="inp-label">Email</label>
            <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
          </div>
          {error && <div className="auth-error">{error}</div>}
        </div>

        <button className="btn-link" style={{color:'white'}} onClick={onLogout}>
          Se déconnecter
        </button>

        {!showDelete ? (
          <button className="btn-link" style={{color:'rgba(255,120,120,.55)',fontSize:12,paddingTop:4}}
            onClick={()=>setShowDelete(true)}>
            Supprimer ce compte et toutes les données associées
          </button>
        ) : (
          <div className="delete-confirm-card">
            <h3>Supprimer le compte</h3>
            <p>Cette action est irréversible. Toutes vos données seront effacées.<br/>
               Saisissez votre email pour confirmer.</p>
            <div className="inp-group" style={{marginBottom:12}}>
              <input className="inp" type="email" value={deleteEmail}
                onChange={e=>setDeleteEmail(e.target.value)}
                placeholder={user.email}/>
            </div>
            {deleteErr && <div className="auth-error" style={{marginBottom:10}}>{deleteErr}</div>}
            <div style={{display:'flex',gap:8}}>
              <button className="btn-danger" onClick={handleDeleteConfirm} disabled={deleting}>
                {deleting ? 'Suppression…' : 'Confirmer la suppression'}
              </button>
              <button className="btn btn-sec" style={{flex:'0 0 auto',padding:'12px 16px'}}
                onClick={()=>{setShowDelete(false);setDeleteErr(null);setDeleteEmail('');}}>
                Annuler
              </button>
            </div>
          </div>
        )}
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handleSave} disabled={loading}>
          {loading ? 'Enregistrement…' : '✓ Enregistrer et quitter'}
        </button>
        <button className="btn btn-sec" onClick={onCancel}>Quitter sans enregistrer</button>
      </StickyFooter>
    </>
  );
}

// ─── couleur spot ─────────────────────────────
function spotColor(prix) {
  if (prix === null || prix === undefined) return 'rgba(255,255,255,.08)';
  if (prix < 0.03) return '#c8f0c8';
  if (prix < 0.06) return '#90d890';
  if (prix < 0.09) return '#58c058';
  if (prix < 0.12) return '#28a028';
  if (prix < 0.15) return '#b0c820';
  if (prix < 0.18) return '#d8b000';
  if (prix < 0.20) return '#e07818';
  if (prix < 0.22) return '#d84010';
  if (prix < 0.26) return '#b01010';
  return '#600010';
}

function ttcColor(prix) {
  if (prix === null || prix === undefined) return 'rgba(255,255,255,.08)';
  if (prix < 0.10) return '#c8f0c8';
  if (prix < 0.13) return '#90d890';
  if (prix < 0.16) return '#58c058';
  if (prix < 0.19) return '#28a028';
  if (prix < 0.22) return '#b0c820';
  if (prix < 0.26) return '#d8b000';
  if (prix < 0.30) return '#e07818';
  if (prix < 0.35) return '#d84010';
  if (prix < 0.45) return '#b01010';
  return '#600010';
}

// ─── SpotHeatmapCanvas ────────────────────────
const DAYS_IN_MONTH = [31,29,31,30,31,30,31,31,30,31,30,31];
const MOIS_LABELS   = ['Jan','Fév','Mar','Avr','Mai','Jui','Jul','Aoû','Sep','Oct','Nov','Déc'];

function SpotHeatmapCanvas({ spotAll, natParams, heatmapMode }) {
  const wrapperRef = useRef(null);
  const canvasRef  = useRef(null);

  const hcWindows = useMemo(() => natParams ? [
    { s: natParams.hc_debut1 ?? null, e: natParams.hc_fin1 ?? null },
    { s: natParams.hc_debut2 ?? null, e: natParams.hc_fin2 ?? null },
  ].filter(w => w.s !== null && w.e !== null) : [], [natParams]);

  const draw = useCallback((containerW) => {
    if (!canvasRef.current || !spotAll || spotAll.length === 0 || containerW < 10) return;
    const canvas = canvasRef.current;
    const ctx    = canvas.getContext('2d');
    const dpr    = window.devicePixelRatio || 1;
    const isTTC  = heatmapMode === 'ttc' && natParams;

    const dayMap = {};
    spotAll.forEach(r => {
      const k = `${r.mois}_${r.jour}`;
      if (!dayMap[k]) dayMap[k] = new Array(24).fill(null);
      dayMap[k][r.heure] = parseFloat(r.prix);
    });

    const days = [];
    for (let m = 1; m <= 12; m++)
      for (let d = 1; d <= DAYS_IN_MONTH[m-1]; d++)
        days.push({ mois:m, jour:d, prices: dayMap[`${m}_${d}`] || new Array(24).fill(null) });

    const LBL_W = 26;
    const HDR_H = 16;
    const CELL_W = Math.max(4, Math.floor((containerW - LBL_W) / 24));
    const CELL_H = 3;
    const W = LBL_W + 24 * CELL_W;
    const H = HDR_H + days.length * CELL_H;

    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);

    ctx.fillStyle = 'rgba(4,55,66,0.85)';
    ctx.fillRect(0, 0, W, H);

    // Header heures — centré sur chaque colonne
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    for (let h = 0; h < 24; h += 3)
      ctx.fillText(`${h}h`, LBL_W + h * CELL_W + CELL_W / 2, 12);

    // Dessine le label d'un mois centré verticalement sur son bloc
    const drawMonthLabel = (mois, startRow, endRow) => {
      const cy = HDR_H + (startRow + endRow) / 2 * CELL_H + 3;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = 'bold 8px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(MOIS_LABELS[mois-1], LBL_W - 3, cy);
    };

    let prevMonth = 0, mStartRow = 0;
    days.forEach((day, di) => {
      const y = HDR_H + di * CELL_H;
      if (day.mois !== prevMonth) {
        if (prevMonth !== 0) {
          drawMonthLabel(prevMonth, mStartRow, di);
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          ctx.fillRect(LBL_W, y, 24 * CELL_W, 1);
        }
        mStartRow = di;
        prevMonth = day.mois;
      }
      day.prices.forEach((prix, h) => {
        let p = prix;
        if (isTTC && prix !== null) p = calcPrixTTC(prix, day.mois, h, natParams, hcWindows);
        ctx.fillStyle = isTTC ? ttcColor(p) : spotColor(p);
        ctx.fillRect(LBL_W + h * CELL_W, y, CELL_W - 1, CELL_H - 1);
      });
    });
    if (prevMonth) drawMonthLabel(prevMonth, mStartRow, days.length);
  }, [spotAll, natParams, heatmapMode, hcWindows]);

  useEffect(() => {
    if (!wrapperRef.current) return;
    const ro = new ResizeObserver(entries =>
      draw(Math.floor(entries[0].contentRect.width))
    );
    ro.observe(wrapperRef.current);
    return () => ro.disconnect();
  }, [draw]);

  return (
    <div ref={wrapperRef} style={{width:'100%',overflowY:'auto',maxHeight:'calc(100vh - 230px)',borderRadius:8,border:'1px solid rgba(255,255,255,.1)'}}>
      <canvas ref={canvasRef} style={{display:'block'}}/>
    </div>
  );
}
