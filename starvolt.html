        {processing ? '⏳ Traitement…' : current ? '🖼 Changer l\'image' : '🖼 Ajouter une image'}
      </button>
      <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={async e=>{
        const f=e.target.files?.[0]; if(!f)return;
        setProcessing(true);
        try{ const b64=await processImageTransparent(f); setData(p=>({...p,[imgKey]:b64})); }
        catch(err){ alert('Erreur traitement image : '+err.message); }
        finally{ setProcessing(false); if(fileRef.current)fileRef.current.value=''; }
      }}/>
      <span style={{fontSize:10,color:'rgba(255,255,255,.3)'}}>250×200 · fond transparent</span>
    </div>
  );
}

// ─── BoxItemRow : ligne catalogue Box avec image inline + checkbox DIY ─
function BoxItemRow({ priceKey, imgKey, diyKey, label, step, data, setData, INP }) {
  const fileRef = useRef(null);
  const [processing, setProcessing] = useState(false);
  const img = data?.[imgKey];
  const isDiy = !!data?.[diyKey];
  const THUMB = {width:48,height:38,objectFit:'contain',borderRadius:5,background:'repeating-conic-gradient(rgba(255,255,255,.06) 0% 25%,transparent 0% 50%) 0 0/8px 8px'};
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid rgba(255,255,255,.06)'}}>
      {/* Miniature ou placeholder */}
      <div style={{...THUMB,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',position:'relative',overflow:'hidden'}}>
        {img
          ? <img src={img} alt={label} style={{width:'100%',height:'100%',objectFit:'contain'}}/>
          : <span style={{fontSize:18,opacity:.25}}>📷</span>
        }
      </div>
      {/* Label */}
      <div style={{flex:1,minWidth:0,fontSize:12,color:'rgba(255,255,255,.7)',fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{label}</div>

      <span style={{fontSize:11,color:'rgba(255,255,255,.35)',flexShrink:0}}>€</span>
      {/* Bouton image */}
      <button onClick={()=>fileRef.current?.click()} disabled={processing} title={img?'Changer l\'image':'Ajouter une image'}
        style={{flexShrink:0,background:img?'rgba(125,217,64,.12)':'rgba(255,255,255,.07)',border:`1px solid ${img?'rgba(125,217,64,.3)':'rgba(255,255,255,.18)'}`,borderRadius:6,color:img?'#7dd940':'rgba(255,255,255,.5)',fontSize:11,padding:'4px 8px',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>

      )}
      {/* Checkbox DIY */}
      {diyKey && (
        <label title="Proposer dans l'offre «Installer soi-même»" style={{flexShrink:0,display:'flex',alignItems:'center',gap:4,cursor:'pointer',userSelect:'none',padding:'2px 6px',borderRadius:6,background:isDiy?'rgba(192,132,252,.12)':'rgba(255,255,255,.04)',border:`1px solid ${isDiy?'rgba(192,132,252,.4)':'rgba(255,255,255,.12)'}`,whiteSpace:'nowrap'}}>
          <input type="checkbox" checked={isDiy} onChange={e=>setData(p=>({...p,[diyKey]:e.target.checked}))}
            style={{accentColor:'#c084fc',width:13,height:13,cursor:'pointer'}}/>
          <span style={{fontSize:10,color:isDiy?'#c084fc':'rgba(255,255,255,.35)',fontWeight:700}}>DIY</span>
        </label>
      )}
      <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={async e=>{
        const f=e.target.files?.[0]; if(!f)return;
        setProcessing(true);
        try{ const b64=await processImageTransparent(f); setData(p=>({...p,[imgKey]:b64})); }
        catch(err){ alert('Erreur : '+err.message); }
        finally{ setProcessing(false); if(fileRef.current)fileRef.current.value=''; }
      }}/>
    </div>
  );
}

// ─── AdminPrixMateriauxScreen ─────────────────
function AdminPrixMateriauxScreen({ onBack }) {
  const [data, setData] = useState(null);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    sb.from('prix_materiaux').select('*').eq('id',1).maybeSingle()
      .then(({data:d}) => {
        if (d) setData(d);
        else setData({pv_prices:[],bat_prices:[],box_prix:500,box_installation:100,box_satellite:200,box_module_deporte:50,box_pinces:100,prise_prix:50,prise_installation:20});
      });
  }, []);

  const save = async () => {
    setSaving(true); setMsg(null);
    const payload = {
      id:1,
      pv_prices: data.pv_prices,
      bat_prices: data.bat_prices,
      box_prix: Number(data.box_prix)||0,
      box_installation: Number(data.box_installation)||0,
      box_satellite: Number(data.box_satellite)||0,
      box_module_deporte: Number(data.box_module_deporte)||0,
      box_pinces: Number(data.box_pinces)||0,
      prise_prix: Number(data.prise_prix)||0,
      prise_installation: Number(data.prise_installation)||0,
      diy_box_prix:           !!data.diy_box_prix,
      diy_box_installation:   !!data.diy_box_installation,
      diy_box_satellite:      !!data.diy_box_satellite,
      diy_box_module_deporte: !!data.diy_box_module_deporte,
      diy_box_pinces:         !!data.diy_box_pinces,
      diy_prise_prix:         !!data.diy_prise_prix,
      diy_prise_installation: !!data.diy_prise_installation,
      img_pv: data.img_pv||null,
      img_bat: data.img_bat||null,
      img_box_prix: data.img_box_prix||null,
      img_box_installation: data.img_box_installation||null,
      img_box_satellite: data.img_box_satellite||null,
      img_box_module: data.img_box_module||null,
      img_box_pinces: data.img_box_pinces||null,
      img_prise: data.img_prise||null,
      img_prise_install: data.img_prise_install||null,
    };
    const {error} = await sb.from('prix_materiaux').upsert(payload, {onConflict:'id'});
    setSaving(false);
    setMsg(error ? {ok:false,text:'Erreur : '+error.message} : {ok:true,text:'Sauvegardé ✓'});
    setTimeout(()=>setMsg(null),3000);
  };

  const updPvRow = (i, col, v) => setData(prev => {
    const arr = prev.pv_prices.map((r,ri) => ri===i ? [col===0?Number(v):r[0], col===1?Number(v):r[1]] : r);
    return {...prev, pv_prices: arr};
  });
  const delPvRow = i => setData(prev => ({...prev, pv_prices: prev.pv_prices.filter((_,ri)=>ri!==i)}));
  const addPvRow = () => setData(prev => ({...prev, pv_prices: [...prev.pv_prices, [0,0]]}));

  const updBatRow = (i, col, v) => setData(prev => {
    const arr = prev.bat_prices.map((r,ri) => ri===i ? [col===0?Number(v):r[0], col===1?Number(v):r[1]] : r);
    return {...prev, bat_prices: arr};
  });
  const delBatRow = i => setData(prev => ({...prev, bat_prices: prev.bat_prices.filter((_,ri)=>ri!==i)}));
  const addBatRow = () => setData(prev => ({...prev, bat_prices: [...prev.bat_prices, [0,0]]}));

  const INP = {background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.2)',borderRadius:6,color:'white',fontSize:13,padding:'4px 8px',width:'100%',fontFamily:'inherit'};
  const TH = {fontSize:11,color:'rgba(255,255,255,.45)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',padding:'4px 6px',textAlign:'left'};
  const TD = {padding:'3px 4px',verticalAlign:'middle'};

  if (!data) return <div className="screen fade-in"><div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div></div>;

  const tableStyle = {width:'100%',borderCollapse:'collapse'};

  return (
    <>
    <div className="screen fade-in">
      <div style={{marginBottom:18,marginTop:4}}>
        <div style={{fontSize:13,color:'rgba(125,217,64,.9)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.8px',marginBottom:6}}>Administration</div>
        <div style={{fontSize:22,fontWeight:900,color:'white'}}>Prix matériel et pose</div>
        <div style={{fontSize:13,color:'rgba(255,255,255,.45)',marginTop:4}}>Tarifs fourniture + pose pour le calcul du ROI</div>
      </div>

      {/* ── PV ── */}
      <div className="card" style={{padding:'16px',marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,color:'#fbbf24',marginBottom:10}}>☀️ Installation PV — fourniture + pose</div>
        <div style={{overflowY:'auto',maxHeight:260}}>
          <table style={tableStyle}>
            <thead><tr>
              <th style={TH}>kWc</th>
              <th style={TH}>Prix € TTC</th>
              <th style={{...TH,width:32}}></th>
            </tr></thead>
            <tbody>
              {data.pv_prices.map((row,i) => (
                <tr key={i}>
                  <td style={TD}><input type="number" style={INP} step="0.5" min="0" value={row[0]} onChange={e=>updPvRow(i,0,e.target.value)}/></td>
                  <td style={TD}><input type="number" style={INP} step="100" min="0" value={row[1]} onChange={e=>updPvRow(i,1,e.target.value)}/></td>
                  <td style={TD}><button onClick={()=>delPvRow(i)} style={{background:'rgba(255,80,80,.15)',border:'1px solid rgba(255,80,80,.3)',borderRadius:5,color:'#ff6b6b',cursor:'pointer',fontSize:13,padding:'2px 7px'}}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <button onClick={addPvRow} style={{marginTop:8,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.2)',borderRadius:7,color:'rgba(255,255,255,.7)',fontSize:12,padding:'5px 12px',cursor:'pointer',fontFamily:'inherit'}}>+ Ajouter une ligne</button>
        <ImageImportBtn imgKey="img_pv" data={data} setData={setData} label="PV"/>
      </div>

      {/* ── Batterie ── */}
      <div className="card" style={{padding:'16px',marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,color:'#38bdf8',marginBottom:10}}>🔋 Batterie chimique — fourniture + pose</div>
        <div style={{overflowY:'auto',maxHeight:220}}>
          <table style={tableStyle}>
            <thead><tr>
              <th style={TH}>kWh</th>
              <th style={TH}>Prix € TTC</th>
              <th style={{...TH,width:32}}></th>
            </tr></thead>
            <tbody>
              {data.bat_prices.map((row,i) => (
                <tr key={i}>
                  <td style={TD}><input type="number" style={INP} step="0.5" min="0" value={row[0]} onChange={e=>updBatRow(i,0,e.target.value)}/></td>
                  <td style={TD}><input type="number" style={INP} step="100" min="0" value={row[1]} onChange={e=>updBatRow(i,1,e.target.value)}/></td>
                  <td style={TD}><button onClick={()=>delBatRow(i)} style={{background:'rgba(255,80,80,.15)',border:'1px solid rgba(255,80,80,.3)',borderRadius:5,color:'#ff6b6b',cursor:'pointer',fontSize:13,padding:'2px 7px'}}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <button onClick={addBatRow} style={{marginTop:8,background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.2)',borderRadius:7,color:'rgba(255,255,255,.7)',fontSize:12,padding:'5px 12px',cursor:'pointer',fontFamily:'inherit'}}>+ Ajouter une ligne</button>
        <ImageImportBtn imgKey="img_bat" data={data} setData={setData} label="Batterie"/>
      </div>

      {/* ── Box Comwatt ── */}
      <div className="card" style={{padding:'16px',marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:14,color:'#7dd940',marginBottom:14}}>📦 Box Comwatt — fourniture et pose</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {[
            ['box_prix',          'img_box_prix',        'diy_box_prix',              'Box Comwatt (fourniture)', 10],
            ['box_installation',  'img_box_installation','diy_box_installation',       'Pose / installation',     10],
            ['box_satellite',     'img_box_satellite',   'diy_box_satellite',          'Box satellite',           10],
            ['box_module_deporte','img_box_module',      'diy_box_module_deporte',     'Module déporté',          10],
            ['box_pinces',        'img_box_pinces',      'diy_box_pinces',             'Pinces forte puissance',  10],
            ['prise_prix',        'img_prise',           'diy_prise_prix',             'Prise connectée',          5],
            ['prise_installation','img_prise_install',   'diy_prise_installation',     'Pose prise connectée',     5],
          ].map(([priceKey, imgKey, diyKey, label, step])=>(
            <BoxItemRow key={priceKey} priceKey={priceKey} imgKey={imgKey} diyKey={diyKey} label={label} step={step} data={data} setData={setData} INP={INP}/>
          ))}
        </div>
        <div style={{marginTop:12,fontSize:11,color:'rgba(255,255,255,.35)'}}>Pour le ROI : investissement box = fourniture + pose</div>
      </div>

      {msg && <div style={{padding:'10px 14px',borderRadius:8,marginBottom:10,background:msg.ok?'rgba(125,217,64,.15)':'rgba(255,80,80,.15)',color:msg.ok?'#7dd940':'#ff6b6b',fontSize:13,fontWeight:600}}>{msg.text}</div>}

      <div style={{height:80}}/>
    </div>
    <StickyFooter row onBack={onBack}>
      <button className="btn btn-yes" style={{flex:1,fontSize:15}} onClick={save} disabled={saving}>
        {saving?'Sauvegarde…':'Sauvegarder les prix'}
      </button>
    </StickyFooter>
    </>
  );
}

// ─── AdminScreen ──────────────────────────────
// ─── AdminDashboard : tableau de bord d'activité (en tête du menu admin) ──────
function AdminDashboard({ onViewLogs, onImpersonate }) {
  const [rows, setRows]         = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showAll, setShowAll]   = useState(false);   // afficher toutes les lignes
  const [collapsed, setCollapsed] = useState(false); // replier tout le bloc

  useEffect(() => {
    sb.rpc('get_admin_dashboard').then(({ data, error }) => {
      if (error) console.error('get_admin_dashboard', error);
      setRows(data || []);
      setLoading(false);
    });
  }, []);

  const fmtClick = (d) => {
    if (!d) return '—';
    const dt = new Date(d), now = new Date();
    const sameDay = dt.toDateString() === now.toDateString();
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    const isYest = dt.toDateString() === yest.toDateString();
    const hm = dt.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    if (sameDay) return `Aujourd'hui ${hm}`;
    if (isYest)  return `Hier ${hm}`;
    return dt.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit' }) + ' ' + hm;
  };

  const visible = showAll ? rows : rows.slice(0, 5);
  const hidden  = Math.max(0, rows.length - 5);

  const linkCell = { cursor:'pointer', color:'#7dd940', fontWeight:700 };

  return (
    <div style={{
      background:'rgba(255,255,255,.04)', border:'1px solid rgba(255,255,255,.1)',
      borderRadius:14, padding:'4px 6px 6px', marginBottom:22, overflow:'hidden'
    }}>
      {/* Titre cliquable → replie/déplie tout le tableau */}
      <button onClick={() => setCollapsed(c => !c)} style={{
        width:'100%', background:'none', border:'none', cursor:'pointer', fontFamily:'inherit',
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'12px 12px', color:'#fff'
      }}>
        <span style={{display:'flex', alignItems:'center', gap:9, fontWeight:800, fontSize:15}}>
          <span style={{fontSize:17}}>📊</span> Tableau de bord — activité
        </span>
        <span style={{display:'flex', alignItems:'center', gap:10}}>
          {!loading && <span style={{fontSize:11, color:'rgba(255,255,255,.4)', fontWeight:600}}>{rows.length} utilisateurs</span>}
          <span style={{fontSize:13, color:'rgba(255,255,255,.5)', transition:'transform .2s', transform:collapsed?'rotate(-90deg)':'none'}}>▾</span>
        </span>
      </button>

      {!collapsed && (loading ? (
        <div style={{textAlign:'center', padding:30}}><div className="spinner" style={{margin:'0 auto'}}/></div>
      ) : rows.length === 0 ? (
        <div style={{textAlign:'center', padding:'22px', color:'rgba(255,255,255,.4)', fontSize:13}}>Aucune donnée</div>
      ) : (
        <div style={{padding:'0 4px 4px'}}>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%', borderCollapse:'collapse', fontSize:13}}>
              <thead>
                <tr style={{textAlign:'left'}}>
                  <th style={{padding:'8px 10px', fontSize:10, letterSpacing:'.5px', textTransform:'uppercase', color:'rgba(255,255,255,.4)', fontWeight:700}}>Utilisateur</th>
                  <th style={{padding:'8px 10px', fontSize:10, letterSpacing:'.5px', textTransform:'uppercase', color:'rgba(255,255,255,.4)', fontWeight:700}}>Dernier clic</th>
                  <th style={{padding:'8px 10px', fontSize:10, letterSpacing:'.5px', textTransform:'uppercase', color:'rgba(255,255,255,.4)', fontWeight:700, textAlign:'right'}}>Clics</th>
                  <th style={{padding:'8px 10px', fontSize:10, letterSpacing:'.5px', textTransform:'uppercase', color:'rgba(255,255,255,.4)', fontWeight:700, textAlign:'right'}}>Tickets</th>
                </tr>
              </thead>
              <tbody>
                {visible.map((u, i) => (
                  <tr key={u.id} style={{background: i%2 ? 'rgba(255,255,255,.02)' : 'transparent'}}>
                    <td style={{padding:'9px 10px', borderTop:'1px solid rgba(255,255,255,.06)'}}>
                      <span style={{display:'flex', alignItems:'center', gap:8}}>
                        <span onClick={() => onViewLogs && onViewLogs(u)} style={linkCell}
                              title="Voir les logs de cet utilisateur">
                          {u.prenom || u.email || '—'}
                        </span>
                        <button onClick={(e) => { e.stopPropagation(); onImpersonate && onImpersonate(u); }}
                                title="Se connecter en tant que cet utilisateur (mode debug)"
                                style={{background:'none', border:'none', cursor:'pointer', padding:'2px 4px', fontSize:14, lineHeight:1, opacity:.55, filter:'grayscale(1)'}}
                                onMouseEnter={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.filter='none';}}
                                onMouseLeave={e=>{e.currentTarget.style.opacity='.55';e.currentTarget.style.filter='grayscale(1)';}}>
                          👁
                        </button>
                      </span>
                    </td>
                    <td style={{padding:'9px 10px', borderTop:'1px solid rgba(255,255,255,.06)', color:'rgba(255,255,255,.7)', whiteSpace:'nowrap'}}>
                      {fmtClick(u.last_click_at)}
                    </td>
                    <td style={{padding:'9px 10px', borderTop:'1px solid rgba(255,255,255,.06)', color:'rgba(255,255,255,.85)', fontWeight:700, textAlign:'right', fontVariantNumeric:'tabular-nums'}}>
                      {u.click_count}
                    </td>
                    <td onClick={() => onViewLogs && onViewLogs(u)} style={{padding:'9px 10px', borderTop:'1px solid rgba(255,255,255,.06)', textAlign:'right', cursor:'pointer'}}
                        title="Voir les logs de cet utilisateur">
                      {u.ticket_count > 0 ? (
                        <span style={{display:'inline-block', minWidth:24, padding:'2px 8px', borderRadius:20, background:'rgba(247,201,72,.15)', color:'#f7c948', fontWeight:800, fontSize:12}}>{u.ticket_count}</span>
                      ) : (
                        <span style={{color:'rgba(255,255,255,.25)'}}>0</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {hidden > 0 && (
            <button onClick={() => setShowAll(s => !s)} style={{
              width:'100%', marginTop:8, background:'rgba(255,255,255,.04)', border:'1px solid rgba(255,255,255,.1)',
              borderRadius:9, padding:'9px', cursor:'pointer', fontFamily:'inherit',
              color:'rgba(255,255,255,.7)', fontWeight:700, fontSize:12, display:'flex', alignItems:'center', justifyContent:'center', gap:6
            }}>
              {showAll
                ? <><span style={{fontSize:16, lineHeight:1}}>−</span> Réduire</>
                : <><span style={{fontSize:16, lineHeight:1}}>+</span> Voir les {hidden} autres</>}
            </button>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── AdminFeedbackScreen : tableau des retours utilisateurs ───────────────────
function AdminFeedbackScreen({ onBack }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all'); // all | up | down
  const [signed, setSigned] = useState({}); // attachment_url -> URL signée temporaire
  const [pdfView, setPdfView] = useState(null); // { url, name } pour la modale PDF in-app

  useEffect(() => {
    sb.rpc('get_all_feedback').then(async ({ data, error }) => {
      if (error) console.error('get_all_feedback', error);
      setRows(data || []);
      setLoading(false);
      // Bucket privé : on génère des URLs signées (expirent dans 1 h) pour chaque pièce jointe
      const withAtt = (data || []).filter(r => r.attachment_url);
      if (!withAtt.length) return;
      const pathOf = (u) => { const p = u.split('/feedback-attachments/')[1]; return p ? p.split('?')[0] : null; };
      const paths = withAtt.map(r => pathOf(r.attachment_url)).filter(Boolean);
      const { data: sg, error: sgErr } = await sb.storage.from('feedback-attachments').createSignedUrls(paths, 3600);
      if (sgErr) { console.error('signed urls', sgErr); return; }
      const map = {};
      (sg || []).forEach(s => { if (s.signedUrl && s.path) map[s.path] = s.signedUrl; });
      // Reclé par attachment_url d'origine pour le rendu
      const byUrl = {};
      withAtt.forEach(r => { const p = pathOf(r.attachment_url); if (p && map[p]) byUrl[r.attachment_url] = map[p]; });
      setSigned(byUrl);
    });
  }, []);

  const fmtDate = (d) => d ? new Date(d).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
  const userName = (r) => {
    const n = `${r.prenom||''} ${r.nom||''}`.trim();
    return n || r.pseudo || r.email || '—';
  };

  const shown = rows.filter(r => filter === 'all' || r.sentiment === filter);
  const nbUp = rows.filter(r => r.sentiment === 'up').length;
  const nbDown = rows.filter(r => r.sentiment === 'down').length;

  const FilterBtn = ({ val, label }) => (
    <button onClick={()=>setFilter(val)} style={{
      background: filter===val ? 'rgba(125,217,64,.15)' : 'rgba(255,255,255,.06)',
      border: filter===val ? '1px solid rgba(125,217,64,.4)' : '1px solid rgba(255,255,255,.14)',
      borderRadius:9, color: filter===val ? '#7dd940' : 'rgba(255,255,255,.65)',
      fontSize:12, fontWeight:700, padding:'6px 12px', cursor:'pointer', fontFamily:'inherit'
    }}>{label}</button>
  );

  const cols = ['', 'Date & heure', 'Utilisateur', 'Page', 'Commentaire', 'Pièce jointe'];

  return (
    <>
    <div className="screen fade-in" style={{padding:'0 0 80px', maxWidth:'100%', width:'100%'}}>
      <div className="auth-header">
        <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
        <h1 className="welcome-title">Retours<br/><span className="accent">utilisateurs</span></h1>
      </div>

      <div style={{display:'flex',gap:8,padding:'0 16px 14px',flexWrap:'wrap'}}>
        <FilterBtn val="all" label={`Tous (${rows.length})`}/>
        <FilterBtn val="up" label={`👍 Positifs (${nbUp})`}/>
        <FilterBtn val="down" label={`👎 Négatifs (${nbDown})`}/>
      </div>

      {loading ? <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div> : (
        shown.length === 0 ? (
          <div style={{textAlign:'center',color:'rgba(255,255,255,.4)',padding:40,fontSize:14}}>Aucun retour pour le moment.</div>
        ) : (
        <div style={{overflowX:'auto', padding:'0 16px'}}>
          <table style={{width:'100%', minWidth:900, borderCollapse:'collapse', fontSize:13}}>
            <thead>
              <tr>
                {cols.map(c => (
                  <th key={c} style={{textAlign:'left', padding:'8px 10px', color:'rgba(255,255,255,.4)', fontWeight:600, borderBottom:'1px solid rgba(255,255,255,.08)', whiteSpace:'nowrap'}}>{c}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {shown.map(r => (
                <tr key={r.id} style={{borderBottom:'1px solid rgba(255,255,255,.06)', verticalAlign:'top'}}>
                  <td style={{padding:'12px 8px', width:34}}>
                    <span title={r.sentiment==='up'?'Positif':'Négatif'} style={{display:'inline-flex',width:26,height:26,borderRadius:7,alignItems:'center',justifyContent:'center',background:r.sentiment==='up'?'rgba(125,217,64,.14)':'rgba(255,138,106,.14)',border:`1px solid ${r.sentiment==='up'?'rgba(125,217,64,.4)':'rgba(255,138,106,.4)'}`}}>
                      <ThumbIcon up={r.sentiment==='up'} size={15} color={r.sentiment==='up'?'#7dd940':'#ff8a6a'}/>
                    </span>
                  </td>
                  <td style={{padding:'12px 10px', whiteSpace:'nowrap', color:'rgba(255,255,255,.6)'}}>{fmtDate(r.created_at)}</td>
                  <td style={{padding:'12px 10px', whiteSpace:'nowrap'}}>
                    <div style={{fontWeight:600, color:'#fff'}}>{userName(r)}</div>
                    {r.email && <div style={{color:'rgba(125,217,64,.7)', fontSize:11}}>{r.email}</div>}
                  </td>
                  <td style={{padding:'12px 10px', color:'rgba(255,255,255,.8)', minWidth:150, maxWidth:260}}>
                    <div style={{whiteSpace:'nowrap'}}>{r.page_label || r.screen || '—'}</div>
                    {r.context_detail && <div style={{marginTop:3,fontSize:11.5,color:'rgba(255,179,64,.85)',lineHeight:1.4}}>{r.context_detail}</div>}

                  <td style={{padding:'12px 10px', color:'rgba(255,255,255,.85)', lineHeight:1.5, minWidth:240, maxWidth:420}}>{r.comment || <span style={{color:'rgba(255,255,255,.3)',fontStyle:'italic'}}>(sans commentaire)</span>}</td>
                  <td style={{padding:'12px 10px', whiteSpace:'nowrap'}}>
                    {r.attachment_url ? (() => {
                      const su = signed[r.attachment_url];
                      const isPdf = /\.pdf($|\?)/i.test(r.attachment_url);
                      if (!su) return <span style={{color:'rgba(255,255,255,.3)',fontSize:11}}>chargement…</span>;
                      return isPdf ? (
                        <button onClick={()=>setPdfView({ url: su, name: 'Pièce jointe PDF' })} style={{display:'inline-flex',alignItems:'center',gap:5,background:'rgba(125,217,64,.12)',border:'1px solid rgba(125,217,64,.35)',borderRadius:8,color:'#7dd940',fontSize:12,fontWeight:700,padding:'7px 11px',cursor:'pointer',fontFamily:'inherit'}}>📄 Voir le PDF</button>
                      ) : (
                        <ImageWithLightbox src={su} style={{width:46,height:46,objectFit:'cover',borderRadius:8,border:'1px solid rgba(255,255,255,.15)',display:'block'}}/>
                      );
                    })() : <span style={{color:'rgba(255,255,255,.25)'}}>—</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        )
      )}
    </div>
    {pdfView && (
      <div onClick={()=>setPdfView(null)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.82)',backdropFilter:'blur(3px)',WebkitBackdropFilter:'blur(3px)',zIndex:10000,display:'flex',flexDirection:'column',padding:'14px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexShrink:0}}>
          <div style={{flex:1,minWidth:0,color:'#fff',fontWeight:700,fontSize:14,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📄 {pdfView.name}</div>
          <a href={pdfView.url} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{flexShrink:0,background:'rgba(125,217,64,.14)',border:'1px solid rgba(125,217,64,.4)',borderRadius:9,color:'#7dd940',fontSize:12,fontWeight:700,padding:'8px 13px',textDecoration:'none'}}>Ouvrir / Télécharger</a>
          <button onClick={()=>setPdfView(null)} style={{flexShrink:0,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.25)',borderRadius:9,color:'#fff',fontSize:16,fontWeight:700,width:38,height:38,cursor:'pointer',fontFamily:'inherit',lineHeight:1}}>✕</button>

    <StickyFooter onBack={onBack}/>

}

// ─── AdminProofreadScreen : correction orthographique du module Comprendre ─────
function AdminProofreadScreen({ onBack }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [corrections, setCorrections] = useState(null); // null = pas encore lancé
  const [scanned, setScanned] = useState(0);
  const [sel, setSel] = useState({});        // index -> bool
  const [applying, setApplying] = useState(false);
  const [doneMsg, setDoneMsg] = useState(null);
  const [lastRun, setLastRun] = useState(null); // { usage, cost }

  const TBL_LABEL = { learn_groups:'Groupe', learn_subjects:'Sujet', learn_questions:'Question', learn_choices:'Réponse' };
  const FLD_LABEL = { title:'titre', description:'description', content:'contenu', question:'question', text:'texte' };

  const run = async () => {
    setLoading(true); setError(null); setDoneMsg(null); setCorrections(null);
    try {
      const { data, error } = await sb.functions.invoke('proofread', { body: {} });
      if (error) {
        // Tenter de lire le détail renvoyé par la fonction
        let detail = error.message || 'Erreur inconnue';
        try { const ctx = await error.context?.json?.(); if (ctx?.message) detail = ctx.message; else if (ctx?.error) detail = ctx.error; } catch(_){}
        throw new Error(detail);
      }
      const cs = data?.corrections || [];
      setCorrections(cs);
      setScanned(data?.scanned || 0);
      setLastRun(data?.cost ? { usage: data.usage, cost: data.cost } : null);
      const s = {}; cs.forEach((_, i) => { s[i] = true; }); // tout sélectionné par défaut
      setSel(s);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(false);
    }
  };

  // Diff léger : isole la zone modifiée par préfixe/suffixe commun
  const diffParts = (before, after) => {
    let p = 0; const lb = before.length, la = after.length, max = Math.min(lb, la);
    while (p < max && before[p] === after[p]) p++;
    let s = 0;
    while (s < (max - p) && before[lb-1-s] === after[la-1-s]) s++;
    return {
      pre: before.slice(0, p),
      midB: before.slice(p, lb - s),
      midA: after.slice(p, la - s),
      suf: before.slice(lb - s),
    };
  };

  const apply = async () => {
    if (!corrections) return;
    const toApply = corrections.map((c, i) => ({ c, i })).filter(x => sel[x.i]);
    if (!toApply.length) { setDoneMsg('Aucune correction sélectionnée.'); return; }
    setApplying(true); setError(null); setDoneMsg(null);
    let ok = 0; const fails = [];
    for (const { c } of toApply) {
      const { error } = await sb.from(c.table).update({ [c.field]: c.after }).eq('id', c.id);
      if (error) fails.push(`${c.table}/${c.field}: ${error.message}`); else ok++;
    }
    // Retirer les corrections appliquées (les non sélectionnées + les échecs restent)
    const remaining = corrections.filter((_, i) => !sel[i]);
    setCorrections(remaining);
    setSel({});
    setApplying(false);
    setDoneMsg(`${ok} correction(s) appliquée(s)${fails.length ? ` — ${fails.length} échec(s) : ${fails.join(' ; ')}` : ''}.`);
  };

  const nbSel = corrections ? corrections.filter((_, i) => sel[i]).length : 0;
  const allSel = corrections && corrections.length > 0 && nbSel === corrections.length;
  const toggleAll = () => {
    const s = {}; if (!allSel) corrections.forEach((_, i) => { s[i] = true; }); setSel(s);
  };

  return (
    <>
    <div className="screen fade-in" style={{padding:'0 0 90px', maxWidth:'100%', width:'100%'}}>
      <div className="auth-header">
        <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
        <h1 className="welcome-title">Correction<br/><span className="accent">orthographique</span></h1>
      </div>

      <div style={{padding:'0 16px'}}>
        <p style={{color:'rgba(255,255,255,.6)', fontSize:13.5, lineHeight:1.55, margin:'0 0 16px'}}>
          Analyse tout le contenu du module Comprendre (titres, textes, questions, réponses) et propose des
          corrections d'orthographe et de grammaire. Rien n'est modifié tant que vous n'avez pas validé.
        </p>

        <button onClick={run} disabled={loading || applying} style={{
          width:'100%', background: loading ? 'rgba(255,255,255,.1)' : 'linear-gradient(135deg,#7dd940,#5cb82e)',
          border:'none', borderRadius:12, color: loading ? 'rgba(255,255,255,.6)' : '#0a1f0a',
          fontSize:15, fontWeight:800, padding:'14px', cursor: loading||applying ? 'default':'pointer',
          fontFamily:'inherit', display:'flex', alignItems:'center', justifyContent:'center', gap:9
        }}>
          {loading ? (<><span className="spinner" style={{width:18,height:18}}/> Analyse en cours…</>) : '🔍 Lancer la correction'}
        </button>

        {loading && <div style={{textAlign:'center', color:'rgba(255,255,255,.45)', fontSize:12, marginTop:10}}>Cela peut prendre 20 à 60 secondes selon la quantité de texte.</div>}

        {lastRun && !loading && (
          <div style={{marginTop:12, display:'flex', alignItems:'center', justifyContent:'center', gap:6, flexWrap:'wrap', color:'rgba(255,255,255,.5)', fontSize:12}}>
            <span>Coût de ce run :</span>
            <span style={{color:'#ffb340', fontWeight:700}}>{lastRun.cost.eur.toFixed(4)} €</span>
            <span>·</span>
            <span>{(lastRun.usage.input_tokens + lastRun.usage.output_tokens).toLocaleString('fr-FR')} tokens ({lastRun.usage.input_tokens.toLocaleString('fr-FR')} entrée / {lastRun.usage.output_tokens.toLocaleString('fr-FR')} sortie)</span>
          </div>
        )}

        {error && (
          <div style={{marginTop:16, background:'rgba(255,138,106,.12)', border:'1px solid rgba(255,138,106,.4)', borderRadius:10, padding:'12px 14px', color:'#ff8a6a', fontSize:13, lineHeight:1.5}}>
            ⚠️ {error}
          </div>
        )}

        {doneMsg && (
          <div style={{marginTop:16, background:'rgba(125,217,64,.12)', border:'1px solid rgba(125,217,64,.4)', borderRadius:10, padding:'12px 14px', color:'#7dd940', fontSize:13, lineHeight:1.5}}>
            ✅ {doneMsg}
          </div>
        )}

        {corrections && !loading && (
          corrections.length === 0 ? (
            <div style={{marginTop:18, textAlign:'center', color:'rgba(255,255,255,.5)', fontSize:14, padding:'24px 0'}}>
              {doneMsg ? '' : `Aucune faute détectée. ${scanned} champ(s) analysé(s). 🎉`}
            </div>
          ) : (
            <>
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', margin:'20px 0 10px', flexWrap:'wrap', gap:8}}>
                <div style={{color:'#fff', fontWeight:700, fontSize:14}}>{corrections.length} correction(s) proposée(s) <span style={{color:'rgba(255,255,255,.4)', fontWeight:500}}>· {scanned} champs analysés</span></div>
                <button onClick={toggleAll} style={{background:'rgba(255,255,255,.06)', border:'1px solid rgba(255,255,255,.16)', borderRadius:8, color:'rgba(255,255,255,.7)', fontSize:12, fontWeight:700, padding:'6px 12px', cursor:'pointer', fontFamily:'inherit'}}>
                  {allSel ? 'Tout désélectionner' : 'Tout sélectionner'}
                </button>
              </div>

              <div style={{display:'flex', flexDirection:'column', gap:10}}>
                {corrections.map((c, i) => {
                  const d = diffParts(c.before, c.after);
                  return (
                    <div key={i} onClick={()=>setSel(s=>({...s, [i]: !s[i]}))} style={{
                      background: sel[i] ? 'rgba(125,217,64,.07)' : 'rgba(255,255,255,.03)',
                      border: `1px solid ${sel[i] ? 'rgba(125,217,64,.35)' : 'rgba(255,255,255,.1)'}`,
                      borderRadius:12, padding:'12px 14px', cursor:'pointer', transition:'all .12s'
                    }}>
                      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:9}}>
                        <span style={{width:20, height:20, borderRadius:6, flexShrink:0, display:'inline-flex', alignItems:'center', justifyContent:'center',
                          background: sel[i] ? '#7dd940' : 'transparent', border: `1.5px solid ${sel[i] ? '#7dd940' : 'rgba(255,255,255,.3)'}`,
                          color:'#0a1f0a', fontSize:13, fontWeight:900}}>{sel[i] ? '✓' : ''}</span>
                        <span style={{fontSize:11, fontWeight:700, color:'#ffb340', textTransform:'uppercase', letterSpacing:.4}}>
                          {TBL_LABEL[c.table]||c.table} · {FLD_LABEL[c.field]||c.field}
                        </span>
                        {c.reason && <span style={{fontSize:11, color:'rgba(255,255,255,.45)'}}>· {c.reason}</span>}
                      </div>
                      <div style={{fontSize:13, lineHeight:1.55, color:'rgba(255,255,255,.85)', wordBreak:'break-word'}}>
                        <div style={{marginBottom:5}}>
                          <span style={{color:'rgba(255,255,255,.35)'}}>{d.pre}</span>
                          <span style={{background:'rgba(255,138,106,.22)', color:'#ff8a6a', textDecoration:'line-through', borderRadius:3, padding:'0 2px'}}>{d.midB}</span>
                          <span style={{color:'rgba(255,255,255,.35)'}}>{d.suf}</span>
                        </div>
                        <div>
                          <span style={{color:'rgba(255,255,255,.55)'}}>{d.pre}</span>
                          <span style={{background:'rgba(125,217,64,.22)', color:'#7dd940', fontWeight:700, borderRadius:3, padding:'0 2px'}}>{d.midA}</span>
                          <span style={{color:'rgba(255,255,255,.55)'}}>{d.suf}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <button onClick={apply} disabled={applying || nbSel===0} style={{
                width:'100%', marginTop:18, background: nbSel===0 ? 'rgba(255,255,255,.08)' : 'linear-gradient(135deg,#7dd940,#5cb82e)',
                border:'none', borderRadius:12, color: nbSel===0 ? 'rgba(255,255,255,.4)' : '#0a1f0a',
                fontSize:15, fontWeight:800, padding:'14px', cursor: applying||nbSel===0 ? 'default':'pointer',
                fontFamily:'inherit', display:'flex', alignItems:'center', justifyContent:'center', gap:9
              }}>
                {applying ? (<><span className="spinner" style={{width:18,height:18}}/> Application…</>) : `✓ Appliquer la sélection (${nbSel})`}
              </button>
            </>
          )
        )}
      </div>
    </div>
    <StickyFooter onBack={onBack}/>
    </>
  );
}

// ─── AdminAIPromptsScreen : éditer les prompts qui cadrent chaque service IA ───
function AdminAIPromptsScreen({ onBack }) {
  const [rows, setRows] = useState(null);       // [{feature,label,system_prompt,updated_at,updated_by}]
  const [drafts, setDrafts] = useState({});     // {feature: texte en cours d'édition}
  const [savingFeat, setSavingFeat] = useState(null);
  const [msg, setMsg] = useState(null);         // {feature, type:'ok'|'err', text}

  const load = () => {
    sb.rpc('get_ai_prompts').then(({ data, error }) => {
      if (error) { console.error('get_ai_prompts', error); setRows([]); return; }
      setRows(data || []);
      const d = {}; (data || []).forEach(r => { d[r.feature] = r.system_prompt; });
      setDrafts(d);
    });
  };
  useEffect(load, []);

  const save = async (feature) => {
    setSavingFeat(feature); setMsg(null);
    const { error } = await sb.rpc('set_ai_prompt', { p_feature: feature, p_prompt: drafts[feature] });
    setSavingFeat(null);
    if (error) { setMsg({ feature, type:'err', text: 'Échec : ' + (error.message || 'erreur') }); return; }
    setMsg({ feature, type:'ok', text: 'Prompt enregistré. Il sera utilisé au prochain appel.' });
    setRows(prev => prev.map(r => r.feature===feature ? { ...r, system_prompt: drafts[feature], updated_at: new Date().toISOString() } : r));
  };

  const fmtDate = (d) => d ? new Date(d).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';

  return (
    <>
    <div className="screen fade-in" style={{padding:'0 0 90px', maxWidth:'100%', width:'100%'}}>
      <div className="auth-header">
        <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
        <h1 className="welcome-title">Prompts<br/><span className="accent">IA</span></h1>
      </div>

      <div style={{padding:'0 16px'}}>
        <p style={{color:'rgba(255,255,255,.55)', fontSize:13, lineHeight:1.55, margin:'0 0 16px'}}>
          Chaque service IA est cadré par un prompt système, lu en base juste avant l'appel.
          Modifie-le ici : la prise en compte est immédiate, sans redéploiement.
        </p>

        {rows === null ? (
          <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div>
        ) : rows.length === 0 ? (
          <div style={{textAlign:'center', color:'rgba(255,255,255,.4)', fontSize:14, padding:'24px 0'}}>Aucun service IA configuré.</div>
        ) : rows.map(r => {
          const dirty = drafts[r.feature] !== r.system_prompt;
          return (
            <div key={r.feature} className="card" style={{padding:14, marginBottom:14}}>
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:8, marginBottom:8}}>
                <div style={{fontWeight:800, fontSize:14, color:'#fff'}}>{r.label}</div>
                <code style={{fontSize:11, color:'rgba(255,255,255,.4)'}}>{r.feature}</code>
              </div>
              <textarea
                value={drafts[r.feature] ?? ''}
                onChange={e => setDrafts(d => ({ ...d, [r.feature]: e.target.value }))}
                spellCheck={false}
                style={{width:'100%', minHeight:170, resize:'vertical', boxSizing:'border-box',
                  background:'rgba(0,0,0,.25)', border:'1px solid rgba(255,255,255,.14)', borderRadius:10,
                  color:'rgba(255,255,255,.9)', fontSize:13, lineHeight:1.5, padding:'10px 12px',
                  fontFamily:'inherit'}}
              />
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, marginTop:8, flexWrap:'wrap'}}>
                <span style={{fontSize:11.5, color:'rgba(255,255,255,.4)'}}>
                  Modifié le {fmtDate(r.updated_at)}{r.updated_by ? ' · '+r.updated_by : ''}
                </span>
                <div style={{display:'flex', gap:8}}>
                  {dirty && (
                    <button onClick={() => setDrafts(d => ({ ...d, [r.feature]: r.system_prompt }))}
                      style={{background:'rgba(255,255,255,.06)', border:'1px solid rgba(255,255,255,.16)', borderRadius:9, color:'rgba(255,255,255,.65)', fontSize:12.5, fontWeight:700, padding:'8px 14px', cursor:'pointer', fontFamily:'inherit'}}>
                      Annuler
                    </button>
                  )}
                  <button onClick={() => save(r.feature)} disabled={!dirty || savingFeat===r.feature}
                    style={{background: dirty ? '#ffb340' : 'rgba(255,255,255,.1)', border:'none', borderRadius:9,
                      color: dirty ? '#1a1208' : 'rgba(255,255,255,.4)', fontSize:12.5, fontWeight:800,
                      padding:'8px 16px', cursor: dirty ? 'pointer' : 'default', fontFamily:'inherit', opacity: savingFeat===r.feature?.6:1}}>
                    {savingFeat===r.feature ? 'Enregistrement…' : 'Enregistrer'}
                  </button>
                </div>
              </div>
              {msg && msg.feature===r.feature && (
                <div style={{marginTop:8, fontSize:12.5, fontWeight:600, color: msg.type==='ok' ? '#5fd38a' : '#ff8080'}}>
                  {msg.text}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
    <StickyFooter onBack={onBack}/>
    </>
  );
}

function AdminFiltresScreen({ onBack }) {
  const [config, setConfig] = useState(null);

  useEffect(() => {
    sb.from('filtres_config').select('*').then(({ data }) => {
      const map = {};
      (data || []).forEach(r => { map[r.filtre_key] = r.actif; });
      // defaults true si absent
      FILTRES_DEF.forEach(f => { if (!(f.key in map)) map[f.key] = true; });
      setConfig(map);
    });
  }, []);

  const toggle = async (key) => {
    const newVal = !config[key];
    setConfig(c => ({ ...c, [key]: newVal }));
    setSaving(key);
    await sb.from('filtres_config').update({ actif: newVal }).eq('filtre_key', key);
    setSaving(null);
  };

  return (
    <>
    <div className="screen fade-in">

        <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>

// ─── AdminTariffEditScreen ────────────────────
function AdminTariffEditScreen({ tariff, onSave, onDelete, onBack }) {
  const isNew = !tariff?.id;

  const getInitType = (t) => {
    if (!t) return 'fixe';
    if (t.type_tarif === 'multi') return 'multi';
    if (t.tarif_dynamique || t.type_tarif === 'dynamique') return 'dynamique';
    if (t.prix_hc != null && parseFloat(t.prix_hc) !== parseFloat(t.prix_hp)) return 'hchp';
    return 'fixe';
  };

  const [f, setF] = useState({
    nom:                       tariff?.nom || '',
    abo_annuel:                tariff?.abo_annuel ?? '',
    type_tarif:                getInitType(tariff),
    prix_hp:                   tariff?.prix_hp ?? '',
    prix_hc:                   tariff?.prix_hc ?? '',
    turpe_fixe:                tariff?.turpe_fixe ?? '',
    cta_fixe:                  tariff?.cta_fixe ?? '',
    marge_fournisseur_ceur_kwh:tariff?.marge_fournisseur_ceur_kwh ?? '',
  });
  const [periodes, setPeriodes] = useState(() => tariff?.periodes || []);
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState(null);

  const upd = useCallback((k, v) => setF(p => ({...p, [k]: v})), []);
  const n   = (v) => v === '' || v === null || v === undefined ? null : parseFloat(v);

  const addPeriode = () => setPeriodes(p => [...p, {date_debut:'',date_fin:'',heure_debut:'',heure_fin:'',prix:''}]);
  const delPeriode = (i) => setPeriodes(p => p.filter((_,idx)=>idx!==i));
  const updPeriode = (i,k,v) => setPeriodes(p => p.map((row,idx)=>idx===i?{...row,[k]:v}:row));

  // Compteur d'heures couvertes
  const { covered, remaining } = useMemo(() => {
    const covSet = new Set();
    for (const p of periodes) {
      if (!p.date_debut||!p.date_fin||p.heure_debut===''||p.heure_fin===''||p.prix==='') continue;
      const parts1=p.date_debut.split('/'), parts2=p.date_fin.split('/');
      if(parts1.length<2||parts2.length<2) continue;
      const dj=parseInt(parts1[0]),dm=parseInt(parts1[1]),fj=parseInt(parts2[0]),fm=parseInt(parts2[1]);
      if(!dj||!dm||!fj||!fm) continue;
      const hD=parseInt(p.heure_debut),hF=parseInt(p.heure_fin);
      if(isNaN(hD)||isNaN(hF)) continue;
      const overnight=hF<=hD;
      for(let m=1;m<=12;m++) for(let d=1;d<=PROF_DAYS[m-1];d++){
        const cur=m*100+d,s=dm*100+dj,e=fm*100+fj;
        if(!(s<=e?(cur>=s&&cur<=e):(cur>=s||cur<=e))) continue;
        for(let h=0;h<24;h++) if(overnight?(h>=hD||h<hF):(h>=hD&&h<hF)) covSet.add(profIdx(m,d,h));
      }
    }
    const totalH=PROF_DAYS.reduce((s,d)=>s+d,0)*24;
    return { covered:covSet.size, remaining:totalH-covSet.size, totalH };
  }, [periodes]);

  const handleSave = async () => {
    if (!f.nom.trim()) { setError('Le nom est obligatoire.'); return; }
    if (f.type_tarif === 'multi' && remaining > 0) { setError(`${remaining} h non couvertes — toute l'année doit être définie.`); return; }
    setLoading(true); setError(null);
    const isDyn = f.type_tarif === 'dynamique';
    const payload = {
      nom:              f.nom.trim(),
      abo_annuel:       n(f.abo_annuel),
      type_tarif:       f.type_tarif,
      tarif_dynamique:  isDyn,
      prix_hp:          (f.type_tarif==='fixe'||f.type_tarif==='hchp') ? n(f.prix_hp) : null,
      prix_hc:          f.type_tarif==='hchp' ? n(f.prix_hc) : null,
      periodes:         f.type_tarif==='multi' ? periodes : null,
      turpe_fixe:       isDyn ? n(f.turpe_fixe) : null,
      cta_fixe:         isDyn ? n(f.cta_fixe)   : null,
      marge_fournisseur_ceur_kwh: isDyn ? n(f.marge_fournisseur_ceur_kwh) : null,
      bat_virtuelle: false, surcout_abonnement: null, acheminement_hp: null, acheminement_hc: null,
      last_modified: new Date().toISOString(),
    };
    let err;
    if (isNew) ({ error: err } = await sb.from('tarifs_electricite').insert(payload));
    else       ({ error: err } = await sb.from('tarifs_electricite').update(payload).eq('id', tariff.id));
    setLoading(false);
    if (err) { setError(err.message); return; }
    onSave();
  };

  const handleDelete = async () => {
    if (!confirm(`Supprimer "${tariff.nom}" ?`)) return;
    await sb.from('tarifs_electricite').delete().eq('id', tariff.id);
    onDelete();
  };

  const iS = {background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.12)',borderRadius:8,color:'white',padding:'5px 7px',fontSize:12,width:'100%',fontFamily:'inherit',boxSizing:'border-box'};

  return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
          <h1 className="welcome-title">{isNew ? 'Nouveau' : 'Modifier'}<br/><span className="accent">tarif</span></h1>
        </div>
        <div className="form-card">
          <TariffField label="Nom du tarif *" fkey="nom" value={f.nom} onChange={upd} placeholder="EDF TRV HC HP"/>
          <TariffField label="Abonnement annuel (€/an)" fkey="abo_annuel" type="number" value={String(f.abo_annuel)} onChange={upd} placeholder="237.72"/>

          {/* Type de tarif */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:'rgba(255,255,255,.45)',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px'}}>Type de tarif</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {[['fixe','Fixe'],['hchp','HC / HP'],['multi','Multi-périodes'],['dynamique','Dynamique']].map(([v,lbl])=>(
                <label key={v} style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',fontSize:13,color:f.type_tarif===v?'#7dd940':'rgba(255,255,255,.7)',padding:'5px 10px',borderRadius:8,background:f.type_tarif===v?'rgba(125,217,64,.12)':'rgba(255,255,255,.05)',border:`1px solid ${f.type_tarif===v?'rgba(125,217,64,.4)':'rgba(255,255,255,.1)'}`,transition:'all .15s'}}>
                  <input type="radio" name="type_tarif" value={v} checked={f.type_tarif===v} onChange={()=>upd('type_tarif',v)} style={{accentColor:'#7dd940',margin:0}}/>
                  {lbl}
                </label>
              ))}
            </div>
          </div>

          {f.type_tarif==='fixe' && (
            <TariffField label="Prix (€/kWh TTC)" fkey="prix_hp" type="number" value={String(f.prix_hp)} onChange={upd} placeholder="0.2081"/>
          )}
          {f.type_tarif==='hchp' && (
            <div className="inp-row">
              <TariffField label="Prix HP (€/kWh TTC)" fkey="prix_hp" type="number" value={String(f.prix_hp)} onChange={upd} placeholder="0.2081"/>
              <TariffField label="Prix HC (€/kWh TTC)" fkey="prix_hc" type="number" value={String(f.prix_hc)} onChange={upd} placeholder="0.1635"/>
            </div>
          )}
          {f.type_tarif==='dynamique' && (<>
            <div className="inp-row">
              <TariffField label="TURPE fixe (€/an)" fkey="turpe_fixe" type="number" value={String(f.turpe_fixe)} onChange={upd} placeholder="129.79"/>
              <TariffField label="CTA fixe (€/an)" fkey="cta_fixe" type="number" value={String(f.cta_fixe)} onChange={upd} placeholder="19.47"/>
            </div>
            <TariffField label="Marge fournisseur (c€/kWh)" fkey="marge_fournisseur_ceur_kwh" type="number" value={String(f.marge_fournisseur_ceur_kwh)} onChange={upd} placeholder="ex: 1.5"/>
          </>)}

          {f.type_tarif==='multi' && (
            <div style={{marginTop:4}}>
              <div style={{fontSize:11,color:'rgba(255,255,255,.4)',marginBottom:8}}>
                Dates : JJ/MM · Heures : 0–23 · Le total doit atteindre 8 784 h/an (année bissextile)
              </div>
              {/* En-têtes */}
              <div style={{display:'grid',gridTemplateColumns:'68px 68px 52px 52px 1fr 30px',gap:4,marginBottom:4}}>
                {['Deb. date','Fin date','H.deb.','H.fin','€/kWh TTC',''].map((h,i)=>(
                  <div key={i} style={{fontSize:10,color:'rgba(255,255,255,.3)',textAlign:'center'}}>{h}</div>
                ))}
              </div>
              {/* Lignes */}
              {periodes.map((p,i)=>(
                <div key={i} style={{display:'grid',gridTemplateColumns:'68px 68px 52px 52px 1fr 30px',gap:4,marginBottom:5,alignItems:'center'}}>
                  <input style={iS} placeholder="01/04" value={p.date_debut}   onChange={e=>updPeriode(i,'date_debut',  e.target.value)}/>
                  <input style={iS} placeholder="30/10" value={p.date_fin}     onChange={e=>updPeriode(i,'date_fin',    e.target.value)}/>
                  <input style={iS} type="number" min="0" max="23" placeholder="0"  value={p.heure_debut} onChange={e=>updPeriode(i,'heure_debut',e.target.value)}/>
                  <input style={iS} type="number" min="0" max="24" placeholder="24" value={p.heure_fin}   onChange={e=>updPeriode(i,'heure_fin',  e.target.value)}/>
                  <input style={iS} type="number" step="0.0001" placeholder="0.0987" value={p.prix}       onChange={e=>updPeriode(i,'prix',        e.target.value)}/>
                  <button onClick={()=>delPeriode(i)} style={{background:'rgba(248,113,113,.15)',border:'1px solid rgba(248,113,113,.3)',borderRadius:7,color:'#f87171',cursor:'pointer',padding:'5px 0',fontSize:15,lineHeight:1,width:'100%'}}>−</button>
                </div>
              ))}
              <button onClick={addPeriode} style={{fontSize:12,background:'rgba(125,217,64,.08)',border:'1px solid rgba(125,217,64,.25)',borderRadius:8,color:'#7dd940',cursor:'pointer',padding:'6px 14px',fontFamily:'inherit',marginTop:4}}>
                + Ajouter une ligne
              </button>
              {/* Compteur */}
              <div style={{marginTop:10,padding:'8px 12px',borderRadius:8,background:remaining===0?'rgba(74,222,128,.08)':'rgba(255,255,255,.04)',border:`1px solid ${remaining===0?'rgba(74,222,128,.3)':'rgba(255,255,255,.08)'}`}}>
                <span style={{fontSize:13,color:remaining===0?'#4ade80':'rgba(255,255,255,.55)',fontWeight:600}}>
                  {remaining===0?'✓ 8 784 h couvertes':`${covered} h couvertes · ${remaining} h restantes`}
                </span>
              </div>
            </div>
          )}

          {error && <div className="auth-error">{error}</div>}
        </div>
        {!isNew && (
          <button className="btn-link" style={{color:'rgba(255,100,100,.55)',marginTop:8}} onClick={handleDelete}>
            Supprimer ce tarif
          </button>
        )}
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handleSave} disabled={loading||(f.type_tarif==='multi'&&remaining>0)}>
          {loading?'Enregistrement…':'✓ Enregistrer'}
        </button>
        <button className="btn btn-sec" onClick={onBack}>Annuler</button>
      </StickyFooter>
    </>
  );
}

  const [sites,   setSites]   = useState([]);

function AdminAccEditScreen({ site, onSave, onDelete, onBack }) {
  const isNew = !site?.id;
  const [f, setF] = useState({
    nom:           site?.nom           ?? '',
    adresse:       site?.adresse       ?? '',
    code_postal:   site?.code_postal   ?? '',
    puissance_pv:  site?.puissance_pv  ?? '',
    prix_vente_ttc:site?.prix_vente_ttc ?? 0.11,
    latitude:      site?.latitude      ?? '',
    longitude:     site?.longitude     ?? '',
  });
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);
  const upd = (k, v) => setF(p=>({...p,[k]:v}));
  const n = v => v===''||v==null ? null : parseFloat(v);

  const handleSave = async () => {
    if (!f.code_postal.trim()) { setError('Le code postal est obligatoire.'); return; }
    setLoading(true); setError(null);
    const payload = {
      nom:           f.nom.trim() || null,
      adresse:       f.adresse.trim() || null,
      code_postal:   f.code_postal.trim(),
      puissance_pv:  n(f.puissance_pv),
      prix_vente_ttc:n(f.prix_vente_ttc) ?? 0.11,
      latitude:      n(f.latitude),
      longitude:     n(f.longitude),
    };
    let err;
    if (isNew) ({ error: err } = await sb.from('sites_acc').insert(payload));
    else ({ error: err } = await sb.from('sites_acc').update(payload).eq('id', site.id));
    setLoading(false);
    if (err) { setError(err.message); return; }
    onSave();
  };

  const handleDelete = async () => {
    if (!confirm(`Supprimer ce site ACC ?`)) return;
    await sb.from('sites_acc').delete().eq('id', site.id);
    onDelete();
  };

  const inpStyle = {fontSize:14};
  const lbl = (txt) => <div style={{fontSize:11,color:'rgba(255,255,255,.5)',fontWeight:700,marginBottom:4}}>{txt}</div>;
  const fi = (k, type='text', placeholder='', extra={}) => (
    <input className="inp" type={type} step={type==='number'?'any':undefined}
      placeholder={placeholder} value={String(f[k])}
      onChange={e=>upd(k,e.target.value)} style={inpStyle} {...extra}/>
  );

  return (
    <>
      <div className="screen fade-in">
        <div className="auth-header">
          <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
          <h1 className="welcome-title">{isNew?'Nouveau':'Modifier'}<br/><span className="accent">site ACC</span></h1>
        </div>
        <div className="form-card">
          <div style={{marginBottom:10}}>{lbl('Nom du site')}{fi('nom','text','Ex: Parc solaire Nîmes Sud')}</div>
          <div style={{marginBottom:10}}>{lbl('Adresse')}{fi('adresse','text','Ex: 14 rue du Soleil, 30000 Nîmes')}</div>
          <div style={{marginBottom:10}}>{lbl('Code postal *')}{fi('code_postal','text','30000')}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
            <div>{lbl('Puissance PV (kWc)')}{fi('puissance_pv','number','100')}</div>
            <div>{lbl('Prix vente TTC (€/kWh)')}{fi('prix_vente_ttc','number','0.11')}</div>
          </div>
          <div style={{fontSize:11,color:'rgba(255,217,64,.7)',fontWeight:700,marginBottom:6,marginTop:4}}>Coordonnées GPS (pour la carte)</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
            <div>{lbl('Latitude')}{fi('latitude','number','43.8367')}</div>
            <div>{lbl('Longitude')}{fi('longitude','number','4.3601')}</div>
          </div>
          {error && <div className="auth-error">{error}</div>}
        </div>
        {!isNew && (
          <button className="btn-link" style={{color:'rgba(255,100,100,.55)',marginTop:8}} onClick={handleDelete}>
            Supprimer ce site ACC
          </button>
        )}
      </div>
      <StickyFooter>
        <button className="btn btn-yes" onClick={handleSave} disabled={loading}>
          {loading ? 'Enregistrement…' : '✓ Enregistrer'}
        </button>
        <button className="btn btn-sec" onClick={onBack}>Annuler</button>
      </StickyFooter>
    </>
  );
}

// ─── AdminUserLogsScreen ──────────────────────
function AdminUserLogsScreen({ userId, userName, onBack }) {
  const [logs,    setLogs]    = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter,  setFilter]  = useState('all'); // 'all' | 'login' | 'click'

  useEffect(() => {
    sb.from('user_events')
      .select('*')
      .eq('user_id', userId)
      .order('created_at', { ascending: false })
      .limit(500)
      .then(({ data }) => { setLogs(data || []); setLoading(false); });
  }, [userId]);

  const fmtDt = (d) => {
    if (!d) return '—';
    const dt = new Date(d);
    return dt.toLocaleDateString('fr-FR') + ' ' + dt.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  };

  const filtered = filter === 'all' ? logs : logs.filter(l => l.event_type === filter);
  const loginCount = logs.filter(l => l.event_type === 'login').length;
  const clickCount = logs.filter(l => l.event_type === 'click').length;

  return (
    <div className="screen fade-in" style={{padding:'0 0 80px'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:4,marginTop:4}}>
        <button onClick={onBack} style={{background:'none',border:'none',color:'rgba(255,255,255,.6)',fontSize:22,cursor:'pointer',padding:'4px 8px',lineHeight:1}}>←</button>
        <div>
          <div style={{fontSize:9,color:'rgba(125,217,64,.8)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px'}}>Activité</div>
          <div style={{fontSize:18,fontWeight:900,color:'white',lineHeight:1.2}}>{userName || 'Utilisateur'}</div>
        </div>
      </div>

      {/* Compteurs */}
      <div style={{display:'flex',gap:8,margin:'12px 0 16px'}}>
        {[
          { key:'all',   label:'Tout',        count: logs.length,  color:'rgba(255,255,255,.7)' },
          { key:'login', label:'Connexions',  count: loginCount,   color:'#7dd940' },
          { key:'click', label:'Clics',       count: clickCount,   color:'#60a5fa' },
        ].map(f => (
          <button key={f.key} onClick={() => setFilter(f.key)} style={{
            flex:1, background: filter===f.key ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.04)',
            border: `1px solid ${filter===f.key ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.1)'}`,
            borderRadius:10, padding:'10px 8px', cursor:'pointer', fontFamily:'inherit',
            textAlign:'center'
          }}>
            <div style={{fontSize:20,fontWeight:900,color:f.color}}>{f.count}</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,.45)',marginTop:2}}>{f.label}</div>
          </button>
        ))}
      </div>

      {loading ? (
        <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div>
      ) : filtered.length === 0 ? (
        <div className="card" style={{textAlign:'center',padding:'28px 20px',color:'rgba(255,255,255,.4)',fontSize:14}}>
          Aucun événement enregistré
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {filtered.map(ev => (
            <div key={ev.id} style={{
              background:'rgba(255,255,255,.04)', borderRadius:9,
              padding:'9px 14px', display:'flex', alignItems:'center', gap:12
            }}>
              <div style={{
                width:28, height:28, borderRadius:7, flexShrink:0,
                background: ev.event_type==='login' ? 'rgba(125,217,64,.15)' : 'rgba(96,165,250,.12)',
                display:'flex', alignItems:'center', justifyContent:'center', fontSize:14
              }}>
                {ev.event_type === 'login' ? '🔑' : '👆'}
              </div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13,color:'rgba(255,255,255,.85)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {ev.label || ev.event_type}
                </div>
                {ev.screen && <div style={{fontSize:10,color:'rgba(255,255,255,.35)',marginTop:1}}>{ev.screen}</div>}
              </div>
              <div style={{fontSize:11,color:'rgba(255,255,255,.35)',whiteSpace:'nowrap',flexShrink:0}}>{fmtDt(ev.created_at)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── AdminUsersScreen ─────────────────────────
function AdminUsersScreen({ onBack, onViewLogs, isSuperadmin }) {
  const [users,           setUsers]           = useState([]);
  const [loading,         setLoading]         = useState(true);
  const [confirmDel,      setConfirmDel]      = useState(null);
  // Copy-site dialog state
  const [copyDialog,      setCopyDialog]      = useState(null);  // { userId, userName }
  const [copySites,       setCopySites]       = useState([]);
  const [copySrcSiteId,   setCopySrcSiteId]   = useState('');
  const [copyTargetUserId,setCopyTargetUserId]= useState('');
  const [copying,         setCopying]         = useState(false);
  const [copyDone,        setCopyDone]        = useState(false);

  const load = () => {
    setLoading(true);
    sb.rpc('get_all_users').then(({ data }) => { setUsers(data || []); setLoading(false); });
  };
  useEffect(() => { load(); }, []);

  const handleRoleChange = async (userId, newRole) => {
    const { error } = await sb.rpc('admin_set_role', { target_user_id: userId, new_role: newRole });
    if (error) { alert('Modification du rôle refusée : ' + error.message); return; }
    setUsers(u => u.map(x => x.id === userId ? { ...x, role: newRole } : x));
  };

  const handleDelete = async (userId) => {
    await sb.rpc('admin_delete_user', { target_user_id: userId });
    setConfirmDel(null);
    load();
  };

  const openCopyDialog = async (u) => {
    setCopySrcSiteId('');
    setCopyTargetUserId('');
    setCopyDone(false);
    const { data: sites } = await sb.rpc('admin_get_user_sites', { p_user_id: u.id });
    setCopySites(sites || []);
    setCopyDialog({ userId: u.id, userName: `${u.prenom||''} ${u.nom||''}`.trim() });
  };

  const handleCopySite = async () => {
    if (!copySrcSiteId || !copyTargetUserId) return;
    setCopying(true);
    // RPC SECURITY DEFINER : bypass RLS pour écrire dans le compte cible
    const { data, error } = await sb.rpc('admin_copy_site', {
      src_site_id: copySrcSiteId,
      p_target_user_id: copyTargetUserId,
    });
    setCopying(false);
    if (error) { alert('Erreur lors de la copie : ' + error.message); return; }
    setCopyDone(true);
  };

  const closeCopyDialog = () => {
    setCopyDialog(null);
    setCopySites([]);
    setCopySrcSiteId('');
    setCopyTargetUserId('');
    setCopyDone(false);
  };

  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';

  const cols = ['', 'Prénom Nom', 'Email', 'Inscription', 'Dernière co.', 'Connexions', 'Activité', 'Rôle', 'Site'];

  // Users sorted alphabetically for target dropdown
  const sortedUsers = [...users].sort((a,b) => {
    const na = `${a.prenom||''} ${a.nom||''}`.trim().toLowerCase();
    const nb = `${b.prenom||''} ${b.nom||''}`.trim().toLowerCase();
    return na.localeCompare(nb, 'fr');
  });

  return (
    <>
    <div className="screen fade-in" style={{padding:'0 0 80px', maxWidth:'100%', width:'100%'}}>
      <div className="auth-header">
        <div className="welcome-tag" style={{color:'#ffb340'}}>Administration</div>
        <h1 className="welcome-title">Utilisateurs<br/><span className="accent">({users.length})</span></h1>
      </div>

      {loading ? <div style={{textAlign:'center',padding:40}}><div className="spinner" style={{margin:'0 auto'}}/></div> : (
        <div style={{overflowX:'auto', padding:'0 16px'}}>
          <table style={{width:'100%', minWidth:960, borderCollapse:'collapse', fontSize:13}}>
            <thead>
              <tr>
                {cols.map(c => (
                  <th key={c} style={{
                    textAlign:'left', padding:'8px 10px',
                    color:'rgba(255,255,255,.4)', fontWeight:600,
                    borderBottom:'1px solid rgba(255,255,255,.08)',
                    whiteSpace:'nowrap'
                  }}>{c}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {users.map((u) => (
                <tr key={u.id} style={{borderBottom:'1px solid rgba(255,255,255,.06)'}}>
                  <td style={{padding:'10px 8px', width:40}}>
                    {u.role === 'superadmin' && !isSuperadmin ? (
                      <span title="Compte super admin protégé" style={{fontSize:14, opacity:.5}}>🔒</span>
                    ) : confirmDel === u.id ? (
                      <div style={{display:'flex',gap:5,alignItems:'center',whiteSpace:'nowrap'}}>
                        <span style={{fontSize:11,color:'#fff',fontWeight:600}}>Confirmer ?</span>
                        <button onClick={() => handleDelete(u.id)} style={{
                          background:'#ef4444', border:'none', borderRadius:5,
                          color:'#fff', fontSize:11, padding:'3px 8px', cursor:'pointer'
                        }}>Oui</button>
                        <button onClick={() => setConfirmDel(null)} style={{
                          background:'rgba(255,255,255,.15)', border:'none', borderRadius:5,
                          color:'#fff', fontSize:11, padding:'3px 8px', cursor:'pointer'
                        }}>Non</button>
                      </div>
                    ) : (
                      <button onClick={() => setConfirmDel(u.id)} style={{
                        background:'transparent', border:'none',
                        color:'#fff', fontSize:16, padding:'2px 4px',
                        cursor:'pointer', lineHeight:1, opacity:.7
                      }}>🗑</button>
                    )}
                  </td>
                  <td style={{padding:'10px 10px', whiteSpace:'nowrap'}}>
                    <span style={{fontWeight:600, color:'#fff'}}>{u.prenom || '—'} {u.nom || ''}</span>
                    {u.pseudo && <span style={{color:'rgba(125,217,64,.9)', fontSize:11}}> ({u.pseudo})</span>}
                  </td>
                  <td style={{padding:'10px 10px', color:'rgba(125,217,64,.8)'}}>{u.email}</td>
                  <td style={{padding:'10px 10px', whiteSpace:'nowrap', color:'rgba(255,255,255,.5)'}}>{fmtDate(u.created_at)}</td>
                  <td style={{padding:'10px 10px', whiteSpace:'nowrap', color:'rgba(255,255,255,.5)'}}>{fmtDate(u.last_sign_in_at)}</td>
                  <td style={{padding:'10px 10px', textAlign:'center', color:'rgba(255,255,255,.7)'}}>{u.login_count ?? '—'}</td>
                  <td style={{padding:'10px 8px', textAlign:'center'}}>
                    <button onClick={() => onViewLogs && onViewLogs(u)} style={{
                      background:'rgba(96,165,250,.12)', border:'1px solid rgba(96,165,250,.3)',
                      borderRadius:7, color:'#93c5fd', fontSize:11, padding:'4px 10px',
                      cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap', fontWeight:600
                    }}>
                      {(u.click_count ?? 0) > 0 ? `${u.click_count} clics` : '0 clic'} · voir log
                    </button>
                  </td>
                  <td style={{padding:'10px 10px'}}>
                    {(u.role === 'superadmin' || u.role === 'demo') && !isSuperadmin ? (
                      <span style={{
                        display:'inline-block', padding:'4px 10px', fontSize:12, fontWeight:600,
                        borderRadius:6, color: u.role === 'superadmin' ? '#ffb340' : 'rgba(255,255,255,.7)',
                        background:'rgba(255,255,255,.06)', border:'1px solid rgba(255,255,255,.12)'
                      }}>{u.role === 'superadmin' ? 'Super admin 🔒' : 'Démo'}</span>
                    ) : (
                      <select
                        value={u.role || 'user'}
                        onChange={e => handleRoleChange(u.id, e.target.value)}
                        style={{
                          background:'rgba(255,255,255,.08)', border:'1px solid rgba(255,255,255,.15)',
                          borderRadius:6, color:'#fff', padding:'4px 8px', fontSize:12,
                          cursor:'pointer', fontFamily:'inherit'
                        }}>
                        <option value="user">Utilisateur</option>
                        <option value="admin">Admin</option>
                        {u.role === 'demo' && <option value="demo">Démo</option>}
                        {isSuperadmin && <option value="superadmin">Super admin</option>}
                      </select>
                    )}
                  </td>
                  <td style={{padding:'10px 8px'}}>
                    <button onClick={() => openCopyDialog(u)} style={{
                      background:'rgba(255,255,255,.08)', border:'1px solid rgba(255,255,255,.15)',
                      borderRadius:6, color:'rgba(255,255,255,.8)', fontSize:11,
                      padding:'4px 8px', cursor:'pointer', fontFamily:'inherit',
                      whiteSpace:'nowrap'
                    }}>📋 Copier un site</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>

    {/* ── Dialog copier un site ── */}
    {copyDialog&&(
      <div style={{
        position:'fixed',inset:0,zIndex:9999,
        background:'rgba(0,0,0,.7)',
        display:'flex',alignItems:'center',justifyContent:'center',
        padding:'0 16px'
      }} onClick={e=>{if(e.target===e.currentTarget)closeCopyDialog();}}>
        <div style={{
          background:'#1a1d2b',border:'1px solid rgba(255,255,255,.12)',
          borderRadius:14,padding:'22px 20px',width:'100%',maxWidth:480
        }}>
          <div style={{fontWeight:700,fontSize:15,color:'white',marginBottom:4}}>
            📋 Copier un site
          </div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.4)',marginBottom:18}}>
            Depuis <strong style={{color:'rgba(255,255,255,.7)'}}>{copyDialog.userName||'cet utilisateur'}</strong> vers un autre compte
          </div>

          {copyDone ? (
            <div style={{textAlign:'center',padding:'20px 0'}}>
              <div style={{fontSize:28,marginBottom:8}}>✅</div>
              <div style={{color:'rgba(125,217,64,.9)',fontWeight:700,fontSize:14}}>Site copié avec succès !</div>
              <button onClick={closeCopyDialog} style={{
                marginTop:18,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.2)',
                borderRadius:8,color:'#fff',fontSize:13,padding:'9px 28px',cursor:'pointer'
              }}>Fermer</button>
            </div>
          ) : (
            <>
              <div style={{display:'flex',gap:12,marginBottom:18}}>
                {/* Colonne gauche : site source */}
                <div style={{flex:1}}>
                  <div style={{fontSize:10,color:'rgba(255,255,255,.4)',fontWeight:700,textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>Site à copier</div>
                  {copySites.length===0
                    ? <div style={{fontSize:12,color:'rgba(255,255,255,.35)',padding:'8px 0'}}>Aucun site pour cet utilisateur</div>
                    : <select value={copySrcSiteId} onChange={e=>setCopySrcSiteId(e.target.value)} style={{
                        width:'100%',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.2)',
                        borderRadius:8,color:'#fff',padding:'8px 10px',fontSize:13,
                        cursor:'pointer',fontFamily:'inherit'
                      }}>
                        <option value="">— Choisir un site —</option>
                        {copySites.map(s=><option key={s.id} value={s.id}>{s.nom||'Site sans nom'}</option>)}
                      </select>
                  }
                </div>
                {/* Colonne droite : utilisateur cible */}
                <div style={{flex:1}}>
                  <div style={{fontSize:10,color:'rgba(255,255,255,.4)',fontWeight:700,textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>Vers l'utilisateur</div>
                  <select value={copyTargetUserId} onChange={e=>setCopyTargetUserId(e.target.value)} style={{
                    width:'100%',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.2)',
                    borderRadius:8,color:'#fff',padding:'8px 10px',fontSize:13,
                    cursor:'pointer',fontFamily:'inherit'
                  }}>
                    <option value="">— Choisir un utilisateur —</option>
                    {sortedUsers.map(u=><option key={u.id} value={u.id}>
                      {`${u.prenom||''} ${u.nom||''}`.trim()||u.email}
                    </option>)}
                  </select>
                </div>
              </div>

              <div style={{display:'flex',gap:10}}>
                <button
                  disabled={!copySrcSiteId||!copyTargetUserId||copying}
                  onClick={handleCopySite}
                  style={{
                    flex:1,padding:'11px 0',borderRadius:9,border:'none',
                    background:(!copySrcSiteId||!copyTargetUserId)?'rgba(125,217,64,.2)':'rgba(125,217,64,.85)',
                    color:(!copySrcSiteId||!copyTargetUserId)?'rgba(255,255,255,.3)':'#0a1a04',
                    fontWeight:700,fontSize:14,cursor:(!copySrcSiteId||!copyTargetUserId)?'not-allowed':'pointer',
                    transition:'background .2s'
                  }}>
                  {copying?'Copie en cours…':'Copier le site'}
                </button>
                <button onClick={closeCopyDialog} style={{
                  flex:1,padding:'11px 0',borderRadius:9,
                  background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.18)',
                  color:'rgba(255,255,255,.8)',fontWeight:700,fontSize:14,cursor:'pointer'
                }}>Annuler</button>
              </div>
            </>
          )}
        </div>
      </div>
    )}

    <StickyFooter onBack={onBack}/>
    </>
  );
}
